body:
  text: 中興小紀卷二十四宋熊克撰紹興八年嵗在戊午春正月言者請今後從官作守不許衝見任人壬辰宰執奏事趙鼎曰祖宗以來侍從官如此上曰若遇從官無異庶官遇宰執無異從官則非朝廷之體陳與義曰人臣何有重輕但堂陛之勢不得不存秦檜曰嚴堂陛乃所以尊朝廷也奉使王倫之還也言金人廢劉豫之謀自己使人發之癸巳起居舍人勾龍如淵言倫迎梓宫問諱日使指也梓宫未還諱日猶祕而一言之合遂使廢豫此其可信哉上曰不然倫奉使時朕嘗以此意諭之渠果能㳺說亦未可知如淵曰此固臣之所不知如淵𨗳江人也參知政事張守乃張浚所引浚罷相人知守必去時已議還都臨安守力請且留建康以為逺圖議不合戊戌以資政殿學士知婺州趙鼎事實曰張浚永州之命既下張守陳與義乞罷上皆許其去秦檜亦留身言之退至殿廬起身至鼎坐榻前喜見顔間謂鼎曰檜今日告上求解機務上曰趙某與卿相知可以少安檜荷相公如此更不敢言去二參在座聞之極不懌二人既銜怨而去其後秦檜獨相鼎亦不免辛丑詔復幸浙西初龍圖閣直學士汪藻罷知撫州奉祠而去翰林侍讀學士范冲言日厯國之大典比詔藻纂集未成而中止恐積久散逸後人益難措手今藻就閒願詔令勿輟俾三朝文物著在方策非小補也詔許藻辟官屬二員且賜史館修撰餐錢力辭不受至是藻又進政和三年以後詔㫖未成者乞從史館論譔癸丑藻仍舊纂集先是以歸朝官馬欽人馬𨽻張俊軍既而親筆差欽江南鈐轄俊堅欲留之不遣乙卯樞宻院奏趣欽赴任上曰昨俊入見朕嘗諭之聞馬欽於卿素懷不足卿必欲留之軍中萬一欽病死人必謂卿殺之於卿亦便乎俊悚然謝曰臣慮不及此不敢復留欽矣上平日訓諭將帥皆切於理使其利害曉然於胸中可謂盡駕馭之道也是月四川謀帥上問刑部尚書胡交修廷臣孰可將者交修曰臣從子世將可用時世將為兵部侍郎兼直學士院遂除樞密直學士四川安撫制置使兼知成都府重兵聚關外以守蜀而餉道險阻漕舟岀嘉陵江春夏漲而多覆秋冬涸而多膠紹興初剏行陸運調成都潼川利三路夫十萬縣官部送徼賞爭先倍道而馳晝夜不息十斃三四至是交修言養兵所以保蜀也民不堪命則腹心先潰尚何保蜀之云臣愚欲三月以後九月以前苐存守關正兵餘悉就糧他州如此則給守關者水運有餘分戍者陸運可免上乃命學士院述交修意詔宣撫使吳玠行之既而世將至蜀玠以軍無見糧奏請踵至世將被㫖約玠於利州㑹議異時制置使以文臣多事邊幅而玠起行伍不十年為宣撫故莫肯相下誠意不通初水運泝江千餘里半年始逹率以七十五斛而致一斛至是世將與玠反覆共論玠亦曉然知利害所在乃復前大帥席益轉般摺運之法軍儲稍充公私為便金主亶肆赦改元天眷時左右副元帥達蘭烏珠左都監托卜嘉並在汴京左監軍薩里罕居長安左都監巴克實原作㧞束改正居鳳翔既而達蘭歸祁州薩里罕歸雲中而烏珠托卜嘉巴克實皆留如舊先是左僕射趙鼎以徽猷閣直學士王庶為知兵召歸除兵部侍郎二月丁巳朔遷庶為尚書癸亥上發建康府至東陽鎮行宫宰執奏事上曰昨日六宫既發張俊來奏事朕召至宫中與論邊事因戒之曰朕來日東去卿在此無與民爭利無興土木之功俊悚懼承命見地無甎靣再三歎息朕諭之曰艱難之際一切從儉庶幾少紓民力朕為人主雖以金玉為飾亦無不可若爾非特一時士大夫之論不以為然後世以朕為何如主也先是上將回鑾詔知建康府張澄陞職改知臨安府澄受命星馳而至不數日前所缺者率皆辦焉中丞常同奏吳玠頃行屯田常得褒詔願問玠近來積穀幾何減餉幾何趙開李迨相繼為都漕先後運至幾何各令條上然後按實講究以紓民力從之戊寅上至臨安府駐蹕三月庚寅台州有匿名書稱常平主管官李椿年刻薄欲率衆作過言頗不遜壬辰上謂宰執曰兵興以來官物多陷失既差官檢察若稍留心便生誣毁此必州縣吏所為萬一作過當遣官勦殺於是趙鼎以下退而服上之英明以樞宻使秦檜為右僕射平章事兼樞宻使時朝士皆相慶惟吏部侍郎晏敦復有憂色或謂敦復曰檜之作相天下之福公獨不悦何耶敦復曰姦人相矣時删定官鄱陽方疇聞是語其後以告給事中張致逺吏部侍郎魏矼而二人亦以敦復之言為過也趙鼎事實曰一日鼎留身奏事上曰堂中必無異議者又曰秦檜久在樞府莫懷怨望否鼎曰檜大臣必不爾然用之在陛下爾況自有闕是夜遂鎻院檜再相上既與議過然後相檜是以鼎未敢遽為去就參知政事陳與義乃張浚所引以久病乞退甲午為資政殿學士知湖州起居舍人勾龍如淵言戸部非擘劃財賦之地宜置一使以總諸路蓋諸路漕臣權輕勢分但見一路利害若一使總之則可通有無審虛實為朝廷久長之計又言此事當以户部長貳判諸道水陸度支轉運等使為名如蘇如洪可以置司若以外官為之則事必掣肘不能久矣上然之壬寅工部侍郎趙霈不為趙鼎所知是月以徽猷閣直學士岀知袁州以兩浙都轉運使徽猷閣待制向子諲為戸部侍郎子諲言安邊固圉必資儲蓄江西宜於洪州置糴於江州置轉般倉以給淮西湖南於潭州置糴於鄂州置轉般倉以給襄陽湖北於鼎州淮西於廬州淮東於真州仍多造船則遣戍出兵往無不利又言今天下急務在攷兵籍究戸版汰老弱升勇健創簿正言使諸州上帳於兵部諸將上帳於樞密府著鄉貫書事藝季申歲攷所以除詐冐也凡詭名挾戸典買推收進丁退老分烟析産田畆升降貨殖盈虛必以時覈實所以革欺弊也此其大畧耳推而行之則在乎人焉金人又於燕京建行臺尚書省改燕山樞密院為之以三司使杜充僉書省事先是金人主計之任在燕山曰三司在雲中曰轉運在京中曰度支在上京曰鹽鐵在東京曰戸部時充在燕京就用之也是春金左右副元帥達蘭烏珠皆在祁州奉使王倫行至祁見二帥時韓世忠岳飛吳玠軍各遣間招誘中原民金得其臘彈旗牓岀以詰倫曰議和之使來而暗遣諜如此君相紿且不測進兵耳倫言所議靖民乃主上誠意邊臣見久而無成或乗時希尺寸為己勞則不可保主上决不之知若上國孚其誠意確許之平則朝廷一言戒之誰敢爾者二帥相視無語夏人乗金人有折可求之䘮攻府州奪之可求子彦文擕其家走河東其後金令彦文知代州夏四月上旋蹕臨安中丞常同言今去淮益逺邊民多不自安宜遣重臣岀按兩淮有荒田縱民耕勿收租數年之後粒米狼戾百姓足而國用足矣又言江浙民困於月樁幾不聊生上憮然遂減月椿數千緍至是詔遣樞密副使王庶視師淮上調諸路兵預為防秋計且以同奏付庶行之自酈瓊叛諸將稍肆庶條上請臨發犒軍于都敎塲庶便服坐壇上自三衙大將而下雖身任使相悉以戎服歩由轅門庭趨受命拜賜而岀蓋自多事以來未嘗行也時主管殿前司楊沂中怒其統制官吳錫收繫之獄户部侍郎向子諲力言于庶謂錫可用庶奏釋之使統兵屯淮西丙寅庶辭上因論王霸之道不可兼行當以三王為法今之諸將不能恢復疆宇他日朕須親行不殺一人庶幾天下定矣祕書少監尹焞於經筵留身乞致仕甚力上許除内祠癸酉上語宰執曰焞云士大夫不知進退安用所學劉大中曰焞學有淵源且老成若得之亦是朝廷氣象趙鼎退至閤子誦杜甫詩文物多師古朝廷半老儒之句秦檜曰老成人重於典刑劉大中曰蔡京惟用少年所以誤國可為戒也户部侍郎李彌遜言祖宗之法有可行于今者發運一司是也大槩權六路豐凶以行平糴之故然今比昔少異當師其意損益行之臣謂宜復此司别給糴本數百萬緡俾廣儲以待恢復之用數年必見其效丁丑詔從之王庶奏辟屬官戊寅上謂宰執曰昨王庶辭朕諭之云張浚待諸將以狎昵取侮吕祉以傲肆取敗皆可為戒劉大中曰庶到堂亦誦陛下之言深佩聖訓初胡寅自中書舍人岀知嚴州其父徽猷閣待制安國以書諭之曰汝在桐江一年矣大凡從官當郡經年未遷即有怠意汝今宜作三年計日勤一日思逺大之業若有遷擢自是朝廷非我所覬也既而移守永州未上至是詔寅除禮部侍郎尋丁憂去朱勝非間居録曰胡寅者凶慝躁進之士也趙鼎薦之詞掖朝士皆畏之以行詞乖繆衆論不容乃稱父安國老疾逺在湖湘乞歸省于是差知永州寅擕妾居婺久之不去有朝士范伯奮亦寓婺貽書責之寅以妾就蓐為辭伯奮復曰妾産與父病孰重寅訴於鼎改知嚴州鼎旋罷累月復相欲召寅議者以不省父止之復除永守星夜南奔未及到家召命已下比見其父疾困不能言寅留數日將行告之安國攬衣垂涕而已寅至行朝除禮部侍郎又兼經筵又直學士院尚未踰月安國果凶問至寅匿之佯為父書與交黨翰林學士朱震言久疾垂死寅欲免召命以時事尚艱遣之使行欲蓋而彰聞者歎駭度其死時寅尚猶在路耳五月戊子監察御史張戒因對言諸將權太重上曰若言䟦扈則無迹兵雖多然聚則強分則弱雖欲分未可也戒曰去嵗罷劉光世以致淮西之變今雖有善為計者陛下必不信然要須有術上曰朕今有術惟撫循偏禆爾戒曰陛下得之矣得偏禆心則大將之勢分上曰一二年間自可了戒曰陛下既留意臣言贅矣張戒黙記曰初淮西之變時秘書省在臨安一日校書郎范如圭謂戒曰諸大將不可制耶戒曰此自張丞相之失且劉光世一軍偏禆無慮十數不知此曹果欲大將壓已否若使各得自達豈復思光世如圭曰善是秋戒新除福建提舉官待次嚴陵待制常同因過戒問曰諸將權太重張丞相既失今當何以處之戒曰兹甚不難但當擢偏禆爾吳玠既失而曲端受死楊沂中建節而張俊勢分自然之理也同大喜曰此論可行既而同被召首薦戒焉初徽猷閣直學士王倫奉使金國見左副元帥達蘭乃命迓使偕倫至北地見其主亶倫首謝廢劉豫方致上指金主始密與羣臣定議許和至是遣倫與副使高公繪等還又遣福州觀察太原少尹烏凌阿思謀太常少卿石慶元與倫等偕來思謀者乃金人始與吾通於海上所遣之人今再來示有復和之意丁未詔吏部郎官范同帶御器械劉光逺接伴之同江寧人光逺光世弟也樞密副使王庶措置江淮遂移張俊下張宗顔將七千人軍淮西巨師古將三千人屯太平州張戒黙記曰戊午夏王庶視師淮上移偏帥張宗顔守廬州乃分兵之漸宣撫使張俊特不悦大理寺丞劉時者秦人庶辟以行俊飲之醉曰鄉人能為我言于子尚否易置偏禆似未宜遽先處己可也不知身在朝廷之上得幾日其已安乎庶聞之復曰為我言於張七不論安與未安但一日行一日事耳庶雖不折竟如俊之言分韓世忠二軍屯天長泗州使緩急互為聲援以劉錡軍鎮江為江左根本至是庶條上江淮事上曰淮南利源甚博平時一路上供内藏細絹九十餘萬其他可知參知政事劉大中曰淮南桑麻之富不減京東而魚鹽之利他處莫比上曰以此淮甸不可不葺也時金使入界上謂宰執曰館待之禮宜稍厚若早遂休兵免令赤子肝腦塗地此朕之本意也趙鼎曰用兵所費比之館待殊不侔矣上曰若無軍旅之事使朕專意保民十餘年間豈不見效鼎同秦檜對曰陛下此言神明感格必有平定之期矣詔徽猷閣直學士王倫就為舘伴使倫辭乃以命太常少卿吳表臣而令倫往來就館議事倫奏金使烏凌阿思謀元在海上結約與馬擴相熟乞召擴赴行在擴時知鼎州乃趣召之中丞常同論新知蘄州錢觀復除郎不當上曰郎官輕以予人雖蔡京王黼不至是也趙鼎因造膝具言觀復無過且求去上曰卿不須爾言官易得宰相難求時同之眷己衰矣六月乙卯試博學宏詞科選人玉山詹叔羲金華陳巖肖麗水王大方中選詔叔羲大方並與堂除巖肖賜岀身先是故知閤門事潘永思家以財興訟御史臺牒送大理寺既而有㫖放岀於是中丞常同言事干内侍梁珂乞仍付寺結案上即依同奏趙鼎曰臨安府自不相妨參知政事劉大中曰陛下初不欲繫無辜今因臺臣所論而從其請仰見陛下未嘗容心上曰朕亦何心丁巳臨安府勘到永思幹人郭壽之用過錢三千緡餘七人各認一二千緡上曰既無文約必是壽之妄攤可除壽之外餘並免於是鼎以下退而讚上之明上曰此一事朕疎决多矣蓋時盛暑方涓日疎决故鼎有是言也重修哲宗實録書成癸亥監修國史趙鼎上之既而鼎因辭免轉官奏曰昨日伏讀詔語載修書本末甚明上曰乃朕批與開令具述宣仁保祐之功蓋欲士大夫知朕修書之意也先是故相曽布之孫惇上布所著三朝正論有㫖惇増秩賜金言者謂布為王安石腹心而朝廷頒其書號曰正論臣竊惑焉願明諭史官筆削之際無惑其説乙丑詔付史館知舉翰林學士朱震上合格進士黄公度等上以亮隂依祖宗故事更不臨軒䇿試壬申乃御射殿引見參以四川類試人遂賜公度以下二百九十五人及第岀身震岀院而病同知舉給事中張致逺起居舍人勾龍如淵入對上問考試事如淵曰大抵所取皆當惟第二人陳俊卿賦自落卷中得之上曰何故如此相逺如淵以其詞工而晦細閲方見工處上然之公度俊卿皆莆田人也癸酉樞密院編諸班直諸軍及親從親事官轉員格成接伴官范同申金使已到常州上謂宰執曰昨日王倫對云金使烏凌阿思謀説國書中須是再三言武元帝與上皇通好事庶得國中感動朕因記當時如尼瑪哈輩不肯交燕雲皆欲用兵惟武元帝以謂我與大宋海上信誓已定不可失約待我死後由汝輩卒如約以此知創業之人設心積慮必有過人者丁丑思謀等見執禮甚恭且欲以客禮到都堂見宰執趙鼎抑之如見從官之禮時上因事撫循莫不中節逺人歸心焉於是留月餘乃去戊寅上愀然謂宰執曰先帝梓宫果有還期雖待三二年尚庶幾惟是太后春秋已高朕曉夜思念欲早相見所以不憚屈己冀和議之成者為此也秦檜曰陛下不憚屈已講和此人君之孝也羣臣見人主卑屈懷不憤之心此人臣之忠也君臣用心兩得之矣上曰雖然有備無患縱使和議已成亦不可弛兵備趙鼎曰假使金人與我河南地亦須嚴備江南劉大中曰和與戰守自不相妨若專事和而忘戰守則堕敵計中矣趙鼎事實曰初行朝聞烏凌阿思謀之來物議大訩羣臣登對率以不可深信為言上意堅甚往往峻拒之或至震怒鼎因請間密啓上曰陛下與金人有不共戴天之讎今乃屈體請和誠非美事然陛下不憚為之者凡以為梓宫及母兄爾羣臣憤懣之詞岀於愛君非有他意不必以為深罪陛下但好謂之曰講和誠非美事以梓宫及母兄之故不得已為之議者不過以金人難測不可深信但得梓宫及母兄今日還闕明日渝盟吾所得多矣此意不在講和也羣臣以陛下孝誠如此必能相諒上以為然羣議遂息翰林學士朱震卒戊寅上曰楊時既物故胡安國與震又亡同學之人今無存者朕痛惜之趙鼎曰尹焞可繼震上曰震亦嘗薦焞代資善之職但焞微瞶恐教兒童費力俟國公稍長則用之朱勝非間居録曰先是戸部尚書章誼禮部尚書劉大中翰林學士朱震皆可遷執政宰相趙鼎知新除建康留守吕頥浩必不赴乃請以誼權守建康洎頥浩改命誼遂即真悒悒得疾兩月卒會當省試鼎引故事以震知貢舉既鎻院大中遂作參政震聞之即病詔告出院不復供内職累章求去詞語躁妄詆誚鼎與大中初章求外祠次章復求行在宫祠顚錯可駭先是鼎初相以其姻家范冲與震同兼資善堂為鼎交結近閹鼎罷冲亦去震如故及其復相震自以為於鼎有功意圖執政至是大失望怨鼎刻骨月餘疾危猶作詩詆鼎遣人傳示遂不起一執政死二從臣可歎也癸未戸部侍郎向子諲奏事稍久而吏部侍郎晏敦復待對未得中書舍人潘良貴權侍立殿上因奏子諲無益之言久勤聖聽揖退之甲申子諲乞致仕良貴且得罪中丞常同奏良貴嫉子諲曼辭衆以為直不可罪之願許子諲補外上詰同曰子諲之貳版曹乃卿所薦良貴犯分沽激復上章稱述何也乃除子諲徽猷閣直學士知平江府良貴以集英殿修撰奉祠而去朱勝非閒居録曰向子諲進不以道交結北司頗事貢獻是日對甚久論説珍玩之物云云不已軒陛侍衞皆聞之潘良貴不能平徑至榻前奏言子諲無益之言不宜久勤聖聽因厲聲叱子諲退子諲駭愕而下於是良貴罷與外祠子諲岀知平江中丞常同論奏以謂良貴忠直不應岀前此同嘗於上前薦子諲蓋觀望北司也至是上責其反覆噫從官方奏對柱史遽造前叱下古未聞也叱者固非而被叱者其人可知矣初四川制置使席益奏以湖南等處諸軍屯于成都至是校書郎孫道夫白于宰執謂漢唐以來亂蜀如公孫述與孟知祥輩皆非蜀人成都無警益乃移軍屯之昨幾有竊發之變願還之舊處以減糧餉又比年使蜀冠蓋相望如劉子羽方岀而范直方又行往來之費公私騷然未聞有能宣徳意者願止之以息浮費又四川元無都漕自宣撫司以随軍漕兼總領四川財賦俾措置茶鹽酒息通融贍軍今之都轉運司但四分歳數以付四路趣辦而己願罷之以寛民力或以其言為中時病是夏金元帥府下令諸欠公私債無可還者没身及家屬為奴婢以償之
