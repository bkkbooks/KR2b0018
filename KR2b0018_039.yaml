body:
  text: 中興小紀卷三十九宋熊克撰紹興三十年嵗在庚辰春正月初詔知荆南劉錡招置效用三千人己支回易錢四十萬緡至是再招三千人錡請更支三十萬緡庚寅詔從之仍令御前激賞庫支銀二十萬𣙜貨務支通鈔一十萬二月庚戌朔金國遣左宣徽使大懷忠禮部侍郎諾延溫都謙原作耨碗溫都謙今改正等來弔祭貢院考到博學宏詞合格西安主簿唐仲友詔與堂除仲友金華人堯封子也庚申以同知樞密院事葉義問為金國報謝使義問入金境見金已聚兵有入侵意及回密秦金人以尅剝不恤為能以殺戮不恕為威窮奢極侈似秦隋之所為如燕京已劇壯麗而又作汴京伐木琢石車載塞路民勞而多死於道天人共怒觀此豈能久也又海州賊黨未平而任契丹出沒太行臣去時聞破濬之衛縣回時聞破磁之邯鄲北使三人皆被賊傷奪去銀牌不驚南使在處不寧今欲遷汴京且造戰船金人皆有深意以臣度之若果遷都則在彼先棄巢穴今江淮既有師屯獨海道宜備臣謂土豪官兵不可雜處蓋土豪諳練海道之險慿海食之利能役船户平日自如若雜以官兵彼此氣不相下難以協濟今欲於沿海要處分寨以土豪為寨主令隨其便使土豪撓於舟楫之間官兵扼於塘岸之口則官無虛費民無橫擾此䇿之上者也於是右僕射陳康伯言金謂我和好滋久而兵備弛其南牧無疑因條上兩淮守禦之計上嘉納之殿中御史汪徹亦極陳利害且曰慮之有素則事至而安靜慮之無素則事至而倉卒自講和以來諸將各擁重兵髙爵厚祿養成驕恣朝廷宜有以懾其心作其氣戰士役以伎藝回易而又老病之不汰逃亡之不補宜有以搜閲之使有鬭心而樂為用文武官平居常患其冗臨事則無人可用當預選實才不泥資格以備緩急之用云上欲封建宗英以隆本支之勢二月甲子左僕射湯思退留身言適奉聖訓此出於獨斷非古帝王所能及上曰朕久有此意以顯仁皇后意所未欲故遲遲至今上又曰朕嘗覽唐宣宗事羣臣有議及儲嗣者輒怒斥去可謂不逹理矣思退曰昔周文王十五年而有嗣子而文王夀幾百年天人之理非聖哲孰能知之吏部尚書張燾告老丁卯詔除資政殿學士致仕甲戌詔翰林學士周麟之兼權吏部尚書乙亥兵部尚書兼翰林學士楊椿上諭以指意鎖院甚嚴丙子詔略曰普安郡王瑗藝祖七世孫也自幼鞠於宫闈聰哲端重亢於宗藩歷年滋久望隆淵懿中外所聞其以為皇子賜名瑋是日以皇子瑋為寧國軍節度使開府儀同三司進封建王初宣詔於文德殿百官莫知其事既聞以普安為皇子縉紳動色相慶中外無不鼓舞丁丑宰執入賀上曰昨日宣詔想見人心喜悅湯思退等曰豈惟士大夫閭巷細民無不鼓舞仰見睿謨英斷合天人之心如此先是編國朝會要久未就緒戊寅殿中侍御史汪徹乞纂元豐以後仍付之祕書省官詔禮部祕書省條具取旨淮西總領都潔言江東所屯嵗費錢七百萬緡米七十萬石而監司守二恬不加意乞將弛慢尤甚者按劾黜責三月庚辰朔詔從之兵部尚書楊椿薦階成副總管楊從義湖南副總管李師顔可充將帥詔從儀轉一官籍記師顔知夔州知貢舉御史中丞朱倬上合格進士劉朔等戊子上御集英殿䇿試既遂賜梁克家以下四百一十人及第出身朔莆田人克家晉江人也癸巳上謂宰執曰監司郡守所寄非輕須平日選有人望者以待有闕使可除用湯思退曰聖慮及此可謂知所本矣臣等當公心選用無毫髮之私庶合衆望丙午以少保恩平郡王璩判大宗正寺紹興府置司丁未上謂知樞密院王綸曰璩昨日之除如何綸曰陛下春秋鼎盛已為宗社無窮之計今日談笑裁決略無難色上曰朕決此計已九年矣建王所佩玊魚乃初置榷場朕令買此玊以備今日之用舉此即可知矣今二王之除皇后意與朕合綸曰陛下英斷如神規模素定然堯舜文武亦由內助祖宗神靈在天自此篤祐陛下與宫中者曷有既耶夏四月乙丑詔自今臣寮乞上殿令徑投狀通進司不許於都堂納劄子永為成法初神宗嘗以御史闕員手詔臺臣同舉忠純體國之人共成篤厚之政至是獲當時石本丙子詔付三省令重刋御史臺朝夕瞻仰庶幾上廣聖意下息澆薄稱朕意焉是月工部侍郎黃中奏御前軍器所領屬中人其調度程品工部軍器監有不得而聞者非祖宗正名建官之意請得𨽻屬稽考之不報初吏部侍郎劉章在工部時郊恩賞賚給絹主胥欲以絹自入而下其直以豫衆不服請於章語胥曰如所直以市百縑可乎蓋謾為辭以折服之爾胥遂誣章以實買絹有摘其語於言事者疏始上上愕然曰劉章必無此事言者執不已遂罷章為提舉崇道觀事在二月朝士皆知其寃無敢言者至是起居郎王佐於上前極論其事言者復以為朋比而併攻之佐亦罷出知永州初言者乞令兩省臺諌卿監郎官各舉所知一二人為令至是給事中王晞亮請將山隂等四十大縣以待薦舉之士悉由堂差吏部更不許注五月癸未詔從之先是提點坑冶鑄錢官李直奏嵗額錢內藏庫二十三萬緡左藏庫七十餘萬緡皆是至道之後額數自紹興以來嵗收銅止及二十四萬斤鉛二十萬斤錫五萬斤比最多之數紐計鑄錢一十萬緡外有拘到諸路銅器二百萬斤搭以鉛錫可鑄六十萬緡乃時暫所拘乞據逐年所産權立為額丙戌工部言若依所請委是數少且以酌中之數五十萬為額從之時大金國遣使來賀天申節詔工部侍郎黃中充館伴使故事錫宴使者謝於庭下至是辭以方暑請拜廡下中持不可乃如故事既又中為送伴使中還言聞金日繕兵不休且其重兵皆屯中州宜有以待之壬寅右正言沈濬言兩浙漕臣湯允恭不孝其母詔刑部侍郎黃祖舜核實祖舜言允恭無不孝事迹不應罪之是月改濬為吏部郎官六月戊申殿前馬步三司申明逃亡軍人首身之限知樞密院事王綸引疾丐罷庚午詔除資政殿學士知福州尋改提舉洞霄宫七月戊戌同知樞密院葉義問進知院事御史中丞朱倬為參知政事翰林學士兼侍讀周麟之為同知樞密院事於是義問奏應變持久二説以謂兩淮形勢在今為急荆南劉錡則均襄隨郢通化棗陽之所𨽻也鄂渚田師中則安復信陽漢陽之所𨽻也九江戚方則蘄黃之所𨽻也池陽李顯忠則龍舒無為軍之所𨽻也建康王權則滁和之所𨽻也鎮江劉寶與馬帥成閔則真陽通泰之所𨽻也江隂正控海道宜自鎮江分兵以扼之至於濠梁固始正安豐諸郡近邉亦宜總之合肥比已分屯諸將臣欲飭其擇地勢險要廣施豫備又金人用兵之久貪驕淫怠今所用皆非舊臣而多用僉軍僉軍本吾民也其肯為敵效死乎此應變之説也臣又見秋冬之交淮水淺涸徒步可過若金人今嵗未動乞以沿淮一帶遴選武臣為守公私荒田悉撥以充屯田使人募耕之暇則練習專務持重勿生釁端來則堅壁勿戰去則入堡勿追使其終無所得而自困此持久之説也八月丙辰詔修吏部敕令格式及刑名疑難斷例至是書成右僕射陳康伯上之既而上謂宰執曰頃未立法加以續降太繁吏部無所遵承今既有成法若更精擇長二銓曹其法以清湯思退曰頃未立法吏緣為姦上曰今既有成法不可更令引例也思退曰一如聖訓丁巳州縣經總制錢或委守臣亦委知通或又令知通同掌其法屢更後因户部侍郎李朝正建言始屬通判既而復命知通同掌至是言者以為通判專行因得盡力往嵗所入至一千百二十餘萬緡昨自改法通判壓於長官之勢恐其侵用迄今無嵗不虧請復委通判己未詔從之金國主亮聚兵將南侵是月令其臣户部尚書梁球兵部尚書蕭德溫先計女真契丹奚家三部之衆不限丁數悉僉起之凡二十四萬壯者為正軍弱者為伊勒希原作阿里喜今改正下同一正軍以二伊勒希副之類為一十二萬又中原漢兒與渤海軍總一十七路惟中都路造軍器河南路修汴京免僉外其一十五路每路一萬通為二十七萬倣唐製分二十七軍是月僉軍數已定遂以百户為穆昆原作謀克今改正千户為明安原作猛安今改正萬户為統軍則有正副諸軍悉令畨漢相兼無獨一色人者先是亮遣其臣禮部尚書施宜生為賀正使隱畫工於中俾密寫臨安之湖山城郭以歸亮令繪為軟壁而圖已之像䇿馬於吳山絶頂後題以詩有立馬吳山第一峯之句詭曰御製其實翰林修撰蔡圭作也建劍邵汀在閩號上四郡例般鹽自鬻以辦嵗費鬻而不售則科於民時汀之長沙縣鬻鹽峻暴民走轉運使司訴之知縣事陳夢逺乃漕司主管官陳正綱之族子正綱為白漕臣王時升押訴者還汀而本州見差巡檢官於鄉下督鹽錢民因共留巡檢乞州釋訴者兩易之是月汀守謂民嘯聚亟遣兵捕戮復疑平民與之關通皆繫之獄欲論以重辟録事參軍劉師尹爭不能得致仕而去帥臣王師心即移文釋諸囚具薦師尹於朝既而夢逺與州之守二皆坐罷而師尹復仕正綱沙縣人瓘子師尹閩縣人也先是前四川帥臣李文會王剛中成都漕臣王之望提點刑獄王弗夔路提舉官王適皆舉武德郎董誡堪充邊將九月丙子朔上謂宰執曰五人皆薦可見其公詔與邊郡仍籍記以俟他時選用言者謂今日産馬之地無出於川廣如沈晦若帥廣西一年間買馬三千匹今每嵗率不及二千竊見亷雷二州鹽積於白石場不知其幾若運置橫山寨以備博馬是以無用而有用也丁丑右諫議大夫何溥言比年朝廷作假多於百司三分之一又有前後相因為例不入省者似非祖宗法意矧陛下宵旰求治責成政地獨可略乎望詔三省稍加裁損仍令吏户兩曹後他司出局庶幾事無壅積詔從之冬十月初殿帥楊存中以官三師班立樞密上校書郎王十朋因輪對言三衙管軍與北司深交盜陛下之大權養成跋扈之勢且權之大者莫如名器與財兵今以管軍而位三公其盜名器極矣古無有也祖宗時無有也凡天下利路舉入其門掊尅聚斂不知紀極且身總禁旅久而不代密結私黨深忌宿將不容其進自恃兵柄在手有輕朝廷心夫樞密者本兵之地號令節制天下之諸將者也今殿庭立班管軍傲然居前樞密甘心其後不以為恥事勢倒置如此其能節制號令之耶又其子弟親戚布滿清要之職臺諫有論列者朝廷為之庇覆俾其言卒不得行夫臺諫言及侍從大臣隨即罷斥獨不行於管軍之門其何以為國耶至若諸軍承受甚於唐之監軍皇城邏卒甚於周之監謗內外諸將剝下賂上結怨於三軍道路之間捕人為卒結怨於百姓皆非治世事也至是知樞密院葉義問以謂三衙本𨽻密院祖宗舊例不許接坐所以正名分示等級豈當以官髙卑而不以職之上下冠履倒置非朝廷福請各為班著從之乃詔文武臣合班如遇親王使相立西班即令樞密院官權綴東班即親王使相請假則立西班先是宰執奏中官承受事上曰今之承受即祖宗走馬承受専令掌邊將奏報近日士大夫或論其賄賂至云恐浸如漢石顯之類朕前此不知亦嘗降詔戒約意謂空言不若以實事示之故前此屢却諸將貢獻此事朕無固必丙午乃詔罷內侍官承受今後諸軍奏狀並於通進司投進湯思退曰陛下英斷洞照今古臣等謹遵聖訓癸亥日方中無雲而有雷聲十一月庚辰福建漕臣王時升言到官才一考見樁上供庫錢三十萬緡欲代納本路拖欠鈔鹽錢從之丙申宰執奏恐合旌賞上曰漕臣能節妄用而代納百姓積欠理宜激勸然未可遽行恐他路聞之妄認以為羡餘可俟政績有聞與升職名時升益都人也前池州都統制李顯忠請令諸軍屯田丁酉上謂宰執曰朕思之甚詳先須根刷諸將留池州分荒田兼取見沿江所在頃畝初年給牛種三兩年間且盡與地利使之嵗入有得則不勸而自耕矣湯思退曰當先根刷别具奏聞上又曰此事在今日誠可議但行之當有先後之序也侍御史汪徹等欲論左僕射湯思退方捃托其過殿中侍御史陳俊卿曰為相無物望而天災亟至此固當罷何以庀為乃言思退始由秦檜父子以致身及掌文衡而取其孫緣此遂至政府自居相位惟務招延親黨佐其羽翼者慶厯初京師一日無雲而雷震仁宗以天變如此由夏竦姦邪亟命黜之前日無雲而有雷聲人情駭異其變蓋在大臣十二月乙巳朔思退罷為觀文殿大學士提領太平興國觀徹等欲鐫其職俊卿曰思退未有大罪雖非相才然比之沈該則有間矣該猶以大學士家居而思退顧不得此則執法之地所以議賞罰者偏矣不從於是徹等冉論思退遂落職初户部侍郎錢端禮知臨安府日嘗建言用楮幣已行之纍月至是端禮又奏近有旨以合支官錢造會子流轉而輸官亦許用之庶公私皆便今有立定分數品搭從之端禮惟演孫也時殿前司乞招軍并三衙兵亦增過紹興丙子嵗人數戊申諸路經總制司錢以十九年為額其數太多侍御史汪徹言財賦所出當究源流十九年經界初行民輸隱漏之稅蓋是適然今當取十年間酌中之數為額癸丑上諭宰執令戶部具十年中數仍合減多少若不與減恐虛挂簿書又慮州縣科敷取足以困百姓陳康伯曰聖德寬明灼見事源臣謹奉詔乙卯權中書舍人楊邦弼繳奏續觱超轉一官不當蓋因秦檜放行王珦等致援例者衆實違令丁巳上謂宰執曰秦檜不獨此一事放行且如禁軍換易亦改動祖宗格法上又曰朕因思漢霍光専政殺許后廢昌邑威震天下魏相乞除奏事副封奉行祖宗故事孝宣是以致中興之功祖宗成憲豈可不守朕無一事敢違舊章陳康伯曰當以邦弼所奏報行庶絶後來援例之弊上曰善戶部侍郎錢端禮言元祐中蘇轍任户部嘗以一嵗出納之數纂成會計録今若不講則恐有限之數不應無窮之用臣以具去嵗所用編類成册望詔宰執侍從臺諫同議無為文具要在可行此今之急務乙巳詔户部條上均節等事翰林學士洪遵以草湯思退罷相制不明著其罪丙寅除徽猷閣直學士與宫觀初朝廷宿重兵守蜀雖無事而總計之臣常患不給是用除太府少卿王之望代總領四川財賦許尹時本所見錢引一千四百四十餘道糧三百三十餘萬石此其大略也
