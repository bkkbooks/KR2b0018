body:
  text: 中興小紀卷二十宋熊克撰紹興六年嵗在丙辰春正月詔四川都轉運使趙開親董餉至宣撫使吳玠軍前而都督張浚亦奏詰開違慢又詔四川安撫大使席益趣開行且除開徽猷閣待制復降指揮轉運使不當與四路漕臣同繫銜凡此皆所以解間隙趣應辦也辛巳升玠宣撫使仍罷綿州宣撫使軍馬聽玠移撥錢物委開拘收都督張浚請親行邊郡分命諸將以觀機會上乃令浚往視師初言屯田者甚衆而行之未見其效至是浚兼領屯田以出始置官屬凡所行之事皆畫一而去趙鼎事實曰張浚再出江上欲謀大舉深慮諸將議論不同未能成功心頗憂之不欲出口鼎察知其意與之謀曰公之此行未便能舉事莫若兼領屯田而他日歸見上猶足以藉手浚大以為然曰邊事未成當大作屯田而歸不為無補於是置官屬畫一而去先此言屯田者甚衆至是始為之其後嵗收數十萬今獲其利也己丑上謂宰執曰前日三大帥屬官陳桷等引對朕諭以朝廷養兵之久國用既竭民力已困須専意屯田此亦自古已成之效况軍中亦須先立家計若有機會方圖進取趙鼎等曰如此措置社稷之幸時軍需甚急故有鬻爵及配賣度牒錢引數事朝士多以為不可於是言者論之初中書舍人任申先趙鼎客也至是獨助張浚乃擕臺諫章示館職張戒曰此論何如戒言不知申先曰子以臺諫之言不敢論耶於是給事中吕祉謂人曰申先姦邪第知附右相不悟人之嗤已然或者以為祉之附浚又甚於申先者也時參知政事沈與求纍章乞罷癸亥除資政殿學士知明州以僉書樞密院折彥質權參知政事與求未幾提舉洞霄宫時趙鼎張浚俱帶都督諸路軍馬置司於行在浚出視師江上以行府為名而鼎居中總政事表裏相應然浚所行之事亦有關三省樞密院者先是與求及知樞密院孟庾皆不能平常曰三省樞密院乃奉行行府文書耶庾已稱疾求罷至是與求復去趙鼎事實曰時張浚在江上經營興舉鼎居中總政事相為表裏鼎自以遭時多故遇人主特達之知心惟至公務要協濟未嘗有所疑忌而行府所行之事往往侵紊三省知樞密院孟庾參知政事沈與求憤然不平之曰三省樞密院乃奉行行府文書耶各稱疾罷去鼎乃一切隱忍未嘗計較無分彼我所幸國事有濟然人以此為難也都督張浚至江上會諸大帥議事乃命韓世忠據承楚以圖淮陽命劉光世屯盱眙又命楊沂中領精兵為浚後翼命嶽飛進屯襄陽以窺中原於是國威大振上御書裴度傳遣賜浚以示至意浚於諸大帥中獨稱世忠與飛可倚以大事時劉豫頗於偽境聚衆世忠自楚州引兵渡淮擊敗之直至淮陽而還上手書賜浚曰世忠既捷整軍還屯進退合宜不失事機亦卿指授之方卿更審虛實徐為後圖或遣嶽飛一窺陳蔡使賊枝梧之不暇也二月庚寅宰執奏四川置制使席益按夔路帥臣罪狀上曰蜀去朝廷逺號令久不及官吏無復知畏前日周祕論蜀中銓選事朕再三勉之去蜀中利害久無人論及今日方見此章祕歷城人時為殿中侍御史時前宰臣汪伯彥等進建炎中興日厯詔付史館修元帥府事實既而纂一十卷書成鼎上之鼎上元帥府事實在四月今聫書之先是去嵗旱傷湖南尤甚安撫制置大使吕頥浩入境即奏截撥上供米三萬石及令廣西帥漕西司備五萬石水運至本路以充賑濟又乞降助教敕度牒誘上户糶米民不能耕則借之糧種夏稅亦俟秋成併輸全活甚衆先是郴衡桂陽草盜紛起頥浩遣統領官步諒裴鐸招捕悉平鼎冦楊么既滅有雷進者尚據慈利縣是春其黨伍俊斬進首詣知鼎州張觷降觷遣統制官覃敵梁吉提兵悉撫定之初劉豫毁明堂得金龍之金四百兩大銅錢三百萬是月以明堂基為講武殿改其門亦號講武時豫再開貢舉取進士邵世矩以下六十九人夏四月庚子户部郎官兼主管都督行府財用張澄請依四川法造交子與見緡並行仍先造二十萬用于江淮既又詔造百五十萬充糴本而未樁到見錢于是右諫議大夫趙霈等謂恐失信于民且言其弊有五望詔大臣詳議而速罷之丙午送户部時翰林學士胡交修亦上疏力陳其害以為崇寧大錢覆轍可鑒方大臣建議舉朝無敢非者法行未幾錢分兩等市有二價姦民盜鑄死徙相屬終莫能勝今之交子校之大錢無銅炭之費無鼓鑄之勞一夫日造數十百紙鬼神莫得窺焉真鷹莫辦轉手相付旋以偽劵抵罪禍及無辜久之見錢盡歸藏鏹之家商賈不行細民艱食必無束手待盡之理比及悔誤恐無及矣遂詔不行時臨安府火災或數刻爇千百家趙霈又建請峻其刑名仍保五均坐庶火初作衆亟撲滅事下刑部立法禮部尚書李光適兼權刑部不奉詔乃抗論天災譴告人君宜修德以厭之不當峻法濫及無知之民朝論謂刑部有司也抗疏為非而諫官之論宜略為施行中書舍人董弅白宰執曰二者之論俱不為過使兩易之則各為舉職矣五月壬辰正字喻樗言祖宗制科以待非常之才猶許士人應選近設宏辭科望詔舉人有願兼應者聽詔送禮部其後不行都督張浚奉以户部郎官主管都督行府財用張澄為兩浙轉運副使時駐蹕之所計司已劇而淮南漕職亦命澄兼領是月左宣教郎平陽蕭振召對稱旨上欲除臺官適無闕趙鼎欲授以樞密副承旨上令與祕書郎越數日鼎薦人為監察御史御批除振六月丁未宰執奏前日地震上曰上天譴告朕極憂恐趙鼎曰嚮緣地震吕頥浩罷職上曰頥浩之罪非為此卿等但與朕協力修政事以答天譴爾戊申趙鼎乞下詔求言上可之禮部尚書李光以疾乞祠是日除端明殿學士知台州上以襄陽府上流重地已令帶京西安撫經略使壬子又詔荆府亦依例帶湖北安撫經略使時已召襄陽帥保康軍承宣使王彥為行營前護軍都統制以湖南漕臣權帥事薛弼代之弼入境彥遣親兵七千人來迓其將言王太尉未有去意弼徑馳入彥晨未起已報新帥入府遽出交政仍起彥所八字兵一萬赴行在人頗不樂弼竭帑犒師彥遂統之以行秋七月癸酉以吏部侍郎劉大中為兵部尚書初內侍馮益以潛藩舊恩恃此頗恣建炎間駕幸浙東因與大將張俊爭渡以語侵俊復訴于上事下御史臺趙鼎時為殿中侍御史嘗論益之橫以為明受之變本於內侍覆車之轍不可不戒趙鼎事實曰內侍官兩經大變其勢少戢而餘風未殄其後鋒鋩稍出如馮益者尤為暴橫始因詬張俊鼎常論劾至是奏斥去之其黨始知畏中外翕然稱快是日上因論及司馬光字畫端徑如其為人朕恨生太晚不及識其風采淮東宣撫使韓世忠引兵自淮陽已還楚州江東宣撫使張俊既城盰眙遂進屯泗州湖北京西招討使嶽飛亦遣兵至蔡州焚其積聚至是張浚承詔入覲力請上進臨建康以為不可緩然朝論同者極鮮惟上斷然不疑初浚在江上謀渡淮北嚮惟倚韓世忠為用世忠辭以兵少欲摘張俊之將趙密為助浚以行府􅊾俊拒之謂世忠有見吞之意浚奏乞降聖旨而俊亦稟於朝鼎白上曰浚以宰相督諸軍若號令不行何以舉事俊亦不可拒乃責俊當聽行府之命不應尚稟於朝復下浚一面専行不必申明慮失機事時議者以為得體至是浚歸奏終以俊不肯分軍為患鼎謂浚曰世忠所欲者趙密今楊沂中武勇不減于密而所統乃御前兵誰敢覬覦當令沂中助世忠却發密入衛俊尚敢為辭耶浚曰此上䇿也某不能及趙鼎事實曰向降指揮責張俊自當一聽行府之命乃朝廷主張行府及楊沂中為泗上之行破劉猊以成功實肇於此也癸丑宰執以郭執中遺表進上歎息久之張浚曰執中當崇寧初以上書邪等禁錮二十年晚遭陛下而年已老不得收尺寸之效上問當時以何事入邪等趙鼎曰凡蔡京蔡卞所惡者皆入邪等折彥質曰京卞以紹述為説凡斥已者盡誣以誹謗先帝上諤然曰上皇內禪之初尚遣梁師成諭淵聖曰司馬光前朝名相今諸事當以光為法則上皇之意可知矣朕今行事與上皇時豈無修潤者要之從百姓安便而已百姓安便乃上皇之意也甲寅上謂宰執曰近時士大夫數言縣令多不稱其任者朕再三思之亦難盡擇莫若精選監司郡守似為要道正如朕深居九重之中安能盡知百執事能否當留意宰相耳上殿官劉長源奏元符人臣子孫未必盡愚元祐人臣子孫未必皆賢且引用房遺愛事為證己未上謂宰執曰長源昨日開陳至比戰國之士若不用於秦則歸楚議論殊可怪張浚曰長源不學無識疏中引事皆非所敢聞者况元符人臣子孫孰為可用而不用折彥質曰如蔡京王黼乃國家之深仇罪通于天幸逃族誅正使子孫真有可用猶不當乃詔長源與逺小監當時四川都轉運使趙開復與制置使席益議不協開以舊宣撫司贍軍財賦不許他司移用又言益截都轉運司錢於閬利州糴米非是又言應副宣撫使吳玠軍須紹興四年總為錢一千九百五十餘萬緡五年又增四百二十萬有竒今蜀中公私俱困事急可憂又言軍務惟錢糧最大欲自都督府制具調發庶無妄動枉費以損威勢而將兵所給皆宜核實朝廷知開難與益玠共事是月詔開赴闕既而益奏行轉般摺運之法雖甚利而玠與益相疑上下觀望終不果行焉吏部尚書兼翰林學士孫近除龍圖閣學士知紹興府時百司並留臨安常程事取決於留守司所不能決者申行在詔兵部尚書劉大中翰林院學士朱震侍讀學士范沖中書舍人陳與義董弅戶部侍郎趙霈起居郎張燾侍御史周祕左右司諫陳公輔王縉左右司郎官耿自求徐林等並扈從主管軍馬權殿前司解潛提舉宿衛親兵劉錡同總禁衛之職而知臨安府梁汝嘉充隨駕都轉運使九月丙寅朔上發臨安府丁卯上至臨平鎮戊辰宰執閲楊沂中下統制官王存吳進將所部二千人還臨安聽留守司用進勇於戰常對御騎射上曰一好漢進聞之刺好漢吳進字作䄘心每閲兵則披以示衆聖駕經崇德縣引對知縣趙渙之而時冇言渙之因緣搔擾者己巳上謂宰執曰昨日渙之對議論殊無可取朕問民間疾苦輒云朝廷每加寬恤民間别無事又問户口多寡亦漫不省趙鼎曰陛下所以延見守令正欲知民間爾上曰朕猶恨纍日不能親乘馬往田間勞問父老鼎曰陛下恤民如此天下幸甚庚午上次平江府初劉豫因金大帥尼雅滿下髙慶裔所推尼雅滿請于故金主晟而立之豫每嵗於二人厚有所獻而蔑視其他諸帥故多憾焉皆謂我等冒矢石拓土地乃為慶裔輩所賣至是豫聞上將親征遣人告急於金主亶求兵為援且乞先冦江上亶會諸帥議之皇伯領三省事宋國王宗磐曰先主所以立豫者欲豫闢疆保境我得息兵安民也自立豫之後既不能自守兵連禍結愈無休時今若從之勝則豫獲其利敗則我受其弊况前年因豫乞兵常不利於江上矣今何可再從之亶遂却豫之請許其自行且遣烏珠提兵黎陽以觀釁焉時金人已厭豫然未廢之者以尼雅滿猶在故也豫以偽皇子左丞相麟領行臺尚書主管殿前司許清臣權大總管府右丞李鄴户部侍郎馮長寧皆參行臺謀議與李成孔彥舟關師古輩悉在麾下僉鄉兵三十萬號七十萬分道入冦西路趨合肥以麟統之東路由紫荆山出渦口以姪猊統之諜報至僕射張浚復往江上視師趙鼎事實曰聖駕至平江未浹日已報賊至右相張浚遂出時劉豫一項趨合肥麟弟猊一項侵及滁和淮甸大擾是時張俊駐旴貽楊沂中屯泗上韓世忠在楚嶽飛在鄂聲勢了不相及獨劉光世大兵在太平光世遣輕騎據廬而松江一帶更無軍馬朝廷甚憂之己卯上諭宰執曰前此大臣誤國困百姓以供不急之務今正用兵未能蠲除力役真有愧也時將臣趙密巨師古軍中多苦重腿之疾上賜之藥軍士服者一服而愈庚辰趙鼎奏其事上曰朕常留意於藥每退即令醫者疹脈才有虧處即治之正如治天下不敢以小害而不去也史館修撰范沖言重修神宗實録於朱墨二本中有所刋定奉詔别為考異一書明著去取之意以垂後世今重修哲宗實録考其議論多誣亦乞别為一書以辦誣為名壬午詔從之初詔吏部侍郎詳定一司敕令晏敦復等修紹興祿秩敕令格式至是書成丁亥右僕射張浚上之時湖北嶽飛軍初置總領錢糧戊子詔户部郎官霍蠡為之於鄂州置司初飛一軍每月費錢三十九萬緡嵗計四百六十萬緡餘至是蠡申飛軍中每嵗統制統領將官使臣三百五十餘員多請過一十四萬餘緡軍兵八十餘人多請過一千三百餘緡總計一十五萬餘緡於是左正言李誼言蠡職在出納理當究心然慮點撿苛細若行改正却合支劵錢六萬餘貫才省九萬緡而已望令依舊勘支務存大體以副陛下優恤將士之意蠡武進人端友子誼南昌人也癸巳翰林學士朱震言今以戰馬為急而買於廣在深慮夷人為姦伺我虛實乞諭帥臣凡買馬必擇謹密之士庶消患於未然異時西路通則漸減廣馬之數乃詔帥臣提舉買馬官常稽察之不得因以生邊患時右司諌王縉以大臣不和為憂乃言今陛下所與共濟艱難復大業者二三大臣爾或出而總戎或處而秉軸交修政事之間進退人才之際謀慮有不相及則初意未必盡同茍無私心惟其當而已願戒大臣俾同心同德絶猜間之萌以協濟國事至再三言之冬十月賊衆十萬已次濠壽之間張俊拒之即詔併以淮西軍屬俊主管殿前司楊沂中為俊統制官浚遣沂中至泗州與俊合且使謂之曰上待統制厚宜及時立大功取節鉞或有差跌浚不敢私諸將皆聽命戊戌沂中統兵至濠州癸卯上謂宰執曰劉先世之意欲退保采石趙鼎曰諸處探報殊無金人自當鏖戰若官軍不能勝豫賊則何以立國但光世隨處分兵捍賊已見失策今已渡淮當遣張俊軍與光世合乃為得計萬一賊得志於光世則大事去矣折彥質曰誠如趙鼎所論上顧鼎曰卿此䇿頗合朕意度金人行兵不如此必止是劉豫之衆合軍擊之無不勝者時賊軍東路猊既敗引數騎挺身逃去西路麟所統麟聞猊敗亦望風而潰光世乘勢追襲亦捷通兩路所得船數百艘車數千兩器甲金帛錢米軍需之物不可勝計京東金人尋亦退走朔方大恐上以手書賜浚略曰賊雛犯順侵壽及濠卿奬率師徒臨敵益壯遂使凶渠宵遁同惡自焚寤寐忠勤不亡嘉歎仍令俊具上都督府隨行官吏軍兵推賞浚言賞或濫加則將士解體遂惟保奏有戰功者諫官陳公輔言前日賊犯淮西諸將用命捷音屢奏邊上稍寧蓋廟社之靈而陛下威德所至然行賞當不踰時廟堂必有定議臣聞濠梁之急張俊遣楊沂中來援遂破賊兵此功固不可掩劉光世不守廬州而濠梁戍兵輒便抽回如渦口要地更無人防若非沂中兵至淮西焉可保哉光世豈得無罪此昭然無可疑者又沂中之勝以吳錫先登光世追賊王德尤為有力是二人當有崇奬以為諸軍之勸若韓世忠屯於淮東賊不敢犯嶽飛進破商虢擾賊腹脅二人雖無淮西之功宜特優寵使有功見知則終能為陛下建中興之業矣既而賞功加俊少保三鎮節度使沂中為保成軍節度使殿前都虞侯除俊及沂中在十二月今聫書之戊申上語及張俊平李成得敗卒八千人而俊才有萬衆明日又戰恐其為亂夜遣陳思恭盡殪之事雖不得已然朕今思之尚寒心也上又謂宰執曰近日淮西有警朕常夜分方寢奏報到輒披衣以起或至再三趙鼎曰致陛下憂勞如此臣等之罪也時楊沂中奏捷俘戮甚衆辛亥上愀然謂宰執曰此皆朕赤子賊迫之南來既犯兵鋒又不得不殺念之痛心顧趙鼎曰可更敕諸將爾後務先招降其陳亡者亟瘞之癸丑以巡幸隨軍轉運使梁汝嘉為浙西淮東沿海制置使仍兼隨軍轉運之職先是詔湖北京西招討使嶽飛往駐江州癸酉飛奏已至上曰淮西既無事飛不須更來趙鼎曰此有以見諸將知尊朝廷上曰劉麟敗北朕不足喜而諸將知尊朝廷為可喜也司馬光作通鑑首論魏斯趙籍韓虔為諸侯以為禮莫大於分分莫大於名何謂分綱紀是也何謂名公侯卿大夫是也又曰貴以臨賤賤以事貴上之使下猶心腹之運手足根本之制枝葉下之事上猶手足之衛心腹技葉之庇根本其措意深矣有國家者以此為先務也十一月丙辰金人遣使問劉豫罪豫惶懼免猊為庶人以謝之於是金廢豫之意決矣起居舍人吕本中言自古中興必有根本之地以制四方之地有根本之兵以制四方之兵今根本之地不過江浙福建而諸路凋殘民力已困若根本之兵則禁衛是也而單弱不可用令大臣先求二者之要而行之時本中權中書舍人有監階州倉草場苗豆者以贓獲罪詔黥之本中繳奏曰近嵗官吏犯贓多抵黥罪且既名士人行法之際宜有所避況四方之逺或有枉濫何繇盡知若遽施此刑異時察其非辜雖欲深悔亦無所及矣論者以嚴刑上法祖宗夫祖宗之時臨機制變事有不得已者然自仁宗而降寬大之政久已成風纍聖相承不敢輒易今一旦盡改成法欲用祖宗權宜之制則將重失人心臣未見其可也又此刑既用臣恐後世不幸姦臣弄權必且借之以及無罪直言私議亦不能免何者用之已熟彼得藉口不以為異也使國家此刑不絶則紹聖以來憸人盜柄搢紳遭此殆將無遺類矣願酌處恆罰以稱陛下仁厚之意凡兩奏從之十二月甲午朔曲赦淮西召龍圖閣學士孫近為吏部尚書三省言昨遣使諸道惟川陜未曽選官乃詔右司員外郎范直方宣諭兩路及撫問吳玠一軍右僕射張浚還平江隨班入見具奏劉光世屯事上曰却敵之功盡出右相時趙鼎等已議回蹕臨安浚力請幸建康且言天下之事不唱則不起不為則不成今四海民心孰不思王室而金偽脅之以威雖有智勇無緣展竭比三嵗間賴陛下一再進撫士氣稍振今當示以形勢激忠興懦則三四大帥不敢偷安蓋天下者陛下之天下陛下不自致力以為之先則人有解體之意日復一日終以削弱異時復詔巡幸其誰信之何者彼知以此為避地之計無意於圖天下故也論者不過曰萬一有警難於逺避夫將士用命扼淮而戰破敵有餘茍人有離心則何地容足又不過曰當秋而戰及春而還此但可以紓一時之急年年為之人皆習熟難立國矣又不過曰敵占上流順舟可下今襄漢我有舟何自來使敵有餘力水陸偕進陛下深處臨安亦能安乎鼎言雖弱不敵強且宜自守未可以進乙巳鼎罷除觀文殿大學士知紹興府朱勝非間居録曰趙鼎張浚爭權浚自謂有卻敵之功興復之䇿當獨任國事諷侍從臺諫及其黨與攻鼎出知會稽時張浚専任國政浚首言親民之官治道所急比年內重外輕流落於外者終身不用經營於內者積嵗得美官又官於朝者多不歷民事請以郡守監司有治狀者除郎官郎曹淺者除監司郡守館職未歷民事者除通判仍乞降詔從之乃下詔略曰朝廷設官本以為民比年重內輕外殊失治道之本自今監司郡守秩滿考其治效內除郎官而未歷民事者使復承流於外庶幾民被實惠以稱朕意辛亥召資政殿學士提舉洞霄宫張守為參知政事丙辰湖南太師少保吕頤浩為浙西安撫制置大使行宫留守翰林學士朱震請編古循吏傳一書以賜守令之有治行者上曰不若有治行者進擢無治行者隨輕重責罰自有勸懲賜循吏傳恐無補於事己未以兵部尚書劉大中為龍圖閣直學士知處州辛酉言者請以寺監丞簿編修刪定檢鼓等院官未歷民事者並堂除太邑下其書左右司辛酉都司言寺監丞簿己準省劄别措置外其編修刪定檢鼓等院欲堂除近闕大邑從之遂以山隂諸暨餘杭富陽江寧上元南昌分寧等四十處為大邑浙東帥觀文殿大學士趙鼎在越惟以束吏恤民為務每言不束吏雖善政不能行蓋除害然後可以興利易之豫利建侯行師謂建侯行師乃所以致豫解公用射隼于髙墉之上謂射隼而去小人乃所以致解鼎之學得於易者如此至是姦猾屏息又場務利入之源不令侵耗財賦遂足是冬劉豫遣其偽皇子府參謀官馮長寧請於金主亶欲立子麟為儲嗣亶曰先主立爾者以謂有德於河南爾子亦有德耶豫當遣人咨訪之時豫兵敗故以此探金之意不從豫自知危矣夏國馬多為塔坦所盜是嵗夏國興兵自河清軍渡河由雲中境徑之塔坦取馬而歸往來皆不假道於金國初大帥尼雅滿烏克紳皆鎮雲中故夏人不敢動二帥已罷兵柄而左監軍薩里罕代守雲中夏人知其無能為所以徑行不顧金人亦不敢問也
