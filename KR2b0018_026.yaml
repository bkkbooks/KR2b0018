body:
  text: 中興小紀卷二十六宋熊克撰紹興九年嵗在己未春正月甲申上論宰執曰朕每有意候邊事平與民休息如月樁錢之類宜悉蠲之祕書少監永州居住張浚上言今敵中有故上下分離故天屬盡歸河南遂復我必德其厚賜將來內變既平指瑕造隙肆無厭之欲發難從之請其將何辭以對臣罪戾之餘深不欲論事顧利害至重不敢自默惟陛下留意乙酉宰執奏赦條事上曰凡臣僚抵罪大則竄黜小則停降雖其才可用而資實小人亦不可輕赦而復進蓋世無用小人之理或偶因微罪既沾沛澤豈可不湔洗收録若以前事論列不已乃使人材終廢亦可惜也上甄别賢否愛惜人材如此丙戌詔監察御史莆田方庭實宣諭三京癸巳上謂宰執曰今當創宫殿以俟太后之還秦檜等曰漢有長樂宫所以奉母后也臣聞聖人之德莫大于孝自輿地將歸陛下出令皆以祖宗母兄為先有以見聖孝通于神明宜乎上天悔禍而強敵之革心也時經制發運司才糴米四十萬斛言者以謂舊發運使總六路財賦而餉中都兵興以來既無轉輸但以糴事委之自朝廷給本錢無慮五六百萬緡又諸路常平既使香鹽司兼領又别差主管官有司莫知適從今欲將發運使并常平主管官罷之丁酉詔去發運二字命户部長二一員兼領仍别置副使或判官一員不時巡按諸路其常平官並改充經制某路幹辦官尋以户部侍郎梁汝嘉兼江淮荆浙閩廣經制使司農卿霍蠡為判官先是鹽法屢變其課浸虧自汝嘉二版曹課乃復登戊戌名徽宗陵曰永固以同僉書樞密院王倫為東京留守昭化軍節度使郭仲荀副之以少師萬夀觀使劉光世為陜西宣撫使移四川制置使胡世將副之仍加世將寶文閣學士會光世弟光逺疏光世之短于言路于是中丞勾龍如淵言光世不可遣乃罷其行勾龍如淵退朝録曰時朝廷擇帥以人材難得遂搜至于仇愈陳規輩如淵因奏曰如數故相論其相業固有短長若以一路付之豈不賢于愈規輩其意蓋欲取練逹如吕頤浩者處之關中靜重如朱勝非者處之汴京而張浚素有威望宜處之建康方言及頤浩上曰頤浩若不去趙鼎河東人亦可去上獨不及張浚如淵曰浚勳在社稷陛下亦豈能終忘之上曰亦須付之一路特不可去陜西耳明日宰執對遂以此意宣諭而朝廷大不恱後旬日有旨除劉光世陕西宣撫使朝廷似欲以此遏吕頤浩之行而如淵再論光世不可遣乃罷之川陜宣撫使吳玠改為四川宣撫使初玠軍中所用激賞錢每嵗下四川都轉運司應副一百八十萬緡至是玠言今不廢兵乞省其半詔奬之詔李誼作上謂宰執曰河南新復宜命守臣專拊遺民勸農桑各因其地以食因其人以守不可移東南之財力虛內以事外也於是秦檜等竊歎上規摹素定皆萬世之計非臣下所能及既而東京副留守郭仲荀請兵及糧上曰朕今日和議蓋使消兵使百姓安業留守司豈用多兵但二三千人彈壓內冦足矣錢糧亦只據所入贍之豈可虛內以事外耶朕見前朝開邊如陜西燕山曾不得尺帛斗粟而府庫已竭此可為戒矣仲荀乞兵糧在二月一日今聨書之初起居舍人薛徽言為前宰臣趙鼎所厚一日因右僕射秦檜于上前論和議事徽言自殿坳直前引義固爭反覆數刻遂中寒疾是月卒初宗正少卿范沖寺丞孫緯等奉詔在紹興五年修祖宗仙源圖宗藩慶系録宗枝屬籍凡三書以太祖太宗及秦王各為一總號曰總要又以母氏姓生宗婦宗女官院官爵夀考賜諡各為一條分髏成書復被旨俟二三年續修去冬本寺已得請至是宗正少卿鄭剛中言見與寺丞陳確同修緣三京宗司所報異舊書有抵牾處乞許新舊俱存庶他日可考仰稱陛下厚本之意剛中金華人也二月壬子朔史館進祖宗實録上曰朕要見景德中與契丹講和後故事今日可遵行者朕每于靜中留意機務頗覺有得于是宰執秦檜等退而贊上心虛靜萬機之暇留意典籍每行一事必以祖宗為法規摹宏逺矣以給事權直學士院樓照為翰林學士上欲用太常少卿邵武謝祖信為臺官癸丑諭宰執曰朕恐祖信不知今日事幾可召赴都堂與之議論秦檜等奏臺臣乃天子耳目恐召至朝堂然後授外間不知陛下之意不能無嫌上曰大臣朕股肱臺諌朕耳目若使臺諫譏察大臣豈朕之意時檜等雖荷上眷迄不敢召祖信退而相勉曰上開懷待遇如此其忍負之哉監察御史方庭實奉使回奏邊事不合己未改祕書少監秦檜曰凡進擬差除未嘗敢分朋黨因陳辛亥嵗席益行赦文不工為諫官所論緣此怏怏後守平江適吕頤浩為都督過郡遂離間同列卒成黨與之禍上曰士大夫豈有不由宰相進擬卿等能平心用人甚善御史中丞勾龍如淵與起居郎施庭臣因私忿交爭奏其惡如淵謂庭臣指斥壬戌上謂宰執曰如淵身任臺綱自合早論至一月後因忿方奏此告訐也告訐之風出于末世三代所未聞也以朕觀之庭臣之罪小如淵之罪大乃命秦檜先召庭臣詰問癸亥檜奏陛下若欲存國體先黜庭臣仍改除如淵俟其乞出然後補外上欲正其事乃詔庭臣語言狂率責嶺南監當如淵失風憲之體罷與外任命下人皆服上之英斷如此其後檜擬除如淵知遂寧府上曰此人用心不正遂已擬除如淵在明年正月今聨書之初諸路月樁各有窠名其後多為漕司占留遂不免敷民甲子宰執請均於諸路不得偏重上曰若所撥窠名錢不足自合從朝廷給降不得一毫及民朕欲養兵全藉民力若百姓失業則流為盜矣上知月樁之害每每宣諭憂形于色此臣下所當奉承也丁卯上諭宰執曰太后歸略備從物務從質朴如器皿塗金可也朕自即位服食器用未嘗妄費卿等所知秦檜等退相謂曰上天資儉德雖奉太后猶不欲過漢文履革舄衣弋綈不能過也時內侍黃冕辭免製太后禕衣事上曰太后聖性恭儉服用簡素今回鑾有期朕得盡東朝之養時上喜見辭色檜等退而贊上之聖孝出于天性其屈意求和實緣太母宜乎上天悔過強敵革心誠非常之慶也癸酉詔史館見修徽宗實録今以實録院為名右僕射秦榛兼提舉其修撰檢討官令檜辟差於是以吏部侍郎范同為修撰禮部員外郎劉昉為檢討昉潮陽人也上嘗謂宰執曰徽宗內禪之事誠意素定非因人言初築北宫夾城甬道嘗諭梁師成曰吾他日釋下重負欲與嗣聖往來其間抱孫自娛宣和末遂踐此言而小人乘時多事貪天之功以為身謀秉筆之士不可不知也檜等曰當時玉音如此臣等踈逺若非聖諭實所未知戊寅殿中侍御史謝祖信言今天意助順輿地自歸而朝廷乃在江吳道里遼邈所以宣至意收人心惟在號令宜推誠引咎使叛者革心詔劄付詞臣時已遣內侍陳成之往陕西撫諭仍先至吳玠軍次之逐路于是右諫議大夫李誼言成之素不與諸將相識情未易通訪聞知金川郭浩父成舊為邊將張中孚中彥皆出其門慕洧之父亦成部曲而趙彬貧時又嘗依浩實於諸將有契望詔成之與浩同去所冀衆心早得以定上欲得元臣調護陜西諸將是月召少傅醴泉觀使呂頤浩赴行在頤浩以年垂七十力辭不至具附奏金人無故歸地其必有意臣記五路元是張中孚中彥慕洧之徒為帥今必仍舊然皆久據一方慮亦難令當諭以德意許之久任庶不致疑既而再趣頤浩至闕竟聽其辭及將東歸復言秦為天下眷今宜于長安興元襄陽各置宣撫司而重兵屯襄陽且建行臺仍即五路選精騎三萬赴行在請上親提萬騎不時勞軍使金人罔知六飛所在以伐其謀自爾不敢復窺江淮而中興之業由兹起矣詔提舉洞霄宫張浚復資政殿大學士知福州召徽猷閣直學士知漳州廖剛既至三月丙戌除御史中丞戊子殿中侍御史謝祖信言和預買為民之病有司變為折錢帛又甚患者也祖宗時官俵錢於春而民輸縑於夏故公私兩利其後官無本可俵則名為預買其實白著是嵗於常賦之外又輸倍軍興久而財益詘遂行一切之政數嵗前縑價髙而折錢或至十千八千今價減而有司猶執前直一例折錢使民鬻縑而求鏹此又甚病也二病固未能去求以少紓民力惟在均而已欲下諸路各具所敷之宜或以稅錢或以畝頭使戶無髙下依夏稅法則姦民猾吏詭名析産無所容其幸而所出均矣詔户部措置甲午上謂宰執曰士卒暴露纍年菴廬下寒暑燥濕之苦豈人情所堪俟疆事稍定當為蓋營屋使各安居於是秦檜等退而竊歎上恤士卒如此人豈得不樂為之死也中書門下言京城已差留守外其南京西京兩處留守乞權以本府守臣充從之丁未上謂宰執曰河南新復州縣官當擇愷弟慈惠之人庶為朕撫養凋瘵使不失職秦檜等曰陛下仁意惻怛如此臣等敢不承也夏四月庚戌朔上以陜西新復不宜置宣撫使當遣大臣諭以德意辛亥乃詔僉書樞密院樓照往焉以祕書少監鄭剛中為參謀官初環慶將官慕洧叛至是安撫使趙彬奏已殺洧餘衆多降癸丑秦檜奏曰陜西已無事皆陛下聖德所致上曰朕何以致此乃祖宗在天之靈默佑然朕自來惟持不殺之説於是檜等贊曰此乃陛下為天人所歸也孟子曰惟不嗜殺人者能一之陛下堅守和議不煩干戈坐得中原豈非不殺之功乎右諫議大夫曾統殿中侍御史謝祖信皆論趙鼎久位宰司專權植黨在靖康末嘗受張邦昌偽命近上章納節敢以富弼自列臣子共憤望加流竄時鼎以少傅奉國軍節度使知泉州乃詔落節吏部尚書晏敦復力請奉祠詔除寶文閣直學士知衢州戊午步帥解潛為趙鼎所厚至是請奉祠出為福建路副總管初二聖北狩上每遇朔望率羣臣遙拜自徽宗升遐之後遙拜淵聖如故至是中丞廖剛言兄弟同列方兄為君則君事之及已為君則兄之而已今淵聖之歸有期望罷遙拜唯淵聖節百官仍舊祝夀下禮部太常寺既而討論欲遇朔望上用家人禮遙拜于禁中羣臣於宫門外遙拜從之東京留守王倫奏金國元帥謂所降赦文載割河南地不歸德于金國倫一靣改定謂元降赦文非真却要國書意與符同甲子上曰待外國當以誠因舉寶訓故事契丹使耶律元在館嘗詢左右館中日聞鼓聲豈非習戰耶或對以優人戲場真宗聞之謂宰臣曰不若以實諭之諸軍比無征戰教習武藝耳宰執秦檜等退相謂曰上每推誠待物動法祖宗庶永保和好使敵人無隙之可乘也庚午殿前司募鈞容樂工上慮其優令但留舊人不得增募上曰朕未嘗好世俗之樂少頗善彈琴自居亮隂久亦忘之蓋上清心寡欲無聲色之娛免喪後不許募樂工蓋防微杜漸規摹閎逺如此知綏德軍劉議自言嘗汚偽命乞放歸田里壬申宰執擬依赦仍舊任上曰新復州軍他時悉用文臣卿等為朕擇循良之吏武臣不曉法直不可與郡上久勞于外深達治體更用文武之意同符藝祖矣是日宰執又奏京城親從官王琪以三朝御容來上曰近有司自京城來獻真宗御容有司辨其非真復獻筆百管雖微物朕不欲受恐來者不已也是月資政殿學士席益卒原本缺庚辰右諌議大夫曾統言自去冬以來凡七遣使初命韓肖胄報聘又命王倫交地又遣方庭實宣諭三京郭仲荀留守東京周聿宣諭陜西士㒟張燾恭謁陵寢樓照又至永興布宣德意所携官吏軍兵甚多借請不知其數竊聞熙寧初宰臣韓絳宣撫陕西才費十八萬緡時論沸騰以為大咎今一使之費己數倍于昔蓋自崇寧權臣用事務為華侈以悅人情至今未革將來兩宫南還其費不少謂宜擇忠實通練之臣以舊制裁定庶無妄費從之時新復州皆免賦役三年而亳州民自願輸以助國用上曰中原遺民久因暴斂今喜于來歸誠意樂輸然乍出塗炭尤當加恤兼信豈可渝乃令依赦蠲免仍降詔奬諭新復諸州進天申節銀絹癸巳上謂宰執曰新復州無餘財此寧免于擾民可悉退回秦檜曰陛下誕節人臣皆致享上之誠而聖意加恤新民却而不受可謂盛德之事也丙申上謂宰執曰鋪翠銷金之飾屢詔禁止今宫中雖無敢犯而有司奉行不虔市肆公然為之可重立賞務在必行秦檜等曰陛下以儉德理天下而風俗尚習故態官吏格詔宜痛加繩治戊戌資政殿學士宇文粹中卒于成都府癸卯上謂宰執曰太祖時強藩悍鎮與方靣之臣既歸朝皆貸之今中原官吏復還朕方以天下為度凡舊染之汚一切兼容秦檜曰陛下天覆之德如此四海孰不歸心上曰今羣臣正當叶心共成治道然在外者輒辭難避事在內者論議多徇私立異風俗如此何以求治卿等當分别之眀示賞罰檜曰陛下聖眀灼知治道臣等敢不奉詔乙卯上諭宰執曰近除邢孝揚團練使朕思顯肅皇后家尚未推恩乃先及孝揚恐失先後之序秦檜等退檢會顯肅聞訃曰其家已推恩上曰今與鄭藻落階官足矣上每行一事反復精思務協公議雖戚里間未嘗以私意行之也時以觀文殿學士汪伯彥知宣州仍趣朝行在伯彥將至國門丁巳上謂宰執曰伯彥相見便令之官庶免紛紜且曰伯彥潛藩舊僚去國十年漢髙光不忘豐沛南陽故舊皆人情之常秦檜退而竊歎曰伯彥遭遇聖主乘風雲之會致位宰輔雖勳烈無聞然上終始眷之可謂至矣初伯彥未第有祁門縣令王本者築館曰英材延之授經檜與其兄弟皆從伯彥遊至是伯彥蒙異寵亦檜之力詔伯彥元帥府舊臣特依見執政給俸於是給事中劉一止曰節度使俸借減尚不薄况郡有供給圭田之厚以郡守而依執政殆與異時非待制而視待制非兩府而視兩府者類矣乃詔罷之詔徽猷閣直學士仇愈為陜西都轉運使愈以病固辭言者論其避事詔禠職尋責居全州殿中侍御史周葵論國用軍政士風三事己未上謂宰執曰國用當藏之于民但百姓足國用非所患也上于百姓㴠養休息雖兵興未嘗橫斂宜中興之民戴之愈久而不忘也時有被召人鮮于參到闕丙寅秦檜奏參乃王庶所薦人材似可取乞令上殿臣備位宰司人材茍有可用不敢輒分黨與上曰朕豈能盡知天下人材但付之宰相宰相賢則賢人皆聚于朝矣檜退而竊歎曰上任相之意可謂得其要矣開府儀同三司士㒟兵部侍郎張燾歸自西京己巳入朝士㒟等曰諸陵下石澗水自兵興以來久涸二使到日水即大至父老驚歎以為中興之祥於是上以語宰執秦檜等謂燾必不妄言檜等退朝相謂曰石澗水至之祥可謂異矣燾之言能使人主信重雖甚異事不以為妄其立身行已無愧矣張燾奏徽宗山陵乞不用金玉辛未上曰前此厚葬之意如循一軌金玉之物朕意不用或謂朕以天下之富而薄于親如後世譏議何朕既灼知薄葬之益使先帝神靈有萬世之安雖以朕為不孝不敢辭蓋上通經博古見利害之實非流俗之言所能奪也初僉書樞密院事韓肖胄充報謝使既入北境其接伴者謂當稱謝恩使肖胄以使名勑授不敢輒易論難三四卒不能奪辛未肖胄還至東京壬申僉書樞密院事樓照至永興軍留十餘日初偽齊將李世輔亡入夏國其家悉為鄜延帥宗雋所害世輔欲從夏國借兵復讐夏國主曰爾能為吾立功則不靳借兵時有酋豪號青靣夜義者恃衆擾邊乃屬世輔圖之世輔請精騎三千晝夜疾馳奄至其穴擒之以歸國主大悅即出兵授之世輔至延安府殺宗雋等二人因剖心以祭會金國已還三京世輔説夏人南歸而夏人多懷疑懼與願從者二千人來而夏國招撫使王樞反説世輔還夏世輔遂擒樞同來樞才入境即望闕遙拜言本國主喜甚再三感聖恩將遣使入貢奏至上謂宰執曰夏人既有此意其待遇之禮令有司舉故例行之上諭在三月丙申今聨書之至是樓照與宣諭使周聿皆招納世輔歸朝甲戌上諭新除京畿都轉運使李逮令速行不然須重貶蓋迫於公議雖與朕有潛藩之舊不得而私也逮惶懼上道蓋上之威斷足以警偷惰懲傲慢也時同僉書樞密院王倫尚留守東京先是金國右副元帥烏珠歸其國徑之祁州元帥府密奏於國主亶云河南地本達蘭宗盤主謀割于南宋二人必隂結彼國今宋使已至汴京未可令過界倫有雲中舊吏𨽻烏珠帳下嘗來謁倫言烏珠謀誅逹蘭倫即馳奏乞早為之備上以示宰執而秦檜但趣倫過界乙亥倫始解留鑰將使指北行是月川陜宣撫使吳玠卒于仙人關後諡曰武安玠馭下嚴而有恩故士樂為之死川陜宣撫副使胡世將嘗問玠所以勝者于其弟龍神衛四廂都指揮使璘璘曰金令酷而下必死先兄每與之戰非纍日不決大抵舉中國所長而用之耳蓋中國弓矢徑利金士卒堅耐吾常以長技洞重甲於數百步外又選據便利出鋭卒以更撓之使不得休彼雖堅耐亦不能無弛此待之之要也吏部侍郎謝祖信除徽猷閣待制知潭州趙鼎事實曰先是謝祖信作言官力論鼎落節於是章氏諸孫咸集闕下再謀理訴併及史事上偶知之謂執政曰聞章惇又有人欲陳訴以趙鼎去便謂事有改變此事乃出朕意趙鼎何預聞有從官為之主議者執政奏謝祖信章氏子壻也上曰亦知之遂出祖信知潭州祖信聞之大駭歸家詬其妻凡數日曰由爾家纍我以至鬱鬱而死識者評之曰使鼎在朝日收拾祖信而用之未必不出其妻小人唯利所在初不以親為意雖父子之間有所不顧况妻黨乎是夏金國左副元帥逹蘭之蔚州避暑逹蘭下令諸藏避我而逃者家長罪死籍其産及人口半以充賞四鄰之家共追賞錢三百緡仍發番軍分諸路搜捕民間大擾羣起為盜以拒番軍遂復止之達蘭在諸帥中最號寬恕今顧為此蓋隂與皇伯宗盤通謀將以致亂使民嘯聚則藉之起兵又令中山府拘奉使王倫于館且會諸路僉軍以復取河南為名皆所以應宗盤也初南安李乾德有庶子智之奔大理國改姓趙號為平至是知李陽煥卒其子天祚襲封大理國遣兵三千送智之歸要代天祚天祚不肯領兵與戰又敗之智之欲進奉朝廷仍乞借兵廣西經略司以聞詔令諭以婉辭勿引之生事
