body:
  text: 中興小紀卷四宋熊克撰建炎二年秋七月丁亥以吏部尚書周武仲為龍圖閣學士提舉太平觀新通判襄陽府程千秋昨因守公安縣有功朝廷再加二秩就命通判荆南時有譛其短於帥臣唐慤者千秋請避之改倅襄陽未行荆南轉運司擒千秋置之獄巧誣以罪其弟千乘詣闕訴寃已得旨免勘而慤猶未肯釋緣有全驅保妻子棄城與敵者欲依公安千秋以其位居已上恐掣肘敗事拒之不納賊平悉懷愧恨媒蘖於慤欲殺之以快其意慤深加煆鍊違詔不釋且忠義立功之士所宜加恤罪猶當宥况無罪乎己亥詔釋千秋仍降慤貼職為直祕閣辛丑詔略曰乃者春多雨霪夏仍旱暵飛蝗為沴餘冦尚存弗能道天地之和何以弭邦家之患永惟厥咎當在眇躬應政事有未便者俾郡守監司條上被災處驗實與免租稅禁囚淹延趣其結絶甲辰詔樞密直學士大名尹杜充為東京留守令又以馬軍都指揮使郭仲荀為殿前都指揮使副之仍召龍神衛四廂都指揮使楊惟忠赴行在為主管馬軍時已遣宇文虛中使金國祈請二聖道由京城乃令攝留守司事既而仲荀先充以至虛中乃行先是提舉洞霄宫謝克家因言者論其嘗從偽命落職遂進狀自辨略曰國家傾危二聖播遷臣不能徇節以死何所逃刑顧如言者所論則為未之察也三月七日張邦昌為金人逼脅圍城士大夫恃陛下之在外也共為後圖吕好問不能獨任其責方邦昌之在尚書省也好問遣人起諸退人故次日皆仍舊職臣嘗遣長男伋往見李回欲同詣元帥軍中回言將令高世賞同臣以行而胡直孺李擢繼道邦昌之言且趣之出與回言合臣始見邦昌面決行日則臣之復出為陛下出也四月八日奉寶璽出門十二日見陛下於濟州蒙陛下洞然照知委任元帥府差提舉一行事務自濟還京不復入省即整辦儀物催發百司官吏前往南京粗免闕悮如臣才短力憊方多事日享祠官之祿臣分已足但所造罪名至醜使如章言則為大惡不宜尚齒縉紳否則為至寃亦不宜按此下有脫字如臣所陳涉妄甘受欺君之誅若原情昭洗死無所恨丁未召克家為吏部侍郎時殿中侍御史馬伸聞召克家及中書舍人晉陵孫覿已去復召乃言克家與覿皆小人之雄不可用二人在靖康間皆附耿南仲唱為和議助成敵謀有不主和者則欲執送金營人畏其險而不敢較陛下即位灼見其情遂去是矣近者不知誰為之地皆得被召復將用望竄之逺方以禦魑魅不報於是克家乞郡除龍圖閣侍制知台州伸此疏在是月丁酉先是朝議大夫惠厚下及密院小吏楊雍皆自金境逃歸言中原之人聞上登極咸以手加額曰聖明既立將有息兵之望又有録登極赦書奏道君者聖情甚恱趣宣和皇后作宴相賀厚下華原人也辛亥宰執早朝以奏上斂容不語久之曰宣和皇后性極儉每得月賜未嘗妄用衣或破則補而服之黃潛善曰躬儉節用服浣濯之衣詩人所美臣等今聞后之儉德如此豈勝幸甚此據顔歧所編聖語壬子詔圭田士以養亷自今毋借是月燕山府人劉立藝聚衆攻破城邑立藝諭衆曰吾欲致南北太平所至不殺掠但令饋糧於是邊上之民歸者甚衆時吏部案牘散逸殆盡選者與吏並緣為姦多冒名寄版之弊右選侍郎吳江魏憲在宣和間已二銓曹熟於典選至是乃請嚴保任以核實開告賞以扼姦急期會以取闕故姦弊稍戢憲屢言古未有背天險而為都者金之徑騎由京西不四五日可至淮泗宜有以備之未幾憲以雜學士奉祠而去户部所餘金帛尚數百萬尚書吕頥浩侍郎葉夢得皆慮倉卒難於輦運遂以行在府庫充牣為言請自今上供之物兩浙福建者寄平江府江湖二廣者寄江寧府從之據葉夢得行述修入言者請復常平官修補助之條廣儲蓄之具八月癸丑朔詔從之既又詔常平之法歲久多弊頃以紹述為名雖公私不便當增損者亦不敢言今止為常平本法所係甚大非可他司兼領宜復置提舉官然慮襲前弊反致害民遂令葉夢得與中書舍人孫覿張澄共討論之澄舒城人也戊午以夢得為翰林學士覿為給事中初徽猷閣待制江淮等路發運使梁揚祖兼措置真州茶鹽至是就緒戊辰進揚祖為雜學士時諸路類試合格進士並集行在甲戌上御集英殿䇿試既遂賜李易以下四百五十人及第出身易江都人也上曰聞易甚貧寄食於人黃潛善曰易揚州學正郡庠正録學業必優上又曰御藥院舊例上十名文卷於御前定高下朕謂取士至公考官足信豈以朕一人之見更自升降潛善等再三稱賀試辭學兼茂科考到朝奉郎袁正功合格正功晉陵人也初信王榛已上奏復遣前保州亷訪使者馬擴詣行在乞師擴至東京見留守宗澤遂逹行在擴自離五馬山寨麾下五百人至是不滿百人上識榛書迹即除河外兵馬都元帥制辭略曰覽封章之近奏聞行役之獨留慨然壯圖副朕本旨依就顓於臨制庶盡總於營屯以迎二聖之還以慰兩河之望又以擴為元帥府都總管俾將兵北討據張匯所記與馬擴自敘初道君北狩自燕京遷霫郡一日謂駙馬都尉蔡鞗曰宸極失御播越至此荷天眷祐建炎中興今草得一書欲厚遺本路都統求通於左副元帥先是御史中丞江南秦檜當靖康末不肯推立異姓為金人驅去亦寓此地道君乃命鞗以書示檜讀之嗚咽不勝謂鞗曰天祐吾宋必將有主聖慮如此定應昭格遂具酒殽延本路都統後聞此書得逹尼瑪哈是月道君徙居韓州先是諸王有得春秋閲之道君曰春秋多弒君父之事為人臣子豈宜觀哉鞗曰春秋者孔子所以正褒貶故司馬遷曰春秋禮義之大宗也願陛下試取觀之他日道君謂鞗曰比讀春秋始知宣聖之深意恨見此書之晚曾因聖夀節宴道君賦詩以與淵聖乃用親仁善鄰事曰此出春秋也道君每南望必注目久之曰陵寢在何處泣數行下遇忌辰時輟膳追慕終日雖在蒙塵教子必以義方宗室自孝騫以下九百餘人每相見撫問再三有挾私恨而致爭者必告以身在他鄉幸得相聚毋挾私憤然紹述神宗之志未嘗忘懷適有貨王安石日録者輟衣而易之先是殿中侍御史馬伸言陛下龍飛河朔近得黃潛善汪伯彥以為宰輔任之不疑然其器識非高如制敵人在今實難不敢望之若中國常事皆可施設豈宜悖謬以敗中興之業也哉且二帝北狩宗社不絶如線者繫陛下一人三鎮未復不當都汴以處危地而前日下還都之詔以謫許景衡其輕詔令如此待闕官俸減三之一又有闕不許差權所以省用而近日廣宫祠之請與復提舉添教授皆與初意相戾其市私恩如此草茅對䇿誤不如式考官贖金可也而一日黜三舍人乃取其門人孫覿諸羣小以掌絲綸其黜陟不公如此夀江二州官吏均能守城夀則推賞江則不賞其政令不一如此卲成章緣上言逺竄今日何時以言為諱其塞言路如此舊制臺官有闕中丞學士各薦而三省不與潛善乃自除李處遁之徒欲為已助其毁法如此張慤宗澤許景衡才皆可任乃忌而沮之至死使不得展其妨功如此人有問以救危拯溺之事則曰難言其意蓋謂陛下制之或問陳東則曰朝廷初不知蓋謂事在陛下也其歸過於君如此又曰吕源狂橫陛下逐去不數日由郡守而升發運凡陛下所欲用者必去之所欲去者必留之其強狠自專如此又御營使實主兵權而潛善伯彥各别置親兵一千所給優於衆兵此何意哉疏奏改伸為衛尉少卿九月癸未伸自乞誅責詔伸言事不實送吏部差濮州監酒初上嘗語宰執以廷中從班未富又謂黃潛善曰求賢宰相之職也宜加意詢訪乃詔取舊從臣姓名來上亦有召還復用者上意猶未足黃潛善曰祖宗時多命從官各舉所知三二人以俟選擇上從之乃詔行在從官各舉所知於是列曹尚書吕頥浩盧益王賔翰林學士葉夢得端明殿學士黃潛厚御史中丞王綯列曹侍郎劉珏張浚康執權給事中黃哲中書舍人黃唐傅張微各奉詔舉二人執權開封人哲華陽人唐傅侯官人也時頥浩舉朝議大夫禇宗諤修職郎李逮益舉朝請郎惠柔民賔舉前知公安縣程千秋夢得舉直龍圖閣知潭州辛炳朝散郎致仕王庭秀潛善舉登州教授鄒潛綯舉通直郎蔡向珏舉崇德縣令鄧根浚舉校書郎富直柔執權舉前知永州李公彥哲舉杭州教授李誼唐傳舉知興化軍張讀澄舉從政郎周虎臣宗諤高密人柔民晉陵人炳侯官人庭秀鄞縣人潛浩弟根邵武人直柔弼孫公彥臨川人誼南昌人讀閩縣人虎臣館城人壬辰宰執進呈上曰所舉人卿等有識者否黃潛善曰臣等未識然皆名士上曰朕得人才又近三十人殊可喜也權管密州杜彥進瑞芝一本狀辭云草葉純赤實符建炎美號形如指掌應股肱宣力之義殆將有熊羆之士蓋彥自謂也時上親寫書之旅獒及易之大有大畜二卦與孟子之言於坐右素屏宣示宰執甲辰黃潛善等謝曰陛下於書取謹德昭德之義於易取有賢畜賢之道蓋正心誠意以齊家治國者在德立政造事以致君澤民者在賢與孟軻之格言皆今日之急務因知心術之妙不以字書為工也潛善又曰自古千歲乃生聖人後世之君欲法堯舜文武必待偶聖而生則多歷年所願治之志莫就蓋在則人亡則書陛下聽朝之暇擇經史之言寫之於屏所謂日與聖賢對汪伯彥曰陛下寫聖賢垂範之言置諸左右則非為翰墨乃進德修業日躋之盛也上曰如孟子言用賢與殺皆察於國人朕每味斯言欲謹守之潛善曰願陛下允蹈其言則天下幸甚己酉同知樞密院事郭三益卒初成都路轉運判官安居趙開奏祖宗以三司總諸路轉運使此成憲也熙寧後因事設官而漕司遂至不足今𣙜茶買馬乞依嘉祐故事併歸漕司仍減額以蘇茶户減價以惠茶商則私販衰而盜息是秋擢開主管川陜茶馬事使推行之開乃先更茶法官買官賣茶並罷酌政和都茶場法印給茶引使茶商執引與茶户交易改成都茶場為合同場仍置茶市交易者必由市而引與茶必相隨茶户茶鋪皆籍其名姓使之互察此其大略也冬十月甲寅借刑部尚書楊應誠等奉使高麗回具奏高麗君臣見拒之意宰執皆欲罪其負恩上亦怒形於色朱勝非曰彼國為北金密邇與中國隔逺近利害甚明自是前此待之太厚安能責報黃潛善曰若以巨舟載精甲數萬徑造其國彼能無懼乎勝非曰越海征伐燕山之事可戒也上怒稍解後兩月高麗奉表謝罪執禮甚恭優詔答之此據朱勝非間居録監察御史冦防宣諭江淮四路回因奏祖宗朝三京各置留守司御史臺每於月旦率屬拜表如宣詔其餘列郡附遞以進故三京之俗號知禮義今諸州亦望依三京故事月旦拜表庶逺方咸知尊君之義戊午詔從之時四方貢賦不能如期而至行在仰給惟茶鹽鈔法然視商賈去來不可為凖初宣和因方臘之亂江浙被賊諸州皆蠲其賦而官兵無所給乃詔發運使陳亨伯經制東南亨伯請以七路之財補其乏始設比較酒務量添酒價及商稅額亦增一分并賣契紙與公家出納每緡收二十三文並號經制錢斂之少聚之多而無損於民靖康罷之至是翰林學士葉夢得言設經制之法添酒價增稅額并賣契紙頭子等錢皆求於民之所欲而非強其所不欲故酒價雖高未有驅之使飲稅額雖增未有迫之為商者其他類此望復行之户部尚書吕頥浩亦言經制之法始於陳亨伯若循之可以助國而無害於民賢於緩急暴斂多矣知沛縣李膺又言方今費廣昨經制司所收積微而多儻行之所補不細壬戍乃詔諸路提點刑獄司拘收仍依封樁錢法不可擅用金人右副元帥鄂勒琿以衆渡河收下開德府遂攻濮州癸亥奏至詔御營使司統制官張俊左軍統制官韓世忠各帥所部兵俊由京師至開德世忠由徐州往東平府迎敵又令見屯冀州總管馬擴援之議者謂俊乃中軍統制不可逺去遂以統制官范瓊代俊行初知河南府翟進與金人夾河而戰屢破之至是留守司遣所招到楊進者來與同捍敵乃擁衆數十萬殘汝洛間翟進諭之不聽癸酉楊進忽遣數百騎絶水犯翟進營翟進已諜知其姦乘半渡縱擊之追北數十里而翟進躍馬墮壕遇害時御營使司都統王淵頗忌楊進故進懼而復叛知樞密院事汪伯彥有子曰似與其女之壻梁汝霖者嚮皆為金人掠去拘於湯隂縣寨中一年矣至是似汝霖同日南遁至河偶得漁舟以濟都水使者榮薿馳報伯彥十一月壬午伯彥以其事奏且曰二聖在逺陛下無足以解憂者臣於子壻之愛宜在所後已不令入城徑歸鄉矣癸未詔奬伯彥略曰卿仰思二聖之未還不忍一門之私喜初金嘗遣萬騎渡河先攻虢後圍陜知陜州李彥仙極力禦之敵不能破金人至拜於城下而去復攻虢州陷之有內侍高邈嘗官陜西至是彥仙寓書於邈言其與金戰獲捷之狀又言鄜延帥王庶節制六路之後將士用命亦屢勝敵彥仙鞏縣人也己丑上以語宰執且曰朕聞之喜而不寐黃潛善曰邈得彥仙書是何月日上曰朕不欲觀其私書潛善曰前代帝王或復道窺人之私此陛下盛德事也既而朝請郎范寅敷自北地歸言每見漢兒説彥仙名乞朝廷究其實而優奬之寅敷致虛子也先是庶用涇原統制官曲端為都統制庶政嚴多誅將士嘗曰設曲端誤我亦當斬之端聞而恨未有以報時敵驟至延安正軍才二萬庶召諸道兵未集端不出兵為援庶退屯龍坊敵乘虛陷延安數日端至龍坊以兵衛庶且曰節制何自至此哉節制固知愛身不知為天子愛城乎庶曰吾數令不從誰其愛身者端怒謀即軍中誅庶而併其兵因問庶印何在欲奪之會朝廷遣主客郎官謝亮使夏國端夜往見之曰延安五路喉襟今既已失春秋大夫出疆之義得以專之使者茍一誅敗將南歸而報乃使者展節之時也亮曰奉使有指以人臣而擅誅於外是跋扈也公為則自為之亮無預也端乃去庶以故忿端欲死之時新知鳯翔府王􅊛自陜府將兵三千人之新任亦為端所襲而敗􅊛不能軍遂將其餘衆轉入西蜀初直龍圖閣張所招撫河東有前清河尉王彥投所軍中所竒其才不數月擢都統制彥以效用人嶽飛為軍將彥河內人飛安陽人也久之飛見疑於彥乃去自為一軍至是飛降於東京留守杜充又故大將种師道帳下小校桑仲為潰兵所推亦降於充並用為統兵官未幾郡盜張用王善等來冦充命飛仲與戰破之李成之敗也獲其黨之家屬詔分養於真泰楚之三州至是江淮制置使劉光世具上男女六百餘人上謂宰執曰此曹身且不顧豈恤其家朕念作亂非其家屬之罪故令分養之黃潛善曰臣聞光世凱旋過楚州降卒見家屬無恙皆感泣仰戴聖恩朱勝非曰郊赦中可載此以見陛下德意上又曰昨於光世處得李成所用持刀一重七斤成能左右手運兩刀所向無前惜也成惑於陶子思邪説使朕不得用之潛善曰陛下英武大度惜人才如此金人既陷延安又破緩德遂逼晉寧軍初守臣徐徽言與府州折可求約出兵夾攻敵衆時可求之子彥文自東京來被執至雲中左副元帥尼瑪哈以利啖之使為書以招其父於是可求遂降於金可求與徽言親也金挾可求招徽言於城下徽言登陴以大義責之可求曰君與我胡無情徽言曰爾於國家不有情我尚於爾何情即引弓射之可求走徽言因出兵擊金兵大敗之斬羅索貝勒之子時河東環境為盜區惟晉寧獨存其地勝號天下險而徽言設械甚備金數負不得志一夕內應者啓扉以納敵徽言率帳下士力戰金兵猥至被執羅索百計誘之不屈遂遇害徽言西安人後諡曰忠壯時奉使宇文虛中甫渡河辛卯夜上夢道君在延福宫亟往拜之壬辰上以語宰執且曰朕何時得見上皇耶黃潛善曰陛下夙夜以二聖為念孝悌之至無所不通故與上皇神交如平日近聞虛中十月二十六日過河與金人議事自兹二聖歸必有期望陛下少寬聖抱上頷之時吏部尚書吕頥浩户部尚書葉夢得御史中丞張澄給事中孫覿共討論常平法謂此法不宜廢如免役坊場亦可行惟青苗市易當罷上曰青苗法永勿復行夢得請選實歷州縣通世務者為提舉官而頤浩又請追還常平糴本皆從之時立法已定未及頒行此據顔歧所編聖語及朱勝非間居録修入先是詔遣常德軍承宣使孟忠厚從衛隆祐太后往杭州癸巳宰執奏所經州縣日用飲食事上曰太后於此朕雖粗留意亦不以口腹勞人如朕於兩膳物至則食未嘗問也向自相州渡河野中寒甚燒柴溫飯用瓢酌水與汪伯彥於茅舍下同食伯彥曰追念此時與光武滹沱河燎火食麥飯何異皆中興之象也黃潛善曰陛下可謂險阻艱難備嘗之矣願崇儉以濟斯民天下幸甚初太學生建安魏行可應詔願使絶域遂借禮部侍郎充大金軍前通問使仍兼河北京畿撫諭時有金人之舅王䇿者拘囚在東京行可經由或勸之取旨帶行庶可為恱金之計行可不敢有請徑馳北去戊戌渡河至開德府右城敵寨是日紅巾四出金人曰既云奉使乃欲以計襲我耶然紅巾亦不知行可為奉使及見使旌乃引去此據行可墓志修入詔有司築圜壇於南門外初政和所造九寶其八為金人劫去惟鎮國寶在焉至是上以宣示宰執玉色溫潤真希世寶也己亥上朝饗太廟辛丑宿齋於行宫壬寅冬至自常朝殿詣壇祀昊天上帝以太祖配大赦天下是日又詔略曰朕適歲當郊大懼菲德弗獲顧歆乃者先事三日隂翳震於朕心逮祖廟及壇垂象燦炳夜氣晏溫迄用成禮顧朕眇昧敢曰馨香上聞實惟祖宗之靈相祐在天亦爾萬方有衆不替忠順協於天心股肱大臣其同寅協恭輔朕不逮耳目之言必忠毋奪於私有官君子惟職是修爪牙之臣咸奮忠力至於怙衆為暴亦當革心自效朕言不渝爾無怠忽初信王榛遣馬擴請兵於行在而五馬山寨中有亡歸金者告於見屯真定女真萬户蘇赫蘇赫馳稟東元帥府謂擴將得兵而來於是右元帥鄂勒琿右監軍達蘭報左副元帥尼瑪哈共為之備尼瑪哈留左監軍烏克紳守雲中而自率其衆下太行南渡黎陽然尚未至鄂勒琿達蘭先會衆攻破山寨信王不知所在而擴持大軍方次於北京之清平鄂勒琿達蘭復攻敗之擴下統制官阮師中鞏仲平力戰而死任琳引衆叛去擴總餘兵歸行在尼瑪哈進攻澶濮為將官姚端夜襲而敗再攻陷之盡屠其城東京留守杜充慮敵西來決大河阻之敵不能西遂東會鄂勒琿同進兵初遣統制官范瓊將兵拒金瓊至東平府金衆方盛守臣寶文閣直學士權邦彥力不能守棄城而走瓊乃脅邦彥與之南歸濟南府守臣劉豫者阜城人中元符第嘗為臺官因論禮制局事道君批曰劉豫河北村叟不識禮制遂黜於外至是才復為郡時金人來攻豫遣其子麟部兵出戰為金所圍豫檄通判張東援之金人解去尼瑪哈乃遣人啖豫以利豫即詣敵軍前通欵甲辰金人陷德州都監趙叔皈死之初杜充尹大名提點刑獄郭永為充畫數䇿充不能用永曰人有志而無才好名而遺實以此而當大任難矣充愧謝之充移守東京詔就除漕臣張益謙代充為尹時北京與東平實相犄角東平已陷大名塊然孤城當敵之衝叛臣劉豫舉濟南之衆引敵騎來攻甚急益謙與轉運判官裴億皆齷齪無能為或勸益謙委城遁者永曰北門所以遮梁宋敵得志則席卷而南朝廷危矣借力不敵猶當死守徐挫其鋒以待外援因自率兵晝夜乘城且募士齎帛書夜縋城出詣行在告急且請朝廷先為之備敵俘東平濟南人大呼城下曰二郡已降降者富貴不降無噍類益謙億輩相顧色動永曰今日正吾儕盡節之時及行城撫將士曰王師至矣衆皆感泣甲申城陷益謙億率衆迎降金人曰城破而降何也皆以永不從為辭金人遣騎召之永正衣冠南面再拜訖易幅巾而入尼瑪哈曰沮降者誰永熟視曰不降者我金人見永狀貌魁傑且夙聞其賢欲以富貴啖之永罵曰無知之徒恨不醢爾以報國何説我降乎時大名人在縶者無不出涕敵並其家害之永元城人後贈資政殿學士諡曰節勇是月有狂人具衣冠執香爐携絳囊拜於行宫門外內侍以聞押赴都堂詰之但云天使我為官家兒送揚州根治亦無他語雖加箠楚終不言其姓名乃釋之中書舍人周望請除鄉兵外民有子弟願習射者聽之仍籍其姓名守令每月一試取藝高者賞以銀絹而最優者如三路保甲法量與補官十二月己卯詔尚書省立法隆祐太后御舟以是月至杭州詔鼎州團練使苗傅為扈從統制官駐軍於奉國寺上初開府時傅為右軍統制官與楊惟忠比肩如王淵張俊韓世忠皆出其下者先是建州叛卒葉濃等破古田縣徑犯福州入西門劫前太宰余深家金帛且欲縱火本路提刑李芘登城諭之乃去深芘皆閩縣人濃遂犯寧德縣官軍追擊之不利濃等回破建之政和浦城建陽三縣復歸城下時詔御營中軍都統制張俊遣兩浙武憲趙哲統兵二千人號萬人討之大軍至賊迎戰連敗東走哲遣人招安庚申濃等遂降後濃至俊軍中復謀為亂俊擒而誅之己巳以右僕射黃潛善為左僕射兼門下侍郎知樞密院事汪伯彥為右僕射兼中書侍郎汪伯彥時政記云潛善伯彥入謝上曰潛善作左相伯彥作右相朕何患國事不濟更同心以副朕意皆稽首謝伯彥所記其果有之耶若果有之而二臣不能副上所期罪益深矣尚書左丞顔歧為門下侍郎右丞朱勝非為中書侍郎兵部尚書盧益為僉書樞密院事中丞張澄言建卒之殘福州一方騷動余深以前宰相與提刑司都吏王宏謀率郡人申朝廷乞留知州江常蓋常善而易制故為此姦謀以窺朝廷又杭卒之叛薛昻不緣君命自知杭州又耿南仲趣李綱往救河東以致軍潰蓋不恤國事用此報讎又許翰與綱最厚方在樞府則迫种師中急攻太原致其覆師及綱作相引為執政此四人者豈可置而不問時深為特進衛國公昻為金紫光祿大夫皆已致仕南仲見謪散官臨江軍居住翰見任資政殿學士提舉洞霄宫丁丑詔深責臨江軍昻責徽州南仲授别駕依舊臨江軍並居住翰落職未幾南仲卒言者論刑部尚書王賔乃李綱之黨昨為中丞無一字及綱比盧益為副樞賔翊日講筵留身夫侍從選居政府身偶後於他人而躁進如此庚子賔除龍圖閣學士與郡初敵陷東平襲慶二府有土人前左司郎官吳給朝奉郎孫億並於徂徠山建寨保聚兩處軍民及纍下山與敵戰至是京東帥臣益都劉洪道聞於朝乙亥詔給為徽猷閣待制知東平府億為直龍圖閣知襲慶府户部尚書葉夢得嘗請上南渡阻江為險以備不虞上曰自揚至瓜洲五十里聞警而動未晚夢得曰運河僅通一舟恐非一日可濟也復乞命重臣為宣總使一居泗上總兩淮及東方之帥以待敵一居金陵總江浙之路以備退保不報上一日召諸軍議事帶御器械張俊奏敵勢方張宜且南渡俟國勢定圖之復請移左藏庫於鎮江又吏部侍郎劉珏亦言備敵之計兵食為先今以降人為見兵以糴本為見糧二者無不可特維揚城池未修卒有不虞何以待之宰執皆不以為然初遣統制官范瓊北征支金帛數萬令其犒師瓊悉以入已且買女色以自奉乃引所部軍由間道自淮西趣江東至是又轉而之江西時金人橫行山東羣盜李成輩因之為亂金左元帥尼瑪哈將由東平歷徐泗以逼行在左右僕射黃潛善汪伯彥皆無逺略且斥堠不明自京城至泗州道途甚逺其京城斥堠但委之御史臺南京則委之留臺泗上則委之郡守未嘗多以金帛專遣人探金之動息成雖前為江淮制置使劉光世所敗而走然成衆未衰也是月淮北屢有警報皆謂成餘黨無足畏者金人覘知朝廷不戒亦偽稱成黨以欵我師云初成之來歸也朝廷既授以官復多給空頭官誥與之成敗皆為光世所奪遂以賞所部立功將士凡書填五十道至是光世申納其餘且言恐軍中有得之者亦效其書填異時真偽不辨乞除所申姓名外許人告捕詔從之仍立賞錢三百緡詔立賞在明年正月二日今聨書之初夏國因契丹為金人所敗遂率衆取其天德八館之地八館者膏腴産稻夏國得之殊喜至是金人怙強遣使求之謂他日以陜西奉償夏國懼不敢違而中懷怨憤又夏國世為知府州折氏所困時折可求已降於金故金欲因折氏以併夏境
