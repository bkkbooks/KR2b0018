body:
  text: 提要中興小紀四十卷編年類臣等謹案中興小紀四十卷宋熊克撰克字子復建陽人孝宗時官至起居郎兼直學士院出知台州事跡具宋史文苑傳是編排次南渡以後事跡首建炎丁未迄紹興壬午年經月緯勒成一書宋制凡纍朝國史先修日厯其曰小紀蓋以别於官書也陳振孫書録解題稱克之為書往往疏略多抵牾不稱良史嶽珂桯史亦摘其記金海陵南侵事以薰風殿之議與武德殿之議併書於紹興二十八年誤合為一蓋以當時之人記當時之事耳目既有難周是非尚未論定自不及李心傳書纂輯於記載詳備之餘然其上援朝典下參私記綴輯聫貫具有倫理其於心傳之書亦不失先河之導創始難工固未可一例論也宋史藝文志載克所著尚有九朝通略一百六十八卷今永樂大典僅存十有一卷首尾零落已無端委僅此書尚為完本惟原書篇第為編纂者所合併舊目己不可尋今約略年月依宋史所載原數仍勒為四十卷乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書中興小紀月録卷一起建炎元年五月盡六月卷二起建炎元年七月盡十二月卷三起建炎二年正月盡六月卷四起建炎二年七月盡十二月卷五起建炎三年正月盡三月卷六起建炎三年四月盡八月卷七起建炎三年閏八月盡十二月卷八起建炎四年正月盡六月卷九起建炎四年七月盡十二月卷十起紹興元年正月盡六月卷十一起紹興元年七月盡十二月卷十二起紹興二年正月盡六月卷十三起紹興二年七月盡十二月卷十四起紹興三年正月盡六月卷十五起紹興三年七月盡十二月卷十六起紹興四年正月盡八月卷十七起紹興四年九月盡十二月卷十八起紹興五年正月盡六月卷十九起紹興五年七月盡十二月卷二十起紹興六年正月盡十二月卷二十一起紹興七年正月盡六月卷二十二起紹興七年七月盡九月卷二十三起紹興七年十月盡十二月卷二十四起紹興八年正月盡六月卷二十五起紹興八年七月盡十二月卷二十六起紹興九年正月盡六月卷二十七起紹興九年七月盡十二月卷二十八起紹興十年正月盡十二月卷二十九起紹興十一年正月盡十二月卷三十起紹興十二年正月盡十二月卷三十一起紹興十三年正月盡十四年十二月卷三十二起紹興十五年正月盡十六年十二月卷三十三起紹興十七年正月盡十八年十二月卷三十四起紹興十九年正月盡二十年十二月卷三十五起紹興二十一年正月盡二十三年十二月卷三十六起紹興二十四年正月盡二十五年十二月卷三十七起紹興二十六年正月盡二十七年十二月卷三十八起紹興二十八年正月盡二十九年十二月卷三十九起紹興三十年正月盡十二月卷四十起紹興三十一年正月盡三十二年六月
