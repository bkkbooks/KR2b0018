body:
  text: 中興小紀卷十一宋熊克撰紹興元年秋七月乙未是嵗當祀明堂文武有合轉官者右僕射范宗尹以為多所僥倖乃建言論崇觀政宣以來濫賞而參知政事秦檜力賛之壬寅上謂宰執曰議得當否朕不欲人毎以此事議及上皇聖徳時吏部侍郎髙衞主右選上疏詆之乃詔先罷武臣討論既而同知樞宻院李回自言宣和間任詞臣以校正御前文籍轉官恐是濫賞乞削秩罷政上曰人君留意文籍命臣下校正有勞轉官豈與濫賞同科顧謂宗尹曰且如卿等以功轉官若與小人同一劄目亦自難處宗尹力奏此事如回者無㡬其他亦不足惜遂詔侍從及館職兼領校正者非按此下原本訛脱既而上批大臣討論亦罷大意以為不欲歸過君父斂怨士夫而宗尹堅謂可行即日求出於是秦檜復以此事擠宗尹而侍御史沈與求條宗尹罪狀二十宗尹力請解政癸亥罷為觀文殿學士提舉洞霄宫上謂執政曰宗尹既去惟王俁萬格以刻薄附㑹討論事招致人言當罷此外宜置勿論恐分朋植黨非國家之福皆曰此陛下盛徳也俁華陽人格鄱陽人時並為都司未㡬宗尹落職初詔勅令所以嘉祐敕與政和敕對修命工部侍郎韓肖胄等詳定至是修成敕令格式八月戊辰提舉官參知政事張守上之肖胄忠彦孫也先是諫官韓璜論堂吏俞宗适滑浩二人預討論事浩已罷職璜言執政不當芘宗适而不問是日執政奏事富直柔曰臣聞宗适誠不預言者誤聽秦檜曰吏承行文書不必罪之李回曰如罪兩都司彼自無詞上曰兩都司殊刻薄為朝廷建議須有忠厚之風張守等仰賛聖訓於是不罪宗适再以浩送吏部初靖康京城圍急胡唐老時為殿中侍御史言萬一不守則本支俱覆聞康邸至磁相間為民所留此天意也請建為大元帥領兵入援至是其弟吏部郎官世将繳唐老劄子且為之請謚壬申上謂執政曰當時事亦偶然何功之有於是張守等退而歎曰大哉王言内侍楊公恕自叙嘗在潜邸欲求差遣執政擬與兵馬都監上曰以潜邸恩與一都監亦不為僥倖但其人難使之近民富直柔曰近有任鈞者至宻院干差遣陛下知其為人否上曰鈞乃珪之子尤狠愎豈可任使此輩稍不循理朕不欲使之在左右於是執政退而悚服参知政事張守薦舊相清逺軍節度副使汪伯彦之才可用詔復官提舉洞霄宫癸酉伯彦復觀文殿學士除江東安撫大使兼知池州既而右司諌韓璜論伯彦不可用詔罷之依舊提舉洞霄宫上曰治天下惟公朕安得而私也於是参知政事秦檜退而仰服聖訓時沈與求再歸言路中疑其論范宗尹所引用者悉出之與求曰近世人材視宰相出處為進退蓋習以成風今當别人之正邪能否而公言之豈可謂一時所用皆不賢而使視宰相為進退哉中書省言池江二州地勢僻隘失祖宗公道置帥之意庚辰詔江東西路依舊以昇洪為帥府癸未執政奏劉光世繳到劉豫偽詔詔尾乃其子偽左相銜也上曰可見豫􅄶陋李回曰藝祖即位用范質王溥皆數年而後代以趙普秦檜因曰帝王自有受命之符陛下靖康初為生靈請行此即受命之符正所謂保民而王者也時揆席久虗秦檜倡言曰我有二䇿可以竦動天下或問何以不言檜曰今無相不可行也己亥中書門下省言文臣舊法曽分有無出身帶左右字若贓罪則悉去左右庶有所别今欲復舊詔從之仁宗嘗親篆明堂及飛白門牓壬寅上謂宰執曰行宫殿小難以模設已别書六字第以嗣天子臣名恭書代孝子嗣皇帝親札蓋以祀天為主也秦檜等曰以祀天為主深合禮意有條令所小使臣楊球者被㫖召試侍御史沈與求言陛下復祖宗故事間詔四方豪俊令中書䇿試而用之於臺省館閣皆極一時之選今球乃預其列不知薦者為誰望罷球使歸右選詔從之甲寅上曰朕以眇躬獲主大器居位五祀而王室益微念兹永懐慘若焚灼比因崇祀明堂投誠上帝冀獲悔禍以雪神人之耻而赦文夸大殊咈朕心又除吕頥浩制首為中興聖緒兼創業守文之言徒使四方誚于有識可與外任於是中書舍人兼直學士院席益以顯謨閣待制與郡而去江南招討使張俊言承務郎汪若海說李允文有功乞充本司幹辦官丙辰上以問宰執吕頥浩曰若海頃與大圭以語言交鬬滕康劉珏致二人不和遂有兵火之變皆編置嶺外尚未放還上曰若容在軍中恐後為累後有罪者亦必援例第勿許之朕自以諭俊也於是頥浩等竦服聖訓戸部侍郎孟庾進尚書時江湖供錢粮久虧而羣盗尚聚己未詔庾為宣諭制置使詔近降赦恩慮州縣奉行不䖍委逐路提刑親行體訪務令實恵及民若所載寛恤事或有未盡亦令監司條上初李成之黨李雱為成計謀至是張俊獲雱而成勢蹙将殘黨遁居順昌詔淮蔡二鎮掩殺成遂奔偽齊餘衆趙瑞等降言者謂洛為國西宅而翟興於僅存之地萬死一生率師䕶寢陵戰屢獲㨗粗自立基望錫軍名使知國家惓惓不忘之意壬戌詔名忠䕶軍吏部郎官廖剛言因江南探報事宜頗致懐慮羣臣徃徃以維揚之事為戒無敢任其責者臣謂動静之間在審其緩急而已料今嵗敵騎勢分必無南渡之事望姑寛聖念以慰天下臣所陳下䇿正如李孝子操瞑眩之藥厥疾已瘳則無所用矣初翰林學士汪藻言自元符以来至建炎並無日厯此國之重事願留聖心上納之既而宰執請擇所付上曰無以易藻矣至是除藻龍圖閣直學士知湖州詔領日厯如故金左監軍逹喇大憾之按句中之字無着句上疑有闕文盡却所獻之物而去豫遣偽相張孝純隨而和之數日乃回逹喇至祁州遷其民而出仍許只􅂝行李其錢榖之類皆留遂以祁城為元帥府先是建炎末敵方南牧有朝奉郎趙俊者宋城人居城北或勸其避地俊曰但固吾所守爾死生命也逃将安之時劉豫以俊為虞部郎官俊稱疾不受豫不能强凡文字不肯用豫僣號但書甲子未幾卒時有武功大夫蘇易縁守奉化縣界轉一官於是中書舍人程俱言武功大夫轉入横行則官益以輕其害尤大祖宗之法武臣自閣門副使至内客省使為横行不係磨勘即非皇城使所得轉入之官皆特㫖而受故元豐官制以承務郎至特進為寄禄官而武臣獨依舊不以寄禄官易之蓋有深意政和間改武官稱為郎大夫遂并横行易之而轉官之級按句内有脱誤此當時有司不習典故率意而改以開僥倖之門故流弊日深且文臣庶官轉不得過中大夫而武臣乃得過皇城使此何理也自改使為大夫以来嘗調官轉為横行者不可勝數其弊已極而他人莫能言也冬十月乙丑以新除給事中兼侍講洪擬為吏部尚書言者謂擬未嘗歴州縣擬請外遂除龍圖閣待制知温州言者以謂近差甲頭催税其害又甚於保長戊辰户部奏甲頭於三十戸輪差初無髙下而大保長乃有力可以倚仗詔從之初金右監軍烏珠駐兵於熈河秦雍至是相繼移寨欲窺蜀宣撫處置使張浚令陜西都統制呉玠於鳯翔府之和尚原先處戰地誘致其來烏珠乃引衆十餘萬造浮橋於寳雞縣渡渭來攻玠遣統制官呉璘雷仲率諸将選勁弓强弩分畨迭射號駐隊矢接發不絶繁宻如雨金稍却則以竒兵旁擊斷其糧道又刼破金寨乙亥與金戰凡三十餘陣烏珠中箭而遁俘其将英格貝勒原名羊哥孛堇今改正及隊領三百甲兵八百殺敵衆横屍滿野是役也烏珠徃反萬里始末三年其衆之損者逾半皆呻吟扶攜以歸烏珠初有從馬數百至是僅留其六道由平陽府守臣蕭慶以三馬奉之於是北歸燕山王之望西事記曰張浚之敗賴呉玠獨全一軍據和尚原以守金人屢攻之不克大破敵軍殺其将帥人多疑不實夫呉玠之敗四太子固未可知然敵若不敗則今已無四川矣故陜西之敗皆浚為之然而金人不能取蜀亦其用玠之力也乙酉宰執言郭仲荀初除管軍例得閣職上曰祖宗待三衙之厚如此富直柔曰祖宗時三衙用邊功戚里班行各一人蓋有深意上曰參用戚里固祖宗法然礙處亦多恐不可用於是宰執退而歎曰此言可以為後世法丁亥宰執奏有司勘到偽造吿身事連知閣門事潘永思上曰雖戚里既有過安可廢法於是令罷閣職就逮秦檜退而歎聖徳曰卓哉此舉初工部侍郎韓肖胄在都司時嘗言國以兵强兵以食為本宜理淮南以修農事則轉輸可省遂命屯田郎官置局建康行屯田之法於兩淮上又親書趙充國傳刻石摹本賜諸将以厲之於是荆南鎮撫使解潜於部内五郡屯田且辟直秘閣宗綱為措置官而公安知縣孫倚率先辦集詔加兩秩既而言者復請江之南岸亦興屯田戊子江西大帥李回又言江州赤地千里望依淮浙委監司興營田並從之初知興元府利䕫路制置使王庶籍興元及諸縣良家子弟號曰義士以縣令為軍正而武勇知邊事者副之尺籍伍符皆如舊制軍聲甚振至是宣撫司上其狀甲申庶自待制為徽猷閣直學士吕大麟見聞録曰王庶立義士其法甚妙紹興初富平大衂之後兵率單寡庶於興元府興洋金蓬聞達諸處令州縣選强壮每兩丁取一丁三丁取二丁與免尸下物力錢二百千每五十人為一隊知縣為軍正尉為軍副日閱武於縣月閱武於州不半年有兵二十萬每遇州教則厚犒賞之教閱有方可以出戰則令尉便與改秩今川口義士尚衆皆庶倡之也己丑吏部郎官廖剛言臣前所獻幸閩之説姑備一時之急爾國家艱難極則必反今乃圖新之時故經營建康殆不可緩歳晚固所未暇俟有機㑹可乘當親擁六師徃為固守之計彼敵雖㸃詎能妄意吾之虚實而輙窺也哉且東南建國無易金陵臣聞劉豫在齊魏間省徭薄賦專務姑息招徕人士誘以偽官安知其不圖吾根本地乎要當出其不意而徙居焉亦先事制人之道也尋除剛起居舍人剛又言伏見陛下詳延儒臣採摭故實為說以進而游意翰墨博覧羣書亦可謂好學矣然帝王之學與文士異堯舜禹湯文武仲尼汲汲皇皇是其用心亦必有在矣且援孟子所言天下國家之本在身與大學之治國平天下其端在正心誠意願陛下去末學之無益坐進此道則可以福羣生也初建㓂范汝為未平而本路制置使辛企宗握兵玩㓂一路騷然詔以大理少卿朱宗為本路漕臣宗仙游人紱子也宗入對言民困無聊弄兵以延一旦之命陛下第追還制置使以此事付臣可毋戰而平也上詔宗行而企宗方議募兵檄取錢糧數多宗遺書責之曰公擁兵彌年州縣餽餉費百萬而責取未巳民在溝壑矣公為則自為之初詔企宗放散汝為之黨企宗乃奏汝為乞於福州就糧不遵聖㫖遂詔企宗措畫而企宗怯懦不能制賊反屯其衆於建之城外上乃擢吏部郎官胡世将為監察御史福建撫諭世将既至言汝為懐反側猶肆剽掠而招撫官謝嚮陸棠顧與賊通亟捕嚮棠與制置使屬官施逵付獄又樞宻院計議官沙縣張致逺請歸鄉因白宰執乞遣重兵討之而知福州程邁亦請改命将臣又是時曹成馬友有衆數萬轉掠湖南北而山東賊白氊笠劉忠者嘗與烏珠戰頡頑而南自黥其額號花面戰據潭之白綿山號為最强左僕射吕頥浩建言先平内冦然後可禦外侮十一月戊戌乃詔參知政事孟庾為福建江西湖南宣撫使太尉武成感懐軍節度使韓世忠副之發大軍由台温路先徃福建次赴餘路仍罷企宗以其軍𨽻韓世忠庾遂辟致逺充隨軍機幕既而世将奏謝嚮陸棠及施逵皆械送行在嚮棠死於路逵得以歸罪二人止從輕典送逺郡覊管中途逸去後改名宜生竄入偽境詔紹興府運頗艱難以久駐可移蹕臨安府初景靈宫萬夀觀㑹昌宫章武殿神御並在温州甲辰詔差内侍岑峑充迎奉主管官時又迎奉太廟神主亦令内侍省選官主管仍罷提㸃官鄭士彦别命郎官一員赴温州充提㸃官凡有事移牒州縣並申提㸃官其主管官毋得輙行初萬夀觀有章獻皇后用黄金所鑄真宗像及后像既而上曰置金像外方人所側目若不取入是誨為盗也因愀然謂宰執曰朕播遷至此不能薦享宗廟奉衣冠出游令祖宗神御越在海隅念之坐不安席聖語在明年閏四月今聨書之先是淮南賊張琪既為統制官閻臯等所敗其黨姚興王恱引所部詣統制官巨師古降琪西走追擒之送行在乙巳戮于市初常州守臣周杞坐殘虐敗官是夏大旱上御邇英閣問所以致旱之由給事中胡交修為中書舍人對曰此殆杞佚罰遂以祀屬吏至是獄具甲寅上曰當官者小過或有害惟濫刑為當懲聞杞数濫殺人豈得不治朕日聽斷若任情殺人豈不可耶顧非理爾於是宰執将順聖徳退而記之以埀訓萬世時杞謂交修䜛己乃上書告其罪詔遣大理寺丞胡䝉詣常州按驗反復窮究交修無所挂然羣從亦多抵罪䝉歴城人也初詔左僕射吕頥浩復相而同知樞宻院事富直柔與司諫韓璜及神武中軍統制官辛永宗兄弟見上多言頥浩之短至是侍御史沈與求言直柔與璜等結為朋黨丙辰罷直柔為提舉洞霄宫而璜等亦皆黜去初復江淮等路發運使以寳文閣直學士權邦彦為之邦彦闇而傲士論不與至是吕頥浩又薦邦彦為兵部尚書初選人永嘉婁寅亮嘗陳宗社大計深契上意已與改官至是以為監察御史制略曰爾上書論事慮國則深既遷一官朕意未足中書舍人程俱辭也宣撫使孟庾總大軍道由温州守臣龍圖閣待制洪擬趨庾赴援庾怒於饋餉外命擬亟犒師犒已即行擬歸未及州治軍人已塞滿庭下訩訩且不測擬即借封樁錢用之事已自劾詔書奨其知變加秩一等金人僉軍之法以家業高下定之者曰家戸軍以人數多寡定之者曰人丁軍謂家戸者不以人數稱人丁者不以家業時雲中有陳氏姑婦持其産簿訴于右副元帥尼瑪哈謂父子俱已陣亡願盡納産乞免充軍左監軍烏克紳怒其沮法賛尼瑪哈誅之於是國人皆怨而尼瑪哈又禁諸路之民不得擅去鄉里凡出必先告官給畨漢守公據然後可行右監軍逹蘭請於尼瑪哈謂西路之軍有解鹽可贍而東路無之乞割齊境滄州鹽場以贍其用蓋達蘭怒劉豫不拜欲奪其利而尼瑪哈方專權芘豫故不之許然逹蘭自此憾豫愈深矣初吕頥浩帥江東置司池州既召入令知池州劉洪道攝帥事是月以資政殿學士葉夢得為安撫大使始還帥府於建康時建康荒殘見兵不滿三千人諸将散居他郡夢得至乃奏移宣州駐劄韓世清一軍屯建康追水軍統制官崔増屯采石及統制官巨師古閻臯分守要害而世清尚未至也於是夢得召集流民稍稍復業商販亦通時羣盗蜂起右文殿修撰胡安國一日謂其門人楊訓者曰昔冦起燕山則關中河北可避及入關河則淮南漢南可避今至湖外惟二廣爾又焉保二廣之無冦也至此可謂窮矣只得存心以聽命訓問曰存心如何安國曰行善而莫為惡耳十二月丙寅詔依祖宗故事置樞宻都承㫖一員以兩制為之建冦范汝為聞大軍将至亟入據州城監司守宰以下皆遁去賊将葉徹徃犯南劒州先是制置司撥統制官任士安一軍駐城西賊至未肯力戰守臣張觷獨率州兵出拒射徹死而退賊觷候官人也觷知士安方懼無功即函徹首與之州兵皆憤觷曰早晩賊必再至非與大軍合不能破也士安得之大喜遂馳報諸司謂已斬徹未幾徹二子曰文臣武果引衆聲復父讎縞素來攻於是士安與州兵偕戰賊大敗汝為自此益挫庚午詔略曰聞汝為嘯聚日久今再遣師剪除其從有能執汝為請命者當受重賞自餘咸赦除之上因諭宰執曰若不許其自新何以示好生之徳秦檜曰天地大徳曰生聖人大寳曰位何以守位曰仁唯仁則能好生而配天地以守其位也既退吕頥浩請記以為訓時宣撫司軍已次福州於是孟庾留福而韓世忠總兵趣建知福州程邁謂世忠曰賊鋭宜少休以俟元夕世忠笑曰吾以元夕凱旋見公矣時賊於正南路植巨木為鹿角及設陷馬坑以拒王師世忠命諸軍偃旗仆鼓由小路徑至鳯凰山繞出賊背范汝為震怖以謂從天而下於是列寨以環其城賊夜遣衆刼寨戰敗而走丁丑右司諫方孟卿言比言大兵所過恣為剽掠有甚於賊願賜丁寧乃詔自今出師毋得秋毫騷擾樞宻院察大将統制統領官以下遞察犯者並行軍法初宣撫處置使張浚移軍閬州令參議軍事劉子羽於關外調䕶諸軍子羽頗得衆心又總領趙開兼都漕號善理財不加賦於民而軍用足戊子宰執奏浚居閬為水運以給西軍上曰朕料浚必能立功秦檜言臣初至行朝見論浚者紛紛可駭賴陛下保全使得安迹萬一有功實陛下知人善任使不惑浮言之效也上因論天下事有利必有害但利多害少皆可為如前年航海一板之外便為不測使惑於浮言逡巡不决豈不敗事於是宰執退至省未食而浚和尚原捷報已至乃相與歎仰聖明知人善料敵如此顧恐人臣不才無以稱任使耳既而浚以功除定國軍節度使職仍舊壬辰兵部尚書胡直儒卒鄧随郢鎮撫使桑仲雖已受朝命而猶恃兵衆再圖取金州是冬復引衆攻房州金均房鎮撫使王彦與戰于青林間又大敗之建炎初詔西外宗司居髙郵軍南外宗司居鎮江府及渡江以来遷徙不常是年西外宗居福州南外宗居泉州其後兩宗學各置教官如諸州例云時金左監軍逹蘭居祁州而其衆尚留承楚浙西大帥劉光世守鎮江欲􅂝貳之乃以金銀銅為三色泉其文曰招納信寳獲金人則燕餞而遺之未幾踵至得衆数萬給良馬利器用之如華人因創赤心竒兵兩軍頗得其用初五路既陷金人悉割以屬偽齊金以陜西重地自右監軍烏珠敗走都統羅索病死而忠䕶軍翟興屯伊陽山又知鳯翔府呉玠見保和尚原右副元帥尼瑪哈欲固人心遂以女真萬戸薩里罕為經略駐兵鳳翔府以守之
