body:
  text: 中興小紀卷三十七宋熊克撰紹興二十六年嵗在丙子春正月殿中侍御史湯鵬舉言禮部侍郎王珉吏部侍郎徐嚞皆附㑹秦檜辛亥珉嚞俱罷鵬舉又論兵部侍郎沈虚中嘗密報秦熺已取塤為奏名之首亦罷之虚中廣徳人也論罷虚中在二月今聨書之新執政府三位成癸丑各令遷入東位魏良臣中位沈該西位湯思退于是良臣等言仰荷聖恩將何以報上曰比年執政府上漏下濕葢不堪居卿等曽到京見宰執府八位諸事如法所以待天下賢俊禮當如此時言者謂諸縣巡尉不用心捕强盗反令鄰保備賞捉賊擾之及捕到官却令扳有力之家悉追入獄恣行乞取望嚴禁止上曰朕深知之惟得一好守臣即此弊自革不得人約束雖嚴不能禁也魏良臣等奏曰自今每一郡闕敢不究心搜才仰副陛下之意特進張浚丁母憂奏至丙辰上謂執政曰士大夫起復非所以厚風俗唯軍中人乃可爾時沈該因奏蜀中人材上曰蜀人多能文然士當以徳行為先文章乃其餘事該曰有文章者多不矜細行往往輕肆傲物徳行為先誠如聖訓是月右中大夫叚拂卒二月甲戍詔累年所造軍器内庫山積諸軍亦各自製可令工部具已造之數其諸州合發物料特與减免見後工匠亦宜减放時有言乞諸州修聖祖殿者丙子上曰惟淮南兵火以來未修聖祖殿乃奉先之所固不可無但行下恐因而擾民今隨宜措置可也先是秦檜當國進奏院所報事目必令具本先納俟竄定方許報行謂之定本其下頗遲又官吏迎合刪去要事止具常程文書故朝廷施設除授四方不得盡知於是右正言陸哲深論其弊請罷去定本復祖宗舊制以通上下之志庚辰詔從之侍御史湯鵬舉殿中侍御史周方崇右正言陸哲論參知政事魏良臣有不公之迹假以嵗月殆有甚于秦檜良臣亦自言輔政無狀乞罷辛卯以為資政殿學士知紹興府初詔修祖宗寳訓置國史院未幾而罷至是著作佐郎周麟之請修神宗哲宗兩朝寳訓癸巳詔從之國子司業王大寳奏乞减折帛錢甲午上謂宰執曰大寳近又乞放度牒殊未曉朕意人多以鬻度牒為利亦以祝人主壽延洪國祚為言且佛法自漢永平方流入中國五帝三王之時人主壽至百嵗卜年八百此時佛法安在哉朕謂人主但當事合天心而仁及生民自然享國久長如髙齊蕭梁奉佛皆無益也僧徒不耕而食不織而衣無父子君臣之禮以死生禍福恐無知之民蠧民傷教莫甚于此豈宜廣也沈該等曰陛下聖識髙逺度越前古天下幸甚是日以吏部侍郎張綱兼權尚書三月丙寅詔略曰講和之䇿斷自朕志故相秦檜但能贊朕而已近者無知之輩鼓唱浮言以惑衆聽至有偽撰詔命召用舊臣抗章公車妄議邊事朕甚駭之内外之臣咸體朕意如敢肆議當寘典刑丁卯詔軍器監工匠除本所見役八百六十人依舊外其諸州發到一千五百人以三分為率减去二分令還本州仍給以路費上之愛惜民力如此己巳執政奏京西淮南閒田乞許人請佃其租課㳂邊免十年次邊免五年又四川地狹人稠欲令制置司散牓諸路募人往京西墾田上皆可之且曰下户恐卒無牛具種糧官宜貸之上之恤民周至如此夏四月己卯上諭執政曰文武一道今太學就緒而武學幾廢致有遺才祖宗武學養士自有成法可令禮部兵部速具以聞上之留神學校兼隆文武如此時大金國主亮加尊號庚寅以翰林學士兼侍讀陳誠之假資政殿大學士醴泉觀使充賀使誠之自紹興十八年賀生辰至是凡三入彼國頗見信後有往聘者必問其安否云戊子詔温州就試人多置増解額初司農寺王炎嘗乞以見管常平錢糴米赴行在而權户部郎官鍾世明亦請令諸路嵗發陳米十五萬石赴行在至是侍御史湯鵬舉言其壊祖宗常平成法望賜黜之乙未詔炎世明各降一官炎安陽人也五月壬寅以參知政事沈該為左僕射万俟卨為右僕射並同平章事先是執政薦直秘閣知婺州辛次膺時已到闕上欲用之而患足不能拜乃升祕閣修撰令復還任上因曰用人須盡公道若以私喜怒則真才實能何由進也上於用人留意如此甲辰端明殿學士僉書樞宻院湯思退進知院事丁未以侍御史湯鵬舉為中丞右正言陸哲言比年臣寮坐罪卒於貶所死生無告乞量原犯條上或復其官職或録其子孫庶幾仁澤下及泉壤戊申宰執奏前宰執及從官昨遭貶屏已死者十五人量輕重分為五等復舊職及與致仕恩澤上曰此甚當於是溥博之惠及存没矣言者謂近年朝廷免米麥耕牛等税錢而不與税務量减嵗額既重則他貨必須重征以求敷數所以商旅不通辛亥上謂宰執曰此説極有理宜令户部立法時諸州大辟雖情法相當類以奏裁遂獲貸配右正言陸哲以謂如此則殺人者幸矣被殺者寃何所伸乃請非實有疑慮及無可憫者不得具奏壬子上曰但恐諸路滅裂將實有疑慮情理可憫之人一例不奏有失欽恤之意致傷和氣乃令刑部坐條及前後指揮行下上於用刑欽恤如此故是嵗諸路斷大辟三十人甲寅三省擬監司除目上曰近遴選監司得人諸路稍稍按發不職之吏罰既行矣賞亦不可無今後郡守有治狀令諸司具奏當議褒擢則善惡知所勸沮蓋上之留意用人如此潭州南岳廟災丁巳詔罷監官仍令轉運司計合用錢數申省撥下免斂及於民六月辛未朔中丞湯鵬舉乞久任守令監司課其政績舉之再任癸酉上謂宰執曰此在謹擇監司監司得人則舉刺公當於是沈該等請詔諸路監司帥臣共考其績列舉再任有異政者不次陞擢從之先是以端明殿學士程克俊知湖州令過闕奏事丁丑除參知政事戊寅宰執奏臣等子弟並令歸本貫應舉並無牒國子監及轉運司試者因檢故事乾徳中陶穀之子卲中第命中書覆試上曰秦熺登科猶是公選後在翰苑文亦可觀其後塤中甲科所對䇿皆檜熺語灼然可見朕抑之置在第三不使與寒士争先祖宗故事今可舉行遂詔舉人有要親者覆試户部尚書韓仲通乞以上供米所餘之數嵗樁一百萬石别廩貯之遇水旱則助軍糧及减收糶號豐儲倉壬午詔從之上曰所儲儻遇水旱誠為有補非細事也丁亥上謂宰執曰近日雨澤甚足暑中雨絶難得可喜也万俟卨曰此秋成可望皆聖徳和氣所召也戊子宰執奏倉部郎官黄祖舜乞科舉取士之外有學行為鄉里所推其卓異者聞之于朝上曰若果有徳行不求聞達之士所當搜揚乃下禮部詳之時以初伏辛卯宰執奏差醫官給散夏藥上曰比聞春夏間民病多是熱疾如服熱藥及消風散多能害人惟小柴胡湯為宜曽令醫官揭牓通衢間服之者所活甚衆上留神醫藥恤民疾苦如此秋七月丁未夜彗出東方井宿間戊申詔朕已避殿减膳尚慮朝政有闕許士庶直言仍令監司郡守條上便民之事庚戍左僕射沈該等言臣等輔政無狀天象謫見便合引咎待罪以兩夜微雲星不見所以未敢遽勤聖聽上曰天象自有數卿等待罪何益朕當與卿等思所以應天之實施實徳以銷變可也上又曰看所臨分野當在秦晉間然朕以天下為憂豈當問逺近耶時禮兵部主管架閣文字杜莘老言彗盭氣所生歴考史牒多為兵兆國家為民息兵而將驕卒惰軍政不肅今因天戒以修人事思患豫防莫急於此因指陳時事十弊時應詔者衆上悉以付後省令精擇第而上之衆議以莘老為首未幾遷勅局刪定官乙卯上謂宰執曰往時士子上書忤秦檜意詔往諸處聽讀遂妨取應可撿舉行之沈該等曰聖慮及此寒士之幸也先是近臣進故事講筵所胥吏多取副本癸亥中丞湯鵬舉言此必懐姦之人恐臣下獻忠有違其意乞不許索從之是日上諭宰執曰比年大金人使到館朕給内庫錢一萬緡付都亭驛備人使買物先為還其直若有還即撥填或還不盡亦不較也初福建鹽貨轉運司積于海倉令上四州及屬縣取而鬻之以充嵗用近年州縣船運過多吏縁為姦鹽斤兩數虧而多雜官肆不售即按籍而敷號口食鹽閭閻下户無一免者民甚苦之甲子湯鵬舉極論其弊乞令憲臣據紹興元年綱數立為定制以去一路之弊乃詔提刑吳逵覈實其數丙寅上諭宰執曰昨卿等乞改正近年續降指揮與祖宗法相戾者有司至今不見上沈該等曰六部謂若一頓改正恐致紛紜欲因事正之上曰此固善然恐吏輩臨時舞文不若一畨改正之也癸酉上諭宰執曰臨安民有納本户絹一匹被退因詢之云官中以不經攬户不肯交朕令人用錢五千五百買之乃好衣絹已令韓仲通根治近在輦轂尚爾外方想不勝其弊矣沈該等曰陛下灼見弊原如此天下幸甚右正言陸哲言改官之弊至多行賄賂薦章一紙費五六百千救弊之術惟在増考第減舉員耳戊寅上謂宰執曰祖宗舊法未易輕改但嚴舉官之令有犯􅂍者舉主同罪必與行之則人自知畏前弊可革沈該等曰陛下察見弊原如此臣等謹遵聖訓時鄂州都統制田師中已平湖南猺賊楊再興且招到其族楊通議等乞各與補官事下刑部以謂前無此例欲令本軍收充效用日量給之陸哲言猺人無故擾邊官軍討之非藉内應焉能直搗巢穴何惜一資一級以慰其心且為來者勸於是通議等卒得補官庚辰中丞湯鵬舉言欲寛民力在于省吏今州縣胥徒最冗為民之害望詔逐路常平官立定吏額從之淮南漕司具到米價最賤處每斗一百二十三文癸未上謂宰執曰昨聞淮南米賤恐太賤傷農故欲乗時收糴今則未須急候價减每石一千至時若户部無錢朕自支一百萬貫令收糴也沈該等曰陛下愛民之心如此可謂至矣庚戌交趾國使貢賀昇平綱言者論川中折帛錢太重絹一匹私直五千而官估十千他物稱是去嵗裕民所减不過一千癸巳上諭宰執須與减若行下未必濟事不若便令四川總領司具合减數申朝廷庶幾民受實惠朕自即位以來未嘗一有妄用凡以為民而已九月辛亥詔錢塘江岸為潮水所損久則費工愈多令漕司同臨安府速修治之壬子詔監司郡守具到裕民事令給舍詳之武學博士歸安周操言乞自今武舉登科髙等者樞密院籍記任滿有績即加擢用其次者亦免充筦庫之任從之是月户部尚書韓仲通除敷文閣直學士知廣州時以内教有司依年例供進賞賚物帛有退還者半冬十月辛未宰執奏此仰見陛下儉徳雖禹湯無以過上曰賞賚無用許多能如此撙節有司一嵗可省數百萬緡沈該等曰陛下每事省約以寛財賦此非獨有司之幸實天下之幸也壬申上諭宰執曰宗室中才學者選三兩人除行在官京師盛時從官建節者甚衆今不可以舊比但如南班亦少朕甚念之沈該等曰仰見陛下睦族之意雖堯舜用心不過如此初詔實録院編皇太后回鑾事實及徽宗梓宫還闕本末至是先修回鑾事實書成丙戍右僕射万俟卨上之時左僕射沈該言昨進安奉回鑾事實禮物陛下悉退出不受皇太后聖性節儉而陛下仰承太后之美天下幸甚上曰宫中無用許多禮物皇太后今七十七嵗而康健如五六十人自古帝后無有也庚戌參知政事張綱奏皇太后生日回賜臣銀絹過多上因曰太后前以飲食動臓腑近已安健粥藥皆朕親進又得皇后侍奉甚謹太后聖慈無比然性亦嚴唯皇后賢淑能順其意朕每日臨朝所以得心安也綱曰太后聖徳聞於天下春秋既髙皇后又能承順周家太任大姒之美在今日可以比隆矣乙丑中書舍人王綸言近詳守臣具到五事其間惟二三的實餘皆細務秖取充數亦有為五條所拘不得盡言望今後不拘其數庶以副陛下務施實徳之意從之綸江寧人也十一月禮部侍郎辛次膺請考每嵗財賦入出之數以廣儲蓄甲戌上謂宰執曰此誠今日急務然止有三説生財理財節財是也比年生財之道講求略盡唯理財多縁官司失職致有拖欠使州縣得人必不至此若節財則用莫大於給軍既有定額無可裁損今但當撙節不可妄費夫理財得人又能撙節如此數年蓄積自有餘矣沈該等曰誠如聖訓時太學補試揭榜中程者一百九十人詩賦多而經義少壬午上謂宰執曰後生輩往往皆詩賦數年後恐經義科廢矣宜令兼習經義沈該等欲來年省試後經義與詩賦兼行上曰善初知嘉州朱昌裔知萬州李莘民知泰寧費行之皆因監司所舉籍其姓名至是行之任滿辛卯宰執擬知卭州上令更與轉官于是昌裔莘民亦皆轉一官浙東提舉官趙公稱奏准詔定吏額今據本路人吏四千二百六十今减去二千一百九十庚午上謂宰執曰若諸路依此非惟省事民亦受無窮之賜也初詔户部侍郎王俣詳定重修貢舉勅令格式至是書成癸丑右僕射万俟卨上之初上親製孔子并七十二賢賛皆灑以宸翰至是臣僚請勒石國子監以為不朽之傳仍摹本賜諸郡學戊午詔從之己未宰執奏臺臣論左朝奉大夫陳亨持左朝請大夫趙廸之罪狀乞屏于逺方上曰所論未知實否且下逐路監司體究沈該曰既是臺章恐不須體究上曰朕見人材難得未嘗不留意愛惜每諭與臺諫風聞言事不可容易須再三詢訪朕惟言者之聽豈可不審今二人者合如何施行該曰乞送吏部與監當上曰且依此時上方委户部郎官向伯奮措置財用言者論其素有脱空之名上謂宰執曰朕見累任監司亦嘗委以捕盗今既有言章須與一郡於是差知吉州章不報行庚申上謂宰執曰昨下詔求言四方之士陳獻甚多朕一一披覧所言利害極有可取宜擇其議論尤切當者量與推恩庶幾有以勸之沈該等曰仰見陛下樂見善言天下幸甚壬戌三佛齊國遣使入貢是年罷提㸃坑冶鑄錢官以其事歸諸路轉運司金國主亮改元正隆復汴京大内遣其臣左丞相張浩領行臺尚書省以督其事且用本朝内侍嚮陷敵中梁其姓者為提督官號大使於是暴役横斂以務速成而中原之民重罹其毒矣紹興二十七年嵗在丁丑春正月監登聞鼓院王述以其父倫死事乞外任戊子上曰王倫頃年奉使於金金欲留之許以官爵倫不從乃冠帶南嚮再拜訖就死此事亦人所難宜恤其後可特添差平江府通判時敷文閣直學士蕭振再為四川帥上念蜀民久困供億詔振與總領四川財賦湯允恭提舉茶馬李澗東西漕臣許尹王之望同措置俾實惠及民可以經久尹鄱陽人之望穀城人也至是之望獨奏乞减四川上供之半以裕民辛卯上謂宰執曰須見得四川毎年出入之賦數常敷幾何横斂幾何軍儲所須與無名之費多少朕不惜减以裕民為諸司未有定議遽先如此萬一闕乏何以善後之望有愛民之志但臨事不審率爾有請湯思退曰四川財賦誠如聖訓可趣蕭振等條上上曰甚善時起居郎趙葵亦奏四川在萬里外其取民之塗有二如激賞絹之類以民所當納者掲於通衢上下共知此眀告之而取之也激賞錢之類總領以若干數下之州縣必陽戒之曰無損嵗計無傷民力若然則須官吏備而後可官吏不能自備其勢不得不暗増有額之賦私應無名之索此隂取而不告者也是故取激賞等錢民不悟也罷激賞錢民不與也臣願詔振等凡總司錢物必分為二曰此上下通知者其不通知當根其所自出而放之然後吏不能沮而惠徧逮矣既而振等㑹議于成都奏請嵗蠲東西路對糴米十六萬石䕫路􅈭賞絹五萬匹减絹估錢二十八萬有竒是月詔侍從各薦宗室文臣京官以上材識治行者兩人特與召對二月上聞諸處將官全不舉職己亥乃詔宰執具出東南共幾員其不職者别與一般差遣却令諸將舉曾歴軍事者充此事出於朕意卿等更委曲相度湯思退曰不曉兵事者即與别差遣可任者依舊存留江東提刑徐天民劾知信州周葵不恤郡政壬寅上謂宰執曰大抵先歴知縣諳政事然後付之一郡必優為之朕頃在河朔見汪伯彦治郡全不費力以其經歴多事皆通曉向來俞俟知紹興府亦然今周葵止因昨在言路好論事遂得虚名魏良臣力薦之及治郡乃不職與宫觀宜矣沈該等曰汪伯彦河朔事至此蓋三十餘年上記人之善久而不忘如此廢江隂軍為縣浙西帥榮薿請也丁未貢院考到博學宏辭合格選人周必大詔與堂除必大榮陽人也戊午以御史中丞湯鵬舉為參知政事己未以少保信安郡王孟忠厚提舉祕書省甲子上曰蜀中舉子赴廷試不及者皆賜同出身慮其間俊秀能取髙第猥令就下列亦可惜今來者尚少展日以待之沈該等曰臣等議有赴試不及者欲試䇿一道第其優劣而髙下之今聖諭令展日則待士人禮盡矣是月太尉御前諸軍都統制楊政卒于興元府後謚曰襄毅侍御史周方崇請京局改官人並注知縣三月己巳上以問宰執該曰選人改官後須歴親民實為良法上曰徽宗嘗言仁宗朝毎除執政大臣須先問曽歴親民否蓋歴親民必能通世務置之廟廊天下利病知過半矣此朕昔年恭侍親聞玉音誠可為萬世法也沈該等曰徽宗葢以愛民為先務陛下欽佩祖宗話言罔敢失墮雖虞舜羮牆之念何以過此壬辰右僕射万俟卨卒謚曰忠靖先是刑部侍郎張杓薦主官告院朐山鮑黌有㫖賜對既而黌對不稱㫖杓為言者所論降一官罷夏四月甲寅知樞宻院湯思退等言杓薦人不當失陞下信任之意昨已罷之甚合公論上曰朕居深宫中何由盡識天下人材侍從既不足信朕何所取信初見黌上殿已覺不如所舉况又臺諌論列較其罪自合逺竄只降一官罷已是寛典思退曰誠如聖訓時武舉第一人趙應熊已與閤門祗候壬戌擬授江東安撫司屬官上曰應熊有用之才朕親觀其所試皆可採徽宗時如馬擴馬識逺並以武舉擢用不可謂今無人知樞密院事湯思退曰應熊初入仕且如此處之以養其資望上曰善是月少師信安郡王孟忠厚卒户部侍郎王俁除工部尚書尋為言者所論以奉祠去吏部侍郎陳康伯遷尚書時四川制置使蕭振在蜀已一年而職事舉五月丙寅宰執欲與進職名上曰四川善政前有胡世將今有蕭振振蠲科敷蜀人安之近薦帥臣又皆得人與之不為過遂進秩四品自待制除敷文閣學士未幾振卒六月初秦檜當國雖未廢轉對而所論者第應故事至是著作佐郎黄中言頃者大臣好佞惡直一時往往以言為諱不過塞責而已望勑在位自今轉對要切於治道庶補萬一甲辰上曰中所言頗合朕意詔從之戊申以知樞宻院事湯思退為右僕射同平章事初荆南府為上流重地而兵力寡弱户部侍郎王師心時為帥嘗奏乞分鄂渚重兵留屯以示形勢從之至是師心又言鄂渚戍兵市馬北境宜禁止以窒邊釁又鼎澧歸峽産茶民私販入北境利數倍自知盭法不赦因去為盜由引錢太重貧不能輸故抵此望别創憑由輕立引價既開其衣食之門民必悔過改業而盜可消矣上然之秋七月庚午上曰茶鹽禁𣙜本為國用所需若財賦有餘則摘山煮海之利朕當與民共之時坑冶鑄錢事已付之諸路漕臣於是户部侍郎林覺言國朝慶厯以來嵗鑄一百八十餘萬緡其後亦不下百萬如前年猶得一十四萬緡去年猶得二十二萬緡而提㸃司官吏徒縻祿廪朝廷罷之殊快人意但付之漕司日久亦未有效望復饒贛及韶三監各令通判主之漕臣往來措置三監所鑄權以十五萬為約仍不得以舊錢代發庚午詔從之是月資政殿學士提舉洞霄宫程克俊卒後謚曰章靖八月己未知樞密院湯鵬舉言近罷坑冶鑄錢事歸諸路轉運司甚善但户部近日欲撥本錢差别差官所以臺章論列又恐坑冶司省罷官在此唱為異議願陛下専委之轉運司必能就緒上曰此一事朕諭之士大夫亦無他説獨王珪再有章朕謂凡有建立人各以所見相可否歸之至當而後已若一人唱之百人和之事或未當朕則何取九月參知政事張綱求去位癸酉除資政殿學士知婺州辛巳以給事中王師心為吏部尚書冬十月戊申經筵進讀三朝寳訓終篇侍讀王師心奏曰祖宗創業垂統所以長慮却顧為子孫萬世之計甚備熙寧大臣私意改作流毒至今不可不監又言帝王之於史其要在於觀得失究治亂今進讀漢書願摘切於治體者讀之詔可户部言義倉米嵗在苗輸而州縣吏不據數令摏故令臨時有誤賑給欲下逐路常平司劾其違戾者癸丑詔從之初福建鹽自提刑吳逵奏定綱額及减價三分轉運司鹽本錢亦减只收一十九文且不許科賣雖民力稍寛而州縣無以供百費且尤非轉運所利故衆論揺之朝廷加逵直祕閣移守鼎州逵憤而死有㫖下本路諸司以逵所奏相度更定至是諸司條上嵗船一千六百萬斤如逵數而鹽價惟减一分鹽本錢收二十五文上方與宰執共議提舉常平官張汝楫别奏請行鈔法庚申上以問宰執陳誠之曰福建山溪之險細民冒法私販雖官賣鹽猶不能絶若百姓賣鹽豈免私販之弊第恐不盡請鈔有虧課額上曰大中間福建曽用鈔法未幾復罷若可行祖宗已行之不待今日正如萬户酒前後有𣙜者甚多然終不可行大抵法貴從俗不然不可經久先是福建嵗認鹽鈔錢三十萬緡至是與减八萬减鈔鹽錢在十一月一日今聨書之自此轉運司及州縣少舒而復科賣于民矣時詔直祕閣曽幾入對幾言士氣久不振陛下欲起之於一朝矯枉者必過直雖有折檻斷鞅牽裾還笏若賣直沽名者宜皆優容奬激之上大悦以為祕書少監幾承平時已為是職至是三十八年以老臣自外超用鬚鬢皓然衣冠甚偉人皆感歎以為太平之象幾舉故事每與同舍㑹説前輩言行臺閣典章從容竟日於是右僕射湯思退語客曰惜思退用偶在前不得當斯時從曽君游也左正言何溥請久任郡守母庸數易十一月辛巳殿中侍御史葉義問言知樞宻院事湯鵬舉乃秦檜黨中之姦在言路時率多賣直癸未罷為資政殿學士提舉在外宫觀義問再論遂落職義問壽昌人也甲申宰執奏接伴使副徐林張倫乞將人使往回宿食頓具有不擾而辦或過為擾民皆許具奏以行賞罰上曰朕再三思之此止是増重接伴事權恐州縣觀望却成騷擾接伴迓客爾何用如此前後指揮已備只令兩路漕臣檢察足矣沈該退而仰歎上英明洞見物情出人意表無不心服林建安人也先是吳國長公主請女夫直秘閣鄭珙轉兩官仍添差浙東參議官珙建安人㲄子也給事中賀允中封駮詞頭丙戍上曰命下逾兩旬珙已被受乃始封駮恐非故事可諭令讀書於是宰執召允中至堂面諭聖㫖允中執所見不易丁亥上曰雖稍後時所論極有理當曲從之沈該等曰諫行言聽使言者得以自安此盛徳事也時故太師張俊三子授待制集英殿修撰允中亦封駁又沈該乞其子便私差遣有㫖改合入官者二人仍與内外窠闕允中言寒士改官視為再第内則筦庫外則屬官俾宰相子任之則主司孰敢號令昔司馬康以光之子扶持改服色光猶力辭今陛下既新萬務宰相正當忘其私臣甚為該惜也不然檜熺覆轍可不杜其漸哉上覧而稱歎初諸路漕憲及常平司皆得互舉所部選人改官舉員及格吏部引驗放散自置總領所而總領所舉及本所屬官或用他薦者引驗訖仍須取㫖寒士病之至是吏部侍郎陸哲始為啟請遂依例皆得放散十二月殿中侍御史葉義問論禮部侍郎周方崇兵部郎官李庚工部郎官禇籍等與湯鵬舉交結上曰朕深不欲朝廷分朋植黨今方崇等交結所幸覺之於早當戒其漸姑從輕典可也庚臨海人籍丹陽人也甲午方崇等罷戊戌吏部侍郎陸哲乞小郡上曰哲縁鵬舉所薦不自安故求外此亦善人非方崇比朕嘗與臺諫論大臣出處或以罪去但及其身足矣至所薦引當觀其人若不問賢否一切斥逐是使之為朋黨非公正之道也時已蠲蜀賦以寛民力而嘉州賦外之斂方急四川制置使李文㑹曰違法科斂與違制罪均况蜀去朝廷逺詔令裕民吏猶不承悖孰甚焉乃劾官吏之罪悉罷逐之
