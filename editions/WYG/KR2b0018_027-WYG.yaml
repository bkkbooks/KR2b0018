body:
  text: 中興小紀二十七宋熊克撰紹興九年秋七月己夘朔金國有郎君烏克紳原名呉矢今改正者反擒獲之下大理獄事連宋國王宗盤兖國王宗雋虞國王宗英滕國王宗偉殿前左副㸃檢罕都原名渾覩今改正時金主亶與右丞相陳王烏克紳謀誅諸父因朔旦伏兵於内宗盤等入見擒送大理獄辛巳悉夷其族詔略曰周行管叔之誅漢致燕王之辟惟兹無赦古不為非翰林韓昉作也時左副元帥魯國王達蘭方握兵在外難遽誅之乃除達蘭為燕京行臺左丞相又以僉書杜充為右丞相仍擢右副元帥烏珠為都元帥命下達蘭語使者我開國功臣何罪而與降奴杜充為伍耶不受命而叛初欲歸本朝不克既而北走沙漠烏誅遣右都監托卜嘉追獲之下祁州元帥府獄具殺之達蘭臨刑謂烏珠曰我死之後禍必及爾宜速圖之烏珠俛首無言遂囚達蘭子泰伊原名太拽今改正乆之因赦得出東京父老百餘人詣闕稱賀乙酉上臨軒以見皆補官遣之甲午上謂宰執曰朝廷惟要辨君子小人君子小人既辨則治道無不成秦檜等退而竊歎聖謨切見立政用人為帝王之先務葢堯舜禹湯文武之治何以出此吏部侍郎張燾遷尚書時久旱上齋居蔬食以祈雨澤己未秦檜奏曰考之典禮陛下惟當損太官常膳上曰雖損膳豈免曰殺一羊檜曰陛下推不忍之心如此何患天意不格既而甘雨應禱霑足先是奉使王倫至中山府留十四日倫以九日丁亥至中山傳云魯王逹蘭見在草地後月半方來庚子始聞其國内變倫以下皆憂俄傳四太子烏珠作都元帥昨夜抵城外已回祁州矣少頃引接者至令倫等悉赴元帥府即趣之行是晚達祁州初右䕶軍凡七萬三千人馬九千匹時宣撫副使胡世將置司於鳯州之河池縣熙河帥呉璘總二萬人秦鳯帥楊政總三萬人戊申世將秦二人皆故呉玠大將威名素著乞命璘於鳯翔及寳雞以來命政於鞏州及白石以來駐軍則應接川陜其勢兩便仍乞璘充右䕶軍都統制政充宣撫司都統制既又請命永興帥郭浩以所統九千人於邠耀二州捍禦皆奏以俟朝命僉書樞密院事樓炤㑹諸帥議移軍事秦鳯經略使呉璘言移軍陜右則蜀口空虗金或逾盟自南山擣蜀邀我陜右則我不戰自屈矣當且依山為屯以控要害俟敵情見力疲則漸可進璘遂止以牙校三隊赴秦州且飭階文等寨以備之至是世將使事畢己酉離秦鳯翔府以歸陜西雖號新復然自金偽變易之後軍民尚懷本朝時諸路禁軍得三萬四千有竒而涇原八千人尤勁雖分𨽻諸帥然各有將分仍存正副葢祖宗之軍政猶在又弓箭手亦得七萬時御營右䕶軍自蜀出者皆駐熙秦兩路而諸郡見管之粟與和糴相當足以支一嵗之食先是轉運使張深上言乞裁减軍士廪賜於是諸軍出闗歸怨於建議者洶洶㡬變而閬州戍卒欲殺其守臣孫渥㑹謀泄不果宣撫副使胡世將亟下令悉如舊數不减即條利害上之議者謂當待報世將曰朝廷置大將事有待報不及者固許之不然某上章乞罪以罪去無憾也先是樓炤奏差環州保安將軍守臣乙卯上諭宰執曰陜西㳂邊控制夏國最為要害當擇久在軍中諳練邊事或本土武人方能保固障寨民得安業可劄付炤令諭諸帥秦檜等退而竊歎上留意疆場愛惜生靈可謂明見萬里之外矣先是夏國將李世輔與偽招撫使王樞同至長安時環慶路又獲夏國一百九十餘人於是僉書樞密院樓炤奏陜西新復正與夏國為鄰此等留之無益還之可使知恩遂遣樞等歸夏國既而世輔至闕上奬其忠義授䕶國軍承宣使龍神衛四廂都指揮使兼樞密院都統制賜名顯忠言者謂宣撫司便宜補官嵗約一千員乃倍於三嵗科舉補䕃之數今既罷便宜而又陳換給其來不已乞限以年庻息姦弊詔限一年言者謂蜀宿重兵一嵗供億無慮四千萬緡民力殫矣賴陛下念之徙兵隴右謂此可以寛民力而官吏多擇善地至新疆則固辭今後避事之人當重黜之淮東宣撫使韓世忠奏金人近誅宗族大臣國内紛擾淮陽所屯兵皆抽回世忠意欲乗虛襲之丙寅上謂宰執曰世忠武人不識大體金人方通好若因其無備襲之是乘亂而幸災也異時何以使鄰國守信義乎户部郎官孫邦奏私酤條已免折屋茶鹽尚有没法亦乞除之癸酉上謂宰執曰法果弊宜亟改若行已久而無甚害且循祖宗之舊也先是金國欲得趙榮王威二人已詔遣還之於是韓世忠以書與秦檜曰榮威不忘本朝以身歸順父母妻子悉遭屠滅相公尚忍遣之無復中原望耶乙亥檜奏外間頗有異論上曰榮威在偽朝力捍官軍金人已割還舊疆宿夀乃腹心之地榮威輩避罪奔逃貪功生事無故驅掠兩州之民罪不容誅宜牓諭此意初提舉明道宫鄭億年為敵執北去遂臣劉豫為吏部侍郎户部尚書遷右丞除資政殿學士河南初復右僕射秦檜與億年為親乃召之還除直學士提舉醴泉觀奉朝請至是檜又欲復其偽授職名參知政事李光以為不可乃已朱勝非閒居録曰時宰臣秦檜王仲山之婿也鄭億年母仲山親姊檜子熺復娶億年之女至是頗佑之億年始至除雜學士繼欲復偽齊所授職名參政李光榻前靣折之乃止後數月光罷億年竟復資政殿學士仍奉朝請雖士論洶洶而一時給舍臺諫皆檜私黨不復顧逆順之節矣鳴呼億年事逆豫為執政掌其機事與謀者欲滅吾宋也欲危吾君也欲傾覆趙氏而為劉氏也欲呑東南而臣屬之也在律叛逆不原赦不分首從則億年與豫其罪等舊官其可復乎唐禄山之亂既復兩京陷偽之官以六等定罪最重棄市次自盡餘流竄故相張說二子均垍皆當死肅宗以在東宫時說有保祐之功欲貸之明皇曰均垍事賊皆任權要均仍為賊毁吾家事不可赦肅宗復請於是流垍嶺表而均被極刑徽宗之待居中厚於明皇之遇張説億年之事劉豫親於張均之從禄山而况居中素無援助之力今失刑如此何以慰徽宗在天之靈乎初右諫議大夫曾統言經制本户部之職更置一司無益乞罷之上曰經制一司須久方見利害今纔半嵗難遽責以近效若實無益雖亟罷可也至是言者又以經制司所創官吏種種横費較其所入未必能補如創酒庫亦是隂奪省司之利况所總之事皆户部本職有經制則户部亦可廢矣詔付户部具經制司察州縣所陷錢物并催未到綱運縁路分闊逺未見速效今若依舊分𨽻諸司則經制可罷其庫欲歸併贍軍庫丙子乃罷經制司其諸路幹辦官依舊為主管常平官徽猷閣待制提舉萬夀觀兼侍講尹焞前為禮部侍郎已病至是疾甚不能朝遂奉祠而去後四年卒於㑹稽時金人法苛賦暴加之饑饉民不聊又下令欠債者以人口折還及藏逃亡而被告者皆死至是將相大臣如宗盤逹蘭之徒皆誅死二帥久握重兵嚮者植黨滋衆今則悉為亡命故所在蜂起平定威勝遼州道不通行一旦太行山義士入懷州萬善鎮州人大恐中原盛傳大駕親征民皆隂備軍器晝而罷市晚視霞起則曰御營烈火光矣初龍神衛四廂都指揮使李顯忠歸朝日常復其父母之讎至是待罪九月戊寅朔詔顯忠有功鄜延特與放罪初召太尉東京副留守郭仲荀赴行在仲荀因領劉豫下兵八千以還至是駐於鎮江己亥上謂宰執曰仲荀善人但馭衆非所長姑令駐彼别選人代之秦檜曰孰可當者上曰極難其人當於統制官中選之檜等言董先牛臯輩才具上曰此皆可用上又曰辛永宗與仲荀同來且令歸前任葢所為誕謾向在軍中毎遇大閲則借人馬器械以充數檜曰外人不知陛下察其姦狀乃謂眷之葢小人在外託聲以惑衆爾上曰如辛道宗不循理亦不可用也丁未起居郎周葵請今後犯茶鹽人免根問來歴上曰犯𣙜貨者不根問經由此嘉祐著令仁祖盛徳也舉而行之則吏不至夤縁獄不至滋蔓可速付之省部先是雷州有海商為賊所刼本州西獄禁勘皆平民所死於獄者五人大理寺丞朱斐奏之上惻然謂宰執曰二廣地逺有司如此寃何所伸令斐再具奏其提㸃刑獄以下官皆重黜責上曰古者刑人則君為之徹樂減膳唐太宗三覆之刑誠以死者不可復生今後逺地監司須為朕遴選秦檜等仰承欽恤之意至是上又詢雷州獄事檜曰已到乃令刑部詳之葢上哀矜庻獄常記淵衷如此金國主亶既誅達蘭遂以右丞相王烏克紳為左丞相右丞蕭慶為左丞烏克紳嘗副尼瑪哈行事雖為羣臣所忌而常以智得免故尼瑪哈以下皆不能及國人號曰薩滿薩滿者女真語巫嫗也以其通變如神也是豈亶之所能馭故深忌之初時客星守魯事在五月烏克紳占之太史曰不在我分野無傷未㡬宋兖虞滕諸王同曰誅死既又守陳事在七月太史以告奉使宇文虛中虚中語之烏克紳不以為怪是月果同蕭慶被誅金應天道如此其詔略曰希尹心在無君言宜不道逮燕居而竊議謂神器以何歸希尹即烏克紳也又曰慶迷國罔悛欺天相濟既致於理咸伏厥辜賴天之靈誅於兩觀時烏克紳之黨皆為都元帥烏珠所誅奉使洪皓嘗與烏克紳持論㡬死烏珠知之故得免時烏珠謀舉兵以復河南已决意入侵葢金法罷兵則權在國主用兵則權在元帥自割地講和之後不半載間元臣宿將誅夷殆盡烏珠所以力沮和議者亦逹蘭臨死之言有以動其心也僉書樞密院事奉使王倫至金國御子林留館五日辛亥見國主亶致命亶悉無所答令其臣翰林待制耶律紹文為宣勘官問倫還知元帥達蘭等罪否倫對不知又問無一言及嵗幣却要割地但知有元帥豈知有上國耶倫曰日者僉宣蕭哲以國書來許割河南歸梓宫太母天下皆知上國尋海上舊盟與民休息使奉命通知兩國爾冬十月辛亥詔侍從官各薦二人上曰朕久在東南中原隔絶遺才必多可令訪求推薦以見朕兼收並用求賢無方之意成都闕帥癸丑以吏部尚書張燾為之仍除寶文閣學士時罷四川制置使上謂宰執曰燾雖安撫成都一路如四川前日無名横斂不急冗費可令蠲省以寛民力上語在己酉今聯書之及燾陛辭言蜀自軍興民力久弊官吏不恤臣願宣陛下徳意俾一路被澤上曰豈惟一路應四川事悉以委卿以成都帥而得行四川民事自燾始也戊午宰執奏統制官雷仲管鎮江府軍馬上曰岳飛軍中偏禆如董先牛皋頗驍勇可用但先好貨皋嗜酒皆有所短未可統衆秦檜等退而竊歎上知人善任使雖軍中偏禆性行才否無不洞察丁卯宰執表上皇太后宫殿名上曰行宫地隘只依山修築至於器用供帳衣衾之類朕皆親臨視仍許宰執入觀秦檜曰陛下純孝篤於奉親之禮無不周也壬申上諭宰執曰呉玠久在蜀備著勞績巳優加恤典然聞其家頗貧可賜錢三萬緡仍進其弟軍職令撫玠家屬秦檜曰陛下追念將帥不忘其勞凡被堅執銳者孰不感而自效也金人近嵗用兵多不利始知憚中國時有遼軍萬户韓常為濬州守一日與其判官宫茵論南北兵戰之事茵曰北非南之所能敵茵益都人葢䛕之也常曰不然今昔事異昔我强彼弱今我怯彼勇所幸者南人未知北間事爾十一月己卯奉使藍公佐回程庚辰纔至燕京而彼國元帥烏珠亦至公佐深懼不免留四日始聽行殿中侍御史何鑄言初改官及初補官人並合赴部注授乙酉秦檜奏舊法初改官歴親民一任上曰有祖宗成法自當遵守嗣濮王仲儡卒戊子司農卿莫將除徽猷閣待制京畿都轉運兼主管奉迎梓宫一行事務上曰迨及朕舊寮亦見朕於臣下無所偏也秦檜曰唐龎夀相任濮守以汚敗自陳嘗在秦王府太宗謂曰我昔為秦王乃一府之主今居大位乃四海之主焉得獨私故人夀相流涕而去陛下英果過太宗逺矣右正言陳淵乞凡賜賚而於例有疑者三省共議又言莫將未應遽除次對須其績著然後命之雖往者尹焞亦自卿聨命以此職由焞先除從班以疾力辭老不可留故以寵之今將宜除近下職名庻合公論淵沙縣人也壬申秦檜奏神宗哲宗實録已進今乞專修徽宗實録按此處疑有脫文實録當實其事以信後世豈容置私意於其間耶開封少尹李景謨奏陽武河埽事癸酉上曰河事利害非輕可速擇都水官朕頃兩至河上毎見一埽所費不貲如十八盤各有斗門以殺水勢一失枝梧民被其害矣金部郎官游損奏州縣贜吏監司郡守不即按治者許民越訴詔申嚴舊法損建陽人酢子也辛酉詔樞機之地安可曠官僉書院事樓炤趣令還任供職時侍從官論薦左朝奉大夫張甸等皆令除郡壬戌上曰士大夫固以任中都官為榮朕謂百姓國家根本當以親民官為重無内外之限甸嘉興人也先是少保開府儀同三司孟忠厚乞河南一郡給事中劉一止言后族業文如忠厚不可多得但此例一開有出忠厚下者何以御之又有嘗事偽楚人徐偉逹者差知池州一止言邦昌僭位凡仕偽之人皆諱其官稱惟偉逹至今自謂郎中豈稍有廉耻者一郡既可惜且無以示好惡於天下上皆為罷之中丞廖剛曰是臺臣所當言者皆為劉君先矣金主亶諭其政省今後四時㳺獵春水秋山冬夏拉必原作刺鋳今改正下同皆循契丹故事拉必者契丹語所在之意然契丹先世雖或㳺獵未常立四時定制自中興講好之後復併諸番境内無事始於毎嵗春水獵鵞秋山射鹿夏則避暑於長嶺冬則就暖於陽城既畢然後歸廣平靴甸受禮卒至亡其國亦縁四時無定逺近騷動時亶方親戚内叛㓂盗外擾不知自警乃循契丹覆敗之轍其後果不令終葢己基於此矣十二月甲辰言者謂翼祖積累深厚興我宋萬世之基而保州睦宗院既陷於敵其南奔者十數人而有官者僅四人望權依西京宗室例先次注官丁巳詔從之宗正丞鄭鬲奏乞以常平錢於民輸賦未畢之時悉數和糴壬子詔從之上謂宰執曰常平法不許他用惟待賑荒恤饑取於民者還以與民也秦檜曰陛下語簡而理盡無不本於愛民鬲侯官人也初詔侍從各舉所知而給事中劉一止起居郎周葵皆以宣教郎吕廣問應詔廣問夷簡孫也李光欲除廣問館職至是殿中侍御史餘杭何鑄言二人非知廣問者因光之囑迫於勢而舉之相與以欺陛下也今光已出二人之罪豈容不正己巳詔一止葵並以奉祠而去金僉軍之法自元帥府下諸路帥帥下節鎮鎮下支郡郡下諸縣縣籍民户丁多寡之數令備軍械軍裝以聽㸃集用兵以來皆尼雅滿之徒專之至是國主亶始令諸路不得從元帥府須見裏面使臣所持御畫牌劄方許僉發葢疑其下也然元帥府距其國都甚逺茍有緩急豈能應機而用哉
