body:
  text: 中興小紀卷九宋熊克撰建炎四年秋七月時已除開府儀同三司吕頤浩建康府路大帥甲辰宰執擬提舉太平觀劉洪道為參議官上曰不可是又欲與頤浩同官趙鼎曰頤浩之來尚遲今先令洪道往池陽措置防江上乃許之因曰議者謂頤浩多引用山東人且頤浩為相當收天下人材而獨私鄉曲非公道也張守曰立賢無方正為此耳既而頤浩遇闕見上言臣自去國不知金人之實似聞已渡淮北去然敵情多詐而難測臣比經四明見朝廷集海舟於岸下是必為避敵之備夫避敵固當預辦然禦敵之計尤不可緩臣仰料聖駕萬一避敵不過如永嘉及閩中爾望鑑去嵗敵騎追襲之事選兵二萬分為二項以頓江東或據水鄉或扼山險邀而擊之使將士戮力如四明城下之戰則無不勝矣萬一今冬敵不渡江則願宰執預為之計俟來夏則遣兵北向分二萬由海道趣文登以揺青齊分二萬由淮陽趣彭城以撼鄆濮葢金人用兵深忌夏月我必乗其忌而攻之故大暑用兵臣前後屢陳此計然安危治亂之要尤在人主能察方去冬金人分三路追襲廷臣皆以航海為非惟陛下㫁而必行故至今帖然無虞夫難得易失者天之時難成易敗者人之功臣願陛下愛惜分隂汲汲圖之近臣有獻計者必參以行事而驗其是非則人不難知矣此陳蕃所謂成敗之機在察言也願留聖意丙午右諫議大夫黎確言陛下念劉光世之功穹資峻秩舉無所吝今又與舊相並命為大帥處以鎮江光世乃預擇便地自安而委郡政於添倅陛下聖㫁不從尚遷延未行公議憤之詔以章示光世確邵武人也辛亥右僕射范宗尹言張俊自浙西東稱岳飛可用上曰飛杜充愛將充於事君失節而能用飛亦有知人之明也新肇慶府鈴轄曾訥者初以貢獻得官後因忤梁師成以至編置籍没上憐其無辜令宰執與一差遣而言者乃謂訥因請託得之戊午上曰朕可嘗有此可亟罷前命使中外曉然趙鼎曰訥已除鈴轄猶上言乞郡不已乃詔并鈐轄罷之知平江府湯東野乞祠乙丑上謂宰執曰向聞趙鼎言東野與康允之皆有才但當外任繁劇不可處獻納之地范宗尹曰議者謂允之優於東野張守曰二人皆能辦事而允之不擾上曰既能辦事無不擾之理己巳禮部尚書謝克家奏故翰林學士范祖禹當元祐中終始實在經筵所著唐鑑已進御又有仁宗訓典及帝學二書深禆治道今其子前宗正少卿冲見寓衢州乞給札令冲投進許之初河北賊酈瓊等五萬人來降浙西大帥劉光世遣統制官靳賽往招納之又饒信間有妖冦王念經等聚衆數萬光世亦命統制官王徳同賽總兵致討徳涉彭蠡道出饒州羣盜劉文舜攻城甚急守臣連南夫馳書求救徳引兵壓壘而陣賊舍兵請降時權知三省樞宻院盧益䕶迎隆祐太后過撫州勸徳進兵徳遂抵貴溪一皷而擒念經是月獻俘行在道君自韓州徙居五國城金人請道君減去隨行官吏道君力懇之不從乃召諭之曰卿等相隨而來憂樂固當同之但事屬他人無如之何言訖泣下官吏皆呼號而出宗室亦不許隨行惟孝騫嫡孫有奕等六人從焉五國貝勒巴克㙮原作孛堇八曷打今改正下同下通事慶格詐傳巴克塔之言求北珠道君與之他日事發巴克㙮欲殺慶格遣人審覆道君曰初無此事恐復誤傳北人聞之皆手加於額太子烏拉罕原名斡离歡今改正下同遣人奉書求内侍兩輩道君不悦曰誰肯往者然五太子不可不遣乃遣王佃陳思正且復書曰二人自汴京隨至此難苦萬狀望優容之時開府劉光世以公事移牒六曹八月甲戍詔新江州鈐轄張忠彦聴朱勝非節制上謂宰執曰勝非當苗劉之變不為無功范宗尹曰勝非能使二兇不疑以待勤王之師議者咸稱其有謀上曰是時惟勝非鄭㲄與之抗若顔歧雖好士人亦懦怯不能有為故人以威武不能屈為大丈夫也先是江西湖南北路正賦外多别科來米則有正耗補欠和糴斛面等自一石輸及五六石錢則有大禮免夫綱夫瞻軍等自一緡輸及七八緡吏縁為姦其名日新復調丁壯把隘修寨富者出財貧者出力民不堪命則據險結黨抗拒縣官既免征徭之苦且獲攘掠之利故多去為盜至是勝非上疏極論而宗尹未嘗厯州縣不甚知民疾痛但降㫖依累降赦令而已叅知政事謝克家請日輪從官一員以前代及本朝之關治體者具兩事進入庶禆聖學從之命侍臣進故事自此始既而吏部侍郎直學士院綦崇禮乞止令講讀官三五日一進乃詔翰林學士兩員如前詔丁丑詔故言官常安民江公望皆抗節直詞觸權姦之怒擯斥至死可並贈諫議大夫仍召安民子同赴行在隆祐太后自江西回庚辰上出行宮門外迎之初侍御史沈與求言右僕射范宗尹年少驟進不更世務恐誤國事上頗難之既而户部侍郎季陵乞詔宰執於罪累中選真賢實能量付以事責功補過雖蔡京玉黼張邦昌之所主者亦不以一眚廢其終身詔臺諫勿復以言遂牓朝堂至是與求同右諫議大夫黎確右正言吳表臣論列以為自古豈有禁臺諫不得言者且不應牓表臣永嘉人也上命撤之宗尹請坐三章行出曰臣唯是之從何敢固執與求再論陵承望宰執風㫖有變朱成黒指鹿為馬之語宗尹請去上令張守諭㫖留之辛巳上批略曰陵為侍從乃乞用一時罪戾之人使箝臺諫不得言可罷與外祠與求乞顯黜獻言者其論為當至云變朱成黒指鹿為馬使大臣不敢安位可除職與郡遂以與求為直龍圖閣知台州初宣撫制置使張浚復歸秦州至是以敵衆猶在淮甸恐復擾東南欲分撓其兵勢故陜西獻計者多以擊敵為便浚召都統制曲端等問之端曰平原曠野敵便於衝突而我師未皆習戰須教士數年然後可以大舉統制官吳玠曰髙山峻谷我師便為駐隊敵雖驍果甲馬厚重終不能馳突我據關輔之勢可以徐圖諸將恥於不武莫肯出言參議官劉子羽爭之以為未可浚曰吾寧不知此顧今東南之事方急不得不為是爾張浚丁巳瀟湘録曰浚奉使川陜日上謂曰陜西士馬彫弊勢非五年之後不可大舉既上往㑹稽敵勢乗隙侵陵海道之行危甚後雖退師金四太子者猶於淮西駐軍浚與叅議官劉子羽議曰今度敵勢必再犯江南儻事有不意為天下後世罪人矣勢當傳檄舉兵以為牽制子羽曰相公不記臨行天語乎此兵非五年訓諌不可一拘者曰事有不可一物者按上二句疑有誤字假令萬有一前日海道之行變生不測吾儕奈何雖欲復歸陜西號令諸將其可得乎子羽之議遂塞此事外人不及知誚浚輕舉且歸罪子羽為多天實鑑之也先是端驟得志而驕自白店原之敗少沮參謀官王庶乘此言於浚曰端有反心久矣盍早圖之浚乃罷端兵柄遷之恭州統制官張中孚李彦琪等諸州覊管陜西人恃端為命及為庶譛而貶軍情頗不悦王之望西事記曰張浚至陜西欲易置諸路帥臣權勢震赫是時五路未破士馬强盛加以西蜀之富而貸其賦五年金銀粮帛之運不絶於道所在山積浚之為人忠有餘而才不足雖昧於知人短於用兵而清修篤謹有志于天下古人不能過也復果㫁敢為諸將亦莫敢桀驁曲端者初為五路統制拜威武將軍屢與金人角更勝迭負西人以為能然心常少浚浚乃奪其兵廢之浚於是決䇿治兵移檄河東問罪癸未復永興軍金人大懼急調右監軍烏珠自京西令星馳至陜右與萬户羅索等㑹而浚亦劄五路合兵四十萬約日㑹於耀州以與金戰權知三省樞蜜院盧益令權綴宰執班今後奏事取㫖時同權知三省樞蜜院李回獲六宫在道尚未至而寜逺軍節度使孟忠厚扈從先還乃乞鐲太后所過秋税丙戍宰執奏夏税已放若更免秋税恐州縣經費有闕却至横斂上愀然曰常賦外横斂及贓吏害民最宜留意祖宗雖崇好生之徳而贓吏罪未嘗末減自今雖未欲誅杖脊流之不可貸也金左監軍逹蘭自維州引衆冦淮東又欲南渡議者將復為海道之行范宗尹以為危事不可再蹈頻年浮海則逺近離心大事去矣上以為然乃詔金兵見於真揚出沒恐不測南渡令浙西安撫大使劉光世往鎮江分兵以備江岸及㑹淮南諸鎮併力撃之盧益上疏言民困乞頒霈澤戍子曲赦饒信二州承州鎮撫使薛慶故為盜時嘗掠於通泰及作守則重税往來民甚怨之承楚相距有樊梁等三湖緜二百里饒魚稻菱蒲之利賊張敵萬往來其中衆至數萬旁郡被害慶與敵萬通和承州賦入城者多得逹楚州鎮撫使趙立不與敵萬通故楚獨受苦絶賦入路由是乏食夏中米價承二百楚五百以敵萬賦入路為厚薄也至是金攻揚州急鎮撫使郭仲威求援鄰鎮慶走救之戰敗而死楚勢亦危立遣人告急己丑樞宻院奏仲威兵力不加僉書院事趙鼎欲遣神武右軍都統制張俊往救之俊曰金方濟師逹蘭善兵其鋒不可當立孤壘危在旦暮若以兵委之譬徒手搏虎併亡無益鼎曰楚當敵衝所以蔽兩淮若委而不救則失諸鎮之心俊曰救之誠是但南渡以來根本未固而宿衛寡人心易揺此行失利何以善後鼎曰江東新造全藉兩淮若失楚則大事去矣是舉也不惟救垂亡之城且使諸將殫力不為養冦自豐之計若俊憚行臣願與之偕往俊復力辭乃詔通泰鎮撫使岳飛率兵腹背掩擊又令浙西大帥劉光世遣兵渡江為援趙鼎事實曰時諌官亦乞趣光世渡江解圍上顧鼎曰移文不足以盡意可作書與光世詳言之鼎曰昨聞光世亦欲渡江一屬官有異意遂己臣嘗以書扺光世曰叅謀諸君又在幕府必能禆替聰明固不可輕舉妄動貽朝廷憂亦豈可坐視不救滋長敵勢上曰諭諸將當如是鼎曰若其屬時時以言警之彼必自籌畫矣又曰臣待罪本兵不能遣一將何以勵其餘陛下有唐憲宗任使之明而臣無杜黄裳協賛之助因力求去辛夘建州民范汝為者粗知書其諸父以盜販為事而號黒龍黒虎者尤善格鬭羣不逞附焉每數百人負鹽横行州境官不能捕有選人建陽江鈿老矣郡守謂鈿有謀使攝令甌寧以圖二范未幾果擒之皆弊於獄其徒無所歸復依汝為一日因刃傷人至死遂作亂事在七月時方艱食饑民從之者甚衆州兵戰敗賊勢滋盛癸巳詔福建帥臣徽猷閣待制歙縣程邁遣兵討之言者論前權知三省樞宻院滕康及同知劉珏昨聞警報了無憂國之心使太后乗流渉險為敵騎所追望行竄遂乙未詔康永州珏衡州並居住言者又論資政學士盧益迎奉太后歸行在所至苛擾亦降兩官時右正言吳表臣復論帶御器械潘永思恃與益深交擅作威福恣行貪饕上詔罷之且曰永思無狀朕未嘗假以事權宰執請除一差遣上曰未可且罷禄以困之庶知悔過朕於戚里未嘗私以恩如邢后之父不復收召張才人兄弟皆小官卿等所知益隂結永思非端人也先是州縣繫囚多以盜販茶䀋及逋官物數雖少而連逮甚衆獄不速決致有死者實傷和氣九月壬寅乃詔諸路提刑司將實犯罪者早結絶干繫者先放上曰不惟州縣如此大理獄亦多淹然朕以一二事付寺至今未了大凡罪當笞杖徒流或至于死法有等差而久繫于獄是重其罪者也可呼獄官戒諭之甲辰皇后鄭氏崩于五國城其後太后回鑾知為此日時越州秋試官宋愈陳協所出䇿問語多尚諛愈以為宰相今得王佐恊以為雨暘今巳時若於是言者謂陛下駐蹕海隅㑹嵇實同首善之地而試官全不體國以詢良圖乃為進身計因言獻諛如此是崇觀政宣之風到今未殄為國大累乞畧賜懲之亦望陛下惡佞之意不減於責張吝時也庚戌詔愈協各罰銅十斤言者論近世銓衡之官法守不正自蔡京王黼用事有詣堂求部闕者雖已注人亦奪而與之甚者部有佳闕且宻獻之遂至堂選混淆為寒士之患朝廷今已灼見斯弊望明戒吏部長貳如堂中取闕並不得報庶幾綱紀復振癸丑詔吏部遵守乙夘罷中書門下撿正官丙辰詔左右司郎官依舊復置四員有王師昊者岢嵐軍人上書誑誕惑衆戊午詔送鄰州編管上曰朕大開言路檢鼓進狀日關聴覽言有可採至命以官其或不當雖斥朕躬亦置不問至於惑衆不免禁止宜以此意曉諭士民己未内降御厨官潘績特令再任庚申宰執奏績乃添差不應再任須特㫖再添差一㳄上恐人得以援例遂請前命宣撫制置使張浚以熙河經畧使劉錫為都統制與涇原經畧使劉錡秦鳳經畧使孫渥環慶經畧使趙哲及諸將各率所部兵㑹于耀州錫錡仲武子也浚進駐邠州於是知鳳翔府兼權永興路總管吳玠與秦鳳提刑郭浩皆言敵鋒方鋭當且分守其地掎角相援待其弊乃可乗浚不從諸軍行至富平縣錫㑹諸將議玠曰兵以利動今地勢不利未見其可宜擇髙阜據之使不可勝諸將皆曰我衆彼寡又前阻葦澤敵有騎不得施何用他徙將戰乃詐立前都統制曲端旗以懼金金將羅索曰彼終紿我也癸亥羅索擁兵驟至輿柴囊土藉淖平行進薄吾營錫等與之戰錡身率將士殺敵頗衆勝負未分而敵鐵騎出不意直擊環慶軍他路無援者㑹趙哲離所部哲軍見塵起驚遁諸軍亦退敵乗勝而前於是陜西人情大震浙西大帥劉光世解到降羌詔分𨽻五軍乙丑三省言陛下推赤心置其腹中固盛徳事然非我族類其心必異國家前日招納己蹈郭欽江統所論之失今日不可不思魏證所爭議者以為戒也乃令諸軍常察之先是光世畏敵騎之衆不能援揚楚止遣統制官王徳酈瓊將輕兵趣承州時淮西乏食諸將多猶豫不進獨海州鎮撫使李彦先以兵至淮岸金人攻其衆殱焉真揚鎮撫使郭仲威兵屯天長掠往來天人以自給徳等至承州有兩校不應命斬之通泰鎮撫使岳飛亦屯三墪為援至是金攻急楚州鎮撫使趙立中砲死城遂䧟而朝廷尚未知也時金留淮上未退一日宰執奏邉事范宗伊曰敵未必能再渡趙鼎曰勿特其不來恃吾有以待之可也乃乞詔州縣各為移治自保之計毋得拘留百姓及敵至即脱身而遁使民肝腦塗地又曰三省常為敵不來而為陛下㧞人材修政事宻院常為敵見侵而為陛下申軍律治兵甲即兩得之上曰卿等能如此朕復何憂忽有諜報謂敵衆引舟自漕渠而南行在震擾鼎謂宗尹曰不速動恐復有維揚之變宗尹曰今日之事在維揚則不可在㑹嵇則可鼎曰相公定道著李回曰丞相之言差强人意此據范宗尹趙鼎事實叅纂被召人朝散大夫毛隨言按漢志嵗星所在國不可伐昔湯之元祀嵗星順行與日合于房心宋亳分也周武王至豐之明年嵗星順行與日合于栁建留于張其分實河洛之墟故武王定鼎而周公迄營成周今年冬嵗星當躔於斗斗吳越之㑹葢與啇州之事畧同天其或者將厭亂而與宋乎金不南渡矣然禦戎上䇿莫先自治今宜保天險修戰備權宜定都不為輕動以係四方之觀聽則士氣日壯隨江山人也冬十月初建州軍賊作過時將官曹維纔到任而浙西提刑趙哲招撫賊衆劾維之罪又衢之開化縣最僻叛將苗劉所不到縣令范瑱乃結守臣胡唐老作守禦有勞改京秩至是言者論之庚午朔並究實改正先是兩浙漕臣李承造言嚴秀二州守倅及漕司官吏催科預辦乞行推賞詔二州守倅各轉一官癸酉言者謂恐此例一開則州縣之吏以亟辦相勉若嚴秀成命既行不欲追寢即漕司官吏更不推賞詔從之是日諌官論監司體量滅裂等事上喜謂宰執曰近來臺諌官日有章疏未嘗放過一事范宗尹曰陛下開廣言路是以人得盡言無隠此朝廷美事也責授中奉大夫余深昨因渡江赦復還鄉里至是遇郊禮乞奏薦在法應責降而官品髙者取裁丙子宰執奏深乃蔡京死黨乞勿令奏薦詔從之上因曰如蔡卞真所謂姦邪比閲王球家所收御製鶺鴒賦京卞皆賦於其後卞賦盛言繼述哲宗之志屏斥元祐黨人因致斯瑞且後苑叢茂珍禽翔集乃其常事太平時不無縁餙而其言若此豈非姦邪也耶范宗尹曰紹聖以來賊害忠良皆卞之力謝克家曰卞之隂險過於京也言者論防海利害有可慮者三不足畏者三大畧謂海道風帆瞬息千里舟師徑至勢難枝梧又出沒示疑牽制王師揚旗伐鼓中夜而至我若驚潰彼計得行所可慮者此也冐涉洪濤敵衆方病乗其未定易以進擊又或為風阻咫尺不前港道回曲加以泥濘其隙易乗不足畏者此也由是言之無備則可慮有備則弗畏今莫若委之沿海巡尉及民社兵大抵海舟不能齊一未集而擊之必可成功甲申詔從之是日宰執奏諌官有疏乞詔劉光世渡江解楚州之圍上曰趙立堅守孤城雖古名將無以過之遂以手札賜光世趣令渡江辛夘詔故中書侍郎張慤忠實剛毅乃心王室其子瑜久已服除宜與差遣是月贈故執政耿南仲為觀文殿學士先是宣撫處置使張浚聞軍潰自邠州退保秦州而金侵軼未已浚復退保興州斬敗將趙哲以徇陜右兵各散歸本路諸帥皆寓治它所知鳳翔府吳玠收秦鳳餘兵閉大散關以㫁敵騎來路統制官關師古收熙河餘兵以保岷鞏知秦州孫渥收涇原餘兵於階成鳳三州以捍蜀口既而大散關又不守浚惟有親兵千餘人實從或建䇿徙治䕫州叅議官劉子羽曰若東走䕫則與關中血脉不相通矣今當且留興州外繫關中之望内安全蜀之心浚乃止遂令子羽以單騎至秦亭分遣腹心召諸亡將時敵騎四出道阻不通忽聞子羽至諸將悉來浚檄玠與提刑郭浩收拾散卒視大散關之東有險曰和尚原方據險列柵守之而賊已抵原下矣浚於是又退保利州或謂吳玠漢中扼蜀口宜屯以安蜀玠曰我保此敵決不敢越我而進堅壁臨之彼懼吾之躡其後是所以保蜀也敵知我有備乃引去王之望西事記曰張浚之戰於富平也金人亦畏之然後喜功名鋭於進取而幕下多川南官不練兵事欲決勝負於一舉以至於是遂走興又有走關中陜西諸郡不殘於金人者皆為潰兵所破矣前宰臣杜充降金至雲中見左副元帥尼瑪哈不知禮久乃令知相州時巨冦李成據江湖十餘州衆號百萬與羣盜合謀造文書符檄以動州縣江東大帥吕頤浩欲之池州治所而成遣其黨馬進圍江州於是頤浩駐兵饒州㑹建武軍節度使楊惟忠有兵七千屯州境頤浩乃請帷忠同解江州之圍合一萬五千人自饒乗舟趣南康軍十一月庚子朔遂復南康頤遣統制官巨師古引兵往江州幾至城下遇伏為賊所敗賊衆三萬乗勝至南康與官軍鏖戰頤浩惟忠以衆渡江避之陣於北溪州癸夘詔元祐故臣吕公著吕大防范純仁皆盛徳元老而遭罹貶斥未獲昭雪可各贈太師追封魯宣許三國公其餘黨籍令有司具名取㫖褒贈上欲除神武副軍都統制辛企宗為節度使端明殿學士僉書樞宻院事趙鼎格詔遂再乞罷甲辰鼎以本職提舉洞霄宫鼎既去上欲申前命叅知政事謝克家曰企宗非有大功今若必行前命是使鼎得名企宗得利而陛下獨負議論於天下後世也上感悟乃止前御吏中丞秦檜自敵中歸時朝士多疑之惟右僕射范宗尹及同知樞宻院事李回力薦其忠丙午檜入對仍進其所與金將逹蘭書有直秘閣李允文者盧陽人初受辟於宣撫處置司時諸路潰兵坌集于湖北之境復辟允文知鄂州兼節制兵馬如張用曹成馬友李宏皆劇盜亦頗為之用又李成方擾江西故允文得以自恣一切便宜從事邀留上供綱運且遣其屬孫濟耿棫用軍法脅取州縣物以千萬計知岳州袁植條其姦狀復置以聞為允文所得亟遣兵執植至鄂丁未沉於江而殺之戊申上謂宰執曰秦檜忠樸可用朕昨為之喜而不寐葢聞二聖諸后起居而又得一佳士也范宗尹曰檜在沙漠四年昨至都堂議事氣不少衰李回曰檜舊曽除資政殿學士可以經筵留之上曰未須如此遂除禮部尚書以春官事簡也張守曰陛下奨檜如此可以風厲多士上又以檜初歸用乏賜之銀絹各二百朱勝非間居録曰秦檜自京城隨金北去以被金人逹蘭郎君任用金騎渡江與之俱來回至楚州金遣舟送歸檜王仲山壻也别業在濟南金為取千緍贐其行檜之初歸自言殺金人之監己者奔舟來歸然全家同舟婢僕亦無故人皆知其非逃歸也以御史中丞富直柔為端明殿學士僉書樞宻院事建賊范汝為衆益盛官軍多失利庚戌詔神武副軍都統制辛企宗將兵一萬討之企宗入閩不敢進而駐於邵武軍尋以企宗為福建制置使初漕臣魯詹謂漕於統制本不相屬公事移牒遂失其意及企宗陞制置督軍需甚急且促詹至其軍人危之詹見企宗言邵武見粮未乏及責漕臣輓他州以取贏某不敢愛死恐終非制置利爾企宗不能屈知湖口縣孫咸以贓罪抵死壬子詔貸命黥之上謂宰執曰祖宗時贓吏有杖朝堂者黥之尚為寛典又曰自今贓吏須與痛懲庶幾可革久弊謝克家曰聖訓及此吏知所畏矣乙夘詔改樞宻院幹辦官為計議官初右正言吳表臣以趙鼎薦為臺官至是乞補外戊午上謂宰執曰羣臣之進雖多因大臣薦引若臺諌朕豈不能辨其言否而表臣用意黨私朕何頼焉范宗尹曰吕頤浩罷相所薦人多被彈擊臣力懇陛下保全之正欲革此也乃除表臣直秘閣典郡江東大師吕頤浩奏李成兵衆此所以敗請益兵以討之甲子上謂宰執曰頤浩奮不顧身為國討賊羣臣不能及但失於輕進今兵既少衂須令持重乃詔神武前軍都統制王􅊅引全軍萬人助之范宗伊曰頤浩欲更得韓世忠兵為助上曰敵騎尚在江北世忠未可遽行李回曰成敢擁衆跨江正以敵方南冦朝廷不遽遣兵若陛下親御六師移蹕饒信間則成破膽矣上曰朕決須親往但敵騎稍北遣世忠先行朕縂兵臨之仍以賞招携其衆則成必易擒亦不欲多殺士衆富直柔曰聖㫁如此天下大幸乃詔江湖川廣所輸上供悉令寄儲信上起居郎丹陽洪擬曰審如是則遷蹕之議決矣舍四通五逹之郡而趣偏方下邑道理僻逺非所以示恢復形勢卑陋不足以堅守禦水道壅隔非漕輓之便輕棄二浙失煮海之利非䇿也因極論之議由是寢先是趙哲既誅死陜西漕臣權慶帥孫恂又斬敗軍統領官喬澤張忠等時統制官慕洧守慶陽懼將及已洧乃本路熟戸其族甚大遂首以城叛進攻環州宣撫處置使張浚檄涇原經畧使兼知渭州劉錡以兵解圍錡至環州與洧相拒金以輕兵破渭州次潘原縣錡留統制官張中孚李彦琪捍洧親率精鋭赴渭州而城已䧟錡退屯瓦亭中孚與其弟統領官中彦送欵降賊彦琪以餘兵遁歸古原州中孚等又引金人刼降之中孚彦琪皆自覊管中起以為將而叛錡至花石峽統制官趙彬又刼其軍與金帛降金彬乃書生嘗為曲端館客其人尤桀㸃金進犯秦州秦無師又犯熙和總管劉惟輔死之統制官俱重亦降于金金由秦鳳還趙彬引之圍慶州守將楊可弁以城降於是五路相繼悉䧟張浚以中孚彦琪皆恭州流人曲端心腹其降也端必知其情而叅謀官王庶譖端不巳時人多上書為端訴寃浚亦畏其得衆心乃送於恭州獄逼而殺之然議者以為無辜其後追復宣州觀察使謚壯愍制畧曰屬委任之人人致刑誅之横被悉還舊秩申賁美名制辭李誼行王之望西事記曰張浚之敗於富平也人皆歸咎於曲端之廢人多上書訟其寃浚畏其得衆心殺之獄中以病死聞西人以此益非之然端負才喜犯上非浚所能御也既不能御之不若殺之天下無一曲端未必便乏才端而不死一日得志逞其廢辱之憾一揺足州陜非朝廷有也然則雖殺之可也議者罪浚以據天下富强之地權牟人主而不能有尺寸功蜀之士人貽書訶詆者不可勝數浚皆優容之或有金帛之賜其去陜西而至於房陵也有題六言詩於傳舍者又有從而䟦之者皆訕罵難堪之詞浚見之命籠以碧紗且書於其後謂中其病此其所以獨當一面累年雖敗而不亡者耶湖冦楊華等一日乗舡至鼎州城下聲言乞招安鎮撫使程昌寓募孔目官劉醇持檄以往醇登舟而賊㫁其首皷棹東去十二月先是金西元帥府宻遣人馳諭諸路令同一日大索兩河之民辛未金境州縣皆閉門及拘行旅於道至癸酉凡三日而罷應客户並籍入官刺其耳為官字鎻之雲中及散養民間立價鬻之或馳於韃靼諸國以易馬葢既立偽齊以舊河為界恐䧟敵者逃歸豫地故爾是時父母夫婦皆星散號哭之聲滿路死于非命者無數樂夀縣得客戸六十八人誤作六百八人以報尼瑪哈必責其數縣官執窮民以足之民罹此患甚於兵毒矣又中原之民被掠歸雲中者不令出城無以自活士大夫徃往乞食于途尼瑪哈見其多恐或生事聚三千餘人坑之城外建康大帥吕頤浩奏討李成軍乙亥上謂宰執曰金退當使諸將併力擊成成敗則諸冦自歸矣范宗尹曰誠如聖訓樞宻院都成㫖闕上令宰執具人數甲申乃擬邢煥辛道宗藍公佐上曰煥係戚里朕不欲令任朝廷差遣次乃道宗但不堪之兵道宗時為後軍都統制遂除副都承㫖於是給事中陳戬言道宗不當除不報浙西大帥劉光世探報敵不渡江辛夘上謂宰執曰敵不渡江天意可見朕當修人事以答天意范宗尹曰聖訓及此天下幸甚李成將馬進圍江州未解右僕射范宗尹請命大將致討上從之乙未以神武右軍都統制張浚江南招討使仍詔在宣撫使之下制置使之上乃令前軍統制王􅊅後軍統制陳思恭與通泰鎮撫使岳飛皆𨽻于後以㑹要及范宗尹事實叅纂舊制川陜買馬及三千匹即轉一官故有一任轉數官者主管茶馬趙開以為濫乃奏用馬到亰實數若斃於道則有罰立為定格是冬買馬踰二萬匹而茶引收錢一百七十餘萬緍初福建制置使辛企宗駐邵武距賊洞二百餘里時遣兵攻賊率為所敗邵武有選人施逵者嘗為潁上教官以䇿千企宗辟充幕屬而逵反為賊游説欲得招安時監司亦以招安為便朝廷乃遣承議郎劉嚮迪功郎陸棠同往招之嚮棠皆建安人賊黨葉鐵者恃其勇未即聴命惟汝為慕得官亦懼大軍繼至雖受招安而不肯散其徒於是授汝為閣門祇候民兵統領以鐵副之鐵改名徹乃就命嚮棠為措置民兵寨柵官
