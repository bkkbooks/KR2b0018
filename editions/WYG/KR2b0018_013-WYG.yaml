body:
  text: 中興小紀卷十三宋熊克撰紹興二年秋七月辛酉上諭宰執以福建昨縁盗作遣兵蕩平其被焚刼之家並與免税秦檜等曰謹奉徳音既又謀帥時資政殿學士張守以内祠侍讀召而守力辭宰執遂擬除守乃以知福州癸酉上謂宰執曰内諸司可省即令修政局條上如修内司與牛羊司已見冗費秦檜曰陛下及此盛徳事也大觀政宣間屢裁冗費終不能行今斷自淵衷誰敢不應上曰只要凡事當人心權邦彦曰人心合則天意得萬事無不成矣檜曰聖徳既著逺人自服陛下近命有司碎銷金屏風逺邇咸知莫不欣載上曰凡事至誠力行善惡人自知不可掩也上又曰儒臣講讀若其説不明則如夢中語耳何以發朕意欲令胡安國兼讀春秋不必作解義朕將諮詢昔英宗時司馬光請乞語問若知則進其説不知則退而討論此於帝學最為有補於是檜等仰賛聖學之知要焉安國時以給事中兼侍講又給事中侍講廖剛嘗從容奏言凡經筵講罷因留進對惟許論説治體汲引賢材不得私有所請及排斥人物上深然之時有議廢修政局以揺秦檜而左司郎官平陽林待聘檜客也方兼本局檢討官乃上言聞之蘓軾曰治道之病其始不立則其卒不成惟其不成是以厭之而愈不立今日是也陛下即位六年更用八相而績用弗著此無他人無常責而各有心則治何以立陛下顧今廷論猶前日爾委弊極矣宜更張之則樂於循故冗濫極矣當裁抑之則惡於害已臣恐修政之舉廢則亦翫嵗愒日而已臣願陛下奮剛明之斷嚴動揺之意以成復古之勲天下幸甚乙亥上謂宰執曰朕每務至公泛觀萬事如學道之人處之無心秦檜曰公乃王王乃天惟公與天合如文王受命乃在無然畔援無然歆羡誕先登於岸上曰此豈文王無欲所致耶檜曰惟無欲則先登於岸觀世人之擾擾如在水中耳初都督吕頥浩北征領統制官巨帥古趙延壽崔増等軍行未至丹陽縣後軍叛去淮南宣撫使劉光世遣統制官王徳追至建平縣滅之於是頥浩不能進引疾求罷遂詔頥浩赴闕己卯頥浩入奏都督府事因言常潤蘇秀大稔米價極賤上曰若此何事不成頥浩曰米㪷二百正如陛下初幸淮南時也上曰太賤亦恐傷農先是創沿海制置使以集英殿修撰仇悆為之建司於浙西甲申左僕射吕頥浩言近創此司最為得策然敵舟從海來有二道一自海北岸來至明之定海一自南岸來至秀之海鹽萬一有警逺不能及乞令仇悆專管浙西别命人管浙東從之丙戌以御史中丞沈與求為吏部尚書兼權翰林學士户部侍郎黄叔敖遷尚書自渡江以來玉牒等文散失至是宗正少卿李易乞旋行編次丁亥詔從之監察御史劉一止嘗言人材進用太遽而仕者或不由銓選朝士入而不出在外雖有異能不見召用執親䘮非軍事至起復為州縣官皆僥倖之門不塞而至公之路不開爾又請選近臣曉財利者倣唐劉晏法於瀕江置司自辟官吏以制國用鄉村皆置義倉以備水旱及増重監司轉運副使提㸃刑獄以曾任侍從官為之是月擢一止為起居郎一止奏事上曰卿朕親擢也自六察遷二史祖宗朝有幾一止曰臣不知舊典尚記宣和間張澂李稅與臣實同顧臣何以當此八月庚寅上謂宰執曰朕見凡詢衆集議二三其説事愈不决吕頥浩曰誠然魏相言漢家自有制度諸儒皆是古非今如漢三傑唐房杜豈須多耶上曰朕即位六年備嘗艱險非天相之何由脱艱今盗平榖稔天意可知假如敵或南來避與不避如何頥浩曰若盡遣諸將禦江敵豈便能渡但先定計以待之上曰未聞千里而畏人者頥浩曰聖意如此諸將誰敢不前耶起居舍人鄱陽張燾言自古用師未有不知敵人之情而能勝者願詔大臣諸將厚爵以募可用之人遣徃伺敵撫養家屬以係其心資之財本使或為商賈或為伎藝以混其跡庻盡死力凡敵人動息皆得知之是日詔諭沿江諸將及都督府壬辰詔参知政事孟庾權同都督江淮荆浙諸軍事時庾同太尉韓世忠討賊湖外就用之也癸巳給事中胡安國言京都圍城中人乞再行遣仍薦李剛可用上問安國所知綱如何曰綱作小官敢言水災上曰綱以此得時望然嘗為相矣如綱昔擁重兵解太原圍與官屬只在懐州相去千餘里卒無成功綱多掠世譽虚羙以此協比成朋變白為黒相附者爭稱之朕今畀以方面於綱任亦不輕甲午上以語宰執吕頥浩曰陛下之言誠是靖康伏闕亦綱之黨鼓唱乃至殺近侍莫能止此風不可再也是日詔韓世忠蕩平諸㓂連奏大㨗已優加擢其告内外諸軍統制官各務立功報國共濟中興以光史册時言者以為今日理財治兵最為急務如鎮江建康江湖皆大帥總重兵又命宰執都督諸路措置規模亦漸可觀望陛下乗此機㑹更遣侍從官提振江上與大將周旋於金鼓矢石之間同力捍禦詔侍從官願行者聽於是給事中胡安國言提振者提領振舉之稱必有事權乃可今長江表裏悉命宰臣都督執政權領次則有宣撫劉光世在鎮江韓世忠在建康侍從官徃諸軍前若只遵約束即為虚行若别授事權又非特命執政專制閫外之意况人主近人入則陪侍出則扈從今逺去觀闕誠非所宜以臣所見其説不可用也先是起居郎胡世將應詔言請以神武武五軍並建都副統制以分其勢益増三衙精卒為萬乘扈衛以備非常人以為中於時病己亥左僕射吕頥浩自江上還欲傾右僕射秦檜而未得其方過平江守臣席益知頥浩意謂之曰目為黨可也然黨魁在鎖闈當先去之頥浩乃引觀文殿學士朱勝非為助至是以勝非為同都督江淮荆襄諸軍事胡安國言勝非與黄汪同在政府緘黙附㑹馴致渡江南渡之初又下詔尊張邦昌結好金人許其子孫皆得録用淪滅三綱乃至於此及為相苗劉肆逆不能死之何足倚仗於是勝非乞守越不許上曰勝非作相三日值苗劉之亂當時調䕶有力朕豈不知言者再論之勝非惶懼復辭㑹稽遂以勝非為醴泉觀使兼侍讀日赴都堂議事特命中書舍人檢正黄龜年書行仍趣其來上曰勝非近罷同都督士人多上書論其功惟一二臺諫不與既而勝非至雖在經筵而實預國論位知樞密院之上安國求去頥浩言時方艱難安國欲以㣲罪而去其自為謀則善矣百官象之如國計何戊申安國落職提舉仙都觀於是檜三上章乞留安國不報龜年永福人也大理少卿張宗臣言諸郡戎器朘削殆盡作院旬呈之法僅成虚文漕計方闕不給以料工匠散充他役雖有舊管或大兵經塗或帥臣捕盗盡取而去今防秋在邇素手臨敵可乎宜下諸路監司察其滅裂或若帥司及大軍所索先足州司方給其餘庚戌詔從之時南雄州境有賊鄧慶呉忠聚黨千餘州兵不能敵守臣奏江西帥司有統兵官傅樞見駐南安軍雖在别路去本州纔九十里願得其兵撃賊辛亥詔傅樞總兵累年糜費錢糧未嘗立功仰躬率所部兵捕賊如敢逗遛重寘典憲殿中侍御史黄龜年論右僕射秦檜以為主和則遂沮止國家恢復逺圗且植黨日衆将專國自恣漸不可長檜即上章辭位甲寅授觀文殿學士提舉太平觀前一日上召當制學士綦崇禮諭以檜二策仍出其原奏云以河北河東人還金以中原人還劉預如斯而已故崇禮載之制詞略曰自詭得權而舉事當聳動於四方逮兹居位以陳謀首建明於二策罔燭厥理殊乖素期既而言者論檜不知治體信任非人専務减刻人心大揺且引給事中程瑀等布之要路何俟不譴乃詔落職於是瑀與侍御史江躋起居舍人張燾相繼罷去丙辰上與宰執言癸丑夜星變昨夕出次東北朕懼欲避正朝又止一已减常膳食素用謹天戒卿等深思政闕益務修舉皆惶懼請罷曰臣等失職致虧于理陛下克自抑畏宜即消伏然所次分野甚逺上曰今不論所次齊魯燕趙之分天象示譴朕敢不畏天之威耶提舉仙都觀胡安國道過衢州遇教官福清黄祖舜師承安國者也時秦檜已罷相於是祖舜言檜不曉事安國未以為然初朝廷所遣通問使自宇文虚中之後率募小臣借官使敵如王倫朱弁魏行可崔縱洪皓張邵輩並為所留先是倫在雲中副元帥尼瑪哈嘗遣都提㸃烏凌阿思謀原名島凌思謀今改正下同即驛見倫語講和事既而尼瑪哈亦自到驛至是乃以事授倫歸報而朱弁洪皓皆得以家問附倫而歸倫入見具奏敵中事上優奨之以為右文殿修撰左僕射吕頥浩謂當遣使以騐敵意九月壬戌乃詔承義郎潘致堯假吏部侍郎為大金奉表使武經郎髙公繪假忠州刺史副之仍兼軍前通問令倫作書與耶律紹文并附茶藥納两宫道君金三百兩銀三千兩淵聖金二百兩銀二千兩寜徳宣和二后金各一百兩銀一千兩又以金銀賜宇文虚中及其下以路由東京乃令宰執作書與劉豫而金國相亦以金二百兩銀二千兩與之時道君在五國城其後金人傳達道君見之泣下謂羣臣曰荷天眷命未亡趙氏中興之主出而繼焉今日信至可謂幸㑹老夫晚年復覩盛際使我得歸一日瞑目足矣羣臣皆賀除藥材留以備用餘皆賜一行親屬官吏時上已擢宣州觀察使楊沂中為神武中軍統制而言者多謂増衛兵癸亥上謂宰執曰此論與朕意不同彼但見承平禁衛之盛今亦不少一衛士所給可贍三四兵朕命沂中治神武中軍此皆宿衛兵也卿等可増修器械乃為先務遂命沂中兼提舉宿衛親兵然不滿三千沂中歎曰勾陳天仗單弱乃爾於是招丁壮營牧圉未半嵗軍容果張由是上益眷之既遂改中軍為殿前司命沂中主管本司公事初置六部監門一員比寺監丞乙丑以觀文殿學士提舉萬夀觀兼侍讀朱勝非為右僕射同平章事兼知樞密院時左僕射吕頥浩猶帶都督諸軍事勝非奏此官宜罷執政言方防秋未可勝非又奏孟庾姑從之頥浩所領當罷也時宣撫處置使張浚自興元復回閬州浚奏金人與夏國頗睽夏國屢遣人至呉玠軍中丙寅廣東漕臣汪召嗣奉其父觀文殿學士提舉洞霄宫伯彦之官所辛未執政除請廣帥吕頥浩曰汪伯彦長於治郡上曰伯彦為郡朕豈不知恐外議以朕藩邸之舊復云未協朱勝非曰漢用蕭曹故人唐用房杜舊僚今使伯彦任方面未為過舉詔伯彦就知廣州伯彦未拜命盗數萬侵廣東圍城邑郡人相率請伯彦討賊伯彦乃出領帥事既而賊亦遁去先是醫官樊彦端湯藥有勞御筆特轉遥郡刺史免執奏言者以為陛下臨御以來深戒僥倖之弊事有不由朝廷者皆許覆奏所以絶羣小之求天下幸甚今奉御筆臣恐斜封墨敕復自此始願下三省評議乃詔寝前命丙子上謂宰執曰凡御筆處分雖出朕意必經由三省樞密院與以前不同若或未由當許卿等奏禀給舍繳駮朱勝非曰不由鳯閣鸞臺不謂之詔令也初鎮江府有織羅嵗貢御服花羅數千匹兵興罷貢至是内藏庫舉行守臣胡世將奏民力凋弊無所從出有司劾世將違㫖府寮皆懼世將曰某以身任諸公無憂戊寅詔罷之上曰軍興匱乏豈可以御服之物為先且省七萬緡以助劉光世軍也辛巳上謂宰執曰湖南巨盗既平殘黨復能作過否吕頥浩曰有未滅者令李綱收之然聞綱縱暴其治潭恐無善状上曰朕選任賢才惟恐有遺朕葢嘗任綱不知其有何功可紀若宣和論水災以此得望可也權邦彦曰綱只是掠虚羙頥浩曰綱之為黨與蔡京一體靖康伏闕薦綱者皆其黨陳公輔張燾余應求程瑀鼓唱為之至殺内侍幾生大變上曰如伏闕事儻再有當誅之自兵興以來急於除用人材並無降詔之體至是學士綦崇禮言望舉行故事是日詔從之湖廣有統制官張忠彦者駐軍廣州頗擾一路宣撫使李綱召之不來綱察忠彦意樂為郡檄令權知岳陽忠彦果至即械送所司取㫖誅之乙酉詔諸路帥臣帶宣撫使者並罷於是李綱知潭州止帶湖南安撫使丙戌詔龍圗閣待制知温州洪擬為禮部尚書主管川陜馬趙開倣大觀東南北鹽法置合同鹽市驗視稱量封記發放與茶法大抵相類鹽引毎斤納錢二十五土産稅及増添等共約九錢四分鹽所過毎斤納錢七分住賣納錢五分若以錢引折納别輸稱提勘合錢六十自此始推行之金諸將請其主晟如中京以觀遼土及兩河之地是秋左右副元師尼瑪哈鄂勒琿監軍烏克紳都監烏珠烏珠自秦翔回皆㑹于燕山以迓之留監達喇守祁州都監伊都守雲中伊都久不遷常怏怏有叛意至是約燕京統制浩里原名槁里今改正同反蓋統兵之人皆契丹人伊都密諭燕雲兩河郡守之契丹漢児令盡誅女真人天徳知軍偽許之遣妻來告時烏克紳獵于居庸闗見二騎交馳甚遽追獲之於靴中得其反狀烏克紳回燕統軍来謁縳而戮之伊都既覺父子以游獵為名遁入夏國不納遂之韃靼先已受烏克紳之命以兵圍之伊都父子皆死烏珠馳至雲中凡預謀者悉誅之并殺尼瑪哈之次室蕭氏烏珠回燕請罪於尼瑪哈曰蕭氏乃天祚元妃與兄實仇然忍死以事兄者蓋將有待今事既不成他日帷間不測寸刄可以害兄矣某愛兄故擅殺之尼瑪哈泣而謝于是令諸路盡殺契丹其得脱者皆西亡入夏北奔沙漠矣冬十月戊子朔宰執奏言者乞置監牧馬事上曰若復孳生馬監當就水草地於是三省樞密院條上欲以饒州為牧地郡守帶提領仍選使臣五員專管其事上曰兵以馬政為先唐開元間馬多至四十萬匹當時用一縑易一馬亦要得人又如王毛仲陳馬若錦繡其盛如此起居舍人朐山王洋言近百官進對所奉訓誥皆不闗史氏慮嵗久失實請自今有得聖訓事闗休戚弗具報者聽史官論列從之時諸路盗賊稍息左僕射吕頥浩慮守令不䖍請分御史循行諸路上乃詔三省選强明亷謹之人臺察不足則以郎官攝之皆令引對面給親劄御寳厯回日考其殿最以著賞罰乙丑詔遣曾統朱異明橐胡䝉劉大中薛徽言等分徃諸路並以宣諭為名異桐廬人橐長沙人大中楊子人徽言永嘉人也詔各賜内帑絹二百匹統等辭免上曰朕欲出使無擾不受一切饋遺若不賜予何以養亷聞司馬光曰儻衣食不足安肯為朝廷而輕去就耶至今人多誦此語時資政殿學士李回以老儒知洪州雖仁厚有餘而智略不足故下多縱弛帥司屯兵數萬皆招牧潰賊既無所憚又軍食不足恣其所為郡民夜不解衣惟恐生變大中至江西以回為不職且言其縱子弟預政及多辟親黨攝官凡二十餘事朝廷初疑太多再下大中審實大中言十中之一二耳事有大于此者乃詔落職罷之回歸饒州而卒先是有富順民李勃者因與娼阿王濫詐稱徐王到夔州守臣韓迪申宣撫司遂津送赴行在道由衢州吏白守臣鄞人汪思温親王至州當避正堂思温曰即乘輿至何以待之治供帳如大賔客之儀勃至行在驗得其詐送大理寺根問獄具庚寅詔勃依軍法阿王决杖編管起居舍人王洋乞封錢氏之後甲午上謂宰執曰洋面對舉不急之務可降一官且曰朕虚已求言如盗賊等事可言者非一洋姑應詔㫖豈朕所以望臣下之意若獻言者有補治道朕當旌賞既而洋知吉州猶得直徽猷閣而去自罷江淮等路發運使以来頗失上供錢物至是新置江浙荆湖閩廣九路都轉運使丙申以大理卿張濟為之仍除集英殿修撰置司湖州言者謂今年閠四月壬辰有詔戍兵于本州知通依階級法蓋朝廷灼見官軍在外恣横之弊然經由州縣一切不䘏擅發倉廩豪奪錢穀甚至笞撻官吏肆為兇暴豈可姑息不問望今後統兵官經由州縣如屯駐法從之己亥上謂宰執曰銓曹若不為人吏舞文即無留滯長貳官肯閲文案自然難欺吕頥浩曰臣昨任吏部尚書頗見其弊臣以為四選人吏作過大即流配次當勒停上曰赴部之官徃徃以細事難知動涉旬月不可不革也初金人陷南京守臣休寜凌唐佐降之復以為南京守至是唐佐宻疏劉預虚實遣人持蠟書歸朝為人所告豫執唐佐還汴都庚子殺之囚其妻田氏於頴昌府其後京西招撫使李横下頴昌田氏訟其事横以聞詔贈唐佐徽猷閣待制中書舍人胡松年面對論吳越楚漢皆有謀臣如吳不用申胥楚不用范増則為越與漢所滅乙巳上以語宰執於是朱勝非曰唐肅宗用李泌以白衣為謀臣上曰徳宗幸奉天一時謀議盡出學士陸贄故號内相庚戌宰執奏禁私酒事上曰私酤亦害國計吕頥浩曰茶鹽𣙜酤令曰仰以飬兵若唐府兵可復無養兵之費則可罷不然舍此何出朱勝非曰𣙜酤自漢武時因用兵而有上曰行之千餘年不能改亦見允利也朱勝非上疏陳經營淮北五事一謂國家屯軍二十萬月費二萬緡儻無變通理必坐困逆豫方行什一法聚以資敵若王師不出豫計得行今當渡江取彼所積以實邊圉淮南既實民力自寛二謂逆豫招到山寨已二十六項彼得之未必為用我失之人心必去且謂官軍不敢出逆黨能驟來以江南為危地北為樂土若承此時擣其巢穴則淮北振擾而江南自安三謂金使既行未有要約而豫之惡可以藉口况彼姦詐但計強弱如尚强和必不集與其併力南向曷若先破豫兵以去其助四謂大軍一出當明諭将帥凡官帑金弊皆以賞軍此藝祖伐蜀惟取土疆之意也五謂渡江之後有助順上豪可率衆者擢為守将俾自為備則兵勢益張如此不二三年中原可定上從之右諫議大夫徐俯言大臣不可立威當與諸将論事上謂俯曰昨杜充一向威嚴将帥不敢議事朕詔執政與諸将㑹食共議卿知未十一月己未宰執進呈俯章吕頥浩曰将相和則國安豈可人情不通上曰天下安注意相天下危注意将然危亦不可偏廢如司馬穰苴文能附衆武能威敵此蓋難事己巳宰執奏新除太尉韓世忠合依兩府恩例上曰朕昨命中使賜世忠帯笏狨座以寵之矣昔周賞晉侯賜之大輅戎輅肜弓盧矢秬鬯今世忠有功宜厚予之吏部尚書兼權翰林學士沈與求除龍圗閣學士知潭州與求乞祠改以禮部尚書提舉太平觀庚午擬奏有官必有吏然先世之吏正後世之吏邪故有所謂猜禍吏有所謂豪惡吏有所謂輕黠吏有所謂深刻吏尹賞張湯王温舒之徒猶能制而用之故能勝其任近時吏强官弱官不足以制吏官有以財用不給而罷者吏未嘗過而問也官有罪吏告之有司治之惟恐後吏有罪官按之則相與疑曰豈寛縱致然耶故任職者皆以不按吏為得計宜其所在姦吏專權擅勢大作威福臣竊憤之願詔有司立法應官除名者吏勒停官衡替者吏放罷官能自按吏則許免失覺察之坐如此則吏强官弱之風浸衰矣上謂宰執曰朕思此一事要在官得其人吏不敢舞文為姦吕頥浩曰縁官不知法故吏得以欺也權邦彦曰昔有三不欺不敢欺在威不能欺在明不忍欺在徳上然之辛未上謂吕頥浩曰朕嘗思創業中興事殊祖宗創業固難中興亦不易中興又顧祖宗已行法度如何壊者欲振墜者欲舉然天不假易朕敢不勉之辛巳上謂宰執曰昨日大理少卿元衮面奏朕戒以持法明恕如宣和間開封尹盛章王革可謂慘刻吕頥浩曰惟明克允乃用刑所先也時衮奏昨政和新書曽未數嵗而論議紛紛衝改幾半者皆自縉紳之臆説也願降睿㫖若於新書有所増損乞更加參訂可否勿使輕紊成憲乃詔今後臣寮所請若祖宗法意并新書有所増損令刑部參酌中省江西宣諭薛徽言奏漢薛宣守左馮翊時頻陽縣當數郡凑且多盗令薛恭所職不辦而粟邑縣小僻在山中民樸易治令尹賞以茂材遷乃奏賞與恭易未㡬兩縣皆治盖材有長短邑有劇易望許臣所到州縣視吏無大過止坐才窘而事不辦者聽兩易其任如薛宣故事詔如合移官申省取㫖初詔知湖州汪藻修元符以來日厯至是藻言東觀凡例臣嘗預聞今本州不經兵火案牘具存且多藏書之家臣於郡政之餘當自元符庚辰至建炎己酉編年類進以備採擇壬午詔從之初婦人阿易詐稱帝姬曾下嫁曹成致宗室趙士倫申荆南鎮撫使解潜送赴行在至是驗知其詐下大理寺獄其十二月丁亥朔詔易杖死士倫等皆編管右諫議大夫徐俯右司諫劉棐言湖南安撫使李綱慢君父輕朝廷及改制書等罪甲午詔綱提舉崇福宫棐宋城人也宰執奏御筆批出令舉舊制禁絶民間銷金事上曰昨因閲韓琦家傅論戚里多用銷金衣服朕聞近來行在銷金頗多若日銷不已可惜廢於無用朕又觀春秋正議謂質則用物貴滛則侈物貴蓋滛侈不可不革先是通州嵗支鹽二十萬袋時淮南宣撫使劉光世下統制官喬仲福置私鹽倣官袋而用舊引貸於池州人不敢問言者以為今嵗縁此支鹽僅三萬袋實損課額於是尚書省言茶鹽之法朝廷利柄今飬兵大費多仰鹽課若将佐容縱侵紊非獨妨客販即養兵大費必闕乃詔光世追仲福取問仍誡所部將佐不得販鹽違者重竄髙麗國遣人入貢己巳司封郎官鄭士彦奏國以兵故强兵以教故精國家承平時禁軍教法甚嚴况今艱難而諸州往往冗占大抵以將迎為急務以教習為虚文望詔有司申嚴故事每州選兵官專主嵗終則較其精粗而賞罰之辛亥詔劄付諸路帥司左司郎中金壇張綱奏欲今後令州縣月具繫囚存亡之數長吏結罪保明申提刑司嵗終較其多少最多則黜責少則褒賞壬子詔從之自中原失守諸重鎮多失惟徳安府獨存鎮撫使陳規與羣盗屢戰皆勝至是規奏屯田事請以兵為農因農為兵其策甚可行諌官乞推賞官吏遂降詔奨規甲寅言者又謂規深得古者寓兵於農之意望頒其法於諸鎮使倣而行之以參知政事權都督江淮荆浙諸軍孟庾為同都督婺州嵗貢羅建炎中已減定為三萬匹是嵗計臣格前詔乞復崇寜之舊守臣王居正三上章且遣其屬詣都堂白宰執仍手䟽五不可以聞乃詔依已減定之數初金人以伊都之叛收平州守郭藥師相州守杜充平陽總管蕭慶皆下元帥府獄既而悉免之惟雲中副留守李處能預謀族誅左副元帥尼瑪哈問充爾欲復南歸耶充曰他人敢歸南朝惟充不敢歸也尼瑪哈顧而笑之時金主晟已至中京欲遂之燕雲以伊都亂復還本土至是副元帥而下知其主已回亦各歸所部時鼎宼楊么黄誠聚衆至數萬么主誅殺誠主謀畫據江湖以為巢穴其下又有周倫楊欽夏誠劉衝分布逺近共有車船李龜年紀楊么本未曰車船者置人於前後踏車進退皆可其名大徳山小徳山望三州及渾江龍之類皆兩重或三重載千餘人又設栢竿其制如大桅長十餘丈上置巨石下作轆轤貫其顛遇官軍船近即倒栢竿撃碎之渾江龍則為龍首每水鬬楊么多自乘此原闕及海鰍船多數百隻海鰍者鰍頭船也蓋車船如陸戰之陣兵海鰍船如陸戰之輕兵而官軍船不能近每戰輒敗大率倫欽雖各有寨而專恃船以為强誠衝雖各有船而尃恃寨以為固誠寨南據芷江東北阻湖惟西有陸路又設重城濠及陷馬坑衝寨北據正江東西南皆阻湖誠衝每詫曰地險如此除是飛來是月詔鼎澧鎮撫使程昌禹與荆南鎮撫使解潜分遣兵討之既而昌禹奏殺賊五千餘人又李龜年記曰昌禹初到鼎州披荆棘立軍寨與賊接戰其御下甚嚴不用命必誅之故将士戮力又為鐵牀等刑專以威賊每擒賊黨引其傑黠者問以賊中事辭不服則以此刑治之其徒旁觀惶駭戰慓又隂縱其老弱以歸故賊畏昌禹不敢犯鼎州初諸州鑄錢監惟饒之永平最古蓋自唐乾元初已創本朝於至道中増池之永豐咸平中増江之廣寜而䖍之鑄錢院大觀末始建兵興以來鼔鑄殊損舊數而官吏猥衆徃徃虚靡廪給是年始令永豐監卒寓役於饒廣寜監卒寓役於䖍蓋移少以就多也鄧隨郢鎮撫使桑仲與其下謀再攻金房李横曰不率三軍入西川即殺敵以報國勿坐困於此霍明獨不從曰朝廷既招安我輩無事且已竟無行意仲怒自馳至郢州起軍明謂其黨曰大太尉來定見害明度仲以駿馬日馳三百里髻必觧散預備有力者為之束髪坐定明卑辭謝曰擇日即起兵豈敢違大哥令事未須遽莫理髪否仲欣諾有力者既得髻即擒而殺之遂以仲再反聞於朝仲之母奔告李横横自鄧州率兵為仲報讎進圉郢城明有口辦登城呼曰仲心難保先殺明次及兄矣何如吾二人分其衆與地請命於朝横不聽攻之愈急明開門與戰大敗而走既而自歸行在授洪州兵官横既為仲報讎義聲稍著詔授襄陽等州鎮撫使偽河南尹孟邦雄盗發永安陵河南鎮撫使翟琮憤不能平思出竒以擒之又知虢州董震初嘗從偽至是復歸正乃将所部與琮併力謀取西京琮興子也
