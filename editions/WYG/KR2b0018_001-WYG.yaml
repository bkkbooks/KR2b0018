body:
  text: 中興小紀巻一宋熊克撰建炎元年嵗在丁未夏五月庚寅朔大元帥康王即皇帝位於南京上道君皇帝之第九子母曰賢妃韋氏以大觀元年五月乙巳夜生於宫中紅光照室初賜名授武定軍節度封蜀國公二年進封廣平郡王宣和四年正月冠于文徳殿賜字徳基三月出外第拜太保遂安慶源兩鎮節度封康王上博涉經史道君問以古事及應詔制述率常稱㫖五年娶邢煥次女封嘉國夫人嘗侍道君習射於鄆王府上挽弓至一石五斗宣和末金人内侵淵聖皇帝方受内禪敵騎抵城下遣燕人吳孝民齎書請和欲得親王宰相為質時諸王皆從道君南幸惟上與肅王留京師淵聖召上具言孝民所陳上毅然請行遂命少宰張邦昌副上使於金寨時敵兵四遶上意氣間暇如平日數與大将斡里雅布原名韓离不今改正下同觀蹴踘雜伎留軍中經月㑹都統制姚平仲以所部兵刼寨平仲古子也金人以用兵責使者邦昌懼而泣上止曰為國家何愛身耶斡里雅布由是憚之不欲上留更請肅王淵聖嘉上忠勤還拜太傅靖康改元冬金人再南侵刑部尚書江都王雲奉使至金寨先遣親吏李裕回道斡里雅布語須康王親到議乃可成於是上奉詔使斡里雅布軍請緩師雲副之上請門下侍郎開封耿南仲偕行淵聖曰南仲老矣乃令其子中書舎人延禧與觀察使髙世則為參議官世則瑗孫也以十一月丁丑發京師晝夜行庚辰至相州民遮道曰肅王已不反乞大王起兵拒敵不宜北去辛巳至磁州初王雲使金歸過磁相勸二郡為清野計二郡從之悉撤近城民居運粟入城洎金人再至果以磁相無糧由他路入二郡人怨雲以為雲通於敵磁有崔府君祠乃東漢之崔子玉也封嘉應侯號曰應王上至州人擁神馬謂應王出迎守臣秘閣修撰義烏宗澤唘上亦謁其廟雲従上入上既出雲為百姓所害上檄澤捕得害雲者斬之乃定磁人力請上毋北去謂離北門五六十里即有敵兵知相州直龍圖閣祁門汪伯彦蠟書至亦言金遣五百餘騎沿路問上所在於是延禧等皆勸上回相州閏十一月朝廷議畫河遣僉書樞密院臨川聶昌之河東耿南仲之河北皆為割地使昌偕金使至絳州絳人殺之南仲偕金使王汭至衛州衛人㡬殺汭南仲遂如相見上乃與南仲連銜掲榜召兵勤王人情大悦戊申上登郡圃飛仙亭因持弓矢呪之曰若次第中此牌字則必聞京師音耗果三發三中左右動色相賀己酉上與幕府從容語曰夜来夢皇帝脱所御袍賜吾吾解舊衣而服所賜此何祥也頃之報京師使臣来乃武學生借閤門祇候秦仔賫蠟詔命上為大元帥陳亨伯元帥汪伯彦宗澤副元帥速領兵入衛上捧詔嗚咽軍民感動上乃命耿南仲同預軍謀十二月壬戌朔大元帥開府除汪伯彦為集英殿修撰上初開府服排方玉帶語伯彦等曰吾陛辭日皇帝賜以寵行吾遜辭久之皇帝曰朕昔在東宫太上解此帶賜朕卿宜收取不得已拜賜癸亥南仲等言軍行先籍糧食今勤王之師經由河北京東兩路乃差徽猷閣直學士河北都漕樂夀張慤直龍圖閣京東漕臣邵武黄潛厚並随軍應副乙丑閤門祇候侯章賫蠟書至催發勤王兵章言陛辭曰皇帝諭臣曰康王辟中書舎人從行可令便宜草詔盡起河北兵守臣自将入援是夜上命延禧草詔曉頒諸郡惟中山慶源被圍不得達元帥府五軍總一萬人上遣使招劇賊楊青常景等皆効順又得一萬餘人丁卯上欲領兵渡河與幕屬謀所向或請出濬滑或請渡王俞或請趨魏縣言人人殊猶豫未決汪伯彦獨曰非出北門濟子城不可衆莫能奪上從之仍遣前軍統制劉浩統兵出南門陽為濬滑之行以疑金乙亥上發相州使臣馳報黄河未凍衆失色上禱于天地河神至子城渡報河凍已合丙子上總師渡河至大名都漕權府事張慤與北道副總管奉符顔歧率衆郊迓時京城圍久及上駐北門而四方事皆取决於帥府矣壬午副元帥宗澤部兵二千人自磁州先諸軍至上大悦癸未知信徳府直徽猷閣梁揚祖兵萬人馬千匹繼至諸将兵官如張俊苗傅楊沂中田師中皆在麾下揚祖子美子傳授子俊成紀人沂中崞縣人師中秀容人上問揚祖孰優揚祖以俊對上亦喜俊自此常在左右上留揚祖為随軍轉運使甲申始聞金人登城斂兵不下淵聖詔見通和卿等兵未可動上涕泣知詔書為敵人所迫宗澤請進師直趨開徳解京城之圍汪伯彦等執講和之説且言敵兵十萬吾軍纔一萬三千人如何解圍合使大王安居更檄宣總司陜西江淮勤王之師約日俱進乃可破敵時北道總管趙野至南京與宣撫使范訥合軍自號宣總故也野訥並開封人伯彦請上移軍東平則措身于安地身安國難可圖上問耿南仲亦以為然遂决東去澤請自領軍至都城許之戊子澤兵行出南門進屯開徳府揚聲大元帥在中軍庚寅上離北京二年正月辛卯朔上入東平府界癸巳帥臣盧益漕臣黄潛厚率衆出迓上達府治丁酉右文殿修撰知冀州權邦彦以兵千人至上命屯開徳𨽻于宗澤壬寅徽猷閣待制知河間府黄潛善與髙陽闗副總管楊惟忠将數千兵至益開封人邦彦樂夀人潛善潛厚弟惟忠西戎部族也潛善請上移書沃哩布與辨曲直令退軍通京城之問耿南仲曰使敵知元帥府所在非利也潛善計不行乞戍兵于曹從之上留惟忠為元帥府都統制丁卯上以京東漕臣閭邱陞所領濮州兵及深州守臣姚鵬博州守臣孫振等兵一萬四千𨽻宗澤新降到賊軍丁順及單州王澈廣濟軍孟世寧等兵三萬七千人𨽻潛善壬申上以約諸路合兵而東平去京師差逺與幕屬議進屯濟州庚辰上發東平府癸未至濟州諸路兵大集軍費日廣梁揚祖言京城圍久鹽法不通宜比𣙜貨物法許人入錢給鈔請鹽上從之纔及一月給鈔一百萬緡公私俱便宗澤帥兵至韋城與金大戰敗之丙辰上奏除澤徽猷閣待制丁巳黄潛善以機事赴府禀議且引探事人張宗得金人偽赦并迎立孟太后書上揮淚大慟期身先士卒追二聖於河北諸将曰此将臣職爾大王乃宗社所繫不可輕舉時兵部尚書吕好問亦遣勇士李進持帛書至好問希哲子也戊午上以便宜除汪伯彦顯謨閣待制充元帥而黄潛善為副元帥癸亥耿南仲等率文武官吏勸進書再上上流涕不受諸路帥守監司推戴無虚日使臣鄭安自京回傳到少帝齧血書襟詔上讀之慟哭南仲以下又言帝王之興必有受命之符大王陛辭皇帝賜以排方玉帶大元帥建府有賜袍異夢四方申呈或曰靖王今始悟靖之為字皇帝立十有二月而元帥府建則靖康紀元實為符兆願大王亟即位以當天心上不納丙寅張邦昌以諮目至大略言國禍之酷權以濟事故寧忍死而報之於殿下上答邦昌書亦曰九廟不毁生靈獲全皆相公之功邦昌又遣上舅忠州防禦使韋淵賫書稱臣且言封府庫以待又曰臣之所以不死者以君王之在外也丁卯吏部侍郎汝陽謝克家以邦昌命賫玉璽至文曰大宋受命之寳克家跪進上慟哭命汪伯彦司之皇太后遣左丞安岳馮澥權右丞江寧李回采奉迎澥康邸舊人也又令姪權衛尉卿孟忠厚賫書詣上略曰王其速驅輿衛入處宸居上以安九廟之靈下以弭四方之變上覽書乃命移檄諸道具言邦昌恭順之意約束不得亂入京城於是濟之老父請上即位於濟宗室仲琮議用晉武靈王遵承制故事幕屬難之謂宜如唐肅宗即尊位以定天下又宗澤言恐邦昌等隂與金結毋或深信且開封于南京乃祖宗受命之地取四方中汴漕尤易庶為萬全時使臣曹勛自河北竄歸進道君御劄曰便可即真来救父母上慟哭拜受由是決意趨應天庚辰上發濟州鄜延副總管劉光世来上命光世都提舉五軍光世延慶子也僉書樞密院沙縣曹輔来癸未上至應天府甲申皇太后遣吏部尚書仙井王時雍開封尹永嘉徐秉哲奉乗輿服御来而張邦昌繼至伏地慟哭請死丙戌上以便宜進汪伯彦黄潛善為雜學士於是耿南仲議改元謂宜倣藝祖建隆之號且本朝以火徳王請曰建炎云改元大赦天下除常赦所不原者赦書首令從臣監司郡守訪求文武才略出倫之士雖布衣亦聽舉又誤國害民如蔡京童貫王黼朱勔孟昌齡李彦梁師成譚稹及其子孫見流竄者更不復敘民貸常平錢榖悉與蠲放又散斂青苗本以便民歳久法弊反為大患亦令罷去祖宗上供自有常數後縁嵗増不勝其弊當裁損以紓民力比来州縣受納租税務加槩量以規出剰可令禁止應臨難死節義不受辱出使軍前及因守戰歿於王事許其家自陳優與褒賞應違法賦斂與民間疾苦許臣庶具陳言雖詆許亦不加罪初睢陽當五代之末有狂僧日呼于市曰此地将来有聖人出世及我太祖以歸徳之節受周禪而國號宋人以為應矣至是乃正應其語上之将即位也門下侍郎耿南仲等請用漢光武故事為壇於宋之陽先告天地北望二聖然後受命及上登壇受表涕泗交流百官環侍無不感動因名其壇曰中興受命之壇初靖康以金人内侵置四道都總管分制諸路以衛京師有詔事得専決財得通用官得辟置兵得調發有警則留其副以守而都帥自将入援既而南道都總管張叔夜統兵三萬至京城下與金戰遂除僉書樞密院從二聖北狩南道都總管胡直孺亦統兵勤王戰敗為金所獲後遣之還惟副總管直龍圗閣朱勝非留治應天府事勝非頗能均節調度帑藏得以不空至是上即位犒賜半出於此叔夜耆之孫直孺開封人勝非上蔡人也辛卯上謂宰執曰少帝事上皇仁孝升聞爰自臨御沉機淵㫁聖不可測乃遭厄運暫為北狩朕念手足之恩常若神㑹太后當二聖北轅以聖德起於宫闈乃眷朕躬膺天厯數累章勸進於國有功靖康皇帝宜上尊號曰孝徳淵聖元祐皇后册為隆祐太后壬辰宰執奏事張邦昌先退上問黄潛善等曰朕何以處邦昌潛善等曰邦昌僭號罪在不貸然為金人所脅不得已而從權惟陛下睿斷處之上曰邦昌小心不幸逢此雖不能死然遭變從權使宗廟不隳社稷不壊一城生靈獲全肝腦金人纔退遣人賫書赴愬及歸寳璽駿奔来朝北面事朕既貸其初欲馭以王爵異時金人有詞使邦昌具書報之曰中國不忘趙氏彼師不旋踵而天下勤王之師皆左袒歸宋故邦昌懼不待問罪幸保首領而反籍於朕使金人知天下之歸出於自然卿等以為如何潛善等曰陛下聖意髙逺非臣等所及於是邦昌罷為太保奉國軍節度使同安郡王五日一赴都堂參決大事上即命潛善等募忠信能専對之士奉使通和除作國書命邦昌更作金人書早遣使行尋詔加邦昌太傅依文彦博故事每月兩赴都堂以稱朕優禮之意册賢妃韋氏為宣和太后立嘉國夫人邢氏為皇后侍御史績溪胡舜陟首言今日措畫中原宜法藝祖命郭進李漢超董遵誨等守邊之術以三京闗陜浙為四鎮拱滑潁昌𨽻東京鄭汝河陽𨽻西京恩僕開徳𨽻北京而同華陜𨽻京兆擇人為節帥使各以地産之賦養兵自衛且援鄰鎮如犬牙相錯又京帑積錢千餘萬緡宜給四鎮為糴本若四帥得人則隠然為國長城庶㡬中原不失江左可居詔付三省未㡬言者謂舜陟為臺官而事偽廷遂除秘閣修撰知廬州其議遂寝門下侍郎耿南仲告老癸巳除觀文殿學士提舉洞霄宫而大元帥府叅議官耿延禧髙世則亦皆以宫觀去上欲命相而難其人黄潛善汪伯彦皆元帥府舊寮新擢執政人望未孚惟資政殿大學士李綱當靖康京城初被圍時能建議力守後宣撫河南救太原雖無功而士論恕之謂其平日有志在今可用甲午綱自外除右僕射兼中書侍郎綱邵武人先是淵聖除綱領開封府道梗尚未赴也金主晟起燕雲上中京遼東西長春平州凡八路民兵𨽻于諸萬戸分擾兩河於是渤海萬户托卜嘉原名撻不也今改正下同屯河間府女真副統蘇赫原名韶合今改正下同屯真定府契丹都統馬五屯平陽府女真萬户尼楚赫原名銀朱今改正下同屯太原府女真萬户羅索原名婁宿今改正下同屯河中府而雄覇嵐憲澤潞諸州皆有萬戸分屯自金之初用兵也朝廷許諸郡得便宜行事故各務自保逐路帥司不調發無連衡合從相援之勢又金兵方盛非一州之力所能敵故金得併兵既破一州又攻一州至是女真副統䝉克原名䝉哥今改正進據磁相詔遣統制官馬忠張換将所部各五千人自恩冀趨河間以襲之時靖康執政皆去而僉書樞密院曹輔已被病丙申卒丁酉詔宣仁聖烈皇后保佑哲廟有大功而姦臣造言仰誣盛徳著於史牒以欺後世可令國史院據實而修播吿天下於是蔡卞邢恕皆追貶之詔遣統制官薛廣張瓊将所部各三千人廣自内黄瓊自開徳過河北山水寨義兵二萬同復磁相尋以宣教郎臨江傅雱借工部侍郎為祈請使又令廣瓊等且駐河南戊戌以吏部侍郎謝克家為翰林學士徽猷閣待制北道副總管顔歧為御史中丞翰林學士莫儔除述古殿學士承㫖吳幵除龍圖閣學士皆奉祠而去儔歸安人幵清流人也知揚州許份言濟鄆與敵為鄰南京雖興王之邦而敵騎屢至惟揚州前江後淮有險可恃願駐蹕於此是日詔略曰屬方勤於北顧難遽議于東巡份侯官人将子也初江寧府禁卒周徳等叛執知府資政殿學士宇文粹中殺官吏嬰城自守㑹經制司屬官鮑貽遜統勤王兵七千至城下發運判官方孟卿檄貽遜進兵逼城徳等乃受招安粹中華陽人靖康初自右丞出帥貽遜龍泉人孟卿鄱陽人也時新除右僕射李綱行次江寧因與漕臣權府事吴人李彌遜謀是日誅首惡五十人其衆千餘人令提舉常平官王枋部赴行在癸卯資政殿學士宋城路允迪靖康初為僉書樞密院未㡬奉祠去丁未召為吏部尚書資政殿學士建陽范致虚靖康末以前執政帥長安嘗統兵復西京擒金留守髙世由未㡬兵敗退駐潼關至是復命為京兆經略安撫使初西路總管資政殿學士王襄北道總管資政殿學士趙野皆以前執政任總帥雖率兵赴闕而遷延不進至是襄野並責分司詔略曰豈有兩君之在野略無一騎之入關故取迂塗以為遁計尋又各以散官安置襄永州野邵州襄南陽人也戊午詔太常少卿周望借給事中充大金軍前通問使武功大夫趙哲除達州刺史副之望上蔡人也是月以龍圖閣東道副總管朱勝非為中書舎人兼直學士院時事皆草創詔書填委而院無几案勝非嘗慿敗鼓草詔然文氣嚴重如平時勝非因奏陛下新即位宜正始正始之説無他仁義而已仁義者天下之大柄也人主當持之而朝廷奉承之則人主尊朝廷當持之而四方順從之則朝廷尊中國當持之而逺人欽服之則中國尊人主失其柄必有大臣跋扈之患朝廷失其柄必有尾大不掉之患中國失其柄必有外國交侵之患國家與北敵結好一百二十餘年彼既亂弱乃逺交金人為夾攻之計天祚匿於近塞遣使指蹤令金人取之且露章稱賀是中國失其柄矣金人内侵每以渝盟失信為辭此皆燕人之語怨我背契丹之約也不然金人通好以来何嘗違其意哉願睿明務思其本凡進退人才弛張法度禮樂征伐慶賞刑威一語言一嚬笑必加詳審合於仁義者行之不合於仁義者置之則可以弭兵保民紹復大業迎還兩宫矣上嘉之時在京榷貨物鬻鹽鈔茶引而道途未通發運使梁揚祖請權於真州置司詔揚祖兼領其事於是嵗入六百萬緡嵗入六百萬據揚祖行述上之相李綱也御史中丞顔歧言張邦昌為金人所喜雖已位三公宜増其禮綱為金人所惡宜置閑地六月己未朔綱至行在入見首言陛下用臣為相而外廷之論如此臣願歸田里至如命相扵金人所喜惡之間更望聖心審處上曰歧嘗有此言朕告以如朕之立恐亦非金人所喜者歧無辭而退綱乃赴堂治事辛酉詔潛邸名升暘宫先是圍城百官中有余大鈞陳冲王及之洪芻等八人皆誘内人為妾及因抄金銀自盜入己事覺送御史臺鞫治壬戌李綱再論圍城中受偽命者上曰國家顛覆士大夫不聞死節往往因以為利如余大鈞洪芻誘宫嬪為妾王及之坐蕃衍宅門詬諸王卿知否曰見鞫之必得其情綱又曰靖康之禍在内惟李若水在外惟霍安國死節甚著而吳幵莫儔王時雍徐秉哲皆奉金人指立張邦昌及捕宗室戚里又受偽命為執政此為罪首先是若水已贈觀文殿學士秉哲以散官安置乃詔贈安國為延康殿學士貶時雍髙州幵永州儔全州並安置時在圍城中者綱槩欲以叛逆罪之右丞吕好問曰王業艱難正含垢納汙之時遽繩以峻法懼者衆矣責以不能死則可若直謂之叛逆彼豈無辭乎綱意不厭乃遣其客正字晉陵胡珵要説好問區别圍城人為三等以差行戮且曰必如是方可表公之忠節好問謂珵曰某與君俱處城中衆以為可罪者纔十許人耳餘人本末吾輩所共悉寧可以叛逆加之耶綱由是不樂吕本中雜説曰金人再逼京師謝克家耿南仲黨人往往在圍城中皆前日力攻李綱者也綱既相復以圍城中事中傷之以邦昌僭號叛逆凡在圍城中皆次第論罪吕好問謂綱曰圍城中固可罪若但責以不能死節彼無所逃罪矣然其間尚有曲折若専以叛逆罪之則彼必有辭矣却恐反為害由是綱不悦即使言者中好問上深以為非然好問亦不敢留綱亦旋罪去由是觀之耿南仲李綱之黨茍以罪更相加誣於國事所害甚大皆不得無罪也癸亥詔略曰朕惟祖宗涵養士類至矣靖康之變仕於中都者曽無仗節死難而多偷生取容甚者乗時為姦靡所不至為中國羞姑取其尤量加竄責以為臣子之戒至於卒伍理當濶略以責後効既而臺獄具余大鈞等皆當棄市上曰有司之法如此新政重於殺士大夫李綱等亦言天地之大徳曰生於是詔流余大鈞與陳冲洪芻于沙門島王及之與張卿才李彛周懿文胡思皆廣南諸州安置臺獄具在八月戊午朔今聨書之李綱又奏張邦昌恃金人盜神器國破而資之以為利君辱而攘之以為榮知陛下總師于外天人所歸乃始退舊班遣使奉迎今冒取王爵平章大政方且偃然自得儻或逃誅何以立國臣請以春秋之法㫁之若都城人則謂因邦昌得生而徳之若元帥府則謂邦昌不待討而恕之若天下則謂邦昌易姓建號而憤之都城人徳之元帥府恕之私也天下憤之公也春秋之法人臣無将将則必誅今陛下欲中興當先正朝廷乃崇僭逆之臣以示四方其誰不解體若執政中有議不同者臣乞與之廷辨上乃召黄潛善吕好問汪伯彦再對而潛善主邦昌甚力綱曰陛下必欲用邦昌乞罷臣相上顧好問曰卿在城中知其詳謂當如何好問曰邦昌僭位人所共知既已自歸惟陛下裁處綱又曰邦昌罪當誅陛下以其自歸則貸死而逺竄之潛善乃言在逺不如在近是日詔邦昌以散官潭州安置初知陳州趙子崧知汝州趙汝櫟知蔡州閻孝忠皆密邇敵兵能保全境内知襄陽府黄叔敖知漢陽軍李彦卿通判鄂州陳規皆扞禦有勞又荆南府帥臣鄧雍棄城而去敵欲乗勢渡江破公安縣知縣程千秋率民禦之敵不敢犯是日詔子崧陞二秩汝櫟寳文閣真學士叔敖秘閣修撰孝忠彦卿皆直秘閣千秋陞一秩就除本府通判叔敖分寧人雍開封人規臨沂人尋詔雍為禁從敵来先遁落職與宫祠既而襄陽復不守叔敖落職降充監當甲子召通奉大夫傅墨卿為禮部尚書龍圖閣學士知潭州郭三益為刑部尚書墨卿山隂人前知舒州以武昌冦作遣其孥還越道由江寧遇周徳之變一家盡死墨卿方遭患不及就職三益嘉興人也初上諭宰執令置登聞檢鼓院以通下情至是置於行宫門外李綱言今日中興規模有先後之序當修軍政變士風裕邦財寛民力改弊法省冗費誠號令信賞罰擇帥臣選監司使吾政事已修然後可議興師上曰誰可任此者綱因薦前監察御史張所於河北直祕閣傅亮於河東乃詔借所直龍圗閣招撫河北又以樞密副承㫖王􅊛經制河東而亮副之皆賜錢百萬緡以備募兵又給半嵗糧及空名告千餘道用京畿兵千人為衛遣之􅊛成紀人所益都人靖康末嘗至河北募兵時因論黄潛善坐貶亮馮翊人號知兵初以布衣得召權京西統制官将兵數千直至汴京城外與金戰至是綱皆引用之丁卯詔曰行在将士適當隆暑暴路之久尤軫朕懐又賦斂之繁當謀蠲减法令之弊當議改更潰兵為盜因間擄掠殘破郡邑已降赦令當遣使招集許令自新贓吏為姦乗時掊克重困吾民罪不可貸當遣使按治寘於典憲靖康間敢言之士或至竄逐宜悉召還自今有智謀之人如能獻諫宜悉擢用協成治道以篤中興之烈上登極赦書已罷天下神霄宫是日又詔本宫錢穀並付轉運司以充省計既又詔道士林靈素鄭知微傅希烈家資令温處二州籍沒上初詔取進士命給事中兼權直學士院河南王綯條所當行者綯言經義當用古注不専取王氏説乃詔復元祐詩賦經義兼收之制鴻臚主簿鄧肅沙縣人也宣和間因進花石綱詩得名李綱為起居舎人論京師水災謫沙縣監税與肅游相善靖康間肅被召得官京城破遂入統制官傅亮軍中至是以肅為右正言肅首論圍城中有以侍從官而為偽執政者有庶官而為侍從者有為張邦昌撰赦文者有因邦昌而改名者是皆不復知有宋徳請悉以叛臣目之其上者寘於嶺外次則逺處編管卿監而下朝廷本不以國士待之亦難於國士責之但籍其姓名自是不復任為臺諫侍郎若用此則一網而盡不惟上報二聖之徳亦破天下姦雄之膽也時右司諌潘良貴亦論圍城中人乞分三等定罪良貴金華人也吕本中雜説曰鄧肅前一年因李綱薦得官時又用汪伯彦薦為右正言故傅㑹綱意専以圍城為言繼而潘良貴又乞三等誅罰癸酉詔河外陜西山東與隣路相援如常山之蛇首尾互應令金腹背受敵每路帥臣統之猶一人而運四體敵至援兵四集則賞不踰時違者必罰無赦詔諸路添置武尉一員戊寅同知樞密院汪伯彦進知院事己卯詔于沿河沿淮沿江置帥府要郡以控扼之帥府帶安府要郡鈐轄各武臣為之副又别置凌波等水軍上之初即位也即命寧武軍節度使范訥為京城留守庚辰詔罷訥仍降授承宣使淄州居住先是召延康殿學士張慤為戸部尚書慤至首言陛下當判忠邪忠邪判則亂治分壬午遂除慤同知樞密院事兼提舉戸部財用初詔舊相觀文殿學士宋城徐處仁為大名尹處仁時已被病至是卒於大名初言者論靖康末折彦質為宣撫錢蓋為制置髙亢總兵守河皆不戰而遁今置不問則後将何以使人彦質可求子可求見知府州猶未陷于敵蓋惟演孫也詔貶彦質昌化軍蓋落職髙亢編置海外亢行次南康軍知軍李定通判韓璹奏亢欲謀變已誅之且待罪右僕射李綱曰亢将兵守河敵未至而先走朝廷不能正軍法一軍壘守倅乃敢誅之必健吏也使後之受命扞敵者少知所戒是當賞上曰然乃詔定璹各轉一官初金人左副元帥尼瑪哈原名粘罕今改正下同自河東歸至雲中右副元帥斡里雅布自河北歸至燕山至是聞上龍飛睢陽張邦昌入覲遂㑹于山後草地議事斡里雅布中暑死乃以其弟鄂勒琿原名斡离嗢今改正為右副元帥時金國主晟嘗遣使諭尼瑪哈止南下之兵尼瑪哈報以本朝數使人要結契丹漢兒欲共攻其國以激怒之蓋尼瑪哈専權晟不能令至是命相亦取决焉晟守虚位而已初錢蓋制置陜西嘗議湟鄯之地於朝廷無毫髮利而嵗費不貲不若立青唐之後使為藩臣有益麻党征者故王之子國人所服儻立之必得其力至是用蓋策乙酉復蓋原官除陜西總制使賫告報益麻党征仍賜姓名曰趙懐恩因召五路兵赴行在以延康殿學士宗澤為東京留守時馬軍都指揮使郭仲荀見統禁旅在京城執政黄潛善汪伯彦頗疑澤故就命仲荀副之又以顯謨閣待制杜充為北京留守仲荀逵孫充安陽人也詔罷州縣職田右僕射李綱請令諸路買馬及募民出財助軍費且言熙豐時内外禁旅五十九萬今禁旅單弱何以捍强敵而鎮四方故莫若取財於東南募師於西北若得數十萬付諸将以時練之不久皆成精兵此最為急務丙戌乃詔陜西河北各募三萬京東各募二萬合為十萬仍創騎勝壮㨗忠勇義成龍武虎威折衝果毅定難靖邊凡十號每號四軍每軍二千五百人丁亥上諭宰執東京發到内庫寳器有玻璃碼碯之屬皆遐方異物内侍陳列以進朕念玩物喪志悉令碎之汪伯彦曰陛下初即位便能以道養志不累於物中興之功不足致也詔河東河北自太原真定失守之後列郡被圍誓以死守昔有十城固守不下則載信史以耀後世今數千里之廣無一人忍負國者忠義之俗古所未有訪聞失職之吏失次之軍失業之民渡河而南未有所歸其令帥臣監司悉心措置分布而收之初淵聖登極髙麗國遣使入賀詔遣吏部郎官華亭衛膚敏為宣問使至明州迓之始許使人春見而金人已逼京城詔令不通使人坐館淹久日費以萬計膚敏度不可留乃以幣易金繒厚餉其使而遣之還朝請矯制之罪上嘉賞遷為衛尉少卿至是膚敏言屬者敵逼汴京乗輿保金湯而居固善然知敵雖棄去秋必復来而尚嬰孤城此大臣不知變之過也今兩河諸郡幸皆堅守臣謂宜隂以帛書許其世封使人知自愛不為敵有陜西山東淮南則令増埤濬湟訓齊其人而擇大臣以鎮撫之可也
