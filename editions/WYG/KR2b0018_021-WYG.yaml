body:
  text: 中興小紀卷二十一宋熊克撰紹興七年嵗在丁巳春正月癸亥朔詔朕將親臨大江駐蹕建康以察天意時左司諫陳公輔勸上幸建康甚力公輔又論今世尚程頥之學以鄙言怪語為伊川之文髙視闊歩為伊川之行人能習此則為賢而舎是皆非也上因詔學者令以孔孟為師時録黄下禮部吏欲鏤版中書舎人董弅權侍郎曰少俟之郎官黄次山申臺謂弅沮格詔令於是侍御史周袐弹弅出之除集英殿修撰知衢州趙鼎雜記曰其後給事中胡世將舉次山自代朝廷擬修注上曰非告訐董弅者耶此風不可長遂令補外除湖南提刑當國者意甚沮丁巳嵗九月鼎再相即除弅次對既而翰林學士朱震求去徽猷閤待制胡安國聞之與其子中書舎人寅書曰子發求去晩矣當公輔之說纔上若據正論力爭則進退之義明今不發一言黙然而去豈不負平日所學惜哉且復問宰相云某當去否既數日又云今少定矣此何等語遇緩急即是為偷生免死計豈能為國逺慮平生讀易何為也於是安國自上奏曰士以孔孟為師不易之至論然孔孟之道不傳乆矣自程頥始發明之而後其道可興至今使學者師孔孟而不得從頥之學是入室而不由户也夫頥之文於諸經語孟則發其微㫖而知求仁之方入徳之序則鄙言怪語豈其文哉頥之行則孝悌顯於家忠誠動於鄉非其道義一介不以取與則髙視闊歩豈其行哉自嘉祐以来頥與兄顥及邵雍張載皆以道徳名世如司馬光吕公著吕大防莫不薦之頥有易春秋傳雍有經世書載有正蒙書惟顥未及著書望下禮官討論故事加此四人封爵載在祀典比于荀揚之列仍詔館閣裒其遺書以羽翼六經使邪説不得作而道術定矣丙寅上為宰執曰昨日張俊呈馬因為區别良否皆不差張俊曰臣聞陛下聞馬足聲而知其良否上曰然因論觀墨惟李廷珪墨有骨有肉昔道君令潘谷及蔡京令張滋造墨皆用廷珪法而谷止得其肉滋止得其骨雖暗中入亦可知也俊曰物猶昜知惟知人為難上曰人誠難知張守曰惟以為難則用捨必不苟俊曰孔子言始吾於人也聽其言而信其行今吾於人也聽其言而觀其行此両言為要上曰是孔子於人其始未能無失也俊曰聖人待人以誠故聞其言而信之至為小人所紿而後加察焉故必觀其行上以為然先是諸路贍大軍錢令轉運司於經制𣙜酟征商等數内逐月樁辦因號月樁錢然所樁不能什之二三餘則州縣之吏臨時措畫錙銖而積僅能充數一月未畢而後月之期已廹戊辰戸部郎官霍蠡言月樁錢病民最甚乞詔守臣具所樁窠名幾何與臨時措置者若為而辦朝廷召諸路漕臣禀決其可行與否而罷又江西湖南認發岳飛軍月樁錢亦令具申省己卯吏部尚書孫近請詔三省樞密院凡所以靖中原制外國者日夜講求而常程之事付之有司上諭宰執曰近所論甚當常程事可付之六曹張守言六曹有常法故不敢專決而朝廷則可取㫖行之上曰六曹長貳不任責則事巨細皆取決於朝廷若任責則朝廷事自然清簡要當遴擇長貳而已淮東宣撫使韓世忠與偽境淮陽軍對壘引兵攻之未能下世忠奏已回楚州召資政殿學士提舉洞霄宫沈與求為提舉萬夀觀兼侍讀既至癸未以翰林學士陳與義為參知政事與求為同知樞密院事乙酉詔本兵之地事權宜重依祖宗故事置樞密副使而知同僉書亦皆仍舊初以道君逺在沙漠乃遣問安使何蘚等往金國通問至是還始知道君及寧徳皇后已相繼上仙丁亥宰執入見上號慟擗踴終日不食張浚等力請方進少粥以觀文殿學士醴泉觀使兼侍讀秦檜為樞密使舊例宰執新除雖到堂即時歸第是日以何蘚等回留檜議事不許歸第是時禮儀皆正字權禮部郎官眉山孫道失草定方議論之際翰林學士朱震多依違人或罪其緘黙獨著作佐郎王蘋以謂若子發建明是已取名而歸過于上也子發之意或出於此此據吕大臨見聞志初馬軍帥解潜與樞密院都統制王彦不協両軍之士嘗交鬬于通衢中外訩訩是月平江民居火潜所部入人室聲言救火而攘其貨有㫖兵士免推治管轄使臣劉舜臣降両官給事中胡世將駮奏曰潜統軍無律不黜無以明賞罰乃詔罷潜及彦以浙西淮東制置副使劉錡主管馬軍併両軍以屬之初河南布衣尹焞漸之孫也師故程頥得其師學靖康初召至京授和靖處士建炎兵亂鎮撫使翟興聘之不就徙居長安劉豫僣位使偽帥趙彬招以厚禮焞逃去遂入蜀止于涪先是范冲在經筵力薦召之不赴遂用程頥故事授左宣教郎崇政殿説書先是焞至九江值左司諌陳公輔論學程氏者之弊復辭曰學程氏者焞也於是右僕射張浚顯言其嘗拒劉豫之節焞始就職自復賢良方正科久未有應詔者按此節詞意未足疑有脱文二月戊午詔太尉湖北京西安撫副使岳飛為宣撫使時淮東宣撫使韓世忠江東宣撫使張俊皆已立功而飛以列將㧞起世忠俊不能平先是飛皆屈已下之書數通俱不答及飛破楊么獻樓船各一兵徒戰守之械畢偹世忠始大悦而俊益忌之飛參議官薛弼雖每勸飛調䕶幕中之輕銳者復教飛勿苦降意於是飛與俊隙始深矣庚申上發平江府幸建康府三月癸亥朔上次丹陽縣宰執奏岳飛下將士功賞上曰諸將每奏乞功賞朕未常許之一切付之有司所以抑其僥求也功有大小賞有厚薄朕何敢私亦戒諸將不可容私若私則有功者解體緩急何以使人張浚曰陛下誠得御將之道三月甲子上次鎮江府丁夘以吏部侍郎吕祉為兵部尚書仍兼都督府參議軍事己巳上次下蜀鎮上謂宰執曰道中閱韓世忠背嵬軍極驍健武藝比往日益精矣張浚因言諸將之才不同要在得士心則人肯用命上然之初臨安行宫留守吕頥浩至平江欲勸上輟行而不得朝乃随上西來至是始見上撫諭遣之及頥浩回臨安處事甚有緒豪右莫敢犯禁始奏浙江渡以舟之大小定人數多寡後遵用之辛未上至建康府駐蹕戊寅同知樞密院事沈與求進知院事先是上謂宰執曰宣和皇后春秋已髙朕朝夕思之不遑安處張浚等曰聖孝如此可以格天矣己夘詔宜尊為皇太后中原遺民有自汴都来者言劉豫自麟猊敗後意沮氣喪其黨皆携貳金人謂豫必不能立國而民心日望王師之来朝廷因是遂謀北伐都督張浚乃出行淮上撫諭諸軍且築廬州城時議者謂淮西宣撫使劉光世昨退當塗幾誤大事後雖有功可以贖過不宜仍握兵柄又言其軍律不嚴士卒恣横浚歸亦言光世不卹國事語以恢復則意氣怫然于是光世屢辭疾乞解兵柄乃從而罷之甲申除光世檢校少師萬夀觀使以其兵屬都督府趙鼎事實曰初駕至建康當軸者以光世不足伏遣其腹心吕祉誘脅之俾請宫祠罷兵柄欲以其兵盡付岳飛為北向之舉是月金右副元帥烏珠自黎陽北歸燕山夏四月丙申權主管馬軍劉錡言得㫖撥行營前䕶副軍侍衛馬軍今欲併為十二將每二將為一軍餘両將為逰奕軍從之丁酉詔徽猷閣待制王倫奉使大金國迎奉梓宫以武經大夫髙公繪副之皇太后禮物例支金一百両付倫等行初靖康執政孫𫝊張叔夜從二聖北狩至是樞密使秦檜因言二人家屬在敵中甚貧宜有賑給上詔依宇文虛中例與之上曰靖康中耿南仲用事毎遣使憚行則威以軍法及既行身分所請多不給家屬至狼狽比還恩澤又復鐫减如此何以使人張浚曰南仲誤國何止此事先是上批内侍鄭諶除帯御器械己亥復諭宰執未湏行朕昨召用徐俯外議謂諶所薦朕何嘗容内侍薦人止縁黄庭堅集有徐郎徐甥後胡直孺薦俯自代質之汪藻藻以為然遂召用之今諶新命恐外間紛紛不若止與在外宫祠張浚等曰陛下聖慮如此敢不奉詔癸夘詔諸路天寜萬夀寺觀並以報恩廣孝為額初張浚與湖北京西宣撫使岳飛議不合飛喪母乞持服乃棄軍而去居江州廬山以本軍提舉事務官張憲權管軍事浚因請用兵部侍郎樞密都承㫖兼都督府參議張宗元為宣撫判官憲在告而宗元除書下軍中籍籍曰張侍郎来我公不復還矣參議官薛弼請憲强出臨軍憲諭羣校曰我公心腹事參謀必知盍往問之羣校至弼謂之曰張侍郎来由宣撫請也宣撫解軍未幾汝輩壊軍法如此宣撫聞之且不樂今朝廷已遣勑使起復宣撫矣張非乆留者衆遂安上詔飛入覲弼亦移書趣飛行至是飛偕弼入奏事飛以手䟽言儲貳事衝風吹紙動揺飛聲戰讀不能句飛退弼進上視之色動弼曰臣在道嘗怪飛習寫細字乃作此奏雖其子弟無知者此據朱勝非間居録及野記與薛季宣所述參修勝非又曰時張浚捃摭岳飛之過以張宗元監其軍蓋浚方謀收内外兵柄天下寒心又張戒黙記曰薛弼以甲子正月道由建昌謂戒曰弼之免於禍天也往者丁巳嵗被㫖從鵬入覲與鵬遇於九江之舟中鵬説曰某此行將陳大計弼請之鵬云近諜報金人以儲貳大事入京闕為朝廷計莫若正資宗之名則敵謀沮矣弼不敢應抵建康與弼同日對鵬第一班弼次之鵬下殿靣如死灰弼造膝上曰飛適奏乞正資宗之名朕諭以卿雖忠然握重兵於外此事非卿所當與也弼曰臣雖在其幕中然初不與聞昨到九江但見飛習小楷凡密奏皆飛自書耳上曰飛意似不悦卿自以意開諭之弼受㫖而退嗟夫鵬為大將而越職及此其取死宜哉弼又云不知若箇書生教之耳岳飛字鵬舉故戒隠其語但曰鵬云丁未上與宰執言飛来解帥事上曰飛頃入對請由商虢取闗陕欲併統淮甸之兵而行朕問何時可畢對曰期以三年朕諭飛駐蹕於此以淮甸為屏蔽若輟淮甸之兵便能定中原朕亦何惜第恐中原未復而淮甸失守則行朝未得奠枕而卧也飛無以對飛既復任宗元乃還左司諫陳公輔言昨今月初四日上殿親奉聖語説及岳飛臣前此採諸人言皆謂飛忠義可用不應近日便敢如此恐别無他意祗是所見有異望陛下加察然飛本麄人凡事終少委曲臣度其心往往謂其餘大將或以兵為樂坐延嵗月我必欲勝之又以劉豫不足平要當以十萬横截金境使金不能援勢孤自敗則中原必得此亦是一説陛下且當示以不疑與之反復詰難俟其無辭然後令之曰朝廷但欲先取河南今淮東淮西已有措置而京西二靣緩急頼卿飛豈敢拒命前此朝綱不振諸將皆有昜心習以為常此飛所以敢言與宰相議不合也今日正宜思所以制之如劉光世雖罷而更寵以少師坐享富貴諸將皆謂朝廷賞罰不明臣乞俟張浚自淮西歸若見得光世懦怯不法當明著其罪使天下知之亦可以警諸將也初建康府通判楊邦義不肯降金為金所害已賜田二頃及銀絹各一百癸丑詔加賜田三頃仍贈待制上曰顔真卿異代忠臣朕官其子孫邦義為朕死節可不厚褒以為忠義之勸乎度支郎官莊必强言聞廬夀閒㣲有邊警蓋因將臣入覲而逆雛乗閒渡淮我師初不知之則斥堠不明甚矣往嵗維揚之變前監不逺又聞淮上之師頗有離次而去者此必有姦人隂閒以誘我師願詔諸將悉以實聞毋有所諱甲寅詔闗都督府知湖州江藻再進大觀政和詔㫖凡六年事且言已置史館見修日厯此後臣不當豫詔藻仍續編進都官郎中馮康國言今天付吴蜀于陛下為中興之基然蜀地狭而民貧昔諸葛亮苦軍食不足運以木牛流馬而莫遂乆駐自兵興饋餉已八年矣亮所苦者無嵗無之前年陸運始行成都潼川利三路調夫十萬縣官部役先至者賞貪婪之吏俾夜作晝莫恤民苦多斃于道運糧一石民間費錢數十千夫養兵所以保蜀而苦民如此蜀可保乎嘉陵江險夏漲冬澁終嵗水運誠莫能給故時起陸運之役兼將佐請米甚厚米價髙而銀絹平既缺正米不免折支所以嵗費大而錢糧兩不給也臣謂宜遣官諭吴玠於三月以後九月以前除防闗外且移兵于内郡就糧則蜀民稍寛可免後患丁巳詔闗都督府上嘗問權左司郎官孫道夫曰卿蜀人宜熟知利害水運與陸運孰便道夫言水運遲而費省陸運速而役煩向宣撫司初由水運每石取民錢五十餘千利害可見上曰水運既便自當行之兵國之武偹不可不養民乃邦本不可不恤恤民乃所以養兵也初都督府議合兵北討命參議軍事劉子羽諭指西師且察邊偹虛實子羽還奏敵未可圖宜治兵廣屯田以俟機㑹至是欲以子羽領光世兵子羽復以為不可乃詔子羽知泉州時金人以尼雅滿烏克紳為相左副元帥達蘭居祈州右副元帥烏珠已歸燕山左丞髙慶裔者尼雅滿之腹心也皇伯領三省事宗磐欲挫尼雅滿因慶裔以贓敗下之大理寺獄具當斬尼雅滿乞免官為庻人以贖其罪國主亶不從遂斬于都市臨刑尼雅滿哭與之别慶裔曰公早聽我言豈至今日我死公其善保之蓋慶裔嘗教尼雅滿反也尼雅滿於是絶食縱飲未幾病而死初鎮江府吕城夹岡地勢髙乆不雨則水淺而漕舟艱至是兩浙轉運使向子諲取唐韋損劉晏攷覈狀建言欲置斗門二石䃮一以復舊迹度費萬緡庶為水利詔從之子諲又請於徳勝橋置倉和糴因以平價且免脚乗欠折毎上江粮運至鎮江冬則候潮閘占舟而妨摺運綱兵亦復侵耗乞置倉以轉般為名諸路綱至即令卸納從之五月乙丑上與宰執論淮西事因曰兵無不可用在主將得人爾趙奢用趙兵大破秦軍而趙括將之則大敗樂毅用燕兵破齊而騎刼代之則為田單所敗豈不在主將得人乎秦檜曰陛下論兵可謂得其要矣後數日左司諌陳公輔因對以南兵不可用為疑上慨然曰赤壁之役曹操敗於周瑜淝水之戰苻堅敗于謝元北人豈常勝哉越王勾踐卒敗吴王兵彊諸國亦豈必北方士馬耶戊寅上謂宰執曰治天下湏恩威賞罰並行若有恩而無威有賞而無罰何以為治朕未嘗以私怒降人一官所以言此者蓋姑息之風不可長也楊沂中朕撫之過于子弟去年淮西有警朕親筆戒之若不進便當行軍法沂中震恐承命所以成功秦檜曰陛下英武如此中興不難致也初淮西一軍皆故羣盗平時驕悍自恣劉光世罷後雖𨽻都督府仍駐廬州都督張浚乃請同兵部尚書吕祉往廬視師及浚還朝留祉以䕶諸將至是祉亦廻而尚未置帥樞密使秦檜知樞密院沈與求以握兵為督府之嫌乞置武帥時統制官王徳酈瓊二人交惡而徳乃光世愛將遂除徳為都統制于是瓊等大噪列状都督府以訟其過先是劉豫後苑有梟鳴又烏數十鳴于内庭皆作休也之聲豫惡之募能捕獲一裊者賞錢五千是月無雲而雷有龍起撼宣徳門㓕宣徳二字豫亟命修之初神宗實録已成書矣至是乃用著作郎永康何掄刋正訛謬六月甲午詔前所修詳略失中去取未當不足埀世令本省官簽貼進入趙鼎事實曰初因臣僚上言裕泰二史是非失實始命官重修鼎去國之後有言其非者乃降御筆改修於是正字兼史館校勘李彌正髙閌見右僕射張浚乞辭史職浚曰正欲平其事故令史官自簽貼若辭却恐非便既而著作郎張嵲對罷申左右史以所得聖語云范冲任申先止凴校勘官便以為是故實録多舛誤時冲申先並為史舘修撰彌正閌遂再辭史舘從之趙鼎事實曰後趙鼎再相一日見上論及史事曰止是修訛錯者非有所改也鼎曰但所降御筆如此外間不得不疑上曰此乃宰相擬定者俟一併降出即自可見鼎又曰近見起居注載著作郎張嵲所得聖語亦復如此上愕然曰安得有此嵲小人也乃敢爾耶上駭甚謂鼎曰嵲所記不得存留鼎曰前此已修入時政記付之史館矣上曰為之奈何曰俟他日修日厯當喻史官除去之上曰甚善蓋此事本非上意特重違用事者之言耳丙申羣臣詣南郊請道君尊諡宜天錫之曰聖文仁徳顯孝皇帝廟號徽宗知樞密院沈與求卒時王徳亦訟酈瓊等之過乃召徳以本軍還為都督府都統制復命兵部尚書吕祉以都督府參謀領之於是中書舎人張燾見張浚言祉書生不更軍旅何得輕付浚不從右司諌王縉乃請於都督府屬官中選知兵者助之謀議且留軍中撫循訓練以通將士之情又直祕閤詹至前在都督府機幕時已去亦貽書于浚曰吕尚書之賢固一時選然於此軍恩威曲折卵翼成就恐不及前人前此軍已付王徳徳雖有功而與酈瓊輩故等夷耳恐有中不能平者願更擇偏禆素為軍中所親附者使為徳副以通下情浚雖然其言未及行也戊戍以祉撫諭淮西諸軍時建康有未起左藏庫錢帛奏乞免輸癸丑以侍御史周祕為中丞上殿官趙子琇頗知蜀中事宜因言今四川財貨茶䀋𣙜酤與夫常賦之外可以供公上者經度措置固已曲盡在今日無復理財之策惟有惜財之術爾願下眀詔使主兵者念民力之易殫凡不急支用當有以蠲裁典計者知戍兵之乆勞凡經費之湏務有以贍給則両司相通恤民贍軍同濟國事丙辰詔劄與宣撫副使吴玠及都轉運使李迨宰執奏上殿官蜀人蒲贄乞駐蹕江陵事上曰荆南形勢自古吴蜀必争之地故杜甫江陵望幸詩云地利通西蜀天文照北秦宜諭帥臣王庶練兵積粟及治城塹招流移為悠乆之計上又曰蜀中多士幾與吴不殊如摯者極不易得也時方盛暑張浚一日坐東閣參知政事張守突入執浚手曰守嚮言某舊徳有聲今與同列徐考其人似與昔異晩節必竟有患失之心是將為天下深憂蓋指樞密使秦檜也浚以為然
