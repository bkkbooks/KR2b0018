body:
  text: 中興小紀卷十六紹興四年嵗在甲寅春正月丁巳宰執論遣使事上舉申包胥曰秦伯初無伐呉存楚之志感申包胥之誠為賦無衣秦師乃出然則合兩國之成回難回之意只在使人耳鼎澧鎮撫使程昌禹遣統制官杜湛與制置司統制官王渥趙與同引兵攻楊么己未破皮真寨俘賊黨陳欽等八十人奪船三十於是湖中小㓂皆震恐不自安矣時殿中侍御史常同論制置使王􅊛討賊久未有功壬戌上謂宰執曰王􅊛使據上流可令岳飛自下流進兵賊無所逃矣今賊恃險與水嘯聚甚久譬如人病若淹嵗月必生他疾宜速除之戊辰上與執政論北方事朱勝非等退而相語曰上神武撥亂而以至仁御世内外歸心清蹕所駐億兆畢從自然成都敵所以不能窺者正恃人心以為固爾先是宣撫處置使張浚奏四川霖雨地震蓋名山大川久闕降香乞製文付下時浚已出蜀而奏纔至癸酉工部尚書胡松年遷吏部端明殿學士同僉書樞宻院韓肖胄與朱勝非議不合力求罷詔以本職知温州既又辭不赴改提舉洞霄宫先是御史臺檢法官李元瀹論保正稅長之弊上諭宰執曰役法推行寖久失其本意致富者益富貧者至貧民力重困此宜講究甲戌上又曰元瀹所論乃是民事祖宗法固不可改然民事急務也孟子所謂民事不可緩其令州縣條利害上之初川陜宣撫處置副使王似盧法原同在閬州及分陜蜀之地責守於諸将自秦鳯至洋川命經略使兼都統制呉玠主之屯和尚原金房至巴達命鎮撫使王彦主之屯通州文龍至威茂命統制官劉錡主之屯巴西洮岷至階成命統制官關師古主之屯武都時遣師古率統制官李進戴越王師古等引衆打粮於河州因襲大潭縣叛将慕洧㧞寨遁去師古深入敵境忽遇金兵與戰大敗師古歸大潭内懐慙懼遂隻身降敵呉玠念其下忠義不從師古以叛亟撫定之玠既併其衆所統益以精强然自此遂失洮岷之地獨存階成而已叅知政事席益既辭使金及金使對榻前又無一言之助於是臺諫交論其失二月壬午罷以資政殿學士提舉太平觀論者不已尋詔落職癸未上曰國家任用小人當退之也朱勝非曰陛下如天地初無愛憎始謂其賢則用之既知其非則退之所以為公也上又曰人或以開河為非急務朕語之曰禹卑官室而盡力乎溝洫孔子以為無間然安可謂非急務要措置有方爾先是議廢觀州下廣西師司相度未上二月乙酉上謂宰執曰知其無益於國便可廢之然當時取之不足為利今日廢之亦須慮患徐俯曰誠如聖諭元祐間棄渠陽匆匆城中人未出者為蠻所殺紹聖中唐義問所以被䜛蓋禍始于此也鼎㓂楊么既為官軍所敗其黨雖出降而賊防之甚嚴鄰居失覺者其罪死間有得達官地保甲利其隨身之物又殺而奪之鎮撫使程昌禹乃募人能引降者與獲級同故降者稍衆遂申朝廷乞招安時知樞宻院張浚自蜀還是月朔日浚至潭州留其屬官馮檝同湖南帥臣折彦質措置招安丙戌宰執奏其事上曰么等愚民嘯聚守令之罪茍欲自新令王􅊛折彦質招之以成朕好生惡殺之意既而行下招安而賊以不堪昌禹殺戮為辭尋有詔除昌禹徽猷閣待制知鎮江府候招安畢日行是月知樞宻院事張浚還朝浚之出使也嘗以秦川館為學舍以待河東陜西之士來歸者給衣食養之又新復諸郡乞鑄印浚以去朝廷逺亦先鑄給而後奏聞又浚之還取道東蜀䕫峽其至稍遲於是侍御史辛炳言浚被命宣撫不能成功輕失五路坐困四川用劉子羽輩皆小人而殺曲端趙哲為無辜以至設秘閣以崇儒擬尚方以鑄印及被詔不肯出蜀乞行黜責炳侯官人也金左都監烏珠與萬戸薩里罕領衆十萬復大入攻仙人闗宣撫使都統制呉玠乃豫為壘於闗旁號殺金坪嚴兵待之統制官楊政言於玠曰此地為蜀阨塞死不可失當臨以强弩彼不敢捨此而犯闗且地名亦善破之必矣於是金人至亦據高阜且戰且攻壘玠與烏珠約相見烏珠誘玠以王爵不從三月辛亥朔金兵攻壘益急玠命統制官呉璘領射士號駐隊者更迭射之矢下如雨敵死者布地而復踐以登玠又遣政與統制官田晟出銳兵持長刀大斧撃其左右夜布火滿四山大震鼓隨之壬戌夜壘中大兵出敵不意攻烏珠薩里罕兩大寨破之連戰皆捷金萬戸韓常為官軍射損左目金不能支遂遁去統制官王俊等追百餘里至鳯州又敗之是役也金自元師以下皆令㩦孥而來又選取豫腹心為四川招撫使期不徒還既不得騁則還據鳯翔授甲士田為久留計不敢復妄動矣丙辰端明殿學士江西大帥趙鼎在洪二年戢吏愛民盜賊屏息一方賴之至是召還辛酉詔舉賢良方正能言極諫是日福建漕臣鄭士彦進讀上曰閩中地狹民貧勿縱吏搥剥以重困之官吏姦贓者當劾不可黙也癸亥以侍御史辛炳為中丞時宣州奏疑獄不當奏而輒奏者不論罪而給事中孫近因疏駮大理寺之失論宣州有觀望乞併罪之甲子上謂宰執曰宣州可貸今若加罪則諸郡後有疑獄不復奏矣趙鼎曰此正國家立法之意也乙丑罷浚為資政殿大學士提舉洞霄宫尋又詔落職福州居住朱勝非閒居録曰張浚出使陜蜀便宜除官至節度雜學士權出人主之右竭蜀之財悉陜之兵凡三十萬衆與金角一戰盡覆用其屬劉子羽謀歸罪将帥趙哲曲端並誅之将士由是怨怒俱叛浚僅以身免奔還閬州闗陜之陷自此始至今言敗績之大者必曰富平之役追還薄譴俾居福州而已癸酉知湖州汪藻編元符崇寧大觀詔㫖先進二百卷詔送國史日厯所江西制置使岳飛奏䖍州盜發已遣兵討蕩甲戍上曰盜發不免加兵然皆理其末也不若理其本如守令得人能奉行詔㫖無以擾之即民自安業盜何自而作耶時梁衛之地悉淪偽境河南鎮撫使翟琮以數城孤立力不能敵乃引部曲突圍而出自歸於本朝詔琮知夀春府琮以母老力辭改授江東鈐轄其衆分𨽻諸軍先是偽宿遷令張澤率其邑二千餘人自㧞來歸泗州守臣徐宗誠納之宣撫使韓世忠奏至僉書樞宻院徐俯欲斬澤送首劉豫叅知政事趙鼎力争遂令宣撫司婉辭約回澤等仍械宗誠赴闕鼎復奏若恐妨和議令宰執以諭世忠宻受之却報偽境謂北界人來以朝廷約束不敢受遂恃衆作過已遣兵逐散是亦兵家一術也殿中侍御史常同言金雖議和而兩界人交歸未嘗有禁偽齊明置歸受館厚立賞以招吾人既遣李誠侵襄鄧隨郢又遣重兵攻川口今乃却澤人心自此離矣况宗誠起土豪不用縣官財賦募兵而自養之為國障捍今因受澤而械之以沮士氣非䇿也乃詔釋宗誠罪命澤以官且給閒田處其衆於淮西夏四月庚辰朔以鎮西軍節度陜西都統制呉玠為川陜宣撫副使免書本司事專治戰守言者謂軍興以來來陛下不吝推賞以旌戰士而屬上功類不覈實有盜賊自去而曰收復州縣有冦過境上而曰保守無虞如惠州及東莞縣皆經殘破而守令以御㓂推賞不知何所據而奏州縣且然况於軍伍似此姦罔詎可置而不問辛巳詔兵部申嚴奏功不實之法右諫議大夫唐輝等言前宣撫司叅贊軍事劉子羽程唐皆為張浚主謀而尚列從班望行貶竄癸未詔貶子羽於白州唐落職奉祀先是浚令前宣撫司隨軍轉運副使直祕閣榮陽張澄統本司兵萬人出蜀詔趣至行在及浚以次皆貶而澄獨入對未幾遷直徽猷閣除漕江西江西制置使岳飛奏川陜宣撫司於仙人闗與金人戰獲捷飛奏中頗有輕敵之意乙酉上語宰執曰用兵當持重飛宜深戒之朱勝非等曰誠如聖訓丙戌詔閤門各省四方館依祖宗舊制並屬中書省不𨽻臺察言者乞撥免役錢以充和買下轉運常平兩司共議兩浙轉運司言於本司無妨而浙東西常平司皆言役錢既充和買則役人無可以給庚寅乃詔轉運司多方那支丁酉衢州奏直睿思殿鄭弼經由常山縣騷擾是日詔降弼兩官㐮陽重地既為偽将李成所據湖湘之民亦不奠枕士大夫自蜀來者茫然不知所向一日宰執奏事朱勝非謂當先取之上曰今便可議就委岳飛如何時飛為江西制置使駐軍鄂岳趙鼎曰知上流利害無如飛者徐俯獨以為不然鼎既與俯異即請上令韓世忠以萬人臨泗上為疑兵劉光世選精兵出陳蔡庻幾兵勢相接㑹光世乞奏事鼎曰方議出兵而大將遽離本軍非便俯欲許之鼎力争以為不可時言者以鼎為是俯求去丙午以本職提舉洞霄宫時上欲令江東宣撫使劉光世分兵巡邉右僕射朱勝非請遣中使齎劄子付之庻無濡滯上慮内侍到軍中多擾止於急遞發行初南昌潘興嗣高蹈不仕自嘉祐以來趙抃韓琦唐玠交薦於朝起為筠州推官辭不就元符中黄履引徐復孫侔李泰伯例乞官其孫淳授星子縣尉及蔡京用事追奪之淳既死趙鼎前知洪州奏乞加恩於興嗣之孫濤以為亷退自守之勸丁未兩浙移文婺州市御爐炭非若胡桃紋鵓鴿色者不中程戊申上對宰執語及此慼然曰當艱難時豈宜以此擾人因詔罷買有似此類悉禁止之初上欲重修神宗哲宗兩朝實録殿中侍御史常同亦奏二史議論不公所以當脩之意且言惟故范祖禹之子冲知其本末時已召冲未至五月壬子上諭宰執曰二史失實非所以傳信後世可趣冲來令兼史事朱勝非曰神宗史縁添入王安石日録哲宗史經蔡京蔡卞之手是所當脩今脩之足以彰二帝之盛美矣言者以為祖宗朝宰執毎聚議都堂頃駐蹕㑹稽大臣㑹議日至三四自吕頥浩再相始不相闗願復故事以踵前世都俞之風是日詔從之川陜宣撫使王似等奏呉玠仙人闗之捷是日詔宣撫司速上功状考功郎官孔端朝言唐徳宗時陸贄建言盜滿天下宜痛自引咎以言謝之庻叛者革心故所下制書武夫悍卒無不感涕今陛下刻意恢復而播告之言或未有以發之謂宜因事見辭痛自引責以收人心時淮西宣撫使劉光世屯建康淮東宣撫使韓世忠屯鎮江以私隙未平殿中侍御史常同奏二臣蒙恩不思協心報國一旦有急其肯相援望分是非正典刑以示國威上以章示劉韓兩軍至是世忠乞差劉光弼充本軍統兵官辛酉上謂宰執曰兹事未便恐光世疑也光世弟光烈與世忠弟世良皆帶御噐械光烈近召世良世良峻拒之昨世忠語及此朕諭之曰世良等内諸司耳設有不和罷其一可也至如大将國家利害所係漢賈復㓂恂以私憤幾欲交兵光武一言分之即結友而去卿與光世不睦議者皆謂朝廷失駕馭之術朕甚愧之世忠頓首曰敢不奉詔他日見光世當負荆以謝時世忠於平江府私第建閣寳藏御書乞賜名有㫖賜名懋功學士綦崇禮奏罷之世忠乞賜閣名見朱勝非閒居録云時日厯所乞闗内東門司㑹禁中出入及更改事務甲子上謂宰執曰禁中百事皆守典故不惟祖宗家法不敢輕改亦最紛紛多事也朱勝非曰今日皆從簡約自無改之理自紹興初脩今上日厯始置脩日厯所既又號國史日厯所癸酉復詔以史館為名時宰臣薦吏部尚書胡松年為執政徽猷閣侍制趙思誠為六曹貳思誠高宻人也殿中侍御史常同言松年乃王黼客宣和間劉安世復直龍圖閣松年在詞掖嘗醜詆之今乃營求欲為執政可乎思誠挺之子崇寧初挺之首陳紹述實致國禍且與京黼同時執政今公道既開豈可使其子尚當要路是月以同為起居郎六月己亥曲赦䖍州土賊初上命江西制置使岳飛復取襄陽亦命淮西宣撫使劉光世發精兵萬餘人援之飛率統制官王萬等自鄂渚趨襄陽右僕射朱勝非許飛迄事建節且命司農少卿歸安沈昭逺往總軍餉参知政事趙鼎請上親筆飭上流監司帥守餉飛軍毋闕庻幾必濟飛等進軍於是劉豫求救於金金偽之兵俱來我師與遇連戰大破之遂復襄陽及郢隨諸州飛分遣統制官王貴張顯進擊敵兵及復鄧州時軍聲大振先是内降以使臣王評為秀州澉浦巡檢右諫議大夫唐輝上䟽引康定元年詔及嘉祐中陳升之劾鎮江軍留後李璋内降轉官正其干請之罪以為祖宗至公如是今一巡檢不足道深恐此風滋長壬寅乃詔罷之時川陜無執政為大帥言者数上章以謂若無大帥必失兩蜀上因諭朱勝非曰西帥難其人朕欲以趙鼎知樞宻院為之如張浚故事勝非曰聖謨如此臣謹奉詔先是荆南制置使王􅊛自鄂回鼎奏已招到賊衆萬餘然賊累殺招安使臣晁遇等且乞割州縣如溪洞故事是月湖南帥折彦質報賊不可招􅊛乃復遣兵蹂踐賊禾賊乗大水攻鼎州社木寨破之官軍死者不知其數賊愈增氣􅊛與鎮撫使程昌禹皆坐降官戸部尚書黄叔敖除徽猷閣學士奉祠而去初吏部法選人改京官而舉主有他故則報罷之至是郎官王思温始建請薦員溢格者本部以收使不盡之數移文所舉官别行改奏詔從之秋七月戊申建昌小壘而軍士素驕邀取無度守不能制至是守臣劉滂以法裁之兵不勝其憤是日衆集為亂滂及母妻皆死滂東陽人也建昌叛卒嬰城自守江西提刑司遣兵招捕時又詔右軍統制官趙詳引兵討之庚午宰執奏討賊事上曰辛企宗自建昌使人來經營乞委之討賊頃嘗遣往福建平范汝為怯懦無謀養成大㓂正如王􅊛在湖南玩㓂卒無成功而企宗又在􅊛之下惟務交結本無寸長可用也朱勝非曰陛下洞察諸将才否如此辛未奏趙詳已平賊上慮官軍入城未免玉石俱焚趙鼎曰未必敢殺人恐刼財爾上愀然曰斯民遭此禍可憫令有司優恤之既而言者以為國家艱難以來閩中殺漕臣建康杭秀之守臣皆為其下所囚率歸罪有司以為失於撫循臣聞建昌兵悍劉滂稍裁以法兹守臣之職乃并其家皆碎於賊此而不懲失刑甚矣願録滂之死以白其寃詔贈朝請大夫官其子二人初樞宻承㫖章誼同給事中孫近出使至金廷與其左右副元帥尼瑪哈烏克紳論事不少屈金人諭以亟還誼等曰萬里銜命兼迎兩宫必須得請金遣金吾蕭慶受書併以風聞歸過吾國誼詰其所自金以實對乃已還至南京為劉豫所留誼等以計得還上嘉勞之乙亥擢誼為刑部尚書時内侍李廙飲於大將韓世忠家即坐手刄傷弓匠事下大理寺殿中侍御史魏矼言内侍出入宫禁而狠戾發於杯酒乃至如此其於防㣲杜漸豈得不過為之慮建炎三年常禁内侍不得闗通主兵官及預朝政如違以軍法處之乞申嚴其制以謹履霜之戒是月御史中丞辛炳除顯謨閣直學士與郡而去朱勝非閒居録曰是夏樞府全闕胡松年為吏書綦崇禮為内翰辛炳為中司炳欲遷數言胡綦之失捃摭細故毫髪必聞未幾炳踰月論奏二公不已疾小愈未能造朝乞先供臺職有㫖從之議者紛然謂從官治事而不赴朝叅為不恭中司如此何以掌朝儀即日出知漳州怏怏而卒魏矼遷侍御史於是矼首論自治之䇿且言諸軍比日以來或造言惑衆或彊行捉募或刼掠財物或殺傷農民朝廷雖付之有司而未能究治自古善用将者必宰輔因其事幾而御之有術臺諌乗其闕失而言之當理是以國能御将将能使兵今宜訓飭諸将謹身率下使士皆心恱誠服安静不擾仍委宰輔以馭将之方責臺諫以敢言之義庻幾上下交儆紀網克振矣資政殿學士謝克家卒於衢州先是淮西宣撫使劉光世入覲頗自􅈭昻奏云錢糧不乏噐甲漸足臣官職又超衆人所願竭力報國他日史官紀中興名将書臣功第一上曰卿不可徒為空言當見之行事八月戊寅朔上以語宰執於是朱勝非等皆知上馭将得其道因言而誨誘之也庚辰御劄以叅知政事趙鼎為知樞宻院事川陜宣撫處置使朱勝非閒居録曰勝非在告執政詣勝非問疾鼎曰今川陜兵柄皆屬呉玠大帥無他能制玠足矣玠見為宣撫副使若官與之同豈可制乎勝非曰公以元樞出使豈論宣撫耶鼎曰須得一使名在宣撫上者乃可勝非曰偶疾不能造朝公難自言即同官可能也時鼎除命既出諸名士争願從之權吏部侍郎胡交修言近詔六漕細務令長貳有條者以條决之無條者以例决之無條例者酌情裁决夫以例决事吏部最多若旋檢例吏得為姦欲七司各編為例冊令法司掌以偹檢從之先是侍御史魏矼論兩淮屯田事上謂宰執曰招集流離使各安田畝最為今日急務因舉鴻鴈美宣王詩謂中興之業寔在於此胡松年曰朝廷行屯田累年惟荆南觧潜略措置其餘皆虛文無實效上曰然松年復曰漢宣之治總核名實而已天下事若因名以責實無不治者如屯田尤不可欺一嵗耕墾幾何收穫幾何便足以考上曰卿等可條上當力行之癸未朱勝非上屯田利害言今日之兵既令執兵又令服田終嵗勤勞所得如故有未可者上曰古者三時務農一時講武農即兵也兵農之制一分恐不可復合勝非所陳甚善可即行之孟庾等曰自此兵日以衆食日以廣饋餉不易更容臣等與勝非熟議上謂宰執曰素聞岳飛行軍有律未知能破敵如此胡松年曰惟其有律所以能破敵也乃降詔奨之且促飛第賞将士趙鼎曰陛下激勵如此其誰不勸尋除飛清逺軍節度湖北制置使既而飛奏辟盧宗訓者知徳安府侍御史魏矼言飛新立功朝廷當成就其羙不宜徙輕儇之徒為其屬郡昔郭子儀以奏請不行謂為人主所厚願以臣章示諸将因此事幾以善其後宗訓之命遂寝魏矼請遴羣才隨宜器使乙酉上謂宰執曰朝廷當為官擇人不可為人擇官矼論隨宜器使矼得用人之道孟庾曰誠如聖諭胡松年指疏中語曰朝廷用人誠能毋分朋類毋徇愛憎則至公之道行矣天下幸甚戊子執政奏事趙鼎曰臣今西行與呉玠為同事或當節制之耶上悟孟庾等言趙鼎除使名與王似等同乞自睿㫖易之乃除鼎都督川陜諸軍事既而鼎又奏荆襄乃四川後門遂并領荆襄諸軍趙鼎事實曰是時當國者不可否事事多不决吏縁為姦毎鼎受状之日人皆駢集由是見忌初上即位以御營使専總軍政其後併歸樞宻院宰相得兼領至是言者論其失乞令叅知政事通知其事上以為然言者又謂當國者不知兵意專以屬鼎也於是忌者益切至除知樞宻院事川陜宣撫使皆忌者之説也鼎留身辭以非才上曰行朝之事朕自主之宰相茍非其人自有臺諫四川全盛半天下之地盡以付卿卿以便宜黜陟専之可也是時呉玠已除宣撫副使鼎奏曰臣之此行與呉玠為同事或當節制之上悟遂除都督川陜諸軍事鼎又奏曰荆襄四川後門勢須兼領上以為然遂兼都督川陜荆襄諸軍命下之日識者相謂曰只此一著已自過人逺甚也上曰朕於大臣未嘗不進之以禮退之以道遂舉清人刺文公詩以為危國亡師之本在所深戒也胡松年曰陛下於鼎可謂任之専責之重矣朱勝非閒居録曰時勝非起復居位已累章丐持餘服鼎窺宰席甚急被命殊不樂申請數十條皆不可行如隨軍錢物須七百萬緡之類勝非叅告進呈指此一項奏言臣昔聞玉音趙鼎出使如張浚故事浚自建康赴蜀朝廷給錢一百五十萬緡今鼎所需三倍以上今嵗郊恩所費不貲上曰奈何勝非曰欲支三百萬緡半出朝廷已如浚數半令所部諸路漕司應副上可之既退鼎詬怒云令我作乞兒入蜀耶於是鼎言陛下建炎中遣張浚出使川陜國勢百倍於今浚有補天浴日之功陛下有礪山帶河之誓居臣相信古今無二而終致物議以被竄逐夫䘮師失地浚則有之然未必如言者之甚也大抵專黜陟之典受不御之權則小人不安其分謂爵賞可以茍求一不如意便生觖望是時蜀士至於醵金募人詣闕訟之以無為有何以自明故有志之士欲為國立事者毎以浚為戒且浚有罪臺諫論之可也人主誅之亦無憾也今乃下至草澤行伍凢有求於浚而不得者人人投牒醜詆及其母妻甚者指為䟦扈抑何甚哉今臣無浚之功當此重責去朝廷逺恐好惡是非行復紛紛於聰明之下矣伏望睿鍳憫臣孤忠使得展布四體少寛陛下西顧之憂鼎又言臣隨行兵除王進外取於宻院及諸處纔二千人而强壮者曾無數百又錢帛各依張浚例初乞錢百萬止得五十萬度牒二萬止得三千再乞得萬八千又乞始足元數臣日侍宸扆所陳已艱如此况在萬里之外惟望睿斷不為羣議所移臣實萬幸趙鼎事實曰自鼎入叅常與諸将論防秋大計獨張浚曰避将何之惟向前一歩庻可脱當裂天下兵守平江俟敵退徐為之計鼎曰公言避非䇿是也以天下兵守一州之地非也公但堅向前之議足矣鼎蓋隂有所處故毎日留身必陳用兵大計上意已悟又使浚宻為之助至是决意親征留鼎不遣入蜀以鼎久有此議故也鼎以浚為助者乃㓂萊公約高瓊之意蓋統兵官不與之同謀事必參差則鼎之䇿逺矣初金左右副元帥尼瑪哈烏克紳居雲中是夏始入見金主晟而烏珠自川口敗回燕山亦約鄂勒琿同覲至是劉豫遣人乞兵同入㓂晟議於諸帥尼瑪哈烏克紳沮之惟鄂勒渾請行晟遂以鄂勒渾權左副元帥達喇權右副元帥将兵應豫又以烏珠先嘗過江知地險易使之為前鋒於是劉豫下書偽境略云朕受命數年治頗有叙永惟呉越巴蜀江湖嶺海皆元議一統之地重念生民久困不忍用兵故為請於大金欲割地封之使永保趙氏之祀豈圖蔑棄大徳乃敢偽遣使聘宻圖吞噬先刼汝潁次掠襄鄧至有收復燕雲之謀是用遣皇子諸路大總管左丞相麟領東南行臺尚書令㑹大金元帥大軍直擣僣壘務使六合混一其吠堯之辭悖逆如此先是湖北制置使岳飛令統制官王萬辛太駐清水河以掩敵太不聽命擅歸荆南而鎮撫使解潜不即遣太反妄申太先復襄皆為飛所劾丙申詔太特貸命除名令自効戊戍詔於臨安府餘杭縣置孶生牧馬監是日以資政殿學士川陜宣撫使王似知成都府是月以宗正少卿范冲中書檢正官虞澐並為左右史而侍御史魏矼言二人乃執政趙鼎胡松年親黨皆罷之先是侍御史魏矼薦武臣崔謹習王宏癸卯樞宻院擬二人差遣上曰臺臣為朕耳目之官職在彈擊官邪若因而論薦人材竊慮私有好惡二人且令籍記他日量材選用朱勝非曰陛下英斷非臣等所能仰窺萬一荆南制置使王􅊛下統制官常概屯鼎州城外
