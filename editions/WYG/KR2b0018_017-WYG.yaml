body:
  text: 中興小紀卷十七宋熊克撰紹興四年九月淮東宣撫使韓世忠奏以遣使議和非便欲進兵恢復乙夘上謂宰執曰世忠為國之心甚切可諭以二聖在逺當遣使通問丁夘合祀天地於明堂以太祖太宗並配大赦天下庚午詔朱勝非聽持餘服候服闋以為觀文殿大學士提舉洞霄宮癸酉知樞宻院都督川陕荆㐮諸軍趙鼎為右僕射平章事兼知樞宻院事趙鼎事實曰鼎奏禀朝辭上曰卿豈可逺去當相卿付以今日大計時獨給事中孫近直學士院時傳鎻院莫知為誰諸侍從謀於近日今晚必命相公當草制幸宻報彷彿以解我憂近入院諸人聚於沈與求之家近宻報取樞府細位諸人喜而散明日拜鼎右相朝士相慶甲戌劉豫遣其子麟姪猊引金右副元帥鄂勒琿等自淮陽分道入攻舟師由清河據楚州進攻承州騎兵渡淮據滁州探者未得其實以為敵勢甚少趙鼎曰金前侵我境乃入敵國即仇也故縱兵四掠其鋒可畏今行豫境即官軍也故按隊徐行不行虚聲然亦不足深畏趙鼎事實曰劉光世宻遣屬官告鼎云相公本入蜀有警乃留何故與他負許大事韓世忠亦謂人曰趙丞相真敢為者胡不將官家入福建穏處坐江上之事付之我輩或不可則少避之俟春首敵退徐議何害鼎聞諸將之論如此恐上意移動復乘間言今日之勢若敵兵渡江恐其别有措置不如向時尚有復振之理戰固危道有敗亦有成不猶愈於退而必亡者乎且金偽俱來以吾事力對之誠為不侔然漢敗王尋晉破苻堅特在人心而已自降詔親征士皆鼓勇陛下養兵十年用之正在今日由是浮言不能入矣淮東宣撫使韓世忠時在承州以援兵未至退保鎮江府冬十月丙子江東宣撫使劉光世軍在馬家渡淮西宣撫使張俊軍在采石遂詔光世以所部兵援世忠且令俊移軍於建康而三大將事權相敵兼持私隙莫肯協心上詔侍御史魏矼監察御史田如鼇分徃如鼇大庾人也矼至光世軍中諭之曰敵衆我寡合力猶懼不支况軍自為心將何以戰為諸公計當滅怨隙不獨可以報國身亦有利光世意許矼因勸之貽書二帥以示無他使為犄角已而二帥皆復書交致其情光世遂以書奏於上於是光世進軍屯太平州己卯淮東宣撫使韓世忠復統兵過江駐於揚州上將親征詔略曰朕以兩宫萬里一别九年覬迎鑾輅之還期盡庭闈之奉卑辭厚幣遣使請和比得敵疆之情稍有休兵之議而叛臣劉豫懼禍及身造為事端間諜和好信逆雛之狂悖率羣偷而陸梁警奏既聞神人共憤誓挺身而效死不與敵以俱生今朕此行士氣百倍殪彼逆黨成此雋功咨爾六軍咸知朕意自豫僭前此至以大齊名之及是始正其逆罪詔既下人皆鼓勇而朝士中尚有懷疑者或謂趙鼎曰兹事甚大公更審處無貽後悔鼎不答既而侍從及臺諌同日請對翼日宰執奏事退鼎復奏曰今日侍從臺諌皆對必及親征事願勿為羣議所移上意益堅而殿中侍御史張致逺亦言今敵人敢大入謂我猶如向來不習戰爾若戎輅親征必伐敵謀上曰正朕志也初知鎮江府沈晦過闕論藩帥之兵可用以為唐中年平安史用朔方太原兩軍末年平黄巢用忠武大同兩軍今沿江千餘里若令鎮江建康太平池鄂五處各有兵一二萬用本郡財賦回易官田給之敵至五郡以舟師守江陸軍守隘彼難自渡五郡合擊金雖善戰不能一日破諸城也若圍五郡則兵分而勢弱或以偏師綴我大軍南下則五郡尾襲而邀擊金人安敢逺去頃歲金人敢越中山河間正以兵少若太原則不敢南踰一歩此制稍定三年移軍江北糧餉器械悉皆自隨所至便成全盛晦又言大將與帥臣各有所職若全倚大將恐不能辦近年杜充總大兵在建而帥臣陳邦光不與措置及充迎敵而邦光被縶以至周望去而湯東野逃郭仲荀去而李鄴降皆坐此也望撥零兵二千付臣併令臣募敢戰之士三千參用昭義歩兵之法朞年後京口便成强藩况東晉常調京口兵可用故北府兵號為最精唐亦用宣潤弩手平淮甸時方以韓世忠屯軍在府其言不用至是晦乞趣張俊統兵為世忠之援宰執皆稱晦論議激昻上曰朕知其為人語甚壯膽志頗怯更㸔臨事能副所言否沈與求曰陛下用人如此則無失矣時趙鼎孟庾胡松年共薦前樞宻副都承㫖馬擴有才中因苗傅事得罪乞復試用擴亦請自將三千捍敵上曰齊小白猶能忘射鈎之讐而用管仲朕豈不能用擴然既用之止與三千人非是俟引見示以恩信然後用之彼必能效死以報鼎曰陛下開大度用人如此天下幸甚沈與求曰陛下御將如此何事不濟既而引擴見復除樞宻副都承㫖鼎又曰陛下用人如此何患不得其死力上曰擴知兵有謀不止於鬭智而已與求曰陛下起擴之廢寵以美官必能立功以報陛下雖漢祖善將不過如此除擴在此月戊子今聨書之直史館范冲録其父祖禹紹聖初報國史院問目以進又具到朱墨本去取體式乞降付史館更憑衆議修定壬午詔送史館初知建康府吕祉言今置江北於度外非朝廷命帥宣撫兩淮之意且乞上親征至是江上探報惟祉最為詳宻趙鼎言祉慷慨敢為此等人材實不易得上曰祉真有方面之才朕留意人物欲其協濟多難如知鄂州劉洪道初縁吕頤浩薦而所對多誕謾不實雖有麄材何所用之沈與求曰洪道知明州脱身先遁一城之民盡殪於賊至今人怨癸未詔鄂乃上流宜别擇守臣詔僉書樞宻院胡松年徃鎮江與諸將㑹議進兵因以覘賊淮東宣撫使韓世忠奏乞過江拒敵戊子上謂宰執曰世忠忠勇必能成功可令戸部支銀絹犒賞過江將士以激其心沈與求曰自敵騎蹂踐中原未嘗有與之戰者今諸將争先用命此成功之秋也既而世忠又奏見在揚州適霖雨未能進而恐朝廷訝成功之遲上曰兵事豈可遙制趙鼎曰軍事不從中覆古之制也乃詔世忠聽機制變甲午戸部侍郎梁汝嘉言每月經費一百餘萬緡兼調發所用倍多請權以江浙夏税及和買十分折納五分二分折四緡三分折六緡其紬則皆折納二分折四緡八分折八緡令轉運司計綱輸送從之淮西宣撫使劉光世探到劉豫事丙申積雨餘月戊戌上發臨安隂雲頓開軍容甚整都人欣歎以謂靖康以來未有是舉上登御舟至臨平鎮宰執奏事趙鼎曰臣等扈駕登舟見道傍觀者皆流涕以手加額葢陛下以萬乘之尊親總師徒履至險之地茍心懷愛君莫不憂此臣待罪揆路不寒而慄非不欲被堅執鋭率衆摧鋒而書生不閑戰鬭又府庫無儲闗津無備隨宜經理倉卒取辦必有過差願陛下収衆智降哀痛之詔捐内帑金以賞激士氣庶可成功此在睿斷勉之而已韓世忠總兵駐揚州時奉使魏良臣過揚世忠置酒與别杯一再行流星庚牌沓至良臣問故世忠曰有詔移軍守江乃命徹爨班師良臣去世忠度其已出境乃上馬令軍中曰視吾鞭所嚮於是諸軍大集行至大儀鎮勒精兵為伍陣設伏二十餘處戒聞鼓聲則起而擊之良臣至金軍金問我軍動息良臣以所見對大帥烏珠喜甚勵兵趨江口距大儀五里其將貝勒托卜嘉原作孛堇撻不也今改正下同擁鐵騎過吾軍之東世忠傳小麾鳴鼓伏者四起吾軍旗與敵旗雜出敵軍亂弓力無所施而我師伍伍迭進背嵬軍各持長斧上揕人胸下捎馬足金全裝䧟泥淖中人馬俱斃遂擒貝勒托卜嘉烏珠走還泗上召良臣責其賣已將殺之良臣好辭得免世忠提舉官董旻與金戰於天長軍又統制官解元成閔與戰於承州皆敗之擒生女真百餘人遣屬官建楊陳桷與旻等具舟載之獻於行在且言使人戰沒者三十餘人壬寅上至平江府復下詔略曰朕急父兄之難申子弟之情師行有名天其助順將臨江滸已次呉門言念幅員之間共離戎馬之禍使汝等邱墓隔絶骨肉散亡罪實在予一人毒乃流於四海咨爾將士勿顧便安宜各奮揚共圖恢復宰執奏建炎初黄濳善汪伯彦擅權專殺將布衣陳東歐陽徹寘之極典上曰朕初即位聽用非人至今痛恨之乃各贈秘閣修撰官其兩子賜田十頃趙鼎曰輔相非人致陛下責躬自咎如此誠為盛德濳善伯彦誤國之罪天下皆知此安可誣也是月以徽猷閣直學士樞宻都承㫖章誼為戸部尚書十一月丙午朔上御平江府行宫時沿江既有備商賈徃來自如通泰出納鹽貨如故上見士氣大振㨗音日聞欲渡江與敵决戰趙鼎曰退即不可渡江非䇿也金兵逺來利於速戰豈可與之争鋒兵家以氣為主三鼓即衰矣姑守江使不得渡徐觀其勢以决萬全且豫猶不親臨止遣其子豈可煩至尊與逆雛决勝負哉於是遣參知政事沈與求按行江上與諸將議可否始知敵騎大集其數甚衆與求回言沿江居民旋造屋為肆敵雖對岸略不畏之此據趙鼎事實修入不得其時實言久之張浚來自閩中則知此事在浚未至之前也時承楚泰三州各有水寨民兵合力撃敵庚戌上謂宰執曰淮民不能安業今又遭敵騎乃力奮忠義不忘國家實我祖宗涵養之力宜與放十年租税仍撥錢米助之趙鼎曰陛下德澤如此人心益固國祚益長矣辛亥上命申嚴宻事之禁仍詔漏泄邊機處以軍法殿中侍御史張致逺奏乞省罷營葺以繫軍民之心壬子詔除軍兵營寨外令孫佑不得應副佑北海人時知平江府上因謂宰執曰臺諫規戒朕所樂聞常恐言者無以補助昨致逺又奏御舟不計其數可速行機察朕隨行惟三十餘舟皆載書籍此外無一玩好趙鼎曰監司郡守之官猶巨艦相銜數里陛下簡約如此實帝王盛徳事也上曰朕初到平江孫佑所供進饍桌子極弊朕念往日艱難雖居處隘陋飲食菲薄亦所甘心若邊境已清郡邑既定迎還二聖再安九廟帝王之尊固在鼎等曰陛下規模宏逺如此太平基業指日可期天下幸甚川陜宣撫副使呉玠奏臣之功乃張浚劉子羽知臣而薦用之今蒙異數望追成命而於浚子羽少寛典刑上曰進退大臣斷自朕志豈可由將帥之言况朕於浚既罰其過詎忘其功癸丑詔子羽自便士大夫以此多玠之義先是趙鼎薦提舉洞霄宫福州居住張浚可當大事顧今執政無如浚者陛下若不終棄必於此時用之乃詔浚復資政殿學士提舉萬壽觀兼侍讀喻樗語録曰樗先受趙鼎辟為川陜都督府屬官既罷行因過平江見鼎曰相公之舉未知果有萬全之計或賭采一擲也鼎曰亦安保萬全事成幸甚不然遺臭萬代矣樗曰今若直前有如頭重不可却也要須有後門鼎曰有則善矣樗曰張樞宻在福今只召之恐逡巡未至若直除閩浙江淮宣撫使不許辭免則命到之日便有官府軍旅錢糧樞宻來路即我之後門也鼎大以為然明日入奏久之上曰且在經筵亦可己未浚至復以為知樞宻院事浚見鼎曰此行舉措甚當既又聞鼎諫上渡江决戰之行亦深歎服朱勝非閒居録曰時敵侵淮泗朝廷震恐宰相趙鼎嘗失身於偽楚初無敢薦者而浚獨薦為言事官鼎徳之至是乘急變召浚復秉樞機趙鼎遺事曰時中外震恐朝廷方難其人鼎力薦張浚可以當之上問浚方略如何鼎曰浚鋭於功名而得衆心可以獨任上即日除知樞宻院鼎曰陛下幸聽臣言驟用浚恐臺諫未悉必至交攻非陛下斷自宸衷無以息衆議上為親書詔刋石也觀文殿學士提舉崇福宫李綱陳禦賊之䇿大略謂偽齊悉兵南下其境内必虚宜擣潁昌出其不意則必還以自救此為上䇿召上流之兵沿江而下以助軍勢此為中䇿萬一借親征之名為順動之計此下䇿也上曰綱去國數年無一字及朝廷今豈非以朕總師親臨大江合綱之意乎辛酉降詔奬之戊辰趙鼎言張孝純李鄴子弟復在近僚可見陛下徳意乞降詔示從偽之臣他日來歸亦不加罪上曰中原陷沒致士大夫不幸汙於僣逆皆朕之過朕備嘗艱難不忘恢復葢欲拯之塗炭咸與惟新要使人人知朕此意僉書樞宻院胡松年曰禹湯罪已其興勃焉臣知中興有期矣右司諌趙霈言乞今有司具一歲錢榖出入之數以節浮費辛巳上謂宰執曰霈此疏極闗治體纔過防秋便可行之胡松年曰使論事之臣皆如此何患不能協濟正恐敵騎既退國家蹔安虚文細務又復出矣上曰趙鼎記此可以為戒知樞宻院事張浚徃江上視師趙鼎事實曰浚在江上時敵在滁上造舟已有渡江之耗鼎宻陳今日之舉雖天人咸助然自古用兵不能保其必勝計當先定事至即應之庻不倉猝萬一敵渡江即再降指揮方始謂之親征陛下當親總衛士直趨常潤督諸軍乘其未畢辦併力血戰未必不勝或遏不住則駕由他道復歸臨安留兵堅守呉江金亦安能深入臣與張浚分糾諸將或腰截或尾襲各據地利時出擾之必不使之自肆如前日也惟不可聞渡江便退即諸將各自為謀天下事不再集矣三衙楊沂中呉錫見鼎言探報如此駕莫須動鼎曰俟敵已渡方遣二君率兵趨常潤合諸將併力一戰以决存亡他無術也二人同聲曰相公可謂大膽鼎曰事已到此不得不然二公隨駕之親兵也緩急正賴為用豈可先出此言二人懼而退朝論謂鼎勸上親征固難而此事不動尤為難也奉使魏良臣等自金回張浚遇之問以金事及大帥之語良臣謂金有長平之衆且出大言謂當割建州以南王爾家為小國索銀絹犒軍其數千萬仍約良臣等再徃浚宻奏不可十二月乙亥朔良臣等至平江府侍御史魏矼亦言當罷講和二字以攻守代之飭勵諸將力圖外禦遂不復遣朱勝非閒居録曰初秦檜自京城隨金人北去為彼大帥達蘭任用至是達蘭統兵侵淮甸朝廷遣魏良臣王繪奉使至其軍數問檜且稱其賢逮檜再相力薦良臣為都司繼除從官欲彌其言耳魏良臣進奉使語録言金人比至天長縣得親筆手詔墨本謂良臣曰恤民如此民心安得不歸丁丑上謂宰執曰向下詔丁寧欲刑無寃爾胡松年曰臣伏覩詔書載小大之獄雖不能察必以其情忠之屬也可以一戰使敵人讀至此能無懼乎張浚奏以樞宻副都承㫖馬擴為沿江制置使軍於鎮江府且令湖南制置大使席益撥統制官崔邦弼等軍赴擴益不從詔落其職淮西宣撫使劉光世奏統制官王徳獲偽官朱從己卯上語宰執欲釋之既而曰先軫有言武夫力而拘諸原婦人蹔而免諸國墮軍實而長冦讐亡無日矣諸將方與敵人對壘今獻俘輙釋之恐其意怠勿殺可也趙鼎曰此皆吾民誠不必殺乙酉宰執薦進士王蘋賜出身除正字上曰蘋起草茅而議論若素官於朝大抵儒者不能通世務所謂腐儒胡松年曰治天下安用腐儒上曰然蘋侯官人也庚寅上因論十二夜太隂犯昴宿有司以為敵滅之象胡松年曰天象如此中興可期上曰范蠡有言天應至矣人事未盡也趙鼎曰正當修人事以應之辛卯上謂宰執曰韓世忠近進鱘魚鮓朕戒之曰艱難之際不厭菲食卿當立功報朕而貢口味非愛君之實也已却之沈與求曰陛下示以好惡如此諸將敢不用命世忠能擒劉豫父子羈致行闕誅之而分醢於諸侯此乃足以報陛下也乙未川陜宣撫副使呉玠奏夏國主數通書不㤀本朝之意又府州折可求族屬列状申玠見訓練士馬俟玠出師渡河當為内援以擊敵戊戌上謂宰執曰此祖宗在天之靈扶祐所致亦見人心憤北敵也知樞宻院張浚至鎮江府召大帥韓世忠劉光世張浚與議且勞其軍既部分諸將乃留鎮江以節制之於是世忠與金帥烏珠書謂張樞宻已在此矣浚因奏捍禦次第且言相持既久恐有别生姦計已與諸將議凡可以克敵者無不為也上曰浚措置如此金必不能遽為衝突參知政事沈與求曰晉元帝時石勒冦壽春相持三月晉臣至有勸降勒者王導拒之金今逺來久相持非其利也上曰朕得浚何愧王導先是太史言來嵗正月朔日當蝕侍御史魏矼請下有司講求故事上曰春秋日蝕必書謹天戒也己亥乃詔百職各為朕講求所以消變弭災者辛丑金人之衆屯於竹墩㑹雨雪乏糧又聞上親征而其主晟病篤萬户韓常勸烏珠曰士無鬬志茍强驅之過江必多叛者况吾君疾篤内或有故惟速歸為善烏珠聽之聞於諸寨一夕遁去方遣人馳諭劉麟劉猊倉皇棄輜重北走麟既歸乃率偽官上言略曰以中原制江表强弱之勢何啻得百二之利故自古王者興起必於河北山東之地然後為真若乃崛起及遁居呉越之㑹計其强者能自保一隅有不道則中原之兵已進而墟其國者非一也於是豫以其言曉示偽境初親征詔未至廬州衆譁然棄淮保江知府仇悆得詔急録以示人皆思奮且遣其子間道告急上命以官及敵進據壽春悆率兵出奇直抵城下敵戰敗欲走渡淮是月金增兵復來悆盡發戍軍千人拒之無一還者遂求救於京西制置使岳飛飛遣統制官牛臯及愛将徐慶以二千餘騎造廬既見悆坐未定金驅甲騎五千且破城矣臯與慶以從騎出城遥謂金人曰牛臯在此爾軰胡為見陵乃展幟示之金衆愕然臯舞袖徑前敵疑有伏即奔潰臯率騎追之金兵自相踐死餘皆遁去或問趙鼎敵何以遽遁鼎曰敵衆雖盛特因劉豫邀請而至既非本心當擇利乃進故不如前日之亡命也是嵗道君在五國城一日諭王若冲曰一自北遷於今八年所履風俗異事多矣深欲著録未有其人詢之蔡鞗以謂文學無如卿者髙居東山躬稼之餘為予記之善惡必書不可隠晦将為後世之戒道君謙虚待下隨行羣臣不以大小未嘗呼名每有使令則温顔諭之
