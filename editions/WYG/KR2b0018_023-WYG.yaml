body:
  text: 中興小紀卷二十三宋熊克撰紹興七年冬十月中丞周祕殿中侍御史石公揆右正言李誼論張浚不已丙申夜御批浚謫散官安置嶺表趙鼎雜記曰是月初鼎奏欲降一詔以安淮西軍民上曰當以罪已之意播告天下俟行遣張浚了降詔鼎曰浚已落職上曰浚誤朕極多理宜逺竄鼎曰浚母老且有勤王大功上曰勤王固已賞之為相也功過自不相掩十月七日夜内降周祕等彈章後批浚授散官安置嶺表中書舊制凡御批即時行岀至是鼎封起未即行明日鼎奏曰前日趙令袊之言外頗傳播謂以浚之岀皆諸將之意今又如此行外間益疑矣上曰若宰相岀入由於諸將即唐末五代之風今幸未至此鼎曰今謫浚雖非諸將之言亦少快諸將之意矣上曰此不恤也又趙鼎事實曰一日御批張浚謫散官安置嶺表鼎時留未行翼日至漏舍約諸人救解至榻前二參泛泛為言秦檜曰前日臣等不敢言今日却合言然無他語也上顧而不答鼎開陳至數百言上意殊未回鼎又曰浚有母老今過嶺必不能將母浚有勤王功陛下忍使其子母為死别乎上猶未解鼎又曰浚所犯不過公罪恐不應如此上乃曰來日再將上商量鼎又留身再懇曰浚之罪不過失䇿爾凡人計慮豈不欲萬全儻因其一失便寘之死地後雖有竒謀妙算誰敢獻之此事利害自關朝廷非獨私浚也上意解遂令分司居永州趙鼎逸事曰鼎一日朝退召禮刑工部郎官勾龍如淵馮康國及馮檝至都堂三人皆蜀士張浚之客也見鼎踧踖退縮鼎慰之曰鼎不負徳逺徳逺負鼎三人愧謝鼎曰上憐徳逺母老有復辟功決不逺謫無過嶺之患諸公速以書報上意三人退鼎又目之曰鼎不負徳逺徳逺負鼎既而除如淵起居郎康國右司郎官檝太常少卿如淵永康人也左司諫縉求外補除直祕閣知溫州於是石公揆言縉懷姦顧望且有後圖望禠職還之銓曹丁酉詔落職與宫觀上在禁宫自有日課早朝退即閲章疏食後學書未後讀春秋史記晚食閲内外奏牘夜讀尚書率以二鼓罷是日因前給事中胡安國乞宫祠左僕射趙鼎言安國昨進春秋解必經聖覽上曰安國所解朕置之座右朕喜春秋之學率二十四日讀一過鼎曰陛下聖學如此今雖寒士亦鮮能之非異代帝王所及戊戍張浚責授秘書少監分司南京永州居住都官郎中馮康國求去庚子趙鼎言自張浚之罷蜀士多不自安今留者十餘人皆一時選臣恐臺諫或以浚里黨論之望陛下垂察上曰朝廷用人正當論才不才頃臺諫好以朋黨罪之如罷一相則凡所薦不問才否一時俱黜此乃朝廷使之為朋黨非所以惜人才厚風俗也鼎曰陛下聖慮如此羣臣敢不自竭御史中丞周祕累乞外任辛丑除徽猷閣直學士知秀州先是淮東宣撫使韓世忠圖上淮東形勢云賊於彼築堡欲遣偏師平之使其屬官溫濟諗於朝上戒濟曰歸語汝帥當岀萬全不宜輕動以貽後悔濟既禀命復要他日將士之賞上曰有功則賞但須覆實然後有功者勸世忠既以狀來上朝廷不欲違如去年攻淮陽賞一萬七千餘人人不以為當也濟悚懼奉詔而退癸卯左僕射趙鼎奏濟已行上曰昨呼來畧戒之矣權主管殿前司楊沂中乞以諸路所起弓弩手揀刺上四軍辛亥趙鼎因論及南兵可教參知政事張守曰止是格尺不及爾上曰人猶馬也馬之能行不在大故兵無南北顧所以用之如何爾自春秋時申公巫臣通吳于上國遂霸諸侯項羽以江東子弟八千横行天下以至周瑜之敗曹操謝元之破苻堅皆南兵也趙鼎言士人有不可為郡守而必欲得之者往往不肯就宫祠上曰爾則不肯其如一方赤子何鼎退而歎曰大哉帝王之言也時有進士劉瑜上書乙卯上謂宰執曰瑜論十事皆民間疾苦可擇而行之趙鼎曰所論皆善然法已具但當申嚴上曰申嚴未必濟事須去其不便於民者為善如向來浙右因於水脚錢後造成綱船遂免此患右正言李誼奏昨扈從臣寮不多止令輪對一次今已輪徧數月矣望凖建隆天聖故事日輪二員俟百官俱集則依舊例丁巳詔遇六參日日輪一員時趙鼎再相已逾月未見所施朝士或以此責之鼎曰今日事如久病虛弱之人再有所傷元氣必耗惟當靜以鎭之若大作措置煥然一新此速死之術也張徳逺非不欲有為而其效如此亦足以為戒矣召徽猷閣待制提舉太平觀常同為禮部侍郎時趙鼎所薦者皆以次用之閏十月庚申資政殿學士王綯卒于平江府先是詔知廣州連南夫條市舶之弊辛酉南夫言市舶司惟藉蕃商往來貿易大商蒲亞里者昨至廣州有武臣曹訥利其財以女適之亞里遂留不歸上因令南夫勸其歸國運蕃貨往來上曰市舶之利最厚若措置合宜所得動以萬計豈不勝取之于民朕以留意於此庶幾可以少寛民力爾癸亥上曰朕每論將帥須責其挽弓騎馬人未知朕意必謂古有文能附衆武能威敵不在弓馬之間抑不知不能弓馬何以親臨行陣而率三軍使之赴難況今時艱將帥宜先士卒此朕之深意也上數令江東宣撫使張俊盡以舟師分布控扼然後引兵渡江左僕射趙鼎曰淮西寂然無警似不必爾外間便謂朝廷棄淮西矣當一向勿顧不發一兵彼未必敢動上以為然趙鼎事實曰初劉預軍既遁張俊復還建康淮西一帶無軍馬朝論紛紛臺諫交章以為淮西無傋可憂鼎獨顯言於衆曰今行朝握精兵十餘萬使敵騎直臨江岸吾無所懼唯是安靜不動使人罔測渠未必輙敢窺伺何至自擾擾如此儻有他虞吾當身任其責俊軍久在泗上勞役良苦還未閲月居處種種未定乃遽使之復出不保其無潰亂也鼎欲使俊岀不意徑趨壽春取其城措置已定㑹金人廢豫乃以淮上卒不遣兵竟以無事上御諸將凡事皆留意而聖意無彼此輕重時殿前楊沂中乞三綱馬丙寅上謂宰執曰川廣馬到朕未嘗留悉均給諸將若小不均即謂朕有偏矣沂中馬少而張浚近以老馬數百匹納樞密院遂以兩綱付沂中一綱付俊已卯龍圖閣學士知處州劉大中為禮部尚書庚辰趙鼎奏淮東安撫使韓世忠保明統制官許世安功賞事上曰世安勇雖不如呼延通而曉事過之平居議論多有補于世忠時通亦𨽻世忠軍上駕馭諸將至于偏禆亦知其材之所長蓋照臨無遺如此戸部尚書章誼言自𣙜貨務復置提舉官見係臣獨領縁無同官商議竊恐誤事望仍𨽻戸部壬午詔從之時𣙜貨務賣度牒而逺方不能就買宰執欲付之諸路上曰如此則州縣將苛於民矣趙鼎等曰不限以數則無此弊上曰宜嚴為約束毋使民受患初江西大旱而觀文殿大學士知洪州李綱乃課民修城一方頗怨至是侍御史石公揆言綱妄自尊大恣為苛擾初張浚謫居于福綱與之交驩意其復用以為已援近乃移書痛詆傳至行在欲以取譽復冀相位繼知已用趙鼎其意大沮又稱感時憂憤成疾聞者笑之又殿中侍御史金安節左右正言辛次膺李誼亦論綱違法虐民毒流一路乞再詔綱提舉洞霄宫既而公揆等再論乞鐫職上曰前宰執朕所禮貌已罷帥足矣趙鼎等曰陛下遇臣如此誰敢不竭心圖報安節歙縣人次膺掖縣人也是日宰執奏復置川陜茶馬舊有主管有同提舉有都大提舉凡三等上曰此轉運副使判官之比當擇人考其資厯而命之茶本以博馬而近乃珠玉紅髪之類須禁止之趙鼎奏來春去留之計望更留聖慮恐回蹕之後中外謂朝廷無意恢復上曰張浚措置三年竭民力耗國用何嘗得尺寸之地而壞事多矣此等議論不足䘏也趙鼎因奏事論及修神宗實録上曰止修訛謬非有所改也鼎曰所降御筆如此上曰乃宰相擬定者鼎曰起居注載著作郎張嵲所得聖語亦然上駭曰安得有此即詔嵲所記勿存留鼎乃知是事本非上意鼎言何掄本與祕閣修撰曽統所進本小異掄乃蜀本有朱字處統本却無之自合重修其李彌正胡聖不應引嫌避史職令依舊兼之上曰朱勾去者太冗鼎曰此乃羙事蔡卞輩不學故不知去取如吳奎傳載有曰臣願陛下為堯舜主不願為唐徳宗卞乃删去臣謂主聖則臣直載之乃見神宗之聖也使魏徴王珪傳不載其直言則後世不知太宗納諫也上曰然鼎又曰臣自去國半載今觀聖意稍異前日上曰尋常造膝每以孝悌之説相揺撼其實紹述之謀也鼎曰莫有正論否上曰無之自卿去惟朱震不改其舊鼎曰臣觀持中論者皆惑聖聽乃是沮善之術故以為不可太分當兼收而用則得人之路廣臣謂君子小人並進何以為治與其多得小人寧若少得君子之為愈也蓋分善惡惟恐不嚴稍寛則落其姦便君子於小人常恕小人於君子不恕也上復以為然是月工部尚書李彌大岀為廣西安撫使初淮西軍中諸使臣為酈瓊刦去至是復歸者甚衆有司以文劵不明例降所給趙鼎與執政議不合乃密白于上曰此曹去偽歸正當優假之今乃降其所請反使悽悽有不足之嘆上即批岀各還其本於是人心忻然來者相繼劉豫不得而防之也江東宣撫使張俊引兵還建康府十一月甲午俊入對因言劉光世解軍政閑居自適有登仙之歎上不樂因諭之曰卿初見朕時何官曰修武郎是時貲如何曰貧甚嘗從陛下求戰袍以禦寒上曰今日貴極富溢何所自耶曰皆陛下所賜上曰卿既知此宜思自効而有羡於光世何耶俊惶懼蝢首至於流涕誓死以報乙未宰執奏事上以此語之趙鼎等曰陛下御將之道可謂盡矣丁酉宰執奏臨安府火禁放火者行軍法遺火延燒數多者亦如之上曰放火遺火豈可同罪大凡立法太重往往不能行趙鼎曰遺火延燒者取㫖可也上曰止於徒足矣庶可以必行兼刑罰太重非朝廷美事先是川陜宣撫使吳玠遣使臣吕政來求軍中犒賞上諭政曰歸語吳玠自小官㧞擢至此皆岀於朕非縁張浚也大丈夫當自結主知何必附託人以進朕已撥一百五十萬緡非因浚進退有所厚薄也他所闕可具奏朕一一應副又諭以川茶自來博馬今聞盡易珠玉紅髪無用之物政曰吳玠則不敢諸將恐或有之上令博馬外不可别易一物是日上語宰執以此趙鼎等曰玠聞聖訓不惟感激眷遇亦仰服聖徳矣壬寅上謂宰執曰張俊臨事不易得獨好營土木朕數鐫諭莫能改也比因入對面諭以建康行宫皆因張浚所修寢殿之後雖庖溷皆無朕不免葺數間為居當與卿觀之初不施丹艧俊曰畧加雅飾不過三二千緡朕語以財方艱窘不忍費三二千緡以崇土木之飾俊感嘆而去有使臣李發者賫到奉使朱弁書報金國尼雅滿等相繼而死樞宻使秦檜曰金國多事勢須有變上曰金人暴虐不亡何待檜曰陛下但積徳中興固自有時上曰此固有時亦須有所施為然後可以得志金主亶欲廢劉豫久矣至是金尚書省劾豫治國無狀亶詔左右副元帥達蘭烏珠提兵以侵江為名徑之東京廢豫而豫方請兵入冦金示以難色而豫請愈堅金若不得已而應者乃令先調發山東兵㑹於淮上約其子麟以二百騎至濬滑間即為金所擒二帥徑引從騎入東華門逼豫入見達蘭以鞭麾命羸馬載之而去囚于金明池廢為蜀王時豫弟益守陜西金又别遣左監軍薩里罕提兵聲言攻蜀即長安擒益其廢豫之詔畧曰建爾一邦逮今八稔尚勤吾戍何以為國豫既廢達蘭逼其北行至上京給舊夫子廟以居之張浚行述曰浚嘗遣人賫手榜入偽地誘劉豫畧曰如能誘致金人使之疲敝精兵健馬漸次銷磨兹報國之良圖亦為臣之後效敵用事者見此榜以疑豫八月間豫聞王師北向遣韓元英告金乞兵同舉金謂豫終欲困已益疑之㑹酈瓊叛去浚復多遣間持蠟書入偽地故遺之大抵謂豫已相結約故遣瓊等降而豫再乞兵於金十月金副元帥烏珠徑領兵來廢豫惜其有此機㑹而浚已去位矣豫初僭位作楮幣自一貫至百貫皆識其末曰過八年不在行用蓋其數已兆矣金遂於汴京建行臺尚書省以張孝純蕭三寳努原作萧三寳奴今改正為左右丞相張通古為左丞又恐汴人不安曰汝舊主人少帝在此於是民心稍定而北軍亦不敢擾民豫之廢也汴京有錢九千八百餘萬緡絹二百七十餘萬匹金一百二十餘萬兩銀一千六百餘萬兩糧九十萬石而方物不在此數初達蘭久居山東回易屯田徧於諸郡每認山東以為己有其立豫也深有悔割山東之意故達蘭屢畵山東河北圖獻議于故主晟曰膏腴之地鹽鐵桑麻所出盡在舊河以南我初與議以河為界爾今新河且非我決彼自決之以與我豈可棄之當以新河為界晟不從及達蘭專權遂議取山東諸將曰若獨取山東恐驚豫之心不若廢豫以取之豫之廢也不惟結怨于諸帥亦以山東為累爾初薩里罕在雲中嘗因軍事召知府州折可求至密諭以將廢豫而立可求之意至是達蘭之意欲割河南以歸本朝薩里罕恐可求失望生變罪歸於已一日燕可求而寘毒可求食之既去卒于路初宣和間進士王問進書萬卷補承務郎上即位有越州布衣諸葛行仁亦因進書得廸功郎至是吏部以為不倫追問兩官斥之詔與改正中書舍人李彌遜以為不當改正丙午上謂宰執曰求遺書自美事朕方多難之時故行仁之賞薄宣和承平留意墳典授京秩不為過然既有論駮可鐫一官十二月己巳詔淮東宣撫使韓世忠移司鎭江府仍留兵守楚州樞密使秦檜曰老小既得所萬一有警諸帥當盡力捍敵上曰朕竭民膏血以養之緩急豈容不盡力正使無内顧之憂也於是世忠奏乞留全軍于楚以蔽江淮從之先是紹興初劉大中宣諭江南薦臨川布衣鄧名世召對賜岀身除删定官是月以名世為校書郎禮部侍郎常同請令大臣屛去細務專意帷幄之謀責任六曹随事裁决凡禮文及法令悉令裁定以趣簡便乙亥上謂宰執曰聞三省文書極繁卿等閲不暇給皆由六部官不任責事事申明故也豈有為尚書不能任一部之事朕若擢為執政便可裁天下之務昨常同亦奏此事陳與義曰今日事比承平時極多趙鼎曰承平時朝廷尊嚴上下有分昨一小使臣馬前喧呼臣恐其訴寃乃求差遣爾政曰臣等不才致朝廷之勢陵夷上曰此須與行遣天下事賞罰而已若有罪不罰漸成姑息之風誠為不便劉豫既廢金國左副元帥達蘭送王倫等回謂曰好報江南既道途無梗和議自此平達至是倫還丙子泗州奏至上顰蹙謂趙鼎等曰朕以皇太后未還夙夜憂懼未嘗去心若金人能從朕所求其餘一切非較也鼎等曰仰見陛下孝心焦勞上曰國家但能自治以承天心豈無復振之日癸未倫等還上錫予特異丁亥以倫為徽猷閣直學士樞密都承㫖充迎奉梓宫使借拱衛大夫高公繪副之知泗州劉綱乞調滁州千夫修城有㫖從之言者以為非是甲申上謂宰執曰百姓誠不可勞但邊城利害至重天下之事亦權輕重而為之朕為民力一毫不敢動惟此役不得已也趙鼎曰昨得㫖已令優給錢米矣是月以禮部侍郎常同為御史中丞劉豫之將有宋超者帶兵千餘詣知廬州劉錡降詔錡帶兵入奏事處超等既定錡復還合肥趙鼎事實曰豫既廢鼎密遣諜者散之沿淮一帶誘其守將由是壽亳陳蔡諸郡率其部曲來歸者相繼不絶兩月間得精兵萬餘西馬數千朝士相謂曰前日大作措置未進一歩潰亡者五六萬衆今不動聲色自致士馬如許盛可謂過人矣時徽宗小祥近且逾七月之期而迎請梓宫使者未有來耗禮官謂不可久停常祀於是綿蕝其儀返虞祔廟以左僕射趙鼎為禮儀使金主亶以皇伯領三省事宋國王宗磐乃先主晟之長子豪猾難馭而東京留守兖王宗雋即亶親叔且素有才望乃除太保領三省事以制之初金有國自旻晟以來雖名為帝而與其下無尊卑之别其主所獨享者惟一殿曰乾元四隅栽柳作禁圍遶壁皆設大坑時與諸臣雜坐于坑后妃躬持飲食自亶初時詞臣韓防已敎之學稍能賦詩染翰既即位左右儒士日進諂䛕𨗳以宫室之壯侍衛之嚴岀則清道警蹕入則端居九重視舊功大臣如草芥非時且莫得見盡失女眞之故態至是宗雋入相顧與宗磐等合謀而亂作矣
