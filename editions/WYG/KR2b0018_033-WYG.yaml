body:
  text: 中興小紀卷三十三宋熊克撰紹興十七年嵗在丁卯春正月戸部侍郎尹椿年言兩浙經界已畢者四十縣其未行處若止令人户結甲慮形勢之家尚有欺隠乞依舊畫圖造簿本所差官覈實若先了而民無争訟之煩則申朝廷推賞如守令慢而不職奏劾取㫖丁卯詔從之詔令後孟饗詣景靈宫及皇太后皇后或時出入自支錢米不須臨安應辦恐擾及市民癸巳資政殿學士提舉萬夀觀兼侍讀秦熺加大學士二月乙未朔以右諫議大夫汪勃為御史中丞臨安府奏減定房錢辛丑上諭宰執曰官私須合均一秦檜曰臣有以知陛下無心應物而施政平也丁未上親祠髙禖少保殿帥楊存中奏諸軍營昨用草葢嵗深已壞乞造瓦屋辛亥上曰草屋經夏尤難處第令改造雖未即成可旋為之壬子詔陣亡恩澤自今不須裁定可依祖宗法言者論參知政事李若谷辛酉罷為資政殿學士提舉太平觀再論遂奪職令江西居住三月丁卯以給事中段拂為翰林學士拂江寧人也己卯宰執奏國信所乞裁减接伴北使官屬事上因諭曰奉使邊知白渡淮數日而尚未至恐滯於中路則從人不能無擾可降指揮今後計程赴行在夏四月辛亥上謂秦檜曰近來任滿轉官减半添給陳乞攀援者多可禁止之悉遵舊法犯者論以違制戊午宰執奏殿前司申訓練官董彦起復事上曰須見在中軍不免從權若旋行竄名規免執䘮有害風教可禁止之先是徽宗忌辰皇太后親詣景靈宫少師昭慶軍節度使充萬壽觀使平樂郡王韋淵因赴起居妄出辨語詆毁太后既而命殿中侍御史上饒余堯弼就其家鞫治具伏庚申責授散官袁州安置六月癸巳朔上諭宰執曰臨安居民皆汲西湖近來為人撲買作田種菱藕之類沃以糞穢豈得為便况諸庫引而造酒用於祭祀尤非所宜可禁止之又曰㳂江石岸令速修失之遲則衝損害民費工必倍乙未宰執奏放臨安府房錢事上曰雨澤稍頻細民不易秦檜曰昨蒙宣問常潤及江東闕雨臣弟赴宣州新任近得報雨已霑足上曰秋成有望可喜也殿中侍御史余堯弼論知上饒縣韓暉非理貪求上諭宰執曰縣令非人民受其弊若銓擇則員多有所不暇第責之監司去其貪暴昏謬庻幾百姓均被實惠堯弼上饒人也秋七月初四川宣撫使鄭剛中即利州置監鑄小鐵錢欲以救川引之敝遂就除資政殿學士剛中在蜀六年秦檜忌之而剛中服用亦或踰制四川總領趙不棄欲盡取剛中所儲剛中不與至是不棄自四川回己巳上曰不棄深知四川財賦計今調度給足則軍興以來所敷並可蠲罷朕所以休兵講好葢為蘇民力爾如其不然殊失本意時不棄頗文致剛中事尋以不棄為工部侍郎甲申提舉太平觀張擴投閑五載居于徳興之先廬日從賔客以觴詠自娛至是疾革請老丙戌上謂宰執曰此吾中興辭命之臣詔除敷文閣待制致仕八月乙未宰執奏除臨安府帥臣上因諭曰朝廷於臨安不免時有所需如御膳未初日供今則月一取之庶幾不敢縁此擾民也九月乙丑宰執奏殿前招到海賊分隷諸軍事上曰海賊若竄須立賞捕之仍常加恤毋使去為民患知大宗正主管濮祠士套赴行在供職也奏事乙亥上謂宰執曰南班有分處紹興府者比之行在日奉朝謁勞佚不均祖宗待遇優恤問有朕湯藥假按此句疑有脱誤朕念宗子食貧者衆時有以助其費秦檜曰嚮日郊賜加厚足見聖慈惇叙之意是日户部具到諸路月樁錢以緡計者江東信州五萬四千徽州五萬八千宣州四萬九千江西吉州六千七百撫州二萬五千江州一萬一千筠州六千九百建昌軍二千三百臨江軍四千六百南安軍六千六百上曰科敷之類富者猶不能堪下户何所從出若計諸州羡餘以减月樁錢誠寛民力秦檜曰指揮之下百姓想皆歡欣鼓舞上曰朕備嘗艱難知細民闕乏雖百錢亦不易得故尋常不欲妄費或有餘財即命樁留以待緩急庻幾時不至失措言者論資政殿學士四川宣撫使鄭剛中奢侈妄作丙子詔罷剛中仍於鄂渚候㫖既而落職責桂陽軍居住其後又以在蜀日有盗過界偷馬詔剛中捕捉而奉行不均又擅自鬻度僧牒及興監鑄以所收到直便支費且欲併都轉運司入宣撫司又不喜朝廷置四川總領官却説諭統兵官云今為總領交去錢物無可送遺再為言者所論制勘獄成剛中累貶封州其子書冩機宜良嗣并官屬張漢之皆除名編管己卯宰執奏修太醫局事上曰醫官如王繼先輩恐難有繼者宜立法試選醫生然須有自得處徒誦方書不能意解豈足為良醫也人命所繫誠不可忽是日金國主亶出獵至隂山之北打圍遂至雲中府冬十月復歸上京十一月辛酉朔日當蝕隂雲不見初命刑部尚書周三畏等詳定重修常平免役勅令格式至是書成丙寅太師左僕射秦檜上之十二月辛卯朔上謂宰執曰昨日閲試殿前馬歩諸軍武藝皆精秦檜曰陛下以賞激之上曰引硬射新舊以二百人為率自後當增至三百人庻使遞相教習緩急可用癸巳宰執擬差左奉議郎呉質知容州上曰廣東西闕官自來多是權攝如海外州軍監司巡歴不到朕毎以為慮有愿就者宜早與差遣自駐蹕以來歲祀十神太一於恵時僧刹言者以為未稱欽崇之意癸卯詔兩浙轉運司營太一宫甲辰右正言巫伋請以前後詔書編成冊付州縣遵行上曰朕屢降寛恤指揮而守令不能奉承安得惠及百姓當使監司按劾警慢吏壬子宰執奏四川命官因罪停降遇恩該叙復者元係宣撫司行令與還之省部上曰四川人多只官川中今可量與注擬東南庻使逺近人情無彼此之間初宣撫司得便宜補官皆預給勅牒至是會萃令吏部換給秦檜疑其未實多格不行吏部侍郎周執羔言於檜以謂朝廷本許以一切不宜失信乃從之此據執羔行述修入權附此殿中侍御史余堯弼論浙東提刑林師説敢為異議甲寅詔罷之上曰人心不同豈能盡知但當試用若肯協濟國事自須進擢如意懐二三狙詐謀身者不免斥去以示之好惡庻革士風之偷薄也建劔汀邵在閩中號上四郡毎嵗上供諸費皆仰鹽以辦時建之鹽綱不集且官鹽莫之售私鹽莫之禁故公家之用匱守臣敷文閣待制林乂熟其弊葢鹽綱非請託不行或綱未入手而本錢為之一空坐是故得而不行行而不至公私俱困乂乃選使臣皂𨽻之亷幹者十餘人以授之且犒勞良厚戒之毋藉銖兩至是損其宜鬻之故鹽貨流行郡以不乏是嵗金國主亶遣使挾相士下兩河諸路選民間室女年十三以上二十以下者凡得四千餘人皆令入宫紹興十八年嵗在戊辰春正月庚申朔宰執奏淮南轉運副使錢端禮乞將本路應副國信使宿食處併作一十二頓上曰此亦免官吏乘時擾民詔從之甲子言者謂先朝春秋二仲以太常少卿薦獻諸陵季秋則御史按視今永祐陵近在會稽一水之隔望舉行舊制從之戊子上與宰執語及人材因謂秦檜曰士專謀身國家何賴厲世磨鈍惟在進賢退不肖檜曰此乃致治之要上曰不須與較但審其賢否而進退則人自勸沮矣二月癸巳上諭宰執曰兩浙漕司舉人聞有勢力之家行賂假手濫占解名甚喧士論今鎖院在近可令禮部立賞許人捕甲子詔假手者許就試舉人告獲取㫖補官仍賜出身殿中侍御史余堯弼右正言巫伋論參知政事叚拂天資隂邪不識亷恥建炎間金陵倅楊邦義仗節以死而堯弼攝倅恬不知恥何以躐居政府乙未詔除資政殿學士與宫祠再論遂落職壬申監登聞檢院徐璉言自昔帝王必有佐命之臣功銘鼎彛侑食清廟以勸萬世國家逺稽三代肇建原廟凡在佐命輔弼皆繪象廟庭以示報功之意陛下紹開中興復崇原廟如祖宗之制而累朝配饗輔弼不過十餘人今其家之子孫必有繪像在焉望詔有司訪求摹於景靈宫庭之兩壁壬申詔禮部措置申省三月禮部侍郎沈該奉使金國賀正面詔該兼宜學士院該歸安人也壬申名行宫之南門曰麗正北門曰和寧時殿前司招軍多誘致鄉民及負販者上慮其失業丁丑乃諭宰執可令川中二大將吴璘楊政招流民之失所者發來填額初建太乙宫期以半年至是告成辛巳詔許士民燒香三日既而上謂宰執曰太一宫亦不華靡朕自謁欵後有一食牛肉人至宫妄有毁訾抵暮遽卒自此都人莫不信向也上語在五月辛酉今聨書之壬午資政殿大學士提舉萬夀觀兼侍讀秦熺再除知樞宻院事一日左僕射檜以問祠部郎官胡寧曰兒子近除外議如何寧曰外議以為公相必不襲蔡京之迹於是檜怒寧崇安人安國子也夏四月戊子朔太陽當蝕隂雲不見貢院考到博學宏辭科合格選人周麟之季南夀並與堂除麟之海陵人南夀龍泉人也知貢舉吏部侍郎邊知白上合格進士徐履等庚寅上御集英殿䇿試既遂賜王佐以下三百三十人及第出身履永嘉人佐山隂人也知樞宻院事秦熺自言父子共政理當避嫌庚子以熺為觀文殿學士提舉袐書省立班左右僕射之次殿帥楊存中乞于平江府添葢牧馬屋壬寅詔所費並令官給見緡不得科民癸丑宰執奏除監司上因諭曰時暑旅中人不易凡到闕人早與差遣令去殿中侍御史余堯弼論敷文閣宜學士知建康府晁詠之輙與趙鼎通書又嘗與王庻辟客詔罷之時京西謀帥以慶逺軍節度使張澄為之是月澄至襄陽府襄陽地平當江漢之衝環以大堤嵗久為水所圯澄始相葺之度民不可勞而江夏諸將私田占籍境内者倍於編戸澄乃諭使出力修隄皆欣然聽命既成比舊增髙週廻數十里民蒙其利禮部下諸路轉運司于祖宗配饗功臣之家訪到趙普曹彬薛居正石熙載潘美李沆王旦李繼隆王曾吕夷簡曹寶臣韓琦曾公亮富弼司馬光韓忠彦凡一十六人繪像五月乙丑詔並畫于景靈宫廷之壁初兩浙漕司運米所差使臣押綱例皆參部有礙志在盗糶官物雖賞罰不能為之勸沮嵗久欠多有至數千石者至是言者請付銓曹選有心力使臣無欠而願併押者聽則官物不失亦赦弊之一端也詔送吏戸部其後逐部欲依所請從之甲戍太常寺主簿林大鼎莆田人初為舉子答䇿言今左僕射秦檜靖康忠義之節檜時閒居永嘉見其文默識之至是稍獲薦用先是自鄭剛中罷利西路帥吴璘利東路帥楊政等元帯四川宣撫司都統制並已改為御前諸軍都統制甲申又詔罷四川宣撫司就除知成都府徽猷閣宜學士開封李璆為四川安撫制置使先是諸路毎歲決獄專委憲司而但遣屬官代行徒為文具六月癸巳乃詔提刑須親到所部决獄仍具申省甲午上諭宰執曰郡守條上民事可委官詳之有可採者即行庻不為虛文也時有布衣上書言縣令非理擾民己亥上謂宰執曰朝廷自和議以來未嘗有取於民可令監司郡守察之庚子乃檢前後約束行下上又曰自今有作事或過及老而昏謬者並與祠禄庻不為民害也丁未上諭宰執曰近者有布衣上書乞行三舎法恐未暇及此内有言民事宜送戸部可行者即行之士民曹溥等一千三百餘人進表乞上尊號戊申上謙抑不受令有司毋得復收乙卯上諭宰執曰袐府見求遺書古跡四川不經兵亂可委諸司尋訪仍令提舉官毎月趣之兩浙漕司奏劾秀州添倅向子昌不法事秋七月辛酉詔本司取勘具奏上因諭宰執曰親民之官莫如縣令縣令至衆不能皆賢但得監司郡守縱有不法亦自知畏更須留意擇人乙丑宰執奏江西漕臣賈宜請乞於縣官中選有出身者兼縣學教諭事上曰令禮部檢舊法申省言者乞令諸州建閣以蔵宸翰上以勞民不許戊寅諭宰執曰治道貴清淨治民惟在于不擾知臨安府湯鵬舉言偃兵以來皇華交贊結轍于道而淮浙㳂流館無慮二十所尚或未就望令賔至如歸詔從之時久旱而雨上曰前此朕甚憂之近來霑足秋成有望殊為可喜八月丙戌朔上謂宰執曰知揚州向子固己丁憂去盱眙軍畢良史又易守地郡今未得人頗以為慮于是就除淮南漕臣榮薿知揚州而良史復還舊任端明殿學士僉書樞宻院事汪勃以親老乞歸養丙申詔仍舊職提舉太平興國宫丁酉以工部尚書詹大方為端明殿學士僉書樞宻院尋權參知政事前知郢州趙叔涔言陛下即位以來用人多矣而競持異議故投艱弭亂略無寧歲自專任一相坐致太平望以今日得人之效宣付史館癸卯上可其奏因頋左僕射秦檜曰此卿之功也朕記卿初自敵中歸嘗對朕言如欲天下無事須是南自南北自北遂首建和議朕心固已判然而梗于衆論久而方决今南北罷兵六年矣天下無事果如卿言檜頓首謝曰和議之諧斷自宸衷臣奉行而已何功之有侍御史余堯弼言刑部尚書周三畏由法吏以陞八座縉紳所鄙乃詔與外祠初左太中大夫范同以前執政太平州秩滿詔令再任而同治郡無政聲通判陳良弼貪汙恣横同不能制是月同卒始復資政殿學士崇慶軍節度使葉夢得卒于湖州自紹興改元以後每歲户部降本下江浙湖南和糴以助軍儲至是以兩國通和户部財賦自足閏八月庚申宰執奏乞與蠲免上喜曰朕向在河朔見民以為苦朝廷所降本錢往往州縣移用不即時給縱有給處又為吏多端乞取十不得一二今幸時和歲豐軍儲粗足朕豈得而不已也甲子户部言今淮東西湖北三總領所收糴軍儲省般運之費民無科泒之患實為久利浙西産米浩澣欲令轉運司於臨安平江府處葢蒼以行在省倉塲為名歲各糴二十萬石又行在省倉三界亦立定歲額上界六萬石中界五萬石下界二十五萬石三總領所各糴十五萬石淮西加一萬五千石從之時江浙士人補中太學雖告假限而皆不除籍以此補試不行禮部侍郎陳誠之請入學五年不預薦及公試不入等者來歲終檢校而除其籍戊辰詔從之甲申宰執奏奉使大國禮物上曰朕觀金國和意甚堅自講好以來於今七年禮物之外未嘗他有一毫邀求朕每遇遣使必再三戒飭毋得生事葢所以固兩國之歡期于與民休息而已御史臺主簿陳䕫言常平著令歲給窮民起十月止三月送來所給之米或移他用請令監司察之癸未上謂宰執曰義倉所以備水旱而救民之艱食比年州縣奉法不䖍窮民不被其恵非所以稱朕矜恤之意令户部行下䕫永嘉人也初福建自創竒兵而䖍梅草冦不復敢入境至是悉平帥司散遣將官周虎臣下衆兵只留巡檢陳敏所部四百人歲猶費錢一萬四千緡米三千六百石至是有㫖敏下竒兵及漳州駐劄周浩盧真汀州駐劄翟臯温立下官兵並改充殿前司左翼軍就擢敏為統制官專令彈壓先嘗遣殿前司選鋒軍統制官劉寶在本路遂詔寶回司詔寶回司在明年今聨書之新知湖州趙叔涔言守令皆帯勸農而漫不加省望詔有司考其戸口增耗以陞黜之九月己丑上謂宰執曰淮南流民未盡復業建隆初以戸口增耗為守令歲課之法所以明示勸戒令吏部行下甲辰以侍御史余堯弼為中丞丙午僉書樞宻院事詹大方卒是月金國主亶遣亷訪使蕭裕偏至諸路詢民間自郡官以下皆究其治狀而陞黜之時國嗣未立亶以故宋王宗幹之子岐王亮為左丞相亮有包藏窺伺之意祚王元者乃故主太祖旻之孫地居嫡長以次當立亮欲先除去以為已計因河南叛兵有妄稱皇弟者亮誣以語相符合實欲結連乃譛於亶寘之重法國人皆謂亶滛于用刑不知由亮之所陷也亮頗能矯情餙貎欺世盗名故竊弄權柄害其宗黨如此此據金國廢亮詔修入冬十月丙辰以御史中丞余堯弼為端明殿學士僉書樞宻院事乙丑上曰前日内教武藝極精挽强中者比去歲多百人更一二年愈精則中者益多上又曰招箭班始於何時似亦無用若箭發誤中必致殞命以朕所見此宜罷却以一般班分處之丁卯詔紹興府守臣林待聘誕謾宜亟罷去其財賦令戸部經理辛未宰執奏知婺州錢端禮劾知義烏縣徐時敏不法事上曰知縣乃銓注員多難辨真否但治行者優擢罪惡者重責則咸知勸懲因此可以得人材矣壬申上謂宰執曰諸州月摏錢昨已例减當盡罷秦檜即諭戸部侍郎李椿年宋貺以經制錢贍軍先是荆南府闕帥宰執依㫖具上諸路副總管姓名秦檜曰其地非輕恐更有可選之人上曰徧詢三衙生帥庻得其人也此事在十月癸未是月以户部侍郎宋貺兼權吏部尚書十一月壬辰上諭宰執曰荆南重地中興以來多差武帥今疆埸安静宜依舊選文臣庻能舉職於是以袐閣修撰知䖍州曾慥移知荆南初已詔米免税州縣不得收力勝錢至是猶未能盡禁戸部再請乞許人越訴監官黜丁酉詔從之皇太后明年七十戊戌上諭宰執令禮臣檢會國朝慶典以正旦行之先是紹興府旱傷詔本府依實檢放民税仍發義倉米賑之他郡有被災處亦令戸部多方措置此事在十一月丁未十二月乙卯朔上復諭宰執曰紹興流民有過江者令臨安府給路費遣還并令紹興依已得㫖賑濟無致失所乙丑又詔昨命提舉常平官躬詣旱傷賑濟尚慮闊逺稽遲許委屬官分行將來春耕當借之種糧俾得及時則公私兩濟
