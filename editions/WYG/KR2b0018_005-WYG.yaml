body:
  text: 中興小紀卷五宋熊克撰建炎三年嵗在己酉春正月中丞張澂言邊事未寧請詢於衆為禦敵之策從之於是吏部尚書吕頥浩奏曰天下多事聖哲馳騖而不足金人已破河北山東與陕西諸郡近復引兵渡河駐于澶濮之境祈請之使雖行而未有報韓世忠范瓊統兵比去亦未有戰期致宸慮焦勞下詢羣策今敵騎漸逼京東若民心一揺淮南望風而下則不能枝梧望降哀痛之詔曲赦河北京東兩路蠲其二稅與公私積欠及人户避敵而南者令州縣優恤又敵長於攻城若難以堅守許官吏與民入山避敵庶免全郡皆為魚肉凡此皆以收民心也夫敵兵雖勇而素無陣法若遇節制之兵一敗必至顛沛但令王師倣古陣法常山蛇勢雖茫昧不𫝊而陣圖别有可攷願早圖之己丑上諭宰執令擇日進發朱勝非曰須支金帛方能辦私覿物彼方辭所進官職恥於自乞上命依格支仍優加其數且曰國家惜財正所謂積以待用若二聖得歸朕豈吝金帛之數時羣臣准詔論防邊事皆送御史臺辛丑詔有警見任官輙般家者徒二年因而動揺人情者流二千里故一時間皆未敢動此據張澂說黄潜善等䟽修入户部尚書葉夢得請以行在所藏金帛五十萬分其半併歸姑蘇金陵二處從之夢得即具舟楫從大將假二千人津發一日而畢然公私舟交河中跬步不通矣夢得復請以户部所餘物前期支六軍春衣及官吏俸一月亦從之時禮部尚書王綯以為金人必侵行在率從官二三人同對便殿上令詣都堂議綯等見黄潜善汪伯彦二人乃曰諸公所言三尺童子皆能及之於是宰執相約曰六宫已先渡江百官家屬亦聽其便惟吾黨骨肉不可動動則軍情不安至是金左副元帥尼瑪哈以輕騎五千自山東徑趍淮甸己酉泗州將官閻瑾失守中夕奏至朝廷震驚二月庚戌朔上即欲南幸潜善伯彦力止上姑候實報渡江未晚上然之少頃又𫝊瑾懼而自反敵見瑾已敗謂朝廷無偹遂徑至天長軍時統制官俱重成喜兩軍共萬人望見金先鋒百餘騎即遁亟遣江淮制置使劉光世領兵拒之行都人謂光世必能禦敵而士無鬬志未至淮亦潰遂遣統制官劉正彦以所部兵從皇子六宫往杭州是晚出門皇子六宮往杭州據趙鼎扈從録疑不是今日壬子得天長報敵已至上乃躬介胄乘馬南巡惟内侍及䕶聖軍從之者數人而已二相方㑹食堂中有審其事者猶以前言為對堂吏呼曰駕行矣於是宰相以戎服從户部尚書葉夢得隨其後百司諸軍並䕶駕行上天性仁慈與路人相先後不令訶止時事出倉卒朝廷儀物皆委棄之太常少卿龍泉季陵亟取九廟神主奉之及出門甲騎已塞道路行數里回望揚州城中烟焰燭天臣寮士庶及帑藏所儲為金人殺掠殆盡給事中黄哲左諫議大夫李處遯太府少卿朱端友皆死揚州守臣黄願遁去時公私所載之物舳艫相銜而潮不應閘膠泥淖中敵悉取之大理卿黄鍔至江口軍人以為潜善罵之曰誤國誤民皆汝之罪鍔方辨其非是而首已斷矣少卿史徽丞范浩繼至亦死鍔南城人也吏部尚書吕頥浩禮部侍郎張浚聮馬追及上渡楊子江至鎮江府初右諌議大夫建安鄭㲄累章請移蹕建康宰執沮之至是㲄扈從上曰不用卿言及此此據㲄傳癸丑命奉國軍節度使劉光世守鎮江府甲寅宰執從臣入對議幸杭州未决吕頥浩葉夢得以首扣地願且留此為江北聲援不然敵乗勢渡江愈狼狽矣宰執以為是上曰如此則須宰執同往江上令江北諸軍結陣防江於是宰執馳詣江干有統領官安義自江北遣人至言今早敵騎數百來攻已射退矣遂以為江北統制官收兵以捍𤓰州既而都統制王淵言蹔駐鎮江止捍得一處若敵自通州而渡先據蘇臺將若之何不如錢塘有重江之阻上以語宰執於是黄潜善曰淵言如此臣何敢留陛下俄有内臣奏城中火起又聞衛士涕泣且藉藉上驚命中書侍郎朱勝非與管軍左言傳㫖問所以勝非呼之前使言皆以未見家屬對勝非即諭之曰已有㫖分遣舟專渡衛士妻孥矣衆帖然因問駕去留利害則曰一聽聖㫖無敢譁者乃許以俟駐蹕定當録扈從之勞優加賞給三軍欣諾方指揮之際上於屏後皆聞之勝非復命上曰適已聽得上即時乗馬南幸自駕起而鎮江城中無賴輩與軍人縱意抄掠民悉奔竄矣乙卯上至常州羣盜丁進等雖已受招而縱兵掠民至是欲走山東朱勝非至丹陽都統制王淵遣使臣張青領五十騎馳䕶勝非因令青圖進青以白勝非勝非曰丁進不除必為巨盜聞渠有數百人爾五十騎可敵否青曰不足畏於是以檄誘進至勝非所誅之其衆愓息聽命丙辰上至無錫縣資政殿學士吕頥浩從行遂除僉書樞宻院事仍充江浙制置使詔張邦昌親屬張邦榮張元亨等並令録用又命朱勝非同禮部侍郎御營司參贊軍事張浚守平江府節制平江常秀兵馬控扼通泰之衝時潰軍在江北多乗時作過統制官王徳以衆攻和州靳賽以衆攻通州二城垂破於是勝非與浚作蠟書招之徳賽皆聽命訴以無食乃漕米給之劉光世又遺以戰袍器甲於是相繼渡江時徳招張育之兵萬人光世得之其軍復振徳鞏縣人號王夜义者是也頥浩遂以精兵二千回鎮江節制劉光世以下捍𤓰洲渡庚申上次秀州壬戍上次崇徳縣初户部尚書葉夢得以本省所藏皆棄江北欲亟趨杭州為偹乃由宜興間道先往壬戍上至夢得迎于臨江上入州治駐蹕詔遣御營軍中統制張俊往吳江控扼汪伯彦時政記曰時黄潜善等言陛下已留朱勝非張浚王淵在平江居吳江之北若更差張俊去臣等慮行在只有苗傅一軍不惟緩急有警傅不可倚仗兼恐無以相制可虞非常乞留俊庶㡬行在不至誤事葉夢得言臣昨至杭見以轉運司為升暘宫小人遂𫝊以為復開應奉之端上即詔罷之夢得見宰執言百官六軍劵厯不存請别給新者又姑蘇金陵兩處所留上供約可支半嵗欲刷杭州諸司所有借支候取兩處物至償之又戸部司農太府及倉庫官吏無一至者願差官攝事皆從之御史中丞張澂論左右僕射黄潜善汪伯彦輔政無狀有大罪二十致陛下䝉塵于外天下人切齒唾罵望重賜竄黜己巳罷潜善伯彦並為觀文殿大學士潜善知平江伯彦知洪州又以户部尚書葉夢得為左丞而澂為右丞言者再論潜善伯彦遂降充觀文殿學士提舉外祠尋皆落職庚午右諫議大夫鄭㲄言今宜用兩浙人材如晉元帝渡江擢用吳中之秀庶衆情翕然歸附從之湖州民王永錫獻錢五萬緡執政言版計無闕上曰如此安用即詔却之辛未敵退江浙制置吕頥浩帥兵渡江至真州收𣙜貨務錢物初婺州嵗貢羅萬匹崇寧以後希進者増其數至五萬八十匹至是守臣蘇遲乞减其半上問執政祖宗額㡬何葉夢得曰皇祐編勑一萬匹上歎曰民將何堪可依皇祐法執政奏今用度與祖宗時不同乃詔减二萬八千著為定制仍給見緡遲轍子也丙子下詔責躬略曰朕已放宫嬪損服御黜宰輔召忠良尚慮多方未知朕志自今事有闗於國體益於邊防許士民直言朕採擇行之仍旌以示勸言之或失亦不汝尤初臺諫官馬伸嘗論黄潜善汪伯彦之過而太學生陳東進士歐陽澈於二人秉政日以言被刑上曰以言責人朕甚悔之乃詔以衛尉少卿召伸而東澈並贈京秩上初至杭州霖雨不止至是執政奏事葉夢得曰東南春夏地濕上曰自渡江百官六軍皆失所朕何獨求安今尚寢堂外俟稍定方入正寢執政曰如此人心孰不感動故事惟侍從乃許薦士不及郎官是日詔郎官以上各薦二人仍不俟都堂審察便令登對執政曰陛下搜賢不倦如此天下幸甚二月己卯朔詔金人已退當移駐江寧府經理中原仍命僉書樞宻院吕頥浩兼領府事召中書侍郎朱勝非至行在禮部侍郎張浚獨留平江節制如故辛巳張浚乞於㳂江置强弩營選州禁兵縣弓手為之言者乞依唐及祖宗舊制應章奏委學士給舎輪日閲於禁中不令内臣傳送只實封往復庶免交結之弊從之上嘗謂左丞葉夢得曰今日兵食二事最大當擇大臣分掌朕自募十萬人將之須與敵力戰先欲得鐵甲五千卿為朕辦之葉夢得行述曰時顔岐等見夢得數論事心忌之及上委以鐵甲愈不樂乃紿杭守康允之云上欲除君待制而左丞沮之允之即與其將曹世英謀為頃者本州兵變但誅其首餘三千人尚在聞夢得秉政反側不自安皆謀為亂岐等證之行述莫濟所作是日詔夢得深曉財賦可除資政殿學士提領財賦充廵幸頓遞使乃分任之意也於是同知樞宻院事盧益遷左丞又以嚮徳軍節度御營使司都統制王淵為僉書樞宻院事仍兼都統制舊制僉書必帶檢校官故治平中郭逵以檢校太保為之至是淵以節度直除非制也命下諸將有不樂者壬午右僕射朱勝非言王淵除命諸將有語臣記武臣作樞有免進呈書押故事今淵又兼都統制於諸將尤有利害臣欲用故事免之仍罷其兼管庶彌衆論上然之勝非又曰葉夢得執政旬日即罷何也上曰提領財用亦有例勝非曰張㲄兼此至於自作酒肆人以為非於是夢得力辭不就職旋亦罷為資政殿學士提舉崇福宫益行述云時政府欲損禮求於金盧益奏如封册正朔之文割地稱臣之禮犒軍嵗幣之數建都屯兵之所事大難悉從願據形勝嚴戰守為自治計庶中興之業日隆而將士之體不解執議不回因責授梅州安置翼日上省察復其官以吏部侍郎孫覿為户部尚書時御營前軍統制官苗傅與副統制劉正彦見王淵擢用且乗有敵難遂圖不軌正彦法子也淵故為法部曲先是正彦以舊恩從淵求官淵薦於朝以文換武得威州刺史又以所領精兵三千付之正彦因招到賊丁進等久之除團練使正彦意不滿而淵檄取其兵正彦固執不遣以此怨之又傅以淵素出其下尤怏怏不平癸未除奉國軍節度劉光世為殿前都指揮使百官入聽宣制傳等脅所部兵以叛執淵殺之併殺内侍數十人傅等與中軍統制官吳湛通為囊槖湛亟閉宫門宰執入奏事朱勝非顔岐張澄路允廸急趨樓上傅正彦與其屬張逵王鈞甫馬柔吉王世修輩列樓下皆被甲露刄以竿梟淵首知杭州康允之扣内東門求見請上御樓不然無以止變上從之管軍王元大呼曰聖駕來傅等望見黄葢即山呼而拜時百官咸在三軍恟恟未定傅乞誅康履上未允軍器監泰寧葉宗諤曰陛下何惜一康履姑以慰三軍上命吳湛執履付傅等即殺之衆猶未退乃請遣使金人且乞隆祐太后垂簾同聽政上顧羣臣曰今日之事如何有浙西機宜時希孟者輙曰乞問三軍於是通判杭州章誼越班出斥希孟曰問三軍何義若將鼓亂耶誼浦城人也上曰太后意如何勝非曰無此理上乃命顔岐奏請太后不登樓徑往諭諸軍勝非從太后至樓前太后鐫諭久之傅等以垂簾請樓上傳㫖可之太后乃還傅等不退復請上為太上皇帝魏國公攝政庶便和議勝非泣曰逆謀一至於此臣位宰臣義當死國乃趨出呼其募屬將佐至前曰請君言二將此事出於忠義為國耶或更有他圖皆曰忠義為國勝非曰若果忠義則當上下一心並聽朝廷處分有異志者誅之皆曰諾時兵部侍郎直學士院鉅野李邴亦以逆順之理曉之由是兇焰稍挫既退勝非奏來日當降赦葢羣兇殺王淵又刼掠意必望赦然不知逆惡自不赦上可之上曰康履忽諸將有取死之道勝非曰諸將奉履必有所求求而不得則怨矣上曰此事終如何勝非曰臣觀王鈞甫輩乃其腹心適嘗語臣云二將忠有餘而學不足此語可為後圖之緒上曰來早太后御殿勝非曰母后稱制須二人同對承平故事於今難用乞許獨對仍自苗傅始與其徒日引一人上殿以弭其疑且乞太后隨宜勉之庶有動心者兩宫以為然太后語上曰賴相此人若舊相未去事已不可收拾矣時傅等掲榜通衢有天其以予救萬民之語見者憤之甲申上徽號於上曰睿聖仁孝皇帝幸睿聖宫以杭州顯寧寺為之太后臨朝皇子魏國公攝政大赦天下自是日引傅等太后勉之皆有喜色而臣寮獨對論機事賊亦不疑矣朱勝非閒居録曰元祐末哲宗方擇后京師里巷作打毬戲以一擊入窠者為勝謂之孟入紹聖間宫掖造禁纈有匠者姓孟獻新様兩大蝴蝶相對繚以結帶曰孟家蟬民間競服之未㡬后廢處瑶華道宫議者皆以為䜟蟬者禪也出家之兆也靖康初京城失守二聖皇族皆詣金營中議亦取后淵聖意張邦昌必不能久僣欲留孟后以為興復基本因遣人入城取物紙尾批廋辭與府尹徐秉哲云趙氏注孟子相度分付㑹金人以后廢嵗久無預時事不復取至是前䜟乃驗葢孟入者兩復入也蟬者禪也兩御簾惟之應也大統中絶而復續天位暫傾而復正皆后之力可謂異人矣丁亥赦書至江寧府僉書樞宻院事吕頥浩亦走介入杭仍寓書於浚及劉光世共起兵孫覿作李謨墓誌曰眀受赦書至建康官吏讀赦皆失色獨頥浩怡然自若謨時為江東漕白頥浩曰樞省大臣盍詔天下兵以除君側之惡頥浩左右視接以他語謨曰王室在難如救焚之急公不應躊躇在衆人後方議行而張浚檄書至及二叛伏誅頥浩第功進右丞相謨歎曰羣兇稱亂全軀保妻子之臣握兵坐視相顧不發幸諸將謀復王淵梟首之禍而因人成事者遂至宰相初頥浩與謨同官河北不相悦至是聞其言益怒然當時勤王之舉頥浩實為之倡今覩所志如是恐未必然姑附見于此朱勝非因王鈞甫來見問之曰君前言二將學不足何也對曰如殺王淵軍中亦有以為非者曰君必以為非矣鈞甫唯唯勝非察其意己諭不復言之召張浚為禮部尚書今以所部兵付淛江提刑趙哲復令御營前軍統制張俊留所部兵付統制官俱重仍赴秦鳯縂管新任浚與俊各不奉詔浚召哲及守臣金壇湯東野令各具奏言敵未盡退若浚朝就道則夕敗事浚又慮苗傅等兵上抵平江則失枝梧乃令俊先遣精兵二千扼吳江於是浚上表大略言國家多難正人主馬上圖治之時願請睿聖不憚勤勞親縂要務復與二兇咨目且欲得辯士徃説之使無他圖浚與蜀人馮轓有太學之舊時轓在平江浚乃遣之入杭見二兇為陳逆順上之御樓也已除苗傅承宣使劉正彦觀察使至是又以其屬王鈞甫為右文殿修撰張逵馬柔吉王世修並直龍圖閣庚寅再除二兇並為節度使依前御營使司都統制黄潜善責衡州汪伯彦責永州並居住時潜善之兄通議大夫潜厚亦責分司南京道州居住提領行在茶䀋葉份言𣙜貨務都茶埸乞就行在一處置司人吏雖分而提轄監官並令通管份劔浦人也時二兇日以殺人為事且頻入都堂右諌議大夫鄭㲄嘗面折之壬辰擢㲄為御史中丞㲄遂遣所親承議郎建安謝嚮微服至平江見張浚等令嚴偹緩進又作杜鵑詩諭百戸當迎乗輿反正之意㲄言傅等便宜軍法止可行於所部士卒又都堂國論所出非庶臣得與請頒其章示之傅等雖怒然由此少戢僉書樞宻院事吕頥浩自江寧上表請睿聖復辟親總萬機仍幸金陵以圖復舊疆不然恐天下之必亂也壬辰馮轓至行在遂見二兇為陳成敗甚悉右僕射朱勝非奏授轓朝官除兵部員外郎朱勝非召二兇及其屬與之語知王世修可以利動因勉之立事許以從官於是世修為之往來傳道時二兇請移蹕建康勝非曰勤王兵在平江君等難與相遇又趣遣使勝非曰未知金將所在宜先遣小使亦宻令留於勤王所以此必破其謀可無憂也后曰天生相公救此患難既而小使止平江而新除尚書右丞盧益辭行遂以本職提舉崇福宫二兇之議遂息兩浙轉運副使王琮言本路夏税及和買絹一百一十七萬餘匹欲令民間每匹折價錢二緡足計三百五萬餘貫以仰助國用從之時兩浙轉運副使劉寧止行部至鎮江府聞難乃越境赴江寧見僉書樞宻院吕頥浩獻以計謀寧止歸安人也兵部侍郎直學士院李邴嘗見管軍王元宻令出禁旅擊賊元怯懦不能從於是朱勝非言浹日以來從官中能助朝廷者惟邴與鄭㲄如中書舎人林遹刑部侍郎衛膚敏皆杜門不出此何意也乞遷邴㲄以厲其餘遂以邴為翰林學士甲午僉書樞密院事吕頥浩自江寧起兵乙未次丹陽縣殿前都指揮使劉光世由鎮江以兵來㑹丙申御營平冦將軍韓世忠以兵由海道至平江見張浚泣曰我便去救官家浚曰投鼠忌器事不可急已遣馮轓甘言誘賊矣初王淵識世忠於微時待之絶等故至是世忠奮發討賊尤力先是二兇與禮部侍郎張浚書言伊周之事非侍郎孰當之朝廷見以右丞相待浚復書曰自古言渉不順謂之指斥乗輿事渉不順謂之震驚宫闕是以見君路馬必加禮至於遜位之説必其子長而賢因託以政使利天下不然謂之廢立若握兵在手責其君以細故而議廢立古豈有是哉上春秋鼎盛一旦遜位似非所宜嗚呼天祐我宋所以保衛聖躬者歴歴可數出質則敵畏之而不留奉使則民謳歌而有屬天之所興孰能廢之二兇得書與其屬俱至都堂言浚見詆以為逆賊所不能堪如吕樞宻則曉事朱勝非曰罷張而以兵權付吕無事矣辛丑責浚散官郴州安置中書舍人季陵草制有輕脱寡謀之語時有小黄門急趨睿聖宫傳太后之命曰張浚不得已貶郴州上方啜􅃵不覺覆􅃵于手朱勝非閒居録言平江檄書至二兇怒此時檄書猶未草葢因浚答書爾若檄書則吕頥浩自為盟主賊不應言吕樞宻曉事矣張浚復辟記曰二兇得臣手書立具劄子乞誅臣以令天下朱勝非力沮之見其狂悖已甚恐生别變遲之七日始有郴州之命浚自記此事葢得其實也壬寅頥浩至平江府凡兵三萬人張浚乗小舟迓之於郵中得堂帖乃貶郴州之命浚恐將士觀望即袖之語書吏云有㫖趣赴行在令申速發之命是夜共宿城外頥浩呼其屬刪定官李承造草檄文浚為潤澤之時韓世忠兵寡頥浩與張浚議分浚兵濟之浚乃以統領官劉寳一軍二千人借世忠二兇矯制召世忠世忠陽為語以報曰殘兵不多欲部至行在二兇許之時張浚下將安義隂結二兇欲代浚奪其兵斷吳江橋以應賊浚乃遣世忠屯秀以伐其謀世忠至秀稱疾不行而造攻具二兇始駭諸將皆謂賊窮則邀駕泛海浚又遣統制官陳思恭辛道宗治舟師於海道以遮賊南遁於是傳檄内外以世忠為前軍浚以精兵翼之頥浩浚縂中軍劉光世親以選卒為㳺擊而分兵以殿於是知平江府湯東野悉倉儲以餉軍用不乏二兇聞之甚恐馮轓知可動即白右僕射朱勝非曰張侍郎以國歩艱難正當馬上治之主上傳位㓜子恐有不測之變縱主上固執内禪猶有一説主上受淵聖詔為兵馬大元帥今日當以淵聖為主睿聖稱皇太弟依舊大元帥嗣聖易稱皇太姪太母垂簾聽政大元帥治兵征伐于外此最為得策勝非令轓與二兇議二兇有許意遂拉同議都堂甲辰轓同二兇及王鈞甫等並引見太后勞問曰卿等皆忠義之臣初張浚誡轓乞以鐵劵賜二兇用釋其疑轓遂奏太后許之議定癸卯詔百官赴睿聖宫奏請人皆歡呼以謂復辟至則宣詔睿聖皇帝稱皇太弟依舊康王天下兵馬大元帥皇帝宜稱太姪於是中丞鄭㲄極論不可百官退詣睿聖宫上御殿引見二兇勞問有加詞色粹然二兇以手加額曰聖天子度量如此二兇歸營逆黨張逵曰趙氏安矣苗氏危矣王世修大愠夜入勝非府變其事復欲改正嗣皇依舊而睿聖之名止稱處分天下兵馬重事勝非不能奪轓力爭勝非曰勿與較其實一也乙巳勤王之師五萬發平江時久隂乍晴識者知必破賊先是二兇懼外師之至檄杭州集保甲選器械扃城門塞河道守臣康允之悉不為行是日將下詔率百官請上復辟朱勝非召傅等六人至語之令軍中自為一奏傅無語劉正彦尚以為疑勝非曰勤王之師未來者使是間自反正爾所以招君等議葢欲上下和同不然下詔率百官六軍請上還宫君等置身何地正彦退立傅長吁曰獨有死爾勝非以責世修於是世修以言逼傅不能答勝非乃使世修草奏持歸軍中諸將書名丙午除世修工部侍郎將賜金帯而内帑適無乃用七百緡市于户部尚書孫覿家以寵之勝非即召學士李邴直院張守分作百官章三奏三答及太后手詔與赦文皆具詔移蹕江寧府以禮部侍郎御營使司參賛軍事張浚為同知樞宻院事浚不受翰林學士李邴御史中丞鄭㲄並為端明殿學士同僉書樞密院事二兇並賜鐵劵丁未文武百官赴睿聖宫迎請復辟是日駕還行宫都人夾道焚香衆情大悦勤王之師次秀州吕頥浩問韓世忠曰賊計有他虞乎對曰彼怗勢憑衆脅取鐵劵自謂不死安有他慮是夜有刺客至張浚帳前浚顧左右已睡問爾何如對曰某初讀書知逆順豈為賊用况侍郎志節安忍相害但見為備不嚴恐有後來者浚下執其手問姓名曰言之是邀後利某河北人有母在今徑歸矣浚翌日取郡獄死囚斬以徇曰此刺客也後亦無他是春山東河决嵗復大饑自上渡江之後羣盗紛起閻皋衆二萬據維州張城衆五萬據萊州有葛進者來攻青州帥臣劉洪道擊走之時尼雅滿自揚州歸東平府遣衆攻青州洪道棄城而去乃宻約安邱縣巨冦宫儀同復青州不克又約閻臯併兵刼敵寨復值大雨火滅而止副縂管王渙領將崔邦弼復青州聞洪道退軍尋亦棄去洪道又同儀臯攻宻州杜彦值敵騎亦來儀臯戰敗於是濰萊宻三州皆降于敵騎儀等野無所掠至以車載乾尸充糧洪道領兵二千赴行在於是諸重鎮相繼為敵所陷
