body:
  text: 中興小紀巻二宋熊克撰建炎元年秋七月己丑朔以徽猷閣直學士董耘為兵部尚書耘須城人嘗為元帥府叅議官初以兵部侍郎召至是擢用之己亥詔省臺寺監以繁簡相兼館職學官减半開封府曹掾依舊為推官諸路提舉常平併歸提㸃刑獄司兩浙福建市舶併歸轉運司諸州司録依舊為僉判曹掾官依舊為節察推判官支使掌書記録事司户司理司法參軍縣不满萬戸不置丞罷吏員三之一堂吏遵祖宗法轉官止朝散大夫初除外任只為通判前宰執子弟縁恩數帶貼職及待制以上并罷宰執并見任宫觀寺闕未有差遣京朝官以上俸錢並權减三分之一右僕射李綱言中原天下根本一去之則人心揺臣昨建策以適襄鄧為次者示不去中原且係其心爾近外議紛紜謂陛下将幸東南果然臣恐中原非復我有上曰但欲奉太后及六宫往東南朕當留中原綱曰陛下英斷如此雖漢之髙光唐之太宗不過是也乞降詔上乃命綱擬詔辛丑詔略曰朕将親督六師以援京城及山東河北諸路已迎奉隆祐太后津遣六宫及衛士家屬置之東南朕與羣臣獨留中原應在京屯兵聚糧修樓櫓治器具令留守司趣辦之壬寅以右僕射李綱為左僕射兼門下侍郎門下侍郎黄潛善為右僕射兼中書侍郎時初建御營司綱與潛善並兼使而同知樞密事張慤副之又擢鄜延副總管劉光世為本司都統制癸卯尚書右丞吕好問除資政殿學士知宣州吕好問家傳曰時臺諌官多李綱所厚因論圍城事并以中好問上出手札付尚書省曰昨邦昌僭號之初吕好問即募人齎帛書具道京城内外事金人甫退又遣人勸進攷其心迹與餘人不同言官所不知仰尚書省行下於是好問力求去乃除職知宣州時七月乙酉也家傳記好問罷政日與建炎詔㫖所書皆不同召延康殿學士提舉鴻慶宫許翰為右丞翰襄邑人靖康時為同知樞密院與李綱最厚故復用之乙巳李綱言今未能幸闗中宜適南陽乃詔委守臣修繕城隍又降鈔鹽錢帛令漕臣范之才儲糧草及命江湖綱運由襄江通漕并四川轉輕貨自歸峽以輸于鄧於是中書舎人劉珏言當今之要在審事機愛日力為急自金北歸已再踰時陛下中興亦既數月矣而六飛時巡靡所定止攻戰守備闕然不講臣聞近臣有欲幸南陽者南陽密邇中原易以號召四方此固然矣然今曰兵弱財單陳唐諸郡新刳於亂千乗萬騎何所取給南陽城惡亦不可恃夫騎兵金之長技而不習水戰金陵天險前據大江可以固守東南久安財力富盛足以待敵又衛尉少卿衛膚敏亦言建康實古帝都望詔東幸徐圗北向為萬全之策珏長興人也丙午户部侍郎黄潛厚遷尚書於是中書舎人劉珏言潛厚乃宰臣親兄祖宗以来無兄弟同居一省者上遣同知樞密院張慤諭珏所論固當以潛厚明於國計姑從權宜可也丁未以虞部郎官張浚為殿中侍御史浚綿竹人感子也時諸路各置總管己酉詔四道都總管並罷右諫議大夫臨卭宋齊愈初在圍城中自外至㑹議處寫張邦昌三字至是鞫于御史臺獄具壬子賜死初江浙經制使翁彦國横賦暴斂致亂東南而其黨兩浙轉運判官吴昉助之為虐人不聊生至有撃登聞鼓以訴者時彦國移知江寧府上乃亟罷二人丁巳降詔引咎略曰比縁時巡深戒有司從儉而彦國與昉同惡相濟今彦國罪盈物故而昉已罷庶㡬吾民少安先是左僕射李綱以彦國姻黨庇之至貼改聖㫖而獨罪昉中書舎人兼直學士院朱勝非言舎渠魁而責支黨臣所未諭卒正彦國罪彦國崇安人也初諸路發禁兵㑹東道總管司勤王至則總管胡直孺已陷于敵遂留南京上即位遣諸路兵還時杭州兵纔三百餘人有故童貫下勝捷殘兵而為盜将兵者遂誘以足數軍校陳通等見杭州富饒甲東南因謀歸為亂八月戊午朔通等夜劫庫兵以叛拘帥臣龍圗閣直學士葉夢得殺轉運判官吴昉與副将白均以下凡十二人時轉運副使顧彦成方出巡通欲俟其歸害之彦成歸及城外而變作復走秀州通等逼令前執政特進薛昻領郡事昻不能拒夢得吴縣人昻餘杭人也己未浙東帥臣翟汝文集兵於西興渡以禦杭冦且奏乞令浙西兵亦聽其節制壬戌詔御史中丞顔歧除待制提舉明道宫初右正言鄧肅言陛下昨欲進兵援京城為耿南仲父子所沮時南仲為觀文殿學士提舉洞霄宫已詔并其子龍圗閣學士延禧並落職至是侍御史侯官王賔復累疏論南仲罪己酉責授散官建昌軍居住丙子詔依祖宗故事改帝姬復為公主先是杭冦申翟汝文云若得内翰親至即降汝文信之是日以兵七千渡江時經制司遣屬官鮑貽遜領鎗杖手二千人亦至城下賊不徳命汝文復回越州初左僕射李綱薦張所招撫河北傅亮經制河東至是所言乞置司北京俟措置就緒即渡河而權北京留守張益謙奏以為招撫不當置司北京亮亦言經制司兵纔萬人河外皆金界乞權置司陜府右僕射黄潛善頗沮所又以兵少不如勿遣罷之綱言潛善力沮二人乃所以沮臣使不安其職臣每鑒靖康大臣不和之失凡事必與潛善等議而後行不謂彼乃設心如此乞歸田里殿中侍御史張浚與宋齊愈素善知齊愈死非其罪謂上初立而綱以私意殺侍從典刑不當有傷新政恐失人心于是首論綱罪丁丑綱罷為觀文殿大學士提舉洞霄宫制辭略曰謀猷弗効狂誕罔悛虧恭謹之通規負弼諧之初望既盡括郡縣之私馬又竭取東南之民財出令符於公議則屢抗以邀留用刑怫於羣情則力祈於親劄以至貼改己畫之㫖芘其外姻之姦兹遣防秋之師實為渡河之援預頒告命厚賜緡錢費踰百萬之多僅逹京師而止専制若此設心謂何綱相凡七十五日右丞許翰因求去且言綱忠義英發非綱無可與共建中興之業者今綱罷而留臣無益既而張所亦罪去傅亮引兵歸陜西招撫經制司皆廢矣馬軍都指揮使郭仲荀自京東部禁旅詣行在仲荀以七月至至是詔仲荀䕶衛隆祐太后之江寧府及制置東南盜賊初李綱建議買馬及勸民出財至是上慮擾民且東南非産馬之地己卯詔罷之惟陜西每州令買百匹辛巳提舉明道宫顔歧再除御史中丞不就職遂改工部尚書詔遣殿中侍御史馬伸往湖南四路監察御史院冦防往江淮四路吏部郎官黄次山往京東西路兵部郎官汪端友往兩浙福建路並為撫諭使伸須城人次山南昌人也尚書右丞許翰見陳東死謂所親曰吾與東皆争李綱者今東戮于都市吾在廟堂可乎乃力求去丙戌罷為資政殿學士提舉洞霄宫時正字胡珵為東潤澤書藁又便交攝他官從綱而行同舟東下既而言者論之詔停其官送梧州編管以給事中瑞安許景衡為御史中丞資政殿學士宗澤留守京城於四壁置統領官募義兵分𨽻之仍團練軍民之可用者以備緩急及治城池修器械略備而宗廟宫室臺省皆随宜緝治澤乃上疏乞不南幸其辭甚切又遣使将兵保䕶西京陵寝羣盜並起王善兵十萬擾京東王再興兵五萬掠京西揚進號沒角牛兵尤衆圍光州甚急澤徧遣人招之悉聽命而宰執黄潛善汪伯彦皆忌澤将罷之於是許景衡言得宗澤方能保東京有東京行在始安枕上梧遽封所上章示澤故終景衡之去澤賴以安景衡又言遷都南陽無險阻城池而密邇盜賊且漕運不繼不如建康天險可據請定計巡幸凡八上疏争之初詔發建州禁卒守京西滑州為金人所攻而退復回本州請卸甲錢轉運司不即支九月己丑因大閲軍校張員等遂作亂殺本路都監田其姓者及害漕臣毛奎拘守臣張動提舉官王浚明嬰城固守於是提㸃刑獄陳桷檄朝請郎王淮為統制官率諸縣弓手土軍及南劔州将兵集于城下討之奎西安人動侯官人浚明金華人桷永嘉人也時江東漕臣劉䝉提舉官陸友諒合奏乞優加翁彦國贈典於是言者以謂彦國乃李綱姻黨為之腹心原䝉等之意蓋欲附綱使綱未逐其計得行則為綱所擢何疑庚寅詔䝉友諒各降五官先是詔兩江諸州兵掩捕杭冦委提刑司節制時文臣周格武臣髙士瞳並領憲司事士瞳戚里子也欲招安之浙東帥臣翟汝文奏以謂浙東軍與經制司鎗仗手合萬人兵勢已盛而諸軍為賊誘去者甚衆人無鬭志又諸處所集皆鄉夫不識金皷一日賊自小堰門出衝散浙東兵次攻鮑貽遜寨貽遜率將士迎敵殺賊兵七百餘人於是朝廷詔遣統制官辛道宗将西兵二千人討之道宗至秀州其軍自亂潰而去者六百人趙萬郭青為之首賊勢益張提刑司所領蘇秀及淮南兵數百人縁此亦驕辛丑夜賊攻周格寨害格蘇秀兵遂脅淮南之衆共入杭投賊淮兵不從盡為所殺即自往投之致賊衆愈盛又刺城中百姓為兵且擄子女以分其黨復以金帛遣人誘諸郡不逞使據城相應翟汝文慮變生肘腋亟引軍回去此據翟汝文奏状修入丁未特進提舉崇福宫白時中卒戊申詔淮浙等路當三錢並許用從同知樞密院張慤請也時報金人攻河陽汜水已逼東京於是羣臣多請幸東南丙辰下詔蹔駐淮甸應接四方稍定即還京闕仍命知揚州吕頥浩修城池膳部郎中陳兖辦頓逓虞部郎中李儔具舟船頥浩歴城人靖康中為燕山漕臣金人内侵執至京城下講和乃送之還時為揚帥辛道宗下叛兵回至平江府守臣趙研集軍民登城嚴備賊畏之自城外徑過一城帖然至常州守臣何衮不為備且厚犒之賊既受犒即刼府庫及居民之家㡬盡復拘通判曽緯以行至無錫縣知縣郗漸單馬造賊中火言曰聖駕幸東南先驅且至知之乎皆言不知漸曰若等無他宜於此轉禍為福衆相視矍然不敢動即送之出境研髙密人漸臨清人緯布子也至鎮江府守臣趙子崧禦之銳甚及與戰府兵敗績子崧領親兵渡江保𤓰洲賊入城遂據之其後子崧以散官貶南雄州金人遣左監軍達蘭原名撻懶今改正下同将兵圍中山時河北官軍多自亂河東守臣皆棄城走於是敵乗而取之惟中山慶源保莫祁洺冀絳久而方陷冬十月丁巳朔上登舟幸淮甸宰執侍從百司三衙禁旅御營司将佐扈衛而行知秀州權浙西憲司趙叔近往招安杭冦時鎗仗手屯秀州賊畏之遂聽命甲子叔近以素隊入城然賊兵猶不解甲時諸處有寓居及待次官多擅自募兵以勤王為名或自稱材武子弟皆徒為紛擾有害軍政戊午詔禁止仍命帥臣憲司察之隆祐太后至髙郵軍聞叛兵焚鎮江遂遣兵控扼𤓰洲戊午太后入揚州先是雄州失守知歸信縣李成者本縣之弓手以勇聞于河朔累功為縣令成妻子在城中為亂兵所戮乃率其衆數萬来歸詔授忠州防禦京東河北都大捉殺使朝廷慮成衆太盛命分二千人往南京一千人於宿州就糧餘衆令成部赴行在成遣其将史亮部所分兵以行亮至宿而殺掠居民且焚汴河橋成躡其後亦至有道士陶子思者喜談兵成道遇之子思謂成面有割據之相勸成西往取蜀成惑其邪説遂叛分兵冦兩淮乙丑命江淮制置使劉光世領統制官苗傅兵二萬討賊光世下令得成者以成官爵與之故士皆力戰賊衆大潰降者數千擒史亮及其黨張勝王宜等數人成勤以身免收殘兵北走初靖康末有勒停人前忠翊郎趙叔向者於京城募兵以救駕為名所募皆㳺手之人上即位與敦武郎而叔向尚謀作亂至是亦命光世擒之詔罷招新軍其凌波等水軍亦罷之戊辰宰執登御舟奏事上曰昨日有内侍至自京師進内府珠玉二囊朕投之汴水黄潛善曰可惜有之不必棄無之不必求上曰太古之世摘玉毁珠小盜不起朕甚慕之庶㡬求以息盜爾庚午上次泗州壬申詔升天長縣為軍以其近行在也初藝祖六世孫選之子偁按宋史秀王子偁為慶國公令譮子選之字疑誤娶張氏夢絳衣神人自言崔府君擁一羊謂之曰以此為識已而有娠戊寅子偁次子生於嘉興縣是夜赤光滿室如日正中子偁以嵗在協洽其屬為羊故字之曰羊己卯随駕後軍至楚州寳應縣作亂逼逐左正言盧臣中墜水死殿中侍御史張浚以為雖在艱難中豈可廢法即論都統制韓世忠師行無紀士卒為變乞正其罰有㫖從贖而中書後省言世忠若止罰金何以懲後於是浚再論且乞擒捕為變者遂奪世忠觀察使既又詔臣中知無不言而死於非命特贈諫議大夫臣中歙縣人世忠膚施人也庚辰詔遣御營使司都統制王淵捕浙西羣盜既而淵總兵入鎮江城賊猶不知悉解甲就招淵紿以勤王先遣歩兵過江至𤓰州登岸盡殺之騎兵百餘人戮於市淵福津人也既而言者論浙東帥臣顯謨閣學士翟汝文總兵臨城不肯㑹戰詔令具析汝文言自杭賊作亂首提孤軍與賊鏖戰而諸将悉為憲臣所制除鮑貽遜鎗仗手在城下與臣相聞外無單車一介以為犄角不知使臣與誰㑹合兼前後乞討賊奏牘具在焉可誣也詔汝文降充雜學士癸未上至揚州駐蹕初觀文殿大學士李綱還至鎮江府而潰兵趙萬已迫常州遂由外江歸宜興且出家財犒之至是言者謂綱獨擅朝政杜絶言路臺諌官則陷以罪或寘之閑散又括馬之擾招兵之暴與勸民納財之虐皆優立賞格召吏為姦民無所告以至陛下徳意綱沮之而不行陛下號令綱改之而自専人臣不道無過於此遂詔綱落職戊子言者又論綱悖戾輕狂嘗易詔令以芘翁彦國之親黨捐金帛以資張所傅亮之妄用奸跡謬狀皆不逃聖鑒昨綱初相首置撿鼓院蓋欲引羣不逞以譽已爾綱以小人譽已則已尊已尊則朝廷可以脅制而政事皆由其出甚者造成靖康之伏闕雖人主不得而令又辛道宗兵叛以来綱居無錫乃傾家資制緋衣數千遣其弟繪迎賊且綱不任討賊之責避之可也豈有甘言重幣與之交通如常州閭閻之俗浮淺知有李綱而已萬一賊起藉綱為名臣恐國家之憂不在金人而在蕭牆之内於是貶綱鄂州居住時虚𫝊貶綱嶺南綱單騎南去既而知無後命乃還庚寅詔以二聖母后在逺兩遣使迎請未副所期而中原固守之圖亦虞弗至思得忠信宏博可使絶域知謀果毅能将萬衆者以成朕志慮其湮沈弗能自達不以有官無官並許詣登聞鼓院自陳朕将優禮遇之以禮部侍郎朱勝非為翰林學士乙未以同知樞密院事張慤為尚書左丞工部尚書顔歧為同知樞密事慤仍兼御營副使先是慤言三河之民怨敵入骨欲殱殄之請依唐人澤潞步兵雄邊子弟遺意募民聨以什伍而寓兵於農使合力抗敵謂之巡社又太中大夫許翰陳利害請使州縣什伍其民而教之戰以効唐昭義步兵之制詔委付慤遂著為法每十人為甲五甲為隊四隊為部五部為社各有長至五社則為都社有正及副如兩都社及萬人以上擇土豪二人為都副總轄其借補官之制則萬人以上成中郎千人以上保義郎八百人以上承信郎自甲長至都總轄三嵗逓遷諸州以守為統制官縣以令為統領官嵗終以較守令優劣而逐路提刑為提舉官書成詔頒于天下行之丙午再遷慤為中書侍郎仍提領措置户部財用顔歧為尚書左丞又以刑部尚書郭三益為同知樞密院事吏部侍郎周武仲為刑部尚書武仲浦城人其初召也鄧肅時為諫官言武仲宣和間任中丞顧望王黼等不敢出一言又嘗與趙良嗣同使金國去年良嗣已殺武仲不殺亦云厚矣其可復使之出入禁闥以誤國乎不報至是復進任之初宣教郎傅雱奉使自河陽渡河疾馳十餘日至雲中見敵人左監軍烏克紳原名悟室今改正下同至是回時又得修職郎王倫授以朝官借刑部侍郎充大金軍前通問使倫旦孫也遣倫在是月壬辰辛亥除雱為考功郎官既而倫至河東尼雅滿軍前為其所留初右諫議大夫衛膚敏入對勸上以守法度重爵賞數事上曰崇寧大觀以来所以亂祖宗法者由宰相持禄惟恐失人主之意故於政事無所可否馴致前日之禍自今當以為戒至是有㫖建承慶院令内侍典之膚敏乃請以承慶之役付之揚州并升暘宫造作事亦歸有司又請禁中差除須索必關三省其有戾祖宗之法許大臣執奏大臣不正救者顯黜之時中書舎人劉珏又言陛下以前朝房院故建承慶院而論者以為修營浸廣陛下以隆祐太后故間有御筆指揮而論者以為内降復出蓋䕶視工役領之内侍而除授不歸中書此人言所以籍籍也今陛下既以承慶之役付之揚州矣願因是凡所興繕悉付有司既以一二人除官為不當矣願因是申命三省皆許執奏則衆論息矣初諸州進士合於今春赴京省試縁軍興已展一年上方急於取人慮寒畯無以自達然巡幸既非久居又四方道梗難赴十二月丙辰朔詔以省試合取人數分下諸路於轉運置司處類試仍令提刑司差考官每十四人取其一詔朕念親儒臣以稽先聖之格言雖羽檄交馳巡幸未定亦不可廢可差講讀官四員萬機之暇令於内殿講讀自中原俶擾内外財賦多失往往吏毁其籍漫無可稽上獨委中書侍郎張慤理財而慤曉錢穀利害吏無敢欺元豐舊制中書専取㫖大臣所擬者慤輒屏不奏時宗澤守東京右僕射黄潛善門下侍郎汪伯彦皆笑其狂慤曰如澤之忠義若得數人天下定矣扵是二人語塞此據野記修入直龍圖閣知秀州權浙西提刑趙叔近招到杭卒陳通等戊午叔近言杭卒初無叛心止縁守臣葉夢得不以時支賞遂致紛紛今已招安乞給吿身修武從義郎各二秉義成忠忠翊保義郎各五承節郎三十承信郎五十進武校尉二十進義校尉一百付叔近書填給之仍乞不依常格注擬詔從之於是給事中劉珏言自羣盜蜂起率用招安此叛者所以滋熾也屬者金陵之亂凶黨無不得所欲故道宗之師建安之卒相挻為變今吴興諸營又以反側吿矣其視逆上命殺長吏習以為常朝廷又從而寵之謀國若此豈可謂工哉今叔近所請給告身二百二十餘人朝廷不以為過而遽從之或者襲是迹而動将見爵賞不足以給之矣先是以隆祐太后兄之子徽猷閣待制孟忠厚為顯謨閻直學士皇后父右文殿修撰邢煥為徽猷閣待制右諫議大夫衛膚敏殿中侍御史張浚皆論以為不可甲子煥改授觀察使而上以太后故不忍罷忠厚職名給事中劉珏中書舎人汪藻引故事極論之藻徳興人也於是翰林學士朱勝非言膚敏所論有故事陛下即位四方引領以望新政今乃坐戚里而去争臣非所以示天下也都統制王淵至秀州下令訓兵十日方行杭冦陳通等聞之為備稍緩翌早淵馳至杭州通走不及遂出迎淵入城撫定癸亥斬通并其黨一百八十餘人乃詔帥臣龍圖閣直學士葉夢得落職奉祠知秀州趙叔近落職罷任丙子御史中丞許景衡除尚書右丞以右諫議大夫王賔為中丞初故崇政殿説書河南程頥以道學為天下倡其門人髙弟則有故監察御史建陽㳺酢與今徽猷閣侍制将樂楊時是日以時為工部侍郎時年七十九矣入對首言自古聖賢之君未有不以典學為務者以君徳在是故也尋詔時兼侍講是時如右丞許景衡右文殿修撰胡安國左司郎官吳給殿中侍御史馬仲皆號得頥之學安國崇安人給須城人也自後傳之浸廣其間志於利禄者託其説以自售而世亦莫辨其真偽矣此據楊時墓誌及胡安國奏状修入初建州禁卒張員等既叛統制官王淮雖駐兵城下未能破賊有軍校魏勝者獨不從亂頗能調䕶其黨於是守臣張動與提舉官王浚明令勝諭員等已奏朝廷軍人本無叛意縁轉運司不支卸甲錢以致作閙自此稍定是月有詔本州招安補勝承信郎權監押賊遂開城門縱人出入動與浚明各罷去金人左副元帥尼雅滿之自草地歸雲中也遣使往夏國約同侵陜西夏人從之及知張邦昌已廢遂率諸将分道来侵右副元帥鄂勒琿原名窩里嗢今改正下同與其弟烏珠原名兀术今改正下同自燕山率衆由滄州渡河侵山東尼雅滿自雲中率衆下太行将由河陽渡河攻西京又别遣萬户羅索原名婁室今改正下同副以萬户薩里罕原名撒离曷今改正下同及貝勒原名孛堇今改正下同黒峯侵陜西又萬户銀木等侵漢上燕山軍欲先圍汴京又分兵趨揚州時留守宗澤増修禦敵之備城外地方千里無糧可因烏珠乃遣人告尼雅滿謂獨力難攻尼雅滿報以将輟西京之行併力圍汴既而知未可圖如烏珠所言遂已於是燕山軍肆暴於京東諸路而羅索等至河中府本朝官軍扼蒲津西岸敵不得渡遂潛由上流韓城縣一夕履氷而過直逼長安於是蒲津官軍不戰自潰時河東之民心懐本朝所在結為紅巾出攻城邑皆用建炎年號見有脱身南歸者往往助以衣糧且言只俟天兵過河亦不須多當藉聲勢盡執敵人戮之金衆之在河東者稍稍遷以北去金之兵械亦不甚精但心協力齊奮不顧死故多取勝然河東人與之習熟略無所懼是年於澤潞之間刼左副元帥尼雅滿寨㡬復之故金捕紅巾甚急然不能得其真則捉平民以塞責有舉村被害者故强壮者多奔以逃命而紅巾愈盛矣
