body:
  text: 中興小紀卷三宋熊克撰建炎二年嵗在戊申春正月丁亥復詔此事前已降詔河東河北郡縣失職之吏失次之軍失業之民渡河而南仰陜西京西帥臣監司悉心措置於沿河州縣分布收納官員即赴行在公人補充職役兵士就填逐處闕額百姓給以官田假其牛種仍令於寺觀權居金大將尼楚赫兵號二十萬攻鄧州先是詔諸道貢賦皆聚于鄧守臣直龍圖閣兼京西帥劉汲營繕儲峙所以待乗輿之具甚備戊子城陷汲死焉庚寅以秘閣修撰吕源為兩浙轉運使直秘閣姜仲謙副之源升卿子也於是言者謂源家富於財初結林靈素孟昌齡而得監司結梁師成而為廣帥若仲謙則為譚稹之奴至除延閣今兩浙人心未安豈堪二小子擾之耶詔與别路既而改源知揚州仲謙廣西轉運副使先是杭温二州上供物留鎮江府有以螺鈿為之者上惡其竒巧命守臣錢伯言毁之壬辰伯言奏已毁於市觀者悦服上因謂宰執曰朕早來語御史張浚曰還淳反朴須人主以身先之天下自然嚮化黄潛善曰誠如聖諭初𣙜貨務都茶埸既移真州至是戸部尚書黄潛厚言其地近行在而兩處給鈔引非便請併歸一司從之時給事中劉珏論潛厚不已遂除延康殿學士提舉醴泉觀先是有撰勸勇文者揭於關羽廟中其言雖俚而切略曰敵兵擾亂甚久百姓因而破家者皆當復讐力戰若不能此枉作男兒雖活何益去歲敵來百姓已錯今年防敵不可怯懦汝若怕敵則敗不怕則勝况敵有五事易殺敵連年戰辛苦易殺馬倒不能起易殺深入重地力孤易殺多帶金銀易殺作虚聲嚇人易殺各宜齊心協力共保今歲無虞於是直秘閣京西提刑謝貺得而上之詔兵部刋板散示諸路初本朝取士制進士外有諸科而明法在其中熈寜以來罷諸科獨明法為時所尚故存之然以舊科但取記誦之學乃改號新明法許曽應諸科人就試崇寜初併入進士額此科遂廢至是大理少卿呉瓌言法官闕人乞復立明法之科進士曽豫薦者聽其試癸巳詔從之殿中侍御史張浚言兵部尚書董耘諂事童貫南征北伐首尾幕中納賄賂以市官資飭表章以肆欺罔海内咸怨陛下總師濟鄆仍縁獲進葢有所自豈可濫居髙選丙申以耘為延康殿學士提舉洞霄宮遂召徽猷閣侍制知東平府盧益為兵部尚書金大將羅索乗地大震進攻長安時城中兵僅千人帥臣龍圖閣直學士唐重嬰城固守援兵無至者戊戌經制通判傅亮以所部降金城遂破重與轉運副使桑景詢總管楊宗閔通判曹謂皆死重眉山人後謚曰恭愍宗閔崞縣人景詢懌孫也先是重辟雅州知録丹稜楊仁欲以自助仁辭不行乃為重言今全陜之重必宰輔親臨大號召天下之兵勢可百倍昔婁敬脫輓輅一言漢髙感悟即日駕關中况近臣為帥有請上當必從重未及用而死金人左副元帥尼瑪哈攻河南府留守孫昭逺遣驍將姚慶拒之于偃師軍敗慶死昭逺命將官王仔奉啓運諸殿神御間道走行在至是敵兵益熾昭逺戰不利己亥其下擁昭逺南去避敵昭逺罵之曰若等衣食縣官不以此時報國南去何為叛兵怒擊昭逺死焉昭逺抃孫也是秋神御乃至行在時尼瑪哈恐東京留守宗澤以兵邀擊萬户尼楚赫故自據西京與澤相持使尼楚赫無後顧之憂云庚子以主客郎官謝亮為陜西撫諭使羣盗有張遇等號一窩蜂初犯江寜府江淮制置使劉光世截其後軍破之遇轉由真州是日攻陷鎮江府守臣錢伯言棄城而去内侍邵成章不守本職輙言大臣辛丑詔自祖宗以來未有内侍言大臣者成章可除名南雄州編管先是劇賊丁進號一箭者以萬餘人攻壽春府守臣直秘閣康允之率軍民固守賊解圍去允之奏至甲辰上謂宰執曰此郡守得人之效也卿等六人宜廣詢人材若人得二人則列郡便有十餘守臣稱職然須參議不可徇私張慤曰崔祐甫嘗謂非親非舊安敢與官今日當問所除當否耳上曰徇私用親舊固不可果有真賢實能是親舊乃不敢用亦非也但扶公道抑僥倖自無嫌怨矣黄潛善曰好惡之言事定則是非方見如周公亦未免於疑所以古人多期於後世之君子上曰然尋除允之直龍圖閣鳯翔府奏以方士彭知一所燒金發來上劄付三省曰朕不忍燒假物以誤後人令發還之仍毁其燒金之具乙巳右僕射黄潛善言臣等伏讀親筆知陛下側身修政動民以行四方鼓舞葢盛徳之舉也上曰當與卿等共持此誠以隆中興之業初詔在京三省樞宻院省臺寺監百司當畨人吏隨到駐蹕處先轉一資事定别推賞不到者勒停編管至是中書舍人汪藻取門下省七十九人中書省七十一人尚書省一百八人皆當轉資庚戌上問宰執曰到者二百五十八人其不到者何不具此賞未可行候見當罰人數同上於是黄潜善等惶懼葢上厲精庶政洞察如此右諫議大夫衛膚敏因論孟忠厚不合改除中書舎人不肯就職辛亥上以問宰執黄潜善等曰給事中劉珏亦未書牘殿中侍御史張浚章再至中書舍人汪藻亦言忠厚與邢煥事同難獨草煥制於是張慤流涕曰陛下循祖宗成憲惟忠厚冒此職士議甚喧諫官卧家幾月臣竊惜之郭三益曰陛下屈法於忠厚為太后也慤流涕而請為天下也願從慤言潜善與汪伯彦亦論忠厚當換武階陛下重違太后即乞以臣僚論䟽納東朝自降處分上曰不若以䟽付忠厚令自請則事體兩全壬子宰執奏事上曰太后令與忠厚換武階矣遂除正任承宣使上曰朕為兹事不下懐今月餘矣潜善曰天下幸甚慤又曰昨髙遵恵之子能言其父在元豐末除侍制宣仁不敢私之但遷一秩其後遵惠為侍從乃紹聖間非宣仁垂簾時也時忠厚以遵惠藉口故朝論不平因詔后族自今勿任侍從官著為令初一窩蜂賊張遇既破鎮江府遂屯于金山寺及楊子橋衆約三萬詔西浙制置使王淵招安之賊遂聽命至是淵歸自杭州自將數百騎穿遇寨而過遇見淵軍器械精明惶懼迎于馬首淵曰汝等賴我來晚故得受降若來早已無遺類矣淵奏授遇閣門宣賛舍人其黨劉立等各補官守臣錢伯言始歸鎮江既而詔降伯言二秩淵自承宣除宣徳軍節度使初言者乞以崇寧無狀之人編為一籍省臺各録副本不許堂除及任守宰已得㫖行矣是日詔略曰朕惟臣寮趨操弗端致貽國患理宜昭示好惡使人同知然念才行難於兼全一眚不可終廢除罪重人外並隨材選任如率職勵行可補前失則與擢用以吏部尚書路允迪為僉書樞密院事言者因論允迪甞托朝士郭太冲買妾遂薦為本部郎官於是允迪以疾乞祠二月丙辰除資政殿學士提舉洞霄宮宣教郎馮鐸言今潰兵為害乞令鄰州之在五百里内者互相䇿應是日詔諸路鄰州三百里内互相䇿應承報而不去者重寘之法言者論龍圖閣直學士鄭修年乃居中之子顯謨閣直學士劉阜民乃正夫之子徽猷閣侍制余日章白彦暉乃深與時中之子皆乳臭小兒初無出身及文學政事乞並鐫其職是日詔從之龍圖閣直學士知洪州胡直孺奏江西五害經制司敷甎瓦萬數浩大一也誘民以私財助國旁及寺觀使臣人吏亦均其數二也州縣受納米一石加至五斗三也朝廷所需皆取之行户動以千計四也監司多不體國務收已恩為保家之計不因有勞巧為髙設動搖軍情致其愈驕使帥守之威令不伸五也望詔除此五者以固人心然後汰監司之躁妄去兵官之愚怯者實中興之先務也詔奬之辛酉刑部尚書周武仲移吏部以御史中丞王賔為刑部尚書户部侍郎兼知揚州呂頥浩進尚書時劇賊張遇等雖受招安而猶縱兵四刼乃詔頥浩率江淮制置使劉光世兩浙制置使王淵等圖之於是頥浩單騎入賊營遇等皆出迎惟劉彦不至乃主謀不降者頥浩斷其足釘於楊子橋餘黨怖而釋甲時四方薦士皆試于中書後省潭州布衣何烈對䇿用廷試體稱臣壬申諫官李處遯請黜烈併劾考官於是降烈充末名而中書舍人汪藻滕康衛膚敏並罷處遯河南人淑孫康宋城人也三月乙酉朔詔遣御營使司左翼軍統制韓世忠領統領官陳思恭及新招到張遇等軍一萬人赴西京時金將羅索自長安進攻秦鳯右都䕶張嚴擊敗之又金將尼楚赫既破鄧遂併掠汝金房凡四郡之民以歸左副元帥尼瑪哈聞世忠將至而羅索已敗親援之乃留左監軍烏克紳原名悟室今改正下同與右都監伊都原名余覩今改正下同屯河陽以待世忠庚子尼瑪哈盡焚西京掠其民而去知河南府翟進遂入洛陽城進伊陽人也初靖康宰執何㮚陳過庭聶昌皆扈二聖北狩丙午除㮚觀文殿大學士提舉玉局觀過庭資政殿大學士提舉太平宫昌資政殿學士提舉崇福宫時昌已死朝廷未之知也初浙東副總管楊應誠嘗為廉訪使者至是頗為帥臣翟汝文所抑不能自安遂首應詔願使絶域謂嘗隨其父任邊吏熟知敵情若自髙麗至女真其路甚徑請身死三韓結雞林以圖迎二聖是日詔應誠借刑部尚書充大金髙麗國信使以武臣韓衍借忠州防禦使副之於是汝文奏應臣欺罔君父自為身謀實無竒策可返翠華茍應誠至髙麗辭以大國之使假道以問二聖之所敢不承命或金人聞使臣至自敝邑却請問津以窺呉越將何辭以對决辱命取侮逺人臣已檄四明若應誠至毋濟其行不報應誠聞此乃自杭州登海船以往時諸路方行巡社之法東平府守臣權邦彦亦奏東河縣民自相糾集為巡社敵不敢逼而言者已謂其法利於西北而不利東南乞罷之夏四月己未詔陜西河北巡社依舊餘路並罷時杭温二州已就緒請存留亦不聽言者已謂近日帥守之棄城者習以成風如鄧雍之於荆南何志同之於頴昌趙子崧之於鎮江皆擁兵先遁今則安居薄責而未正其罪义如康允之之於壽春陳彦文之於九江以數千之疲旅捍十萬之强敵而允之止遷一職彦文纔復舊官議者惑焉願著其賞罰以示勸懲是日詔從之時經筵講論語及讀資治通鑑故事五月至八月罷講庚申上諭宰執曰朕履兹艱難方孜孜經史若廢之累月則疑義無所質朕欲勿罷可乎宰執皆稱善遂詔勿罷又上欲旌賞有功將士嘗命綾錦院監官姜渙㨂工匠權赴軍器所織戰袍以備宣賜或言少府監於織作所捉人而監丞許任申初無是事宰執以奏上始知言者之妄因問少府官為誰黄潜善等曰監少馬居中張元膺皆小心能辦事張慤曰若只付綾錦院織令長貳督之保不誤事詔可潜善曰陛下洞察人情庶政各歸攸司深鑒前日因事置局紊亂綱紀之弊葢中興之漸也初上登極赦覃恩轉官朝請大夫至中奉不限正法而三省樞宻院吏亦有合轉者宰執奏取㫖甲子上曰吏雖該恩豈宜與士夫一等可令回授有服親黄潜善等曰陛下既分流品増榮士類則人知歆艷相率赴功此致治之本也乙丑御營使司左翼軍統制韓世忠至西京時金將烏克紳伊都之衆屯河陽世忠約知河南府翟進及新降丁進及孟世寧等三軍併力與金戰丙寅進夜攻金營而金已預知反為所襲而敗烏克紳復入據西京進乃為世忠前導再與金戰于永安縣㑹丁進等不至而統制官陳思恭領後軍先走世忠敗績其將張遇救之僅得免收潰兵數千歸于行在先是扈聖駕後軍至寶應縣而亂既又殺統制官姓龎人遂去為盗有孫琦者為之首衆至五萬癸未琦等入據唐州初二聖北狩諸親王皆從獨王弟信王榛至慶源府遁歸乃變姓名隱於真定境内又宣和末童貫宣撫河東自太原遣保州廉訪使者馬擴往真定募兵或告擴於帥臣劉韐謂擴欲獻城於金韐收擴繫之獄韐崇安人擴狄道人政子也既而韐去金䧟真定城擴與羣囚走出為金所擄不死時有武翼大夫趙邦傑者聚忠義鄉兵於五馬山作寨擴往依之邦傑與擴聞信王在民間遂率兵擊奪榛以歸奉之為首故兩河遺民聞風響應皆受旗榜至是榛奏雖尚未逹而朝廷已聞信王有渡河入京師之謀五月己酉乃詔朕將還京闕恭謁宗廟仰三省樞宻院御營使司條具當辦者取㫖行之左僕射黄潜善等以右丞許景衡議論與已異始共排之初李綱既去而遷都南陽之計格遂幸維揚景衡復請上渡江潜善等因已降詔囘京故言者以景衡之説為非至是罷為資政殿學士提舉洞霄宫未幾卒識者哀之言者以為頃歲民間養馬州縣民注之於籍時或和顧亦借用之人苦其擾乞今後不得拘籍仍免顧借丙戌詔從之陜西京東諸路及北京留守並奏金人分兵渡河辛卯詔統制官韓世忠等各領所部兵迎敵令京城留守宗澤遣新招到楊進等援之世忠至京東為金所敗其將張遇死焉甲午曲赦河北陜西四路時江淮等路發運復添副使一員是日以秘閣修撰知揚州吕源為之太常少卿周望奉使未行除起居郎先是責授散官韶州安置宇文虚中應詔願使絶域遂詔赴行在丙申詔宇文虚中復資政殿學士羣盗有號李鐡棒者與靳賽等合兵四萬人擾隨州是日破光山縣壬寅中書侍郎張慤卒士庶皆痛惜之諡曰忠穆熈河經略使華隂張深奏走馬承受内侍蘇淵尚習故態敢陵帥臣乙巳詔承受見帥臣如屬官禮己酉秀州禁卒徐明等叛囚守臣詔帶御器械張浚統兵往討遂平之擒明獻于行在復秀州在六月戊辰今聨書之是月金大將羅索至鳯翔府熈河帥張深遣偏將劉惟輔統兵三千禦之惟輔以精騎千餘夜逾新店金恃勝不虞惟輔舞矟刺其將黒峯大王者羅索勢窮遁走深更檄右都䕶張嚴以兵繼進嚴趨鳯翔戰五馬山下兵敗而死金謀趨涇州時涇源統制官曲端與本路正將呉玠屯軍原上有統領官劉彦希自鳯翔退歸端斬以徇乃遣玠率前軍據青溪嶺以拒敵端鎮戎人玠隴干人也端知書善屬文而長於兵略與金戰屢㨗金頗勇之左副元帥尼瑪哈聞嚴已敗取平陸渡河由解絳晉汾以歸雲中羅索遂自馮翊渡河破潼關䧟同華陜以西於是直龍圖閣知延安府王庶遣將斷河橋又遣將屯神水峽斷其歸路金人遂遁時有詔陞庶龍圖閣待制六路軍馬制置使庶慶陽人也此據庶傳修入初建州叛卒張員等雖受招安而疑權監押魏勝圖已一日勝於通衢呼員等曰我心為汝而見疑如此可决於神若卜不吉汝當殺我員等舉筶擲之而吉自此始安時以職方郎邵武謝如意為福建轉運判官如意至建陽宻遣人結路分都監黄濤及勝共誅員等首惡六人勝招員等赴路分㕔受宣劄既至悉擒誅之後數日如意入城人情稍定既而新守城莆田方承被命賫勑榜諭衆卒承留建陽不敢進六月丙辰夜軍校葉濃復叛突城而出遂犯福州古田縣戊午以禮部侍郎兼直學士院王綯為御史中丞時内侍康履用事諸將有奉之者而綯不敢言北據野記修入借刑部尚書楊應誠等奉使至髙麗丁卯見國王楷傳聖㫖借道以逹金國楷拜謝與應誠等對立論事且言事大朝日久皇帝即位方欲入貢遽䝉降使昨聞二聖逺征本國惶懼金人舊時弱今兵威如此亦嘗遣兵來奪去所築九城因此不和應誠等言本朝累聖待貴國最異非他國之比今時偶多艱假道此去只是講和於貴國無害楷曰大朝自有山東海道何不由登州以往應誠等曰不如貴朝去金最徑但煩國王報金國應誠至界首待報而後行兼三節人皆自賫糧不敢以浼貴國惟借馬二十八匹而已楷曰容與諸臣議遂遣門下侍郎富佾至館議曰聞金人見造海船欲往兩浙若引使至其國恐彼却要借路至兩浙則何以處應誠等曰女真不能水戰佾曰東女真常於海道往來况女真舊臣本國近却要臣事以此可見强弱留數日楷又遣中書侍郎崔洪宰知樞宻院事金富軾來議亦守前説葢其君臣畏金人之强堅不肯假道且言二聖見留燕雲不在金國又曰金國决不肯和應誠等不得已遂回言者以為東南武備利於水戰宜於江上廣造戰艦列於南岸仍防姦人有乗風盗爇之患設不此圖則寡不足以敵騎誤事必矣己卯詔沿江措畫限一月畢資政殿學士東京留守宗澤病諸將楊進等曰今四方義士雲集都城幾百萬糗糧亦備聞河北金兵殊少脅從者日望王師之至而留守嬰疾進等憂焉澤遂力疾而起合諸將鋭兵數十萬涓日渡河復抗䟽請上還京且曰臣若誤國一子三孫甘被顯戮是月澤卒後諡曰威愍殿中侍御史晉陵張守言今防秋在邇而朝士往往引去願榜朝堂以戒敕之秋七月先是湖州薦選人張體純敦遣赴行在授江東茶鹽司幹官又提領措置茶鹽所辟朝官鄭待問為屬官於是言者論體純待問皆以進頌得官豈可冒部使者之屬癸未朔詔悉罷之仍詰問湖州及提領官以二人皆係濫補因何舉辟體純金壇人待問江山人也丁亥宰執奏楚州發來歸朝官事上曰聞諸州多囚繫此輩經歲不釋小有疑則加害朕甚憫之覆幬之間皆吾赤子偶生邊地豈可與金人一概待之金人與吾戰率諸國之衆荐冒鋒鏑使肝腦塗地彼亦何辜朕欲悉發行在存拊之庶可召和氣汪伯彦曰王者仁不異逺陛下皆與生全葢如天矣黄潜善曰陛下一視同仁愛之如傷此盛徳所以通於神明矣是日詔國步多艱人材為急如蔡京王黼當國日久孰不由其擬授果賢或才豈可不用自今毋得分别使自奮忠義三省遵行之戊子詔宰執曰朕昨親筆外人頗聞之否黄潜善曰陛下廣收人才以濟時艱天下士聞之必歸心矣潜善又曰内侍王嗣昌以何罪送吏部上曰嗣昌為門司好大言議國政與邵成章為死黨不可不斥潜善曰臣一刻之間三聞陛下大哉王言此中興之兆也
