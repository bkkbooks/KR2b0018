body:
  text: 中興小紀卷六宋熊克撰建炎三年夏四月戊申朔上御朝太后便欲還政上以問朱勝非對曰捲簾當先降詔乃乞太后暫出仍下詔明日捲簾并復建炎年號勝非又奏二凶未有一處乃並除淮南兩路制置使許以所部兵行仍以其屬張逵為本路轉運判官二凶請鐵劵乃令有司檢故事如法製焉二凶又言王世修尚可從軍否勝非曰渠為從官難復預軍謀矣時傅遣其弟翊伏赤心軍于臨平伺擊勤王之師御營前將軍韓世忠曰乳臭兒敢爾耶是日翊戰敗二凶遣兵救之朝廷諸將皆集皇城門外守臣康允之以為不可不若遣人諭二凶速引兵去是夕二凶乃開湧金門以出遇大雨倉皇而遁世忠勤王之師至北關辛亥入城擒工部侍郎王世修及中軍統制官吳湛皆戮之壬子以禮部侍郎御營使司參贊軍事張浚為知樞密院事時中司闕官右僕射兼中書侍郎朱勝非因薦中書舍人張守以為守預聞反正謀議詔以守為中丞勝非因力請解政癸丑出為觀文殿大學士知洪州以資政殿學士同僉書樞密院事吕頥浩為右僕射兼中書侍郎一時執政俱罷於是門下侍郎顔岐為資政殿學士提舉鴻慶宫中書侍郎王孝迪為端明殿學士提舉崇福宫尚書右丞張澄為資政殿學士知江州資政殿學士僉書樞密院事路允迪以本職提舉醴泉觀兼侍讀惟僉書樞密院事李邴遷尚書左丞同僉書院事鄭㲄進僉書院事詔管軍王元左言各責散官并浙西機宜時希孟並安置元英州言賀州希孟吉陽軍初議反正樞密都承㫖馬擴亦往來其間至是以擴為觀望停其官責永州居住初倉部郎中張虞卿等一十九人皆乞建藩鎮朱勝非嘗奏其事謂當倣藝祖之初權時制宜以行在為京師淮北為鎮淮南為郡至是勝非去未果行之虞卿建安人也甲寅以奉國軍節度使殿前都指揮使劉光世為太尉御營副使劉光世行述曰時上面授光世僉書樞密院光世力辭定國軍承使帶御器械韓世忠為武勝軍節度左軍都統制寧武軍承宣使帶御器械張俊為鎮西軍節度右軍都統制餘皆進秩一級乙卯大赦天下知樞密院事張浚薦朝奉大夫趙鼎趙鼎事實曰上初渡江詔郎官以上薦士時都司黃槩以鼎應詔至杭聞復辟始入城而張浚又薦之鼎見浚首曰隆祐復辟其功甚大當檢纍朝捲簾故事推恩其家丁巳常德軍承宣使孟忠厚除寧逺軍節度醴泉觀使遂以鼎為司勳郎官鼎聞喜人也詔崇寧以來內侍用事自今不得與主兵官交通及干預朝政如違並從軍法初敵攻淮甸發運副使吕源以兵三千自衛而遁為中丞鄭㲄所論已詔停其官送卲武軍編管至是軍器監葉宗諤除直龍圖閣與右文殿修撰葉煥並為發運副使除葉煥在是月辛酉今聮書之戊午户部尚書孫覿除龍圖閣學士知溫州既而改知平江府苗傅攻衢州城守臣晉陵胡唐老禦之㑹大雨賊引兵去時言者引元祐宰臣司馬光併三省狀乞舉行之詔侍從臺諌集議中丞張守以謂光之所奏較然可行若更集衆徒為紛紛庚申右僕射吕頥浩等乃言欲左右僕射不兼門下中書侍郎並帶平章事舊門下中書侍郎改為參知政事其左右丞並罷從之於是左丞李邴改參知政事詔都停驛同文館並罷都水監仍置使者一員癸亥以給事中周望為江浙制置使乙丑望言乞降賞以徠賊之降者從之丁卯上發杭州幸江寧府命御營左軍都統制韓世忠亦為江浙制置使統一軍追捕苗傅初賜門下詔略曰東朝有垂簾保佑之勞元子有踐祚纂承之託宜上徽稱於長樂正冡嗣於青宫太后上尊號曰隆祐皇太后嗣君立為皇太子皆令有司擇日壬申乃克行禮於是禮部尚書王綯除資政殿學士權太子太傅時殿帥劉光世遣其將王德喬仲福追賊至信州皆令受周望節制初朝廷遣統制官巨師古將兵討山東賊趙不忙至是回信上與德等遇而韓世忠下禆將陳彥章亦至德與之同見郡守語不協彥章欲刺德德手刃殺之苗傅等聞信城有兵不敢進乃屯於衢信之間且黥居民為兵其衆方盛時未可擒言者謂王鈞甫馬柔吉初不預謀見將赤心隊為先鋒以拒王師宜下詔寬二人之罪以誘致其降從之時州縣添差官猥衆如平江府監酒四五員湖州監稅五六員安吉縣監酒六七員是月詔官冗蠧財理當澄汰除宗室歸朝官外餘悉罷之監司屬官亦依此行初勤王所檄至湖州守臣梁端㑹寄居葉夢得賈安宅曽懋等謀之衆未及言主管鴻慶宫曽紆曰此逆順甚明出師無可疑者趣端張榜用建炎年號時賊使來取兵器紆又請擊之毋令還既而端被賞至是中丞張守言紆首明大義詔除顯謨閣而殿中侍御史楊庭秀亦言杭州通判章誼首叱時希孟使人知逆順詔擢誼為倉部郎官安宅歸安人懋贛縣人紆南豐人布子也初叛臣劉豫據濟南以降金至是金徙豫知東平府兼節制河南於是右副元帥鄂勒琿與監軍達蘭分占山東諸郡惟濟單興仁廣濟以水阻尚存焉五月戊寅朔以知樞密院御營副使張浚為川陜宣撫處置使初命浚為招討使左司郎官權中書舍人江都李正民言川陜吾境難名招討請用唐裴度故事從之仍詔浚便宜黜陟正民未幾除中書舍人時祕書省權罷而日厯之局亦廢正民謂宜置著作一二員選文學之士兼領仍以日厯案𨽻門下省亦從之辛巳上次鎮江府諭宰執曰張慤古之遺直陳東誅死可念二人皆葬郡境已親劄令有司致祭可更議恤其家先是右僕射吕頥浩建議幸武昌為趨陜之計既又欲徙中原之民於東南御史中丞張守右諌議大夫滕康皆不可守曰東南今日根本也康語守曰吾曹當以死爭之於是上擢為翰林學士癸未又以康為端明殿學士僉書樞密院事康既執政再懇言之上悟而止頥浩語康曰公真執政也孰有受命二日而能决此大計者乎乙酉上至江寧府駐蹕仍改為建康府時以保寧寺充行宫時統制官王德欲與江浙制置使韓世忠戰世忠曰苗劉未平若與之戰乃是更生一敵不如避之丙戍苗傅等冦浦城縣韓世忠將兵夜至縣北十里賊跨溪據險設伏於路世忠使統制官馬彥輔擊賊伏發死之賊乘勝至中軍世忠率親兵力戰傅大敗遂擒劉正彥有舉子程妥者崇安人時虜在傅軍乃為傅畫䇿領餘衆由小路入崇安縣境既又夜棄其軍變姓名作賈人偕妥及其愛將張政西走至斂鋒村為土豪承節郎詹標所邀苛留數日妥覺不免密告標曰此苗傅也標即報福建提刑林杞遂聞於朝杞永嘉人既而告者謂政本誘傅出降把等惡分其功而殺之故把標皆就逮把除名連州安置而標死于獄林把遺事曰苗傅劉正彥既敗擁衆南走大將韓世忠尾賊而追之時杞為閩憲恐賊至得脫預檄諸郡扼其奔衝既而正彥先為大軍所擒傅與其徒數人變姓名竄伏人莫能蹤跡杞立重賞捕之俄而募士詹標擒傅與其徒張政以至是時世忠已班師由太末以歸把冒暑親部送傅政欲追赴世忠至富沙境上㑹日暮大雨政乘此謀竄去為護兵所殺杞獨以傅追及世忠授之世忠得傅喜曰今當還朝首為公論功杞曰此非某之本心况太尉自浙右提師破賊而追至某借大軍餘威獲之匹夫力爾何功可論初知建州某人者與當軸為姻恃勢貪婪用官錢至纍巨萬而監司忌於投鼠皆不敢發杞曰吾為憲官豈可開眼放贓吏亟以其罪聞某人讒於當軸遂以張政為告苗傅反者宜得重賞而杞殺之遂下杞於獄幾欲置之死不得已猶削籍連州安置然傅事有本末傅天資狠暗正彥直狂者爾而政實為之腹心既敗猶與傅同竄其不告之明矣臺諌知把寃相繼論列不數月有㫖許自便遺事所記小異蓋其辭不無緣飾也甲辰龍圖閣直學士提舉萬壽觀詹義兼權直學士院義縉雲人未幾乞祠詔升徽猷閣學士提舉洞霄宫以示優禮癸巳詔諸路預和買絹綿即支其直違置之法丁酉尚書省言欲將江池饒信為江州路知州帶安撫使建康太平宣徽廣德為建康路知州帶安撫制置使庶幾責任稍専從之己亥宰執請依祖宗官制置中書門下檢正官樞密院檢詳官各二員仍减左右司郎官兩員從之初羣盜薛慶靳賽皆嘯聚淮上慶據髙郵軍衆至數萬知樞密院事張浚聞其欲歸麾下請自往招撫之才渡江而賽率兵降于浚浚徑至髙郵入慶壘從行者不及百人出黃榜諭之慶感服再拜慶欲求厚賞留浚三日而外間不知浮言胥動真州守臣以聞宰執議遽罷浚除資政殿學士奉祠仍遣統制官王􅊛提兵往平其事􅊛渡江慶先以兵衛浚而出乃召浚赴行在浚辭曰髙郵之行徒恃忠信雖不至如所傳聞然身為大臣輕動損威其罪莫大詔不允辛丑浚還上歎息即日趣就職既又改髙郵軍為承州仍命慶守之先是上方擇人使金宰執薦持服人朝散郎鄱陽洪皓乃擢為徽猷閣待制借禮部尚書奉使大金軍前以眀州觀察使龔璹副之時淮上賊蜂起李成甫就招安詔皓兼淮南京南撫諭使命成以兵護至南京皓至淮南成方引兵與耿堅共圍楚州責守城趙立謂其降敵而城棄因持叛心立彭城人也成以汴泗及虹有紅巾為辭且言非五千騎不可往軍絶食不克惟命皓知堅可撼遣人說之曰山陽縱有罪當禀命于朝今擅兵攻圍名勤王實作賊爾堅遂强成斂兵皓即疏言李成以朝廷不恤之而稽饋餉有引衆納命建康之語今靳賽據維揚薛慶據髙郵若三叛連衡何以待之此含垢之時宜遣辨士諭意優進其秩畀以京口綱運如晉待王敦可也上遂遣宣贊舍人賀子儀撫諭成給米五萬石而皓轉由滁陽以至太原六月己酉詔初下劉珏忽謁告一日之蔣山明日同舍問獨登山樂乎珏曰非登山也特往拜舒王墓爾誅苗傅劉正彥及張逵等于建康市按建炎復辟記以是日誅苗傅等而吕頥浩勤王記乃十五日壬戍三省樞密院置賞功司自興軍以來立功將士許之持文自陳各以輕重推恩甲寅吏部侍郎劉珏遷尚書時舊相黃潜善汪伯彥袁植皆已逺貶戊辰秀王見上曰昨見罷植之命有曰忠厚之言不聞殺戮之事可戒大哉王言也太祖以來未嘗戮大臣國祚久長過於兩漢者此也未幾潜善卒于貶所是日詔將親閲諸軍庶知諸將能否仍令宰執預觀辛未御史中丞張守再論吕頥浩難以専任而張浚不宜西去甲戌除守禮部侍郎以中書舍人范宗尹為中丞時殿中侍御史王庭秀亦難頥浩除擬不公詔庭秀罷職與郡於是右正言吕祉言今日緣論大臣移一言官明日緣論大臣罷一言官則後日大臣行事有失誰復敢言願陛下以言章示大臣使之自省置身無過之地庶兩全之如或不悛黜之何惜祉建陽人也時以華藏寺為建康府治而江浙制置使韓世忠權住蔣山詔世忠候建康府移保寧宫即聽居華藏緣保寧有先朝房院尚在守臣顯謨閣直學士安陸連南夫未及遷入而世忠逼其骨肉狼狽出寺於是殿中侍御史趙鼎言世忠躬率使臣排闥而入逐天子之京尹此而可為則無不可為者矣南夫治郡緩不急事願先罷之然後降詔切責世忠仍治其使臣之先入者此為兩得上深嘉納且曰唐肅宗興靈武諸事草創得一李勉然後知朝廷尊今朕得卿無愧昔人矣於是諸將帖然畏服亦罷南夫而以兵部侍郎湯東野兼知建康府秋七月祕閣修撰知廬州胡舜陟言金人見侵鑾輿順動使之深入中原往來自如我莫敢抗惟務逃遁何時而已臣願身當江北之地以護行在儻仗天威稍摧敵鋒則生靈休息庶幾有期今淮南羣盜多者數萬少者數千臣欲以本州將兵鄉兵及所降劉文舜之衆共二萬餘人仍更招羣盜須得數萬結之以信輔之以威足以捍敵今日侍從近臣多擇閩浙大郡以往而臣乃欲當江北地非狂則愚第以忠義所激不敢愛生若其養兵之物與夫屯泊訓錬戰陳之方乞容臣赴闕面奏甲申詔舜陟議論慷慨除徽猷閣待制淮西制置使時江浙制置使韓世忠已除兩鎮節度使於是周望自給事中為兵部尚書立功將佐皆第賞之世忠訟王德擅殺陳彥章詔鞫于御史臺殿中侍御史趙鼎攝德下獄案成以死刑定斷朝廷以德有戰功貸其命於是鼎言德總兵在外而擅殺不顧此風一長其禍有不可勝言者乃編置德於江州丁亥皇太子敷薨諡曰元懿僉書樞密院事鄭㲄卒己丑詔恩數依郭三益上慘然語宰執曰㲄論事豈易得昨元子薨朕雖動懷然聞㲄亡尤悼之初金人入京東命平冦前將軍范瓊領兵轉入江西至是右正言吕祉論其罪且進取瓊之䇿乃詔瓊赴行在時瓊駐軍南昌徘徊觀釁詔監察御史松溪陳戩趣其入覲戩至瓊整兵而後見且剝人以懼之戩諭瓊曰聖上勇智天錫宵旰圖治將軍宜戮力濟難以遺澤於子孫效郭汾陽朝聞命夕引退可也瓊尚未决戩曰將軍不見苗劉之事乎願熟計之瓊翻然北嚮謝恩遂引兵赴闕既至未嘗肯釋兵自陳祖宗以來三衙不任河東北及陜西人且乞除殿前司之職又言自鄂嶽以來凡招盜一十九萬上謂宰執曰瓊罪甚大靖康圍城日與金人交通逼宗室出城且為張邦昌之衛都人恨不食其肉貸而不誅以安反側今復無禮如此且盜雖多安有十九萬人瓊言此欲以恐動朝廷爾張浚曰臣自平江勤王凡三遣人致書約令進兵瓊皆不答今呼吸羣凶布在列郡以待竊發若不乘時顯戮他日必有王敦蘇峻之患上深以為然命浚召瓊赴都堂議事密謀誅之浚與樞密院檢詳文字劉子羽選院吏數輩作文字劄榜皆備鎖吏於府中子羽崇安人韐子也壬辰遣御營前將軍張俊以千人渡江若捕他盜者使皆甲而來因召瓊俊及殿前都指揮使劉光世詣都堂計事為之計食食已相顧未發子羽坐廡下恐瓊覺事變遽取寫勑黃紙趨前舉以麾瓊曰有勑將軍可詣大理置對瓊愕不知所為遂擁置輿中衛以俊兵送獄仍使光世出撫其衆數瓊罪狀且曰所誅止瓊爾若等固天子自將之兵也衆皆投創曰諾初河北制置使王彥在太行山聚兵皆刺其面曰誓殺金人不負趙王號八字軍金人頗畏之瓊之往山東也彥與偕行彥以疾留其州瓊併領其兵而去時浚薦彥為御營使司統制遂以瓊衆分𨽻神武諸軍而八字兵復𨽻干彥皆頃刻而定瓊至獄猶不伏大理少卿王衣鞫治之瓊稱無罪衣徐以圍城鼓衆不順語折之遽曰瓊死罪衣顧吏曰囚辭伏矣遂賜瓊死衣歷城人也詔朝奉郎監諸司審計院崔縱除右文殿修撰借工部尚書充奉使大金軍前武節郎閣門宣贊舍人郭元明借遙郡刺史副之縱臨川人也初上問大計於張浚浚請身任西事置司秦州乞别委大臣與韓世忠鎮淮東令吕頥浩扈駕來武昌張俊劉光世等從行庶與秦州首尾相應議已定庚子浚發行在王彥統八字軍隨之時浚之屬官馮康國等往别臺諌殿中侍御史趙鼎謂之曰元樞新立大功出當川陜半天下之責邊事外悉當奏禀蓋大臣在外忌權太重也時金人左副元帥尼瑪哈自東平府歸雲中右副元帥鄂勒琿自濱州歸燕山右監軍烏珠請提兵窺江浙二大將許之仍留左監軍達喇原名撻辣今改正下同屯濱州以守山東乃遣女真渤海漢軍諸萬户并大起燕雲河朔民兵付烏珠將之入攻上以金人將入攻方遣兵守淮及控扼江上未有順動之意壬寅下詔奉隆祐皇太后率六宫先往南昌詔略曰朕念邊隅震擾國制搶擾因時變通隨事參酌合三省樞廷之任總百司庶府之繁爰命近臣俾司厥職若征伐財用賞罰選任等事悉屬其營具關朕聽其常程有格法事如四方刑獄奏案吏部注受並𨽻洪州三省樞密院遂以參知政事李邴同僉書樞密院事滕康並為資政殿學士邴權知三省樞密院事康權同知扈從以行監察御史陳戩一員而從官郎吏皆分其半又詔東京留守杜充已至是日除充同知樞密院事陳戩行據趙鼎奏議本用二員而沈與求改除金人試舉人于蔚州初太原帥張孝純因城陷降金見尼瑪哈不肯拜敵莫能强執歸雲中至是以孝純主文柄使孝純能守初志寧死不汚於敵後世必以為忠臣今乃為敵用是時遼人皆用詞賦兩河人皆用經義而孫九鼎者為第一欣州人也九鼎政和間遊太學與洪皓同舍陷敵十年始登第皓在北方屢見之八月己酉詔添發運副使從太后往江西以直祕閣劉寧止為之仍命龍神衛四廂都指揮使楊惟忠領兵萬人以從初有司月供太后錢一千緡后聖性儉約至是斥賣本殿絹二十匹充費上方知尋常用度不足因謂宰執曰朕事太后與所生母同近買得衣絹千匹即先分獻飲食亦然今往洪州未有回期除禁中自分納外令户部供錢絹各二萬銀一萬可趣令辦之資政殿學士權知三省樞密院事李邴與左僕射吕頤浩議不合力丐罷詔以本職提舉洞霄宫壬子更命資政殿學士滕康權知三省樞密院而擢吏部尚書劉珏為端明殿學士以二之賜康等手詔許綴宰執奏事寓治都堂於是頤浩言人謂陛下雖下詔固守建康而陰為避敵之計如曾懋尚疑之况小民乎宜量留嬪御掌批奏牘以固人心且免令內臣權管恐其不密或緣此開端上納之壬戌隆祐太后登舟以行東京副留守殿帥郭仲荀以敵逼京城軍儲告竭乃領兵赴行在都人從之南來者以萬數遂以京畿轉運使上官悟為東京留守悟邵武人均子也詔浙西安撫司移於鎮江府仍改杭州為臨安府帶管內安撫使丙寅上聞道君遣二內臣二宫女將與髙麗人使同至壬申謂宰執曰朕聞之一則以喜一則以悲朕别二聖已三年忽得安信豈不喜但道君當承平之久以天下奉一人今彼中凡百粗陋而朕居深宫廣殿極不遑安且朕父母兄弟及妻皆在異域唯一子又薨孑然一身當此艱難所以悲也玉音未已澘然淚下吕頤浩曰願陛下少寬聖抱力恢中興之業周望曰此必金人之意若非彼意數人者雖至髙麗髙麗亦不肯令來上曰然甲戌兵部尚書謝克家言今之官冗外方尤甚如添招弓手董以舊尉足矣乃更置新尉又諸州不分大小例置訓練官三員請悉罷之以紓民力又言官軍單寡而郡縣皆有土豪宜令自相推擇有智勇者各守一方又言有闕官處乞許郡守自辟吏銓無礙則付以告身若其徇私則監司御史得以紏之又言京東西及江淮悉為榛莽難用常法宜建藩鎮文武並授令便宜從事財賦亦聽自用如捍敵有功則許世襲又言國典不存宜詔諸郡訪求傳録俟駐蹕既定悉上送官凡此皆急務也
