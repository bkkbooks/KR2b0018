body:
  text: 中興小紀卷十宋熊克撰紹興元年嵗在辛亥春正月己亥朔詔改元癸卯上謂宰執曰張浚短於知人所用多浮薄妄作李回曰浚行倉猝故不暇詳擇上曰國人皆曰賢然後察之見賢焉然後用之用人豈可不審也尚書省言鄂嶽道逺合撥還湖北其江南仍舊分為東西路東路以池州西路以江州為帥府戊申詔開府儀同三司呂頥浩充江東安撫大使兼知池州觀文殿學士朱勝非充江西安撫大使兼知江州主管閣門宋籛孫早事潜邸為內知客至是親筆轉橫行一官上曰籛孫稍習朝儀而法非橫行不使知閣門故與進一官朕藩邸人人皆與外任蓋恐其請託或紊朝政惟籛孫姑留之甲子上曰天下事非一二著可勝又曰治亂安危固有天命亦必修人事以應之若人事不至而専聽人命固無是理二月辛未詔和州鎮撫使趙霖以屯田法養兵己卯宰執奏乞候就緒日優與推恩上曰此不須行凡以賞行法則吏必慕賞而不恤擾民俟其成功朝廷自賞之可也范宗尹曰此非臣等愚慮所及當如聖訓初皇祐明堂合祭天地奉太祖太宗真考並配而五帝神州地祗亦親獻之日月河海諸神悉如圜丘從祀至是上取法仁宗欲舉行之癸未詔將來明堂一遵元祐之制建炎初權罷祕書省丙戍復置盟少監丞郎著作郎佐郎各一員校書正字各二員以直祕閣程俱為少監俱開化人也神武前軍都統制王􅊛軍至饒州江東大帥呂頥浩乃趣左蠡下寨其地在饒池之境㑹淮南水軍統制官崔增有衆八千頥浩以書招置麾下令􅊛同增與賊戰于湖口之南增大捷乘勝至江州城下而守臣以糧盡已棄城去矣賊魁李成據城而處又遣其黨馬進南犯筠袁而招討使張後大軍五萬由江西路已至南昌辛卯詔頥浩與俊協力攻賊毋失機㑹於是頥浩言權湖北總管孔彥舟昨𠞰滅鍾相師律甚嚴因又詔彥舟統兵亦至筠袁掩捕癸已詔侍從臺諌官條上弭盜之術遏金之䇿與夫豐財强兵之要朕當虛已而力行之於是兵部侍郎兼權直學士院汪藻承詔言略曰臣昨扈蹕永嘉陛下賜以條對臣謂所急惟馭將一事更無他說時亦頗䝉採納臣區區之意猶守前見敢再陳之今之諸將爵祿極而家資盈習成驕而無鬪志一方有警輒狐疑相杖誰復奮然請行或迫之不得已而行則必過有邀求朝廷為之黽勉曲從不啻如奉驕子是豈能為國立功者哉臣有三說一曰示之以法夫君之於將刑未嘗偏廢豈有獨恩無威浸然不治如今日之甚者謂國難未已方藉此曹以為腹心若不孜孜拊循誰肯前死此言是也臣所謂以法治之者豈欲明主自親其文哉必有人為任其責唐李祐縛吳元濟其功大矣違詔進馬溫造劾之祐自言膽落於溫御史臣竊聞今諸將雖驕亦尚畏法使知朝廷有人小過不貸則惡意不復萌于胸中矣二曰運之以權君之於將必有得其要領而後使之心服而心畏唐杜黃裳令髙崇文將兵討蜀然崇文素憚劉澭黃裳乃使人謂之曰君不奮命者衆以澭代崇文懼盡力縛賊以獻陛下於平居時亦嘗察其好惡如以澭代崇文之術不可不知三曰别之以分唐太宗所與謀者房杜而已英衛之徒則不得而與也上然之時有司方以財匱為憂而大饗明堂已下詔矣江南招討使司隨軍轉運使詹至言今大敵在前國勢不立請停大禮悉以其費佐軍仍督諸將分道攻守以慰祖宗在天之靈繼志述事孰大於此至桐廬人也初桑仲據襄陽才兩月有盜張莽蕩者引衆來攻仲遣其將李橫拒之橫髙密人本黃河歸兵以勇自負莽蕩為橫所敗而去是後羣盜皆畏仲不敢犯其境仲跨有鄧隨郢等數州益無所憚放兵四出久之野無所掠其軍絶食乃以人為糧每遇打請則全隊撥男女給之至自食其愛妾於是襄陽之民殲焉然仲性頗孝或盛怒欲殺人其母戒之即止每自稱桑仲本王官終當以死報國以故能服其下至是有衆號二十萬而無食仲自知不可以久長驅西上有吞蜀之志先遣橫攻金州金房鎮撫使王彥與參謀官續觱畫䇿以數千衆扼險拒之橫敗走彥追至竹山縣橫據房州彥合諸統兵官韋知幾等軍二萬以備之既而復與戰於房橫連敗乃還襄陽王之望記西事曰張浚嚮之東下而復西也或謂非桑仲之畏有詔止之然臨敵而退賊益得以譎使其衆故漢上之禍皆浚為之羣盜不能入蜀者亦其用王彥之力也時右僕射范宗尹念其鄉國被禍之酷請赦仲罪遂以仲為鄧隨郢州鎮撫使朱勝非間居録曰范宗尹以其兄宗禮在桑仲軍中故授仲襄陽鄧隨郢均房等郡鎮撫使地大人衆稍為患又王銖亦言仲授襄陽錫撫使今據汪藻外制乃鄧趙郢三州而襄陽不在其數合依汪藻制辭仲分橫屯鄧州又令别將霍明屯郢州明嘗為中都親事官性尤嗜殺初仲結義兄弟九人橫明皆其一也三月辛丑宰執奏事李回曰江上渡軍有覆舟者上顧秦檜曰卿在軍中備知此亦常事軍行無不損者如出軍一萬元未見敵而回校未出之數已减數百要是兵真不得已之事稍得已不如戢兵之愈也辛亥詔諸路間田甚多百姓慮將來租役且乏牛種遂不敢耕彌望荒蕪今遣官則慮成搔擾若立法又土俗不同宜俾守令各以所宜措畫或官耕或豫民或假貸以取贏或召募以共利凡百施設朝廷並不牽制唯在簡而可行公私兼濟候秋成核實其有效者當擢以不次如古循吏入為公卿次猶增秩賜金或怠惰因循視為文具亦必按其罪以懲不恪䕫路安撫司奏昨有楊文貴者作過募土人捕殺乞依元許推賞戊午上謂宰執曰朝廷事急時多許人賞典事平則不能如所許與之甚不可也范宗尹曰當以此為戒己未張俊捷報至上謂宰執曰李成雖號數萬其實皆吾民被虜若設賞募人擒成餘皆不問所活多矣秦檜曰只此心便可以破賊張守曰若降赦事體尤正非若遣使之此范宗尹因言今日之事不可削弱上曰豈可削弱祖宗基業宏固偶遭戎寇故劉豫李成輩跋扈猖獗或謂止於淮上作籬落朕甚不取要當以次收復須一統乃已宗尹曰君臣修德以次圖之甲子乃詔除李成不赦外餘並許出首先是上聞捷曰兵既精又治器甲所以成功以此知軍器當留意朕計見甲巳四萬范宗尹曰得十萬粗足上曰可令軍器所足之財固當惜但合用處亦難吝也是日詔樞密副都承㫖辛道宗與外任上謂宰執曰近者從官條對以為辛氏兄弟檀權市恩朕未深信至為福建提刑栁瑊乞章服始信人言之不謬朕鑒往者羣小侵紊朝政求章服雖小事漸不可長范宗尹以下共奏外議稱愜服上之英斷是月召顯謨閣直學士致仕翟汝文為翰林學士時有司議明堂配祀疑於嚴父之文不克時定禮部郎官江都王居政議曰古之帝王非肇造區憂者皆無配天之祭聖宋崛起非有始封之祖太祖則周之后稷配祭於郊者也太宗則周之文王配祭於明堂者也皇祐宗祀固宜以太祖太宗配當時蓋拘嚴父之說故配帝以并登真宗其後英宗朝孫抃請専配以近考司馬光呂誨諍之以為詘祖進父而神宗亦謂周公宗祀在成王以文王為祖則明堂非配考明矣今主上紹統自真宗至於神宗均為宗廟獨躋則患無明文並配則同祫饗請今祭昊天上帝皇地祗於明堂宜奉太祖太宗配上是其議是春金左監軍逹喇引衆攻泰州水寨張敵萬為敵萬所敗擒其壻萬戶布拉原名不刺今改正殺五千餘衆初契丹之亡也其族有達實林牙佛頂林牙者竄於漠北據和勒端城以自立至是金右副元帥尼瑪哈在雲中欲圖之雲中距和勒端三千里而右都監伊都乃本土人知其巢穴於是尼瑪哈遣伊都將女真及燕雲漢軍二萬往攻之然不付以契丹兵且留其妻子蓋疑之也又起燕雲及河東夫負糧隨去蓋金自用兵以來驅民征役民不憚者往時有虜掠無戰鬪計其從軍之費及回日所獲數倍自立劉豫之後南則冦淮西則冦川有戰鬪無虜掠生還者少而得不償費民始為患故漠北之行人不勝其苦矣是春詔分鄂嶽潭衡永道郴桂楊八郡為湖東路安撫置司於鄂分鼎澧辰沅靖合邵金武岡九郡為湖西路安撫置司於鼎初湖南帥臣向子諲既罷去以本路漕臣賈收權帥事有節制兵馬王以寧者開封人因宣撫處置使司所辟徑來潭州今駐軍未幾鼎澧鎮撫使孔彥舟引兵擊以寧逐之有詔起子諲復帥湖南而羣盜馬友自江北趨潭子諲欲得人以利害說友令受招安前户部郎官致仕賀允中適在郡境乃為子諲見友說之曰宋祚更興足下正宜立功名何自棄於此自古有盜賊而受終者乎友心動改容謝允中卒不犯城而退子諲乃檄友共擊彥舟敗之又宜章土冦李冬至方擾縣境而益陽有吳錫者提精兵數千屯本縣告邵州守臣魏舜臣乞糧不得錫以兵趣邵舜臣懼而走於是子諲遣人招錫錫欣然歸附遂遣錫討冬至滅之時分路詔下子諲方欲之鄂而劇冦曹成擁衆數萬自江北掠湖南屯於攸縣時鼎之諸縣大半為賊所據賦入絶少米貴升直二千而養蔡兵頗衆軍糧屢竭有五日才給糯米一㪷軍人鬻妻子以自活至是鼎守程昌禹兼湖西帥即調兵糧於屬郡事急上聞得報不及為諸司所劾又水陸道阻民力頗為之困夏四月庚辰隆祐太后崩詔以繼體之重當從重服於是討論冊禮上諭宰執曰太后失位於紹聖其後欽聖復之再廢於崇寧雖事出大臣恐天下不能户曉或得以竊議兩朝范宗尹曰太母聖德在人心自陛下推崇四海欣悅前後之廢實由章惇蔡京非二聖之過上曰然昔髙宗欲立武氏長孫無忌褚遂良皆以為不可李績獨曰此陛下家事何須問外人帝意遂決則隆祐之廢出於惇京明矣宗尹因論宰相非其人則人主不難骨肉不能相倚如明皇相李林甫以刑措受賞上曰明皇相姚宋而治林林甫而亂明皇在天寶比開元時如兩人所為宗尹曰誠如此富直柔曰陛下推崇隆祐天下以為當亦不尤哲廟與上皇願陛下無復疑之既而禮部郎官王居正以謂國朝追冊母后皆由前日未及尊稱恭惟太后蚤儷宸極䝉垢紹聖退處道宮按元符三年五月已復為元祐皇后乃上皇受命欽聖獻肅皇后復冢婦之意甚明崇寧初權臣悖禮顧以卑廢尊是太后隆名定位已定於元符而不在於靖康變故之日也謂宜專用元符詔書明指姦臣格沮之意告於天地宗廟可也遂不果冊金左監軍逹喇自為張敵萬所敗其氣挫折又馬災多死是月遂歸河北休兵于宿遷縣時渤海萬戶托卜嘉亦北歸過淮揚與知軍張渙飲于舟中因語及劉豫僣立事托卜嘉歎曰某契丹之大臣渤海之大姓初金人見招許開國遼東纍載從軍被堅報鋭今雖一郡之安亦不可得豫山東郡守勢孤而降乃當是任豈不負我哉渙孝純猶子也五月丙午真揚鎮撫使郭仲威擅補官謀與劉豫連和浙西大帥劉光世遣統制官王德渡江誘而擒之癸丑詔斬仲威於平江府將佐本非同謀皆釋其罪自建炎初罷大府寺至是復置丞一員既而加三員後又復置長二復置長二在四年五月李成既敗江西大帥朱勝非以是月入江州城而賊猶據江北不退勝非與之對壘又䖍州有冦而吉州李亨仁者與䖍冦相交通勝非遣辨士彭世範誘亨仁出降然後諸郡解嚴民稍還業先是九江被禍最酷異於他處勝非奏臣被詔赴任來自桂嶺至衡州境有屋無人至潭州境有屋無壁至袁州境則人屋俱無良民可憫陛下幸降寬詔蠲其苛擾招降首領量與補官收𨽻軍籍而散遣其徒則江西之亂庶可措日平也不然為盜者益衆勢必南軼湖廣皆不得全矣以兵部侍郎兼權直學士院汪藻為翰林學士江東大元帥吕頥浩自左蠡班師回饒州時帳下兵不滿萬而淮南劇賊張琪衆五萬渡江冦諸縣進犯饒境郡人大恐統制官閻臯者頥治之愛將也方捕羣盜胡江于臨川走檄呼之臯已招到江等在路星馳以赴頥浩召諸統兵官姚端崔拜弼皆令聼臯節制端軍為左邦弼軍為右臯將中軍頥浩自畫戰圖授之紹出城五里而賊先鋒已至前軍將張守忠失利琪恃其衆直犯中軍臯力戰而端邦弼兩軍夾攻遂大破之追奔五十里橫尸滿路賊又遣精鋭為水軍分道而進頥浩自將水軍禦之賊敗走溺死者不可勝計金有皇姪摩哩郎君原名沒立郎君今改正者與其别將鄂拉扎哈原名烏魯折合今改正數萬衆分兩道入寇摩哩自鳳翔鄂拉扎哈自階成出散關約日皆㑹時知鳳翔府吳玠與弟統領官璘以散卒數千人駐和尚原之上朝問隔絶軍儲匱乏將士家屬往往陷敵人無固志有謀劫玠兄弟北去者幕官陳逺猷入白玠與璘遽召諸將勵以忠義㰱血而誓諸將感泣為備益力已而鄂拉扎哈先期而至陳於原北玠率諸將列陳待之更戰迭休鄂拉扎哈大敗由他道遁去摩哩力攻箭筈關玠復别選將擊退之兩軍卒不相合初水賊邵清擾通泰有大小戰船三千餘至是抵太平州城下詔浙西大帥劉光世討之賊又犯江隂軍及崇明鎮遂為光世兵所圍勢蹙乃降宣州駐劄韓世清者故嘗為盜有衆五千朝廷既招安之令屯宣州而世清復招亡命至萬五千人月費錢十萬緍米五千石頗凌州縣時江東大帥吕頥浩言世清可疑六月庚午宰執奏其事李回曰世清近討張琪有功未見可疑上曰頥浩之言亦不為無理方其可疑自當賞其功如郭偉奏邵清解圍而劉光世乃謂因其招安清之去恐或因光世然偉之守城亦自當賞功過不相掩則賞罰信矣范宗尹等曰謹遵聖訓韓世清在江東彈壓有勞民間惟恐其去至畫像祠之時吕頥浩方招安張琪而世清襲擊琪破之頥浩以世清壞其事故不樂徽人羅汝楫在言路嘗欲為世清辨白而未果今敷文閣直學士程大昌亦徽人知其事嘗親與克言之初詔諸路轉運司類武進士専委提刑司差官至是言者慮有私請望於帥臣漕憲中擇文學之臣總其事甲戌乃詔江東差帥臣吕頥浩江西差帥臣朱勝非兩浙差憲臣施坰福建差帥臣程邁荆湖差漕臣孫綬廣東差帥臣趙存誠廣西差漕臣王次翁川陜令張俊於逐路選之坰晉陵人綬須城人存誠髙密人次翁歷城人也時將葬隆祐太后已得地于越州之寶山證慈禪院議者欲稱園陵以直寶文閣曽紆為修奉官紆言上不日恢復中原奉隆祐歸祔此但攢宫爾當先正名朝論是之乃以同知樞密院事李回為總護使而有司復援異時園陵之制給事中陳戬上疏以謂陛下念太后保祐之勞社稷之勳務急追崇而有司觀望禮或失當中外切疑他日歸祔泰陵復用何禮耶且外有總護使司以大臣為之而頓遞修奉之類各設其所內有大都監以閹寺為之而提㸃按行之屬復異其名辟置官吏增加俸給賜豫宴犒數亦不資至謂㑹稽之山無可採而欲取他山之石鑲禁之卒不足用而欲調諸郡之夫並緣為姦騷動州縣又况梓宫僅取周身明器止用松錫而有司誇侈如此豈不違太后慈儉之遺訓而失陛下之本意乎於是一切鎸省壬午昭慈獻烈皇后掩攢宫初舊相吳敏方謫居涪州范宗尹薦敏復觀文殿學士知潭州敏以祖母年髙力辭遂改資政殿學士提舉洞霄宫至是又復敏觀文之職充廣西湖南宣撫使敏既受新命暫駐司桂州以便宜起永州流人馬擴為本司都統制兼咨議軍事既而擴與參謀官范方方不協辭去初鄂州李允文殺袁植江東大帥吕頥浩即奏其事植有愛將袁衮詣行在擊登聞鼓訟寃而臺臣繼亦論列參知政事張守素與植厚乃啓上密諭招討使張俊令收允文俊既破李成即與統制官陳思恭謀思恭言允文兵亦衆須以計取有前三省樞密院屬官汪若海者歙縣人被罪責英州行至臨州允文以書招之至是招討司參議官湯東野引若海謁俊曰君與李節制善盍往說之與俱來免盛夏提師至鄂若海曰說與俱來而招討誅之則若海為賣友俊曰某以百口保之若海先以書與允文曰張少保既破李成欲移戈指武昌若海言君無反狀其屬曰節制非朝命而殺袁植與留四川綱運非反而何惟少保言以百口相保今有三說劉豫新立君能引張用之衆擒豫以取重賞一也或引衆西投宣撫使張樞密既相辟必為君白于朝二也信少保百口相保之言三也君勿恃張用之徒為强彼見李成既破皆已喪魄若知朝廷怒君必為戈相逐矣允文感悟乃舉軍東下因檄若海併招張用亦以衆俱來於是俊執允文歸於行在詔付大理寺既而遂正典刑贈植直龍圖閣復若海承務郎時俊得允文與用之衆軍勢益盛矣時以張用為舒蘄鎮撫使江西大帥朱勝非極言其不可并論處置乖方之狀又乞歸帥司於洪州且言陛下志在撥亂事須務實乃可圖功不當徇虛名又謂安撫大使與宣撫使名甚重而無資糧及兵實不及一小邑其辭切直皆類此時資政殿學士王綯刑部尚書胡直孺並兼侍讀中書舍人胡交修兼侍講一日上賜經筵官扇皆取杜甫詩句親書與之於綯則曰霖雨思賢佐丹青憶老臣直孺則曰文物多師古朝廷半老儒文修則曰相門韋氏在經術漢臣須蓋上之光寵儒臣如此
