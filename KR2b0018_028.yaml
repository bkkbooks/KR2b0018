body:
  text: 中興小紀卷二十八宋熊克撰紹興十年嵗在庚申春正月辛巳右僕射秦檜等奏前日外間有匿名書非毁朝廷當繳進上曰已見之無足恤又曰度近日上封事言臣等陛下掩蔽者多矣上曰無事凡所上書朕無不覽若有言卿等過豈可不令卿等知却致積成大過耶時遷工部侍郎李誼為尚書欲借誼資政殿學士奉使金國誼辭行乙酉上謂宰執曰朝廷遣人往新疆多辭不行奉使亦辭若不黜是為姑息之政即詔罷之丙戌詔新除工部侍郎莫將充迎護梓宫使以知閣門事韓恕副之壬辰詔上殿官唐文若改合入官仍舊潼川府教授秦檜奏近制初改官人須任親民不許堂除此可以養成人材上曰非特養成人材亦足以抑奔競之風文若庾之子也癸巳上諭宰執曰朕選任將帥下至偏禆必審知其材然後用非其人至於失職不過罷之蓋將兵之官所繫非輕豈可不審也初太尉郭仲筍既兵交與淮東宣撫使張俊下統制官雷仲至是乞祠甲午以為醴泉觀使既而俊薦仲荀有才遂令知鎮江府詔陜西買馬已及千匹自此必益多宜指畫牧養庶幾蕃息以偹戰騎癸亥上諭宰執曰舊徐州有鐵監陜西諸路亦多坑冶今當置作院以造軍器各有土俗所宜倘非所宜不惟枉費亦非所用豈除戎器之意哉秦檜曰臣仰體聖意安不忘危而留意於武備如此二月癸丑以龍神衛四廂都指揮使主管馬軍劉錡為東京副留守錡帶騎司之軍以行即王彥所刺八字軍也廖剛又請起舊相之有人望者處之近藩秦檜滋不樂初秦檜請下有司討論史館之制至是禮部言依元豐制合併歸祕書省國史案以著作郎修纂日厯遇修國史即置國史院修實録亦置實録院所有見今史館官罷歸元處既而著作佐郎丹陽王揚英又言國史案移文諸處多不報於是復以國史日厯所為名初淮南諸路已置教官至是言者又謂四川士人衆多宜選分教乞諸州並置立丁未詔從之端明殿學士僉書樞密院韓肖胄請去除資政殿學士知紹興府壬申上謂宰執曰爵祿本是厲世磨鈍之具凡肯任事赴功者朝廷當與進櫂至如崇虛譽飾空言與避事保身者豈可加奬秦檜曰臣等敢不仰遵聖訓言者請復置勳官癸酉詔付吏部三月己卯詔陜西諸路前環慶帥顯謨閣直學士趙彬前永興帥寧國軍節度使張中孚前涇原帥清逺軍承宣使張中彥前鄜延帥雄武軍承宣使關師古皆入覲而彬已到闕於是禮部侍郎鄭剛中言臣聞陜西二三大帥被㫖入覲朝夕且至陛下有顯秩以寵其身慶澤以暢其意彼方戴德而感激震驚之不暇陛下引見之日所以推誠而收其心者雖不可後亦當折其氣而責以後效不然恐不知有朝廷之尊昔英布歸漢髙祖踞牀見之布悔來欲自殺出就舍又大喜過望赤眉之降世祖陳兵臨洛問盆子曰汝知當死否其衆請命則又曰得無悔降乎吾不强屈汝既服然後陳其三善而釋之又賜田宅使居洛陽今日朝廷所以待之聖心自有恩威之度臣蓋不能自已者也至是入見遂除彬為兵部侍郎中孚醴泉觀使中彥提舉佑聖觀師古馬軍都虞候未幾師古卒其後諡曰毅勇先是上嘗諭秦檜曰比聞州縣多創添稅務因此商旅不行所有貨少為公私之害又州縣違法差夫騷擾被差一夫須備十千動止數十人而借者或止收錢而去己未檜具禀乃詔所增稅務並罷差夫嚴行禁止上曰二事責在漕臣違者重置之法先是遣禮部侍郎蘇符為金國賀正使知閣門事王公亮副之丙申符等回符軾孫也初陜西㳂河諸郡諜者言金欲以修大慶關水岸為名將興兵渡河川陜宣撫副使胡世將遂言與金講和今已踰年梓宫天眷未有還期本朝使命尚留彼國竊慮敵情難信萬一以精騎自河中府突來不數日可至川口近探到金果於河中廣積糧草並獲到奸細王萬稱金復要興兵乞先事為之以防意外之警兼永興涇原環慶三帥皆已入覲冝早擇帥臣機不可失况本路統兵官多是降敵之人亦乞更加選擇及早去留萬一有不測應干軍事或待報不及許臣隨冝措畫至是世將又奏金帥薩里罕等復來蒲解緣薩里罕等久在陜西窺我四川去而復來其意安在今分兵太逺老小同行緩急呼唤難集又收復陜西今已朞嵗人情茍簡軍政廢壞若自大慶關深入秦地則㳂河諸郡决不能守是雖得其地與未得同又陜西諸帥皆嘗從僞不敢訓兵兼器甲絶少皆謂北軍若來惟有投拜是雖得其兵與未得同惟望早擇良將兼選將佐如不此圖但謂已復陜西其徑兵良馬我悉得用實為誤國丁酉詔世將隨宜措畫庚子詔徽宗裁定笞杖之制德意深矣有司昨拘舊文請從重比殊咈於理可依政和敇遞減庶幾省刑以彰先帝之美時川口諸隘如仙人關和尚原殺金坪有稍壞之處是月胡世將令忠勇軍伐木十餘萬條并興洋一帶皆葺治之夏四月實録院檢討官朱翌言作史之道法有取於簡事不貴於繁癸亥上謂宰執曰史欲垂信萬世事關治亂乃當載之豈貴繁也上又曰陜西弓箭手祖宗良法其初置提舉官務在廣招茍取充數以希賞而地不足以給之削其頃畝法因以壞乃詔樞密院行下帥司見田招刺不必拘以舊額五月甲申詔建敷文閣藏徽宗御集置學士直學士待制直閣等官時殿前司有將領湯尚之者詔與外任乙酉上謂宰執曰屢戒楊沂中凡將領有不可用者並令汰遣所養人必可充戰士馬必可備戰騎然後可收不惟皆得實用亦不枉費糧芻蠧耗國計也戊子上謂宰執曰朕於聽言之際未嘗曲徇惟視理之所在茍當於理雖小臣所陳必聽不當於理雖大臣有所不從秦檜等竊歎上如天之無心故聽言之際任理而不任情如此時吏部差鄂州巡檢而湖北宣撫司不許其上御史中丞王次翁奏劾之壬辰上曰天下之事當謹其小小之不圖積習浸久將有大於此者次翁所論深明國體乃令詰問宣撫司時有詔令侍從舉所知給事中林待聘因薦新台州教官永嘉張闡召對張闡言金歸我關中此地古號天府乃祖宗社稷之靈天下莫大之福而議者過計以為金棄空城以餌我他日富實敵將復至不如守蜀之得策其說疏矣天與不取反受其咎願擇大帥為必守之計秦中根本既固則中原之復可冀於是闡試館職為正字除正字在閏六月初金元烏珠將渝盟乃舉其國中之兵集於祁州元帥府大閲至是分四道入攻一攻山東曰聶哷貝勒原作聶黎孛堇今改正者將之一攻陜西曰三郎君者將之三郎君即薩里罕也一則攻河南以吾叛將李成將之而烏珠同三路都統及號龍虎大王與將軍韓常擁精兵約十五萬渡大河丙戍據張戒默記乃正月十三日入東京執留守孟庾於是烏珠駐舊龍德宫而三路都統以次長驅南下破頴昌淮寧三府蔡州遂降於金先是馬軍帥東京副留守劉錡領兵之任泝江淮至頴上錡與屬官杜亨道王羲賔及將佐捨舟陸行抵順昌府庚寅守臣顯謨閣直學士陳規得報金騎己入東京規以示錡時錡所部選鋒游奕兩軍及老幼輜重相去尚逺錡遣騎趣之是夕才抵岸錡見規曰事急矣城中有糧則能與君共守規曰有米數萬斛錡曰可矣規亦力留錡共守錡又見劉豫時所蓄毒藥猶在足以害敵壬辰乃召諸將議曰吾軍逺來未及息敵已厭境今當如何有欲就便舟順流而下者有欲守者錡曰某本赴官留司今東京既陷幸全軍至此有城池可守機不可失當盡心力以死報國家衆議始定即鑿舟沉之示無去意通判汪若海緣府檄至行在錡以奏附若海行即與屬官等登城區處城外有居民數千家恐為賊巢悉焚之分命諸統制官許青守東門杜把守北門且明斥堠及募土人作鄉導間探於是軍人皆奮曰平時人欺我八字軍今日當為國家立功錡親於城上督衆設戰具修壁壘凡六日粗畢而敵之游騎已渡河至城外矣初右護軍七萬二千人馬六千一百匹自復故疆進屯陜右其留保川口者不過二萬多是秦鳯帥兼右護軍都統制吳璘所部時永興帥兼樞密院都統制郭浩領八千衆在邠耀二州餘則分於利路帥兼樞密院都統制楊政及涇原帥田晟環慶帥范綜鄜延帥王彥熙河帥孫渥布於諸路至是金大帥薩里罕自河中府渡河入同州界馳二百五十里破永興軍直趨鳯翔府據之而我陜西諸軍皆隔在敵後逺近震恐宣撫副使胡世將倉卒召諸帥時吳璘孫渥已隨世將在河池而楊政田晟亦繼至惟范綜王彥仍守其地諸軍稍集世將即遣璘政晟同率大軍㑹諸路統兵官涇原曲汲環慶屈鄜延趙維清等分據渭河南一帶外捍六路內保四川先是張燾出帥成都請由京洛關陜以達因得觀形勢利便且與胡世將議事上許之及燾至永興軍報金已敗盟遂見世將言和尚原最為衝要自原以南則入川路若失此原是無蜀也於是燾為奏乞速徙右護軍之戍陜右者還屯蜀口丁酉有㫖令世將日下抽回詔雖下而未逹也己亥上謂宰執曰金人自靖康以來每捃托前事歸曲中國以為兵端自前年割地請和朕待之之禮已盡忽無故稱兵曲直有在朕今决意用兵秦檜等曰陛下本以可和則和不可和則戰此素定之計今烏珠骨肉相屠遺毒中國首亂舉兵陛下赫然震怒當為弔民之舉臣等敢不效死承命命少師萬夀觀察使劉光世為太保三京招撫處置使以援劉錡於是光世駐軍太平州請以護國軍承宣使李顯忠為殿前都統制從之光世復請統制官王德𨽻其軍德堅不肯從時秦檜素主和議於是中丞王次翁言於上曰陛下既以和議為主而諸守備益嚴士卒勇鋭金雖敗盟曲不在我無能為也前日國是初無主議事有小變則更用他相蓋後來者未必賢於前人而排黜異黨收召親故紛紛非纍月不能定於國事初無補也願陛下以為至戒無使小人異議乘間而入上深然之川陜宣撫副使胡世將在河池而都統制楊政與涇原帥田晟鄜延帥王彥並據渭河南一帶與敵兵對壘都統制郭浩駐涇州而熙河帥孫渥權參謀官渥勸世將退保諸將亦曰敵掩我無備我分屯之師未集宜少退清原野以避其鋒右護軍都統制吳璘曰敵所以輕視我者聞先兄之亡謂我無備今若退墮其計矣璘請以身任責世將壯之乃曰分屯之兵未集關中旦暮望官軍捷而吾遽避則大事去矣吾誓死於此勿多言也遂先遣晟還涇原渥赴熙河仍命璘統軍二萬於寶雞河南捍敵庚子詔璘節制陜西諸軍方下而未達也時金選精騎令哲庫貝勒作前鋒有受金號令者與敵通謀辛丑敵騎掩至右壁寨璘遣統制官姚仲等拒之仲自奮身督戰哲庫貝勒中傷退屯武功時楊政母病方危亦不顧家徑至河南與璘協力捍敵既而諸軍老小悉歸內地人心既定踴躍自奮不復懼敵矣時有監進奏院陳鼎上書言金於今日敗盟乃朝廷之福使不即敗他日之禍有不可支持願乘此早為自治之策秦檜怒送之吏部鼎松溪人戩子也初吏部功賞難於核實吏得舞文為姦司勳郎官張官因陛對力陳其弊以謂圖籍散逸止憑省記月異而嵗不同無所總括舍法則用例引例則破法姦弊日滋甚非畫一之政請自今以例為據者悉令上之朝廷稽其合於三尺者著為定制人以為當官晉陵人守兄也至是遷祕書少監時官齒髮以衰每盥濯危坐而讀未見之書自視無愧於蕭德言云新西京留守仇愈未至而金背盟乃復愈待制知明州兼㳂海制置使六月甲辰朔右僕射秦檜言德無常師主善為師臣昨見金國逹蘭有講和割地之議故贊陛下取河南故疆既而烏珠戕其叔達蘭藍公佐之歸和議已變故贊陛下定弔民伐罪之計臣今請先至江上諭諸路將帥同力招討如臣言不可行即乞罷免上嘉納之初威州團練使李貴統官兵於江西䖍吉筠三州及湖廣界招捕盜賊至是貴誘到首領一百餘人脅從六千餘人丙午以貴為登州防禦使時金人圍順昌府城四日乃移寨於城東地號李村距城二十里劉錡遣驍騎將閻充以鋭卒五百募土人前𨗳夜劫其寨至軍中氊帳數重朱漆奚車有一將遽被甲呼曰留得我即太平不聽竟殺之是日乙酉以東京副留守劉錡為㳂淮制置使錡未之知也金將哲庫貝勒自武功縣整兵再來是日乙酉都統制吳璘楊政率大軍迎敵至扶風遇敵力戰金先是於扶風築城既敗亟入城閉門拒守官軍乘勝攻拔其城殺敵衆幾盡援兵繼至亦敗而走初言者論太常少卿劉昉宗正少卿陳淵皆罷至是言者又論二人之去而工部尚書廖剛謂昉淵乃已所薦獨以為賢又金人敗盟而剛幸時警復肆嘵嘵以惑縉紳庚戌詔剛與外任遂除徽猷閣直學士提舉明道宫時淮西宣撫使張俊遣行營護軍都統制王德將所部統勝軍援錡俊既不樂錡而德復懼撥𨽻劉光世軍遷延未行建康留守葉夢得諭德曰朝廷頒賞格能立竒功者使相節度皆即軍中書告舊未聞也且劉錡名素出爾上今自奮報國爾能救錡則可謂竒功矣德復慮錡怒之夢得曰吾己上章以百口保爾矣德遂行未至順昌乙卯金拔寨遁去順昌破敵録曰錡方被圍時遣介求援於朝得報已差行營左護軍統制王德躬率全軍來援十三日金兵既退之後德方移文來問敵勢動息二十三日卯時以數十騎到城下錡邀入具飯已憩於子城樓上申時出門遣人致意曰不果奉别今日復回又數日傳聞申樞密院某已解順昌圍矣方敵在城下得遞到御筆劉某擇利班師錡以方應敵未敢輕動敵退後十日又被㫖先發老小還駐鎮江遂津發老小輜重并被傷之士船載而行以統制官杜把焦文通兩軍防護東下又聞德申宣撫司云某以全軍裏送劉太尉老小出潁河矣烏殊至淮寧府自三路都統以下皆撻之於是以三路都統官守南京將軍韓常守潁昌府而自與龍虎大王者擁其餘衆向東京潁昌被敵記曰烏珠撻將諸韓常有怨言曰我一隻眼只為爾於和尚原環了時人情頗離烏珠至東京欲往河北僉軍王山曰河北有百姓無正兵可僉也參知政事孫近奏被㫖奉迎兩宫今道路未通欲權結局戊午詔從之甲子僉書樞密院事樓照以父憂去位庚午以鼎州觀察使㳂淮制置使劉錡為武泰軍節度使侍衛馬軍都虞候時金别又陷宿亳淮西宣撫使張俊親統大軍出廬州命統制官趙密出西路密引衆經蘇村時水漲三尺涉六晝夜乃逹宿城與敵遇敗之而統制官王德率衆自夀春趨宿夜半襲破敵營降僞守馬秦乘勝趨亳又下之密以孤軍駐夀春纍月敵不敢南嚮俊既復宿亳二州遂引軍還夀春府時俊軍威盛而智謀勇敢賴德為多俊亦先計後戰故未嘗敗初諸大將入覲陳兵閲於禁中謂之內教至是統制官呼延通因內教出不遜語中丞王次翁乞斬通以肅軍列因言祖宗著令寸鐵入皇城司者皆有常刑今使武夫悍卒被堅執鋭於殿廷之下非所以嚴天陛也內教遂罷時韓世忠劉光世張俊劉錡皆不相能次翁曰臣聞世忠之於光世因言議而隙俊之於錡因措置而暌竊恐錡保一孤壘光世軍處窮獨俊與世忠不肯急援願遣使切責因用郭子儀李光弼以忠義泣别相勉者以感動之時諸將驕而次翁彈擊不避方乞斬通時上勞之曰卿有李勉之風矣淮南宣撫使韓世忠遣統制官王勝并背嵬將成閔率兵北伐辛未至淮陽軍城南二十里水陸轉戰掩金兵入沂河死者甚衆奪戰船二百餘隻是月資政殿學士馮澥卒時湖北宣撫兼招討使嶽飛遣統制官張憲與金戰于潁昌府敗之遂復潁昌憲又與戰於陳州境敗之飛别遣統領官楊成與金戰於鄭州境敗之復陳鄭二州而飛自與烏珠戰於偃城縣殺其將鄂爾多貝勒原作阿李朵孛堇今改正資政殿大學士福建安撫使張浚聞淮上有警亟具邊計言向使金出上策還梓宫歸兩殿則我德之必深和議不拔人心懈怠國勢寖弱幸今金自反覆士氣尚可以作臣願引權制變用天下英才據天下之要勢措置一定大勳可集矣三京招撫處置使劉光世奏統制官李顯忠葬其父乞官與之費詔賜以萬緡中書舍人林待聘言陛下多顯忠自歸而憫其家禍不待殊功著績而置髙位曩邊遽亟聞誠顯忠竭盡之秋也而計奪於聲懼形於色屈指命日以策川陜之陷安在其謀且勇兵才二千行逮宿泗什亡其七安在其得士心緡錢十萬與為軍資盡且復乞又三倍所求無厭必驕且望願寢其賜從之光世又請以舒蘄等五州為一司選置將吏宿兵其中為藩籬之衛右正言万俟卨言光世欲以五州為根本將斥旁近地自廣以襲唐季藩鎮之蹟不可許也時方多故武夫怙亂卨又言諸大將起於行伍知利不知義畏死不畏法髙官大職子女玉帛已極其欲盍示以逗遛之罰敗亡之誅不用命之戮使其知所懼焉時東京留守孟庾南京留守路允迪悉已降金閏六月甲戊詔送其家屬居於全州癸未上曰順昌淮陽戰士捐軀死於國事冝令逐處設奠仍作浮屠水陸法事以慰忠魂使知朕不忘之意甲申時陜西奏捷金既不敢度隴蜀道以安分屯之軍亦各全師而還丙戌以知秦州兼節制陜西諸軍右護軍都統制吳璘及知興元府宣撫司都統制楊政知永興軍兼樞密院都統制郭浩並為節度使璘鎮西軍政武當軍浩奉國軍而宣撫副使胡世將亦自寶文閣學士升端明殿學士時有獻計决淮水以灌淮陽敵壘辛卯上謂宰執曰决水所及京東民田有被其害者秦檜曰陛下聖度兼愛如此宜無敵於天下也特進趙鼎自泉州罷來居紹興府中丞王次翁言鼎近聞邊報喜見顔間幸將有警規圖復用直抵近輔略不避嫌門下黨與往來臨安鼓惑衆聽又論鼎在靖康末結王時雍薦之張邦昌遂受僞命為京畿憲退而與人言有親奉玉音之語又向以元樞都督荆襄未幾拜相而乾沒官錢十七萬緡皆有實蹟望顯置於法章三上丁酉鼎責祕書少監分司南京興化軍居住次翁言之不己遂以散官潮州安置趙鼎事實曰時鼎連失洙渭二子與親知書曰幼子之病以某謫溫陵失于醫理而死長子之病以某謫潮陽惜於離别而死一罹被譴而併殺二子蓋負罪之深宜誅而貸故移禍私門如此其酷然造物者方且困之未使其斃强顔茍活惟是責躬無地自容耳戊戍賜諸帥詔曰狂敵不道薦肆凶殘王師所臨無往弗克捷奏繼至俘獲踵廷尚慮狃吾屢勝之威忽彼不虞之戒天下本吾一家豈貪尺寸之利金人亡在朝夕必滅為期咨爾六軍咸體朕意湖北宣撫兼招討使嶽飛時屢獲捷至是詔書不許深入飛遂班師而所取州縣旋復失之野記奉使洪皓時在燕密奏順昌之後金人震懼喪魄燕之珍寶悉徙而北意欲捐燕以南棄之王師亟還自失機㑹惜也福建安撫使張浚復條海道利害仍大治海舟至千艘為直指山東之計以俟朝命秋七月癸丑太尉殿前副都指揮使楊沂中進都指揮使公事為淮北宣撫副使又以馬軍都虞候㳂淮制置使劉錡為淮北宣撫判官沂中自行在引兵出泗上時淮北無敵騎遂復還臨安亦詔錡班師次於鎮江府時方用兵當嚴斥堠己未宰執奏擺鋪事上曰遞鋪兵極可憫月糧雖按月支鋪屋亦須如法有虎狼處必用兩重籬落秦檜既退竊歎仁心周遍真堯舜之用心也詔討使韓世忠遣統制官王勝王權攻海州破之擒僞守王山獲金人押至行在王山即隨敵至順昌城下者也順昌破敵記曰王山言金國見只有烏珠主兵權先時舉國內兵盡赴祁州大閲舉所閲之兵盡隨烏珠南下烏珠之在順昌三郎君敗於陜西亦來告急是時南宋若更有一項兵乘此而來敵可擒也乙丑詔却押回世忠軍隨宜區處秦檜請今後獲敵不必解來上曰不然須令押數人來問之庶得其實不敢妄奏也檜曰陛下於庶政核實如此孰敢欺乎時世忠怒統制官呼延通通赴淮以死丁卯詔川陜宣撫副使胡世將遣鋭兵千人具舟百艘載柴草膏油自丹州順流而下至河中府焚毁金人所繫浮橋及選萬人由斜谷出潼關皆以絶金歸路世將奏已差統領官閻興帶五百人往㑹知丹州傅師禹知陜州吳琦知華州潘道及忠義軍統制官傅忠信同措畫斷毁河橋又臣前遣永興副帥王俊領選鋒四千人已復興平醴泉二縣永興之屬邑也今正與大敵相距且當盛暑多不容其遣兵兼王俊在彼可以乘間斷其歸路其後閻興至永興之外邑與王俊㑹雖同傅師禹結到河東忠義秦海等一千餘人皆補以官然亦不能成功八月癸丑上曰御將用兵當如身之使臂臂之使指不能自運豈立國之道秦檜曰此漢髙帝馭英雄之意也己卯宰執奏徽宗隨龍人乞恩例上曰若舊人尤當優恤凡事干徽廟非唯朕奉先之孝所當自致亦欲風動四方使人知有君親之恩也秦檜等退而竊歎上於一命一令存教化於其間所謂明王以孝治天下蓋如此也己丑宰執奏淮東宣撫使韓世忠見圍淮陽期於必滅上曰攻城當開其生意不可合圍既得城多殺何為秦檜曰此成湯祝網去其三面之意也言者以為民間詞訴郡縣監司不以時决壬辰上謂宰執曰朕昔以元帥在河北京東見縣民有訴縣於州者復委之縣郡民有訴郡於監司者復委之郡如此則民寃何緣得直當申嚴約束秦檜曰陛下察見郡縣之弊知吏治得失雖漢之宣光殆無以過也詳定一司敕令張宗元奏刪定官序位甲午詔在樞密院編修官之下詔川陜宣撫副使胡世將今日事勢以力保關隘為先又陜西將士與右護軍不同正當兼容有仗義自奮者優奬之以厲其餘於是世將奏川口諸隘及梁洋一帶先已修畢見分遣吳璘在白石至秦州以來遏熙秦之衝楊政在寶雞遏永興鳯翔之衝及永興副帥王俊亦在盩厔作寨牽制敵勢兼自金人冉攻陜西諸曽受僞命人並許收使如能立功就上遷轉緣從僞既久率望風降拜臣亦開其自新之路多方誘諭已招到一萬一千五百餘人總管傅忠安撫朱勇將官梁炳及統制統領各給袍帶移住老幼居於近裏又有總管魏價等十四員帶城寨兵一千五百亦加勸奬官各授差遣卒各支請給與右護軍相參為用矣時楊政在寶雞金大帥薩罕隂遣客刺政詐為降人政覺而誅之辛亥合祀天地於明堂以太祖並配大赦天下先是川陜宣撫副使胡世將聞金分兵欲侵川界遣右護軍都統制節制陜西諸軍吳璘總兵至秦州之北丁巳攻城拔之守臣武誼將官邵干成紀知縣荔諫等皆降戊午宰執奏事上謂秦檜曰士大夫多樂在朝廷不樂在州縣蓋朝廷遷進多州縣遷進少卿等可擇州縣吏之有治狀者當如漢增秩賜金使內外之勢均也庚申吳璘進兵剡家灣與敵將賀珍郎君原作胡盞郎君今改正戰兵潰時行在遺火壬戍宰執奏犒設救火諸兵事上曰纍令去席屋作瓦屋皆不奉行朕已戒內侍如敢不遵比衆罪當加重卿等更戒諸房吏亦依此若內侍堂吏奉行則衆不敢違戾癸亥上曰朕觀自昔守令能抑强振弱者始號循良今豪右稍不快意必中傷之自今州縣吏有能稱職而或誣以非辜者須朝廷主張庶使吏得自效而民被其惠矣甲子上曰近世禮器大不合古制如聶崇義三禮圖極可笑俟兵事稍定當講論改造况亦無大費也是秋兩浙轉運司類試凡解二百八人而溫州自計四十二人宰執子姪皆預其選揭榜之日士論大駭自置舉場以來未嘗有也朱勝非閒居録曰東南諸道解額少舉子多求牒試於轉運司每七人取一名比之本貫艱易百倍秦檜居永嘉引用州人以為黨助吳表臣林待聘號黨魁名為從官實操國柄凡鄉士具耳目口鼻者皆登要塗更相扳援其勢炎炎日遷月擢無復程度是年有司觀望所薦溫士四十二名檜與參政王次翁子姪預選者數人前輩詩云惟有糊名公道在孤寒宜向此中求今不然矣河南府奏撿視諸陵除永定永昭永裕永泰並無損惟永安永昌永熙神臺璺裂冬十月己亥詔本府委官修之勑令所修在京通用勑令格式書成戊寅右僕射秦檜表上之右正言万俟卨論淮北宣撫司范直方怯懦沮師丁亥上曰升黜必明當其功罪可鐫職與逺小監當初直方之行上寵以列卿賞賚優渥至是出於威斷勸沮若此臣下孰敢不奮勵而赴功也臺臣論信州守臣劉岑歷守三郡妄費官帑以市私恩己丑上曰朕於軍興調度尚恐有傷百姓其可以無名之費重困吾民乃詔重貶之是月臨安府居民遺火延燒省部官舍朱勝非閒居録曰初上駐蹕應天堂饌頓減至維揚又減至餘杭又减宰執每員日用二千有竒僅備一食紹興四年趙鼎以元樞為川陜荆襄都督須錢七百萬緡有㫖半與之兩浙轉運司臨安府又取二萬緡行有日矣㑹鼎拜相因淮上用兵遂以三百萬緡入三省激賞庫先是建炎初御營使置激賞庫銀百星錢千緡為一料畫㫖支降傳充軍書警奏間探之費其後司廢庫存𨽻於三省內結諸宦外交諸將首尾五年御史謝祖信論鼎章內一事云盜官錢八十萬緡蓋此錢也秦檜繼相用術尤精九年金人歸河南故地檜託言計備使禮凡常賦之入多歸此帑嵗時所獻日月增厚而錫賚便蕃權勢熏灼線履每兩二十餘緡月至數兩至是庫金出入輕於州郡公庫矣用度既廣賦入不繼十年下令云舉兵擊敵須備犒賞計畝率錢遍天下五等貧民無得免者所斂號激賞而兵未嘗舉百姓尤以為怨十一月火作首焚三省庫中所積一夕而盡不復根治悉行除破蓋侵取既多見物無幾幸火以滅迹無復稽考者也資政殿學士翟汝文卒十一月戊午時御書皇太后玉冊癸亥右僕射秦檜言陛下字法遒徑絶類雲天之體上曰學書必以鍾王為法然後出入變化自成一家檜曰陛下天縱多能無不造其至妙推而上之所以治天下蓋必以堯舜為法臣下自非堯舜之道安敢輒陳於前也是月兵部尚書兼翰林院學士胡交修請外除端明殿學士知台州十二月戊寅上曰凡觀人者必觀其行事則可以察知其心之微漢髙帝平時好色喜貨至於入關秋毫無所犯唯范增能察知其志在取天下於是秦檜等仰歎聖學淵妙商𣙜古今非羣下所能及也壬午上皇太后冊寶上躬詣殿廷祗發赴慈寧殿禮成百官於宫門外遙賀太后先是冬溫無雪上以嚮春疾疫為慮是日禮樂備物百寮在列凝雲闔雪不降至夕大雪人情歡恱道途相慶甲申秦檜奏曰陛下聖孝感通天意昭格明堂禮成然後雨尊冊禮成然後雪若出符契陛下再三謙抑不居臣等仰見聖意欽天之命雖休勿休如此丙戌禮部侍郎蘇符遷尚書初建寧軍承宣使知代州王忠植將兵至延安府為叛將所執令拜金國詔書忠植毁罵被害至是川陜帥司以聞丁亥詔贈忠植節度使開府儀同三司官其子孫十人言者乞令諸大帥各薦偏裨之可任者乙未上曰諸帥所𨽻統制統領官智愚勇怯朕皆熟知之儻有所使便可抽擢何必更令薦舉蓋上於人材大小無不遍察下至遍裨已深簡於淵鑒矣婺州東陽縣魔賊竊發丁酉詔遣前司禆將王滋往捕之上令宰執諭滋不以多殺為功未幾賊平
