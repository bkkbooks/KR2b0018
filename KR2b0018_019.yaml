body:
  text: 中興小紀卷十九宋熊克撰紹興五年秋七月壬申朔上謂趙鼎曰内侍亦有動人者如軍器所初縁内侍李至道措置有法至今整齊至道左右手籌計不差毫釐是亦人妖爾鼎曰惟其精敏如此便非國家之福丙戌都督張浚以知徐州何洋所條屯田利害來上癸巳上謂宰臣曰淮北之民襁負而至朕為民父母豈可使其失所可賦田予之更加優恤以廣招徠之路趙鼎曰彼乍歸無所居當賑助之沈與求曰立國不當為朝夕計就耕之民若蠲租稅更助之五年以後兩淮荒土已闢亦為無窮之利上曰然内軍器庫保明前行徐才良者出職乙未上謂宰執曰内諸司轉官出職文字祖宗法並用御寶朕守之甚嚴但令有司依法行之趙鼎曰陛下雖細事亦謹守祖宗之法中外幸甚自建炎兵興四方舉子不能至行在遂以省額分於諸路謂之類試所收多不當至是始復開省闈一如舊例八月乙巳觀文殿學士提舉洞霄宫范宗尹卒於台州時宗室趙繼之趙不愚皆有贓為言者所論而趙鼎嘗薦此二人乃乞解機政丁未上曰事有輕重卿薦士之失甚輕而朕之罷相甚重況頃臺臣論李處勵罪吕頣浩為相嘗薦處勵亦自陳今案牘在中書可見也卿既自劾復有何嫌宜體朕懐勿再有請己酉詔四川比嵗軍興百姓供億不易恐吏縁為姦令宣撫司按治詔故趙普佐太祖開基非他勲臣之比官其五世孫六房各二資戸部尚書章誼求去癸丑除龍圖閣學士知温州先是起居郎任申先乞追贈其父伯雨官且言伯雨因論章惇蔡卞誣謗宣仁后有廢立之意遂被責仍以伯雨手澤進之乃詔贈伯雨諫議大夫上曰朕嘗親奉隆祐之訓今果爾三省可議追貶惇節度副使卞團練副使子孫不得除在内職任於是倉部郎官章傑出知婺州太府寺丞章僅出為江東提舉官給事中廖剛封還詔書謂如此豈足以示懲乃詔僅並與外祠而新監進奏院章倧亦罷既而倧登進士第只補外任試中博學宏詞科新勑局删定官王璧新明州教授石延慶並與堂除璧勤縣人延慶山隂人也淮東宣撫使韓世忠奏獲到偽官王拱等十人乞推恩將士壬戌上曰宿遷偽官本是吾民他時邊臣如此小利不須賞庻免生事今世忠既保明姑量與推恩知貢舉翰林學士孫近上合格進士樊光逺等癸亥上御集英殿䇿試上謂宰執曰復詩賦累年未有卓然可稱者俟唱名取髙等陞甲以觀多士既遂賜汪洋以下二百二十人及第出身先是有官人黄中第一上曰故事如何沈與求曰皇祐初有官人沈文通第一仁宗曰朕不欲以貴胄先天下寒畯遂以馮京為第一文通為第二上曰此故事也乃擢洋第一而省闈賦魁鄭厚依第三名光逺錢塘人洋玉山人中邵武人厚蒲田人仍賜洋名應辰時言者請賜新進士儒行及中庸篇詔正字髙閌正上將親書以賜閌言儒行詞說夸大類戰國縱横之學葢出於漢儒雜記望止賜中庸庻使學者知聖學淵源而不惑於雜上乃止賜中庸閌鄞縣人也丙寅曲赦潭郴鼎澧岳復諸州初詔常州布衣陳徳一撰統元新厯至是成中書舍人朱震上之詔震為之序己巳右僕射張浚以平楊么功自宣奉加左金紫光禄大夫詔祕書省以十八員為額自南渡以來百司日有申明皆臨時裁決初無定制三省樞密院尤為叢冗至是左僕射趙鼎請委後省及都司取㑹前後所行之例約以中制立為定法付之有司遵守而行吏不得以為姦矣是月劉豫之子麟出獵于陳留有義黨百餘人欲擒麟南歸其徒首之悉斬於汴京豫又以其弟復知濟南府觀知淮寧軍九月壬申都督張浚奏江上諸軍精强非前日之比壬午宰執進呈趙鼎曰承平時陜西並邊兵亦未必如此皆陛下累年葺治之力沈與求曰去嵗陛下英斷亦恃有此可以却敵也上曰皆卿等協贊向使朱勝非尚為相必勸朕退避今已無江浙矣湖南北制置使岳飛以平楊么功除檢校少保重修神宗實録書成乙酉監修國史趙鼎上之史館奏乞以故東京留守宗澤行實與前宰臣汪伯彦等所進建炎中興日厯參照具録斷自聖意付之史館戊子上謂宰執曰朕昨使事今十年歴歴可記趙鼎曰臣聞宗澤勸陛下勿為河朔之行信否上曰誠有之澤云肅王一不不回況敵騎已逼大王去無益澤留朕雖有功然朕不甚喜葢淵聖委朕以事使朕不能成有違恨也時磁人亦不放朕去然疑王雲為姦而殺之澤不為無力沈與求曰澤留陛下此乃天命至不能救雲豈得無過哉己丑上謂宰執曰祖宗朝人才中外迭用故無偏重之弊邇來士大夫以内為重今身至侍從而不歴州縣者宜少革之初元符末上書范柔中等三十人皆以直言獲罪定為邪等壬辰上謂宰執曰此乃蔡卞之罪獻言者有可取則行無可取則容之如是則上無拒諫之名下有敢言之士何至目為邪等其誤道君皆此類也唐馬周言身觀初米斗直一縑而天下恬然知陛下憂之也今一縑易粟十餘斛而百姓怨以為陛下不憂之也其言可謂切矣太宗亦優容之復加擢用先是國子監承正平張戒上書幾八千言自謂恐忤聖意願陛下容之自南渡以來國計所賴者惟鹽每因闕用即改新鈔以幸入納之廣第茍日前不知利權為啇賈所持去年冬鼎請立對帶之法商賈聽命而鹽法遂為定制除去積年之弊是秋加以出剰立為分數計入納與對帶二法並行出入有常源源不絶始不為巨猾所制矣此據趙鼎事實修入冬十月上御書車攻詩宣示宰執癸卯趙鼎等入謝上曰車攻宣王中興之詩今當與卿等夙夜勉勵以修政事制仇敵鼎等曰臣等庸才何足以副陛下此意然陛下㳺神翰墨之間亦不忘恢復臣等敢不自勉都督張浚自湖湘轉由兩淮㑹諸將議防秋至是還庚戌入見上曰羣盜既就招撫以成朕不殺之仁卿之功也趙鼎曰湖湘既平則川陜血脉通他日可漸為恢復之圖矣時有武略郎成希靖以䇿干浚言國家阻江據闗深得御敵之道彼之騎兵葢無所施近年屢北終不得志於呉蜀必將遺我以破殘之地使吾取之則兵勢遂至分而又約以和好使吾信之然後出吾不意以此詭道而圖呉蜀一落其計中為害不細又金將薩里罕郎君常與其腹心人黄職方者於陷蕃人賀仔處言之以謂有今國王子定計要入川不難第陜西棄下三四年不顧南兵必來作主則一舉而四川可取其後仔歸朝授官為秦鳯都監時金已歸我河南陜西故地仔始言之壬戌上謂宰執曰比頻得二聖安報朕當親筆諭四方使知朕朝夕不忘二聖之意遂降手詔略曰二聖逺狩九年于茲迎請之使屢馳侍膳之期尚逺晨昏在念怵愓靡容間縁首敵之來歸每喻兩宫之安報惟孝悌之至可通神明而小大之臣共堅忠義庻戡多難克成厥功趙鼎等曰陛下聖意如此天必降之福迎還兩宫有日矣時温州有唐顔真卿之後裔居焉詔守臣推擇遣到顔邵顔卓各齎真卿所有書告身又顔彦輝乃真卿直下第十一世孫乙丑上謂宰執曰人有一死或輕於鴻毛或重於泰山在處死為難耳真卿死節可謂得所處矣今艱難之際欲臣下盡節可量推恩以勸忠義況仁祖時曽命顔似賢以官自有故事趙鼎曰真卿死節一時而名重萬世人安可不勉於善既而邵卓彦輝皆補初品官先是都督府參議權川陜宣撫副使邵溥自閬州移司綿州凡戰守皆副使呉玠専行溥概不得與玠急於軍食與總領四川財賦趙開謀不合玠欲從陸運糧開執言不可玠乃自為之時調夫兩川運米十五萬石至利州費民間僱夫錢六百餘萬緍丁夘以端明殿學士席益為資政殿學士四川安撫制置使兼知成都府詔益乃前執政令位川陜宣撫司之上既而益至成都言蜀民已病而軍尚乏食圖以救弊不一而足欲以上流水澁之時併運於閬利俟春水生後則運至軍前庻無如今夏頓闕又於閬利就糴入中庻免多支脚錢又於瀘叙嘉黔官伐木造船庻免拘船致商人逃避又於洋川就糴十萬石庻免陸運民多役死上以益所陳曲盡利害降詔從之是月館職髙閌言太祖欲平僣偽嘗置神衛水軍至真宗祥符中以兵備不可廢乃選水卒於金明池習戰掉仍置營池側號虎翼軍當無事之日尚爾今㳂江雖有舟師而繫於岸上乞時令按習以精其能庻幾緩急可用不至誤事也十一月庚午朔中書舍人胡寅言縣令近民之官尤在精擇宜依漢制嘗為臺省寺監官者分宰百里有政績則擢以不次似増重其權軍屯本縣者許之節制詔付三省初宣撫副使兼營田大使呉玠苦軍餉不繼遂於洋川及闗外成鳯岷三州治屯田嵗收十萬斛又調戍兵治褒城廢堰民知灌溉可恃皆願歸業至是就緒甲戌降詔奬之先是利路漕臣成都郭大中言於玠曰漢中雖得營田粟萬斛而民不敢復業若使民自為耕則所得數什百於此矣玠用其言嵗入果多玠又將陸運大中曰利路幸小熟請以本司緡錢就糴徐責兩路僦船之直以償玠從之丁夫得不死于路而餉亦不乏大中又患水運亡失以䇿誘賈販省費十之五庚辰給事中吕祉言侍從官以論思獻納為職豈可與庻官輪對願勿拘時從之甲申以翰林學士孫近為吏部尚書兼學士刑部侍郎兼權直院胡交修為翰林學士乙酉以顯謨閣直學士李光兵部侍郎都督府參謀折彦質徽猷閣待制李彌大竝為尚書光禮部彦質兵部彌大工部初總領四川財賦趙開言總領之職於四路漕計或不相闗必正其名俾知有所統至是乃以開為四川都轉運使仍兼宣撫司參議領茶馬等如故癸已有親從官趙勝自金國還歸言二聖萬福上悲咽不自勝左僕射趙鼎曰願少寛聖慮强於自治天必悔禍二聖終有還期也是月劉豫令偽境民有鬻子者依商稅法計緡而收其算十二月己亥朔詔以湖北制置使岳飛兼湖北京西招討使川陜宣撫使呉玠遣其子拱來奏邊事庚子上謂宰執曰玠比乞入覲今遣子來得事君之體矣玠握兵在外乃能如此良可嘉也是日詔神武乃北齊軍號久欲釐正宜改為行營䕶軍仍分中軍江東前軍淮東後軍湖北左軍淮西右軍川陜並聴本路宣撫司節制後亦謂之右䕶軍其中軍權𨽻殿前司遂以都統制楊沂中權殿帥事既而左僕射趙鼎又曰都督府軍馬合撥𨽻三衙上曰祖宗故事軍馬未有不𨽻三衙者今釐正之甚善其名既正則軍政漸可復舊禮部尚書李光言江浙為根本之地宜䘏民而寛其力今寛其力漕司不任轉輸之職而趣辦于州縣乞檢舊例應上供及軍糧錢帛令漕司自備脚費癸卯詔從之辛亥太府少卿沈昭逺請久任計臣是日上謂宰執曰祖宗時三司使如陳恕任最久號稱職今内外計臣儻能稱職就加秩以寵之不須數易張浚曰他官有稱職者亦然上又曰孔門文學政事各是一科朝廷用人若取文學而踈於政事亦非通才至於侍從論思獻納尤湏兼二者之長趙鼎曰誠如聖訓殿中侍御史晉陵周葵言監登聞檢院𨽻諫省而勑令所删定官為書局望皆俾輪對從之初葵言今天歩尚艱非臣子諷諫之時臣願直言其失大抵務虚文而無實效因數近所行之事不當凡二十許上曰趙鼎張浚為朕任事不可以小事形跡之葵曰陛下即位已相十許人其初皆極意委之卒以公議不容而去大臣亦無固志假如陛下有過尚望大臣納忠豈大臣有過而言者指陳便謂形迹臣願因人言使大臣易意不唯可救朝廷之闕亦可保全之上曰此論甚竒至是朝廷大舉而葵三章力言此存亡之機不必更論安危治亂自古未有不先自治其國而成大功者或言葵沮國大計遂遷司農少卿初御前軍器所以内侍提舉不屬工部是年始罷提舉官日輪工部郎官及軍器監赴本所視之罷諸鎮撫使劉豫遣人持海道圖及戰船様獻於金人乃興燕雲兩河夫四十萬入蔚州交牙山採木為栰由唐河運入虎州金人於雄州北立城曰虎州意以雄為熊謂虎可以勝熊也造戰船將由海道以窺我也自靖康以來中原之民不從金者於太行山相保聚初太原張横者有衆二萬往來嵐憲之境嵐憲知州同知領兵一千五百人入山捕之為横所敗兩同知俱被執又梁小哥者有衆四千破神山縣神山距平陽帥府百里而近本府遣兵三千付總管判官鄧奭將而討之金軍遥見小哥旗幟不敢進既而有都統馬五者領契丹鐡騎五百至責奭逗遛併將其軍與小哥戰亦敗而死小哥名青懐衛間人也
