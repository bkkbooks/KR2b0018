body:
  text: 中興小紀卷四十宋熊克撰紹興三十一年嵗在辛巳春正月安南獻馴象己卯上曰蠻夷貢方物乃其職但朕不欲以異獸勞逺人可令帥臣詳諭今後不必以馴象入獻甲午殿中侍御史陳俊卿言自秦檜之死其黨皆逐獨韓仲通嘗因獄事附檜今猶以敷文閣直學士帥建康是月詔罷之初正字胡憲以年老求去詔改京秩三館之士分韻作詩共餞其行以兵部尚書楊椿兼權吏部尚書二月丙午宰執奏昨有詔問儀鑾司換舊陳設有無交收事上曰陳設不過饗廟及殿中并人使時用之何至一嵗五易朕已令以新易舊仍據數交收矣上又曰朕宫中未嘗用此惟以儉為尚陳康伯曰陛下儉德天下所知雖大禹不過如是少師殿前都指揮使楊存中在殿岩幾三十年至是上章丐間甲寅除太傅封和義郡王為醴泉觀使以開府儀同三司主管步軍司事趙密代為殿帥存中行述云同列有謀其權者意蓋謂密也方存中之制未降也上曰可令趙密於未宣麻前便交職事昔唐神策軍使王駕鶴久典衛兵權震中外議欲易之崔祐甫召駕鶴留語移時而代者已入軍中矣朕讀唐史深喜祐甫善處事可以為法又以龍神衛四廂都指揮使殿前司統制李捧主管步軍司事而龍神衛四廂都指揮使主管步軍司事成閔仍舊職焉甲子詔於都茶場置㑹子務仍撥左藏庫錢一十萬貫為本時户部侍郎錢端禮經畫為六務出納制用皆有法焉是月少師觀文殿大學士秦熺卒於建康府詔贈熺太傅給事中黃祖舜言三公非有大功德不以輕授陛下保全秦檜家俾熺休致而歸不加以罪恩亦至矣今乃贈以帝傅之秩又因其遺奏許之推恩異寵併加殊駭物聽遂寢其命三月己卯以何浦為翰林學士兼權吏部尚書壬午以兵部尚書兼權翰林學士兼侍讀楊椿為參知政事夏四月自廣西嵗於橫山寨買馬費九萬緡而多斃於路至是言者請今後止令部至靜江府南北兩務收養令所撥諸軍自往取之詔經略司相度申樞密院己未上謂宰執曰朕思州縣逋缺若民果貧困自合蠲放或已納足而官吏侵用則當與核實明示罪責治道貴信賞必罰若漫不經理則是姑息雖堯舜不能治也是日四川總領王之望上催驅殿最事目乃詔諸路依此行之時左僕射陳康伯與參知政事楊椿密議敵將敗盟其兆已見當先事為備其策有四令兩淮諸將分畫地界使自為守一也措置民社密為寓兵之計二也淮東劉寶將驕卒少不可專用三也沿江諸郡增壁積糧以為歸宿之地四也時舊相惟張浚在於是殿中侍御史陳俊卿言浚忠藎兼資文武可付以閫外臣素不識浚雖聞其嘗失陜服散淮師而許國之心白首不渝今杜門念咎老而練事非前日浚也臣望聖慈勿惑讒謗雖未付以大柄且與一近郡以係人心庶緩急可以相及俊卿復論鎮江都統制劉寶軍律不嚴裒刻過度比有朝命分卒戌黃魚垜而寶違不遣乃詔責寶以散官安置朝論快之金國主亮率其衆北巡至北邙山因改名其山曰太平五月金主亮恃其強暴欲渝盟擾邊久矣至是遣其臣龍虎衛上將軍髙景山刑部侍郎王全來賀天申節辛卯引見於紫宸殿全因導亮意求淮漢之地及指取將相近臣議事并報淵聖皇帝訃音且言亮以九月北巡今所指近臣當於八月至其國大率皆慢辭也於是宰執聚都堂議舉哀典故時有謂上不可以凶服見使者欲俟其去乃發哀工部侍郎黃中聞之亟白曰此大事一失禮謂天下後世何且使人或問故將何以對於是始議行禮及調兵守江淮之策甲午宰執召三衙帥趙密成閔李捧及太傅和義郡王楊存中至都堂議舉兵既又請六曹長二凌景夏汪應辰錢端禮金安節張運黃中給舍黃祖舜虞允文楊邦弼臺諫官汪徹劉度陳俊卿聚議久之而退宰執百官入和寧門舉哀仍進名奉慰景夏餘杭人度歸安人也時朝廷命浙西總管李寶駐江隂軍以防海道於是提舉浙西市舶曽懷獻言曰舶海之役船有輕重篷有疾遲風有大小竊嘗聞於髙麗之商謂有同日離岸而隔嵗不至者有同時出洋而經月不至者况北人之便唯在乘騎縱使至岸無馬不能捨舟如猛獸失林將自投於穽若海道過為之備徒分兵力耳朝廷亦以為然懷公亮孫也六月壬寅御前諸軍都統制田師中戍鄂渚李道戍江陵吳拱戍襄陽朝廷以上流重地邊面闊而兵力分宜主以大將乃詔遣慶逺軍節度馬帥成閔總禁旅三萬往上流控扼壬子閔率衆發臨安尋以閔為湖北京西制置使閔至鄂未幾移屯應城縣在鄂郢之間焉乙卯以鎮江都統制劉錡為淮南江南浙西制置使上以金敗盟命同知樞密院事周麟之往聘麟之憚行左僕射陳康伯以國事勉之語侵康伯康伯曰上儻遣康伯聞命即行大臣同國休戚雖死安避麟之竟辭於是言者論之上曰為大臣臨事辭難何以率百僚庚申罷麟之為在外宫觀時前吏部侍郎徐嚞前户部侍郎劉岑皆願使金並召至行在而岑對不合戊辰以嚞為敷文閣待制樞密都承㫖借資政殿學士充起居稱賀使武臣張掄副之仍留岑為戶部侍郎秋七月新德安府教授王質以近方登科召試館職為言者所論癸酉詔罷之甲申左僕射陳康伯率羣臣詣南郊請淵聖皇帝諡宜天錫之諡曰恭文順德仁孝詔恭依右司諫山隂梁仲敏言前同知樞密院周麟之懷姦辭難巧避出疆之命望行誅竄戊子責授麟之祕書少監筠州居住徐嚞等出使未至盱眙軍金主遣翰林學士韓汝嘉先在泗州壬辰相見於淮岸口汝嘉𫝊亮語謂卿等雖來即非所召可回令元指定近上一二人來須九月初定到是月金主亮南徙汴京其臣自左丞相張浩以下具九節儀從迎亮於南薰門亮及門而雨暴至儀從皆不克舉亮入內至承天門迅雷風大作天變如此亮不知懼也其母太后力諌南征亮怒使護軍將軍持嘉彥忠原作赤盞彥忠今改上二字即宫中弒之以威言者於是左右縮頸國人以目而后徒單氏與子光瑛復諫亮亦欲誅之母子俱避去三日而後出亮一日召其臣問曰許多宰執孰有能為統軍者右丞劉諤曰臣請為之亮喜即拜諤為統軍將二萬衆歷唐鄧以瞰荆襄又以金紫光祿大夫王忠彥統步軍孟州防禦使王彥章副之將五萬衆據秦鳯以伺巴蜀工部尚書蘇保衡統水軍驍騎上將完顔正嘉努原作鄭家奴今改正副之由海道將趨二浙餘兵亮自將焉淮南制置使劉錡新創踏射威强弓兵八月戊申醫官昭慶軍承宣王繼先怙寵干法富埒公室子弟直延閣通朝籍姻戚黨友莫非貴遊撤民屋以廣第舍别業外帑殆遍畿甸數十年間未有敢搖之者自聞邊警日輦重寶歸吳興為避敵計於是殿中侍御史杜莘老上疏數其十罪上曰初以太后餌其藥稍假恩寵不謂小人驕橫乃爾莘老曰繼先之罪擢髮不足數今臣所奏其大凡耳上曰有恩無威有賞無罰雖堯舜不能治天下乃詔貶繼先福州子孫停其官都城第宅皆籍沒强買奴婢悉縱還之先是言者謂今日正當節浮費積其贏以濟軍興監司自浙漕始郡守自臨安始各具裁省之數以聞頒示外路俾之為式至是浙漕以二萬緡臨安以五萬緡來上癸丑上諭宰執樁留外府若不下諸路切戒無得科敷如昔時羡餘適資贓吏而擾吾民也初浙西總管李寶遣其子公佐同將官邊士寧潜入敵境伺動靜甲寅寶以舟師三千人發江隂既而以風未順退泊明州澳而士寧適自密州回言其子公佐已挾歸正官魏勝得海州矣寶大喜趣其下乘機進發上念出戌官兵之勞特捐內帑錢七萬緡分犒其家殿中侍御史杜莘老言諸軍負回易子錢甚夥例償以月廪不先除此弊緡出禁帑入將帥私室矣上悟既又聞諸營勘請回易處仍舊尅除或非理斂索丙寅詔悉禁止違者重置之法士皆歡舞拜賜己巳朝獻景靈宫九月庚午朔朝饗太廟辛未崇祀上帝於明堂以徽宗配大赦天下金師喀齊喀原名合喜今改正號西元帥以五千餘騎自鳯翔大散關入川界三十里甲戌攻黃牛堡時人情悸懼四川制置使王剛中單騎日馳百里抵仙人原見宣撫使吳璘於帳中璘大驚剛中曰大將臨戎義同休戚安得高枕而臥於是官軍用神臂弓射退敵騎璘遣將官高松往為之援仍與本堡管隊官張操同力拒之初建炎末陜西諸將如張中孚張中彥兄弟嘗叛歸北境中間金還我河南故地乃召二人至行在復授官以仍奉內祠及和議成悉為金索去中孚未幾死至是惟中彥為金將兵在陜王剛中即遣臘書說之又剛中聞大將劉錡制置淮上因對璘談錡之美璘曰信叔有雅量而無英槩今天下雷同舉之璘恐其不能當亮也剛中未以為然冬十月庚子朔下詔親征初金亮肆虐國人久不堪之有楚王褒者晉王宗輔之子而太宗晟之孫也時中原豪傑並起大名王友直濟南陳俊皆倡義集衆而契丹之後耶律斡罕原名窩斡今改正亦興於沙漠於是渤海一軍萬人叛亮歸㑹寧府立褒為帝或言立褒在六月改元大定赦其境內黃河以北皆下之左丞相張浩自汴京録褒赦馳以報亮亮歎曰朕欲俟江南平後取一戎衣大定之義以紀元是子乃先我乎命取書一帙示其下果預識改元之事亮即遣先鋒將郭安國率衆攻褒令盡誅黃河以北之叛已者癸卯詔四川宣撫使吳璘分陜西河東路淮南制置使劉錡分京東河北東路湖北制置使成閔分京西河北西路並為招討使時新復海泗二州乃詔歸正官魏勝知海州夏俊知泗州金帥喀齊喀攻黃牛堡旬餘不退宣撫使吳璘别遣將直至寶雞渭河夜劫橋頭大寨獲捷於是四川制置使王剛中即日馳還謂其屬李燾曰將帥之功吾何有焉燾曰公以身督戰而功成不居過人逺矣時屯戍兵將暴露日久丙午宰執請冉加賞犒上詔所在總領所撥給仍具數以聞令內帑給還戊午以知樞密院葉義問督視江淮荆襄軍馬中書舍人虞允文為參議軍事時四川總領財賦王之望區處調度有條葉義問力薦之上有擢用之意陜西河東招討使吳璘遣將官彭清强英張德等攻破隴州方山原辛酉左光祿大夫湯思退復觀文殿大學士充醴泉觀使兼侍讀既至除行宫留守甲子特進張浚復觀文殿大學士判潭州左太中大夫湯鵬舉復資政殿學士知太平州浚尋改判建康府先是浙西總管李寶舟師至東海縣時金兵已圍海州寶麾兵登岸金人驚出意外亟引去於是魏勝出城迎寶寶遣辨士四人招納降附時山東豪傑王世隆明樁劉異輩皆各以義旗聚衆爭為應援寶與子公佐引舟師至密之膠西石臼島而金舟已出海口泊唐島相拒止一山候風即南不知王師之猝至也寶伺敵未覺遣禆將曹洋黃端禮禱於石臼神祈風助順丙寅風自南來衆喜爭奮引帆握刃俄頃過山薄敵鼓聲震疊敵驚失措敵帆皆以錦纈為之彌亘數里忽為波濤卷聚一隅窘蹙搖兀無復行次寶命以火箭射之煙焰隨發延燒數百火不及者猶欲前拒寶命健士躍登其舟以短兵刺擊殪之舟中其餘僉軍皆中原舊民脫甲而降者三千餘人獲金將完顔正嘉努等六人斬之惟統軍蘇保衡未發不可獲旋聞自經死得獻議造船人倪荀商簡梁三兒等皆淮浙姦民且為敵嚮導者又獲其統軍印與詔文書器甲糧斛以萬計寶欲乘勝而進而聞亮已濟淮遂旋師駐東海視緩急為援遣曹洋飛小舟奏捷既至上命降詔奬之除寶靖海軍節度沿海制置使丁卯知樞密院葉義問至鎮江權立行府先是淮東制置使劉錡遣都統王權將兵迎敵逗遛不進錡冉檄權往夀春權不得已僅發軍至廬州戌守故敵得維橋以濟權棄廬州而遁敵騎至尉子橋統制官姚興以一軍三千人力戰權擁羣刀斧自衛殊不援興殺賊數百人以援兵不至而沒癸亥權又棄和州先奔采石初京西招討使成閔遣統制官趙樽以四千人守德安府樽乘虛攻蔡州入其城斬敵首楊寓餘衆遁去時金人既入兩淮而上流惟鄂渚荆南二軍朝廷亟命閔總諸軍併舟師回援淮西而荆南軍新創金將劉諤擁衆十萬楊聲欲取荆南又欲分軍自光黃搗武昌朝廷以金人昔嘗由此入江西慮搖根本命都統制吳拱遣兵護武昌一帶津渡拱將引兵回鄂宣諭使王徹聞之馳書止拱而自發鄂之餘兵進戍黃州敵果犯襄陽拱與戰於襄水之上敗之時武昌令薛季宣嘗獻計於徹謂閔已得蔡有破竹之勢盍守便宜勿遣令閔乘虛下潁昌經陳汝趨汴梁敵內顧必驚潰徹不果用季宣永嘉人徽言子也時詔淮漢郡縣籍民為兵淮南乃選丁壯欲涅其手面從大軍役使民駭而逃殿中侍御史杜莘老言敵未至而先毆吾民非計請令兵民止聽郡縣官節制征役無出鄉從之淮民乃定先是金萬户髙景山以兵數萬攻楊州劉錡提大兵禦之於清河敵以氊裹舟載糧挽而上劉錡募善沒者鑿舟沉之敵大驚錡俄病嘔血殆不能支猶乘肩輿臨敵指揮俄而敵薄揚子橋欲以邀錡錡以兵保瓜州敵騎逼江錡遣麾下員琦設伏於皂角林與敵接戰誘敵入張弩俄發敵大敗斬景山俘數百人十一月庚午宰執奏禁軍闕額事上曰尋常兵集自有定數當此多事之時額外添不必拘也詔江浙福建揀軍發赴三衙其闕額令自招填詔下鬻爵之令登仕郎八千貫依奏䕃人例仍免銓試一次度僧牒亦减價為三百貫金房駐劄都統王彥統兵復虢州金亮為內變所撓於是親統細軍駐和州之雞籠山臨江築壇刑馬祭天必欲由采石而渡朝廷詔王權至行在以池州都統制李顯忠代之命中書舍人虞允文趣顯忠交權軍時顯忠未至乙亥允文夜見建康留守張燾議禦敵之計燾但言已當死留鑰丙戌左僕射陳康伯等言時當雨雪戰守諸軍暴露不易乞再加優恤上乃詔總領所每人支絹一匹家屬在營者給以薪炭之直康伯等曰此真受陛下挾纊之賜也亮自采石之敗乃北抵瓜州時淮南制置使劉錡退屯鎮江而錡病已遽知樞密院葉義問以都統制李橫代錡之職趣令渡江錡之姪中軍統制官汜隨橫以往軍戰不利橫併其都統制印失之時上怒甚將先按誅王權以厲諸將同知樞密院黃祖舜密言於上曰權敗軍之罪誠合誅然劉汜亦須正典刑若貸汜而誅權是謂同罪異罰顧劉錡有大功今聞其病已殆汜誅錡必愧忿以死是國家以一敗而自殺三大將得無為敵所快乎願陛下少留聖恩上大悟權汜得不死癸未乃詔湖北制置京西等路招討使成閔為淮東制置淮北泗宿招討使鄂州駐劄都統制吳拱為湖北制置京西等路招討使建康府駐劄都統制李顯忠為淮西制置淮北夀亳招討使上以李橫劉汜等不利急遣御營宿衛使楊存中措置守江中書舍人虞允文亦自建康馳至鎮江時江岸有車船二十四艘賊已瞰江恐臨期不堪駕用存中允文同淮東總領朱夏卿鎮江守臣趙公稱相與臨江按試命戰士踏車船徑趨瓜州迫岸復回敵兵皆持滿以待其船中流上下回轉如飛敵衆相顧駭愕時亮已聞李寶由海道入膠西焚其戰艦而荆鄂成閔諸軍方順流而下亮愈忿乃回揚州召諸帥約三日畢集過期盡殺之諸帥相與謀曰南軍有備如此進有淹殺之禍退有敲殺之憂奈何其中一人曰等死求生可乎衆皆曰聞教有總管萬戴者曰殺郎主却與南宋通和歸鄉則生矣衆口一辭曰諾亮有紫茸等細軍不遣臨敵専以自衛諸人雖欲弒亮而細軍衛之嚴密衆因謂諸軍曰淮東子女金帛皆逃在泰州我輩急欲渡江汝等何不白郎主往取之細軍欣然共請亮從之於是細軍去者過半一作三萬人亮語威勝統軍耶律勸農曰爾所將勝兵我明日自㸃數少必誅勸農自計兵亡已過半與其子宿直將軍穆爾原名母里今改正謀亦欲弒亮乙未諸帥集兵萬餘人拉弦直入亮寢帳中左右親兵散走諸帥帳中矢下如雨亮即死并殺其太傅及三妃與謀事者十餘人丙申亮細軍破泰州統制官王剛棄城走江隂是日虢州僉軍雷政渡江報亮已被殺時樞密行府留建康先是有知數者詣行府上書云以太一局考之金亮不煩資斧冬至前當有蕭墻之變人皆未以為然至是驗之是月以吏部侍郎汪應辰兼權尚書初馬軍司統制官趙樽離蔡州至麻城縣復被詔㑹鄂渚帥吳拱江陵帥李道併力進取樽領兵還攻蔡州刺史蕭懋德破城立寨十二月己亥朔黎明樽潜師入城懋德遁去時有司用紹興七年巡幸故事辦嚴殿中侍御史杜莘老言今親征與曩日事異宜悉從簡以幸所過郡縣上曰此行中宫及內人不往止與建王行令遍識諸將雖朕服用亦自省約也壬寅淮東制置使成閔復揚州敵衆已戕亮欲遣使報我訪得瓜州所俘成忠郎張真使持牒請和甲辰金都督府牒本朝樞密院云正隆失德無名興師兩國生靈枉被塗炭今已從廢殞見議班師各務戢兵以敦舊好上將撫師於建康而欽宗未祔廟留守湯思退請省虞以速祔禮部侍郎黃中持不可上納之然議者猶謂凶服不可以即戎上曰吾固以縞素詔天下乙卯李顯忠戰退金兵己未上次鎮江府宰執奏肆赦事目上曰向已下哀痛之詔今日恩宥不必更揚完顔亮過惡但専罪已以稱朕畏天愛民之意陳康伯等奏宣諭詞臣仰遵聖㫖壬戌曲赦新復州軍上諭宰執曰前日過平江守臣洪遵進洞庭柑却之今過常潤兩郡俱無所獻必是聞風而罷也朕意無他正恐受之則後來所歷之郡必競為夸侈有過於柑子者矣陳康伯等因贊此非獨仰識陛下儉德又以見聖慮之深逺也癸亥建康留守張浚言金人已退兩淮皆定初金亮既被弒子光瑛留汴京亦為其衆所殺亮遣先鋒將郭安國行至滑州聞變留不進金國新主褒知亮已死乃與其子允升允迪擁甲騎一萬趨燕京時詔沿江監司條上恢復事江東提舉常平官洪適言金亮既殞大定僣號未必諸國服從自淮以北别無爭立之人宜傳檄中原使義士各取州縣因以畀之王師但屯淮上募兵積粟以為聲援不必輕涉其地與之力爭俟蜀漢山東之兵俱集遲以嵗月必有機㑹可乘此萬全之䇿也初諸路嵗鑄銅錢一百六十萬貫自紹興以來權以五十萬貫為額而近嵗虧甚多是年止及一十萬一千貫數內惟嚴州神泉監密邇行都今徑自輸而建之豐國韶之永通與贛之鑄錢院悉赴提㸃官所就饒之永平監團綱津發泛大江轉入浙西漕渠納之京帑是年詔籍鄉兵知荆南府續觱乃請籍民為義勇其法取於主户之雙丁每十萬戶為一甲五甲為一團甲團皆有長又擇一邑之豪為總首嵗於農隙教以武事而官給其糧其後𨽻於籍者至七八千人此據楊倓江陵志又武昌令薛季宣亦求得故河北陜西弓箭手保甲法五家為保二保為甲六甲為隊據地形便利則為總不限以鄉總首領焉諸總皆有射團教民射而旗幟亦隨總而别其色云紹興三十二年嵗在壬午春正月戊辰朔日有食之初鄧州安撫蕭中一率先歸正上嘉其忠義嘗欲築館待之使其至如歸至是為亂兵所害州民乞立廟襄陽都統制吳拱知均州武巨列上其事丙子上諭宰執宜與贈官并賜廟額仍令拱輩致其孤於武昌多方恤之時江東提舉常平官洪適因上殿言江鄉之民以旱荒而徙淮甸比遭敵騎之擾復還故鄉所棄之産已為官司估賣形勢之家買者十不償一佃者量納租課無補於官有害於民乞斷自紹興二十八年以後州縣所賣逃産許元業人子孫以元估價就贖専委提舉常平官覺察從之先是京東忠義軍耿景等以占東平府遣使來奏己丑以景為天平軍節度就知東平府仍節制京東河北忠義軍二月戊戌朔以中書舍人權直學士院虞允文為兵部尚書川陜宣諭使於興州置司癸卯上發建康府初上欲付留守張浚以江淮之事已而中止乃以宿衛使楊存中為宣撫使中書舍人劉珙不書録黃且論其不可珙子羽子也上謂宰執曰劉珙之父為張浚所知比奏事専為浚地耳然存中宣撫之命亦寢㑭專措置而已乙巳上次鎮江府乙卯上至臨安府己未以觀文殿大學士行宫留守湯思退知紹興府先是統制官趙樽再得蔡州城復為金兵所圍樽戰却之㑹鄂帥吳拱進軍駐南陽遣統制官成臯華旺等各以所部來援而金帥費摩原作裴滿今改正率精甲十萬止於城西依汝水為寨一日凌旦來攻統制官焦元中流矢敵乘勝登城樽牙將王世顯募敢死巷戰敵敗退再來攻又不利敵燒營而遁屬有㫖班師乙丑樽軍還信陽閏二月太尉提舉萬夀觀劉錡卒右諫議大夫梁仲敏殿中侍御史吳芾左正言劉度言參知政事楊樁無所建明三月丁酉朔罷為資政殿學士奉外祠再論遂降授端明殿學士壬寅詔諸路帥府各置㑹子庫上之幸建康也翰林學士何浦以屬疾不能扈從至是力求去己巳以浦為龍圗閣學士提舉太平興國宫夏四月御史中丞王徹宣諭荆襄回戊寅入見遂除參知政事甲申上與宰執論及近年諸將之子躐取科第有居清望官者上曰武臣子孫只宜為武臣清望須還白屋今以將家居之則公議自然籍籍於是陳康伯等退而歎仰不已是月資政殿學士魏良卒太傅和義郡王楊存中罷措置兩淮詔以建康留守張浚兼之四川宣撫使吳璘時已復大散關和尚原至是又遣都統制姚仲率師攻德順軍未下敵衆來援璘恐士有退志即自秦馳赴率數十騎繞城傳呼城中之人欲識璘面不發一矢敵氣自索既戰又為我軍所敗遂遁去璘入城父老擁拜馬前幾不可行開府儀同三司領殿前都指揮使趙密纍章乞解印尋除萬夀觀使奉朝請五月甲辰宰執奏近探報皆言黃河南北蝗蟲為災今已數年天意可見而江淮之間蠶麥大稔此實聖德所召上愀然曰去嵗完顔興師無名彼曲我直豈無天理朕德不足以動天賴祖宗仁澤所致今幸蠶麥告登更望有秋設或邊事未息必可枝梧於是陳康伯等惶懼仰歎而退戊申太𫝊和義郡王楊存中罷御營宿衛使復為醴泉觀使壬戍龍圗閣學士洪遵復為翰林學士望仙橋東新葺宫成六月戊辰詔以德夀為名己巳立皇子建王為皇太子改名從􅎣從目初民間䜟語曰朝廷自有龍兒在頭角生時方見天至是識者謂從天而加二㸃乃頭角之生其下從日則如日當天而天下利見此見天之義也右僕射朱倬罷為觀文殿學士奉祠而去制辭略曰君子邦家之基未聞成效元良天下之本乃覬疇庸未幾落職甲戌皇太子賜字元永故宗室祕閣修撰子稱追封秀王妻宜人張氏封王夫人內降御劄皇太子可即皇帝位朕稱太上皇帝皇后稱太上皇后應軍國事並聽嗣君處分丙子上行內禪之禮有司設仗紫宸殿下百寮起居畢宰執陳康伯葉義問汪徹黃祖舜言臣等不才輔政今陛下超然獨斷髙蹈堯舜之舉臣等心實欽仰但自此不獲日望清光犬馬之情不勝依戀因再拜辭相與泣下幾至號慟上亦為之揮涕曰朕在位三十六年今老且病久欲間退此事斷自朕意非由臣下開陳卿等當悉力以輔嗣君康伯等復奏曰皇太子仁聖天下所共知似聞謙遜太過未肯便御正殿上曰朕前此固嘗與之言早來禁中又面諭之即步行徑趨側殿門欲還東宫朕已再三敦勉邀留今在殿後矣上即還內羣臣移班殿門外聽宣詔書少頃皇太子服履袍內侍扶掖至御榻前側立不坐百官拜舞山呼起居畢康伯等升殿奏願陛下即御坐以正南面仰副太上皇傳授之意天顔愀然曰君父之命出於獨斷此大位懼不敢當尚容辭避康伯等再奏陛下應天順人龍飛寶位臣以駑下之材恐不足以仰副新政然依乘風雲千載之遇實與四海蒼生不勝大慶賀畢駕還內百官赴祥曦殿候太上皇登輦扈從至德夀宫而退
