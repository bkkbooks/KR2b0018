body:
  text: 中興小紀卷八宋熊克撰建炎四年嵗在庚戌春正月甲辰朔上至台州章安鎮駐蹕兩浙宣撫副使郭仲荀既不能遏敵又棄越城而遁其兵多散為盜至是來朝責授散官廣州安置上以敵騎驚擾慮隆祐太后徑入閩廣己酉詔遣使臣賫書至䖍州尋問艤舟之所詔浙西制置使韓世忠赴行在世忠言見駐華亭江灣願將所部全軍往升潤邀金人歸路盡死一戰丙午詔從之丁未御史中丞趙鼎諫議大夫富直柔户部侍郎葉份中書舍人李正民綦崇禮太常少卿陳戩同對於舟中時扈從泛海者宰執外惟此六人而給事中汪藻與其餘皆未至也户部侍郎李逮自明州來戊申入見言張俊在明為戰守備城外居民盡爇之其意亦欲赴行在也金烏珠引衆再攻眀州丙辰浙東制置使張俊率兵禦於髙橋一日戰數合慮其益兵復來俊與守臣劉洪道俱避去烏珠遂破明州屠其城時提舉明道宫鄭億年避地山間為金所得驅以北去億年居中子也敵衆以船趣昌國縣欲追襲御舟時提領海舟張公裕引大舶擊敗之敵遂退初金萬户羅索及尼楚赫與吾叛將折可求聨衆十萬圍陜州時關以東獨陜在焉寧州觀察使李彥仙守禦甚備遇士卒有恩食既盡煮豆以啖其下而取汁自飲至是金亦無食欲去有人告以急擊可入按原本作馬繫可入今從建炎以來繫年要録改金益增兵攻之愈急丁巳城陷彥仙巷戰而死雖民之婦女猶升屋以瓦擲賊哭李觀察不輟金人殺其家陜民無噍類金人始敢西而全陜沒矣先是宰執臺諫㑹食金鼇山寺范宗尹密語趙鼎曰近日諸將姚端等進見太數所錫極厚國用窘甚見上幸一言也戊午鼎草奏乃聞上以在四明時衛士紛擾盡廢禁直獨中軍統制卒永宗有兵數千而端即御營使吕頥浩親兵之將其衆獨盛所以優遇之也己未夜大雷雨庚申上謂宰執曰昨雷聲頗厲晉志以雷發聲非時為女主顓權君弱臣强外國兵不制所致朕與卿等當共修德以應天地癸亥上曰昨日雷再發聲今日方二月節要亦非時也與晉志所占無異惟發頻者應速爾甲子詔中書舍人李正民往江西問安隆祐太后仍稱撫諭使中丞趙鼎薦京官永嘉吳表臣林季仲補臺官之闕季仲避地未至而表臣先對是日除監察御史時聞明州失守海道可虞丙寅上移次溫州館頭殿中侍御史張延夀論權知三省樞密院滕康及同知劉珏之罪詔罷康珏仍並落資政殿學士遂以新復端眀殿學士盧益權知三省樞密院而參知政事范宗尹因薦李回時回以散官居吉州召復端明殿學士以為之二戊辰中丞趙鼎對因言豫章之擾上曰太后僅以身免乘輿服御之物悉棄之宫人失一百六十餘人上又曰已黜滕康劉珏用盧益李回替之矣己巳上幸水陸寺侍御臺省官稍集班列差盛辛未詔侍從官條具金人退與不退如何措置及於何處駐蹕户部侍郎葉份言淮鹽路梗妨阻客販浙鹽數少積壓客鈔請權以福建鹽通商仍指還買鹽本錢即本路官搬官賣兩不相妨士申詔從之初政和中遣左司郎官張察至本路參定鹽法嵗以三分為率二分歸朝廷許商人輸錢於𣙜貨務給鈔即本路受鹽一分歸漕司許自買鹽積於海倉令上四郡及屬縣般賣以辦嵗計時商販官般二法並行靖康俶擾商販殆絶故官悉自鬻至是份請行鈔法而姦民乘之盜販多矣金萬户羅索與其副薩里罕及黑峯等攻邠州宣撫處置使張浚遣都統制曲端率兵拒之一日兩戰皆捷至白店原薩里罕據髙原而陳羅索與黑峯引衆來攻為端所敗薩里罕乘髙望之懼而號哭金人因目之為涕泣郎君既而敵勢復振端所部統制官張中孚李彥琪連戰不利敵亦引去二月乙亥上至溫州江心寺駐蹕因改曰龍翔東有小軒遂曰浴日皆宸翰書額賜之詔啓運宫神御於福州奉安熒惑犯紫微垣侵相位癸未吕頥浩乞解機務不允知溫州盧知原有治績詔除右文殿修撰知原秉子也丙戌知眀州劉洪道奏已復本州詔眀晚移蹕明州金元帥烏珠尚據臨安聞浙西制置使韓世忠自江隂復趨鎮江恐邀其後丁亥烏珠遽引衆殺掠而去縱火城中數日方滅戊子詔萬夀觀㑹聖宫章武殿神御於溫州天慶宫奉安時右僕射杜充已降敵而御營副使劉光世猶奏充敗事未知存亡光世又言金人遣兵由湖州攻兩浙而王􅊛所統前軍亦潰韓世忠自浙西上海船而去臣今孤軍駐南康望逺避賊鋒俟春暄破之不難詔光世乘間擊之無失機㑹及敵退光世遣統制官王德躡其後擒數百人以歸庚寅上至溫州駐蹕州治先是主管眀道宫薛弼見吕頥浩謂宜遷入城且獻䇿平其直以鬻官産既而駕留一月所費不資皆取足於鬻産之直弼永嘉人也王􅊛引餘軍赴行在自觀察使降為防禦使先是詔募海船百餘隻於福建廣南獨廣東漕臣趙億所發船先諸路而至福建漕臣祖秀實魯詹與權提刑梁澤民共裒一路經費之餘得銀八萬兩上之億安西人撲之孫秀實浦城人詹海鹽人澤民邵武人也初鼎州武陵縣有土豪鍾相者以左道惑衆乃結集為忠義民兵其徒呼相為老父士大夫之避地者多依之相所居村有山曰天子岡遂即其處築壘濬濠以捍賊為名且承帥檄聚衆閲習武藝時有中州潰兵孔彥舟等擾湖南詐稱鍾相民兵相聞之懼又因其子奪監司之馬於白涉渡是月相等遂作亂逺近響應僭號楚王改元天載自補官屬尋詔湖南北帥司發兵討之於是鼎之武陵桃源龍陽沅江澧之澧陽安鄉石門慈利荆之松滋公安石首潭之湘隂益陽湘鄉嶽之華容辰之沅陵諸處皆為盜區矣時太常少卿陳戩扈蹕准詔論時事其略謂兵將用命則寡可以敵衆不用命則多適以致敗今之握兵柄秉旄鉞非闒冗即跋扈也國之典刑不能加之將將之威令不能施之軍宜申嚴紀律使進退左右惟命之從則敵可破矣先是知真州向子忞言昨携本州金帛皆為韓世忠所奪且言杜充以投降而去麾下兵有走回者癸巳上謂中丞趙鼎曰自聞充之報不食者纍日蓋非朝廷美事也乙未溫州奏故右丞許景衡妻胡氏乞給借所僦官屋上顧吕頥浩曰朕即位以來執政中張慤最直頥浩曰慤未病時嘗語臣云惟一許少伊不轉了少伊景衡字也臣以是知景衡纍與慤同宜睿意之不忘也乃詔以官屋賜其家丙申以金退赦諸路烏珠引金衆回至平江府城下同知樞密院事兩浙宣撫使周望與守臣湯東野力不能拒棄城避之初郡人恃望以為安敵至欲遁而舟楫皆為諸軍所奪故不能脫戊戌敵入城縱兵焚掠而去過吳縣宣撫使統制官陳思恭以舟師邀於太湖擊敗之幾獲烏珠既而擢思恭為御前後軍統制丁酉中丞趙鼎諫議大夫富直柔同對彈右僕射杜充乞先罷相候得其投降的報則别議罪上欲幸平江府三月丙午趙鼎言萬一敵去未逺或作回戈之期何以待之於是行期稍緩左僕射吕頥浩奏戶部侍郎葉份言駕幸浙西須早除發運使臣觀可任漕計極難得人間有之又素行不修上曰有德者率浮直或不能辦事有才者多是小人如梁揚祖誠無學術使為發運使則有餘矣大抵小人不可在侍從之列若藉其才任之於外亦何不可是月遷份為尚書宣撫措置使張浚奏大食國進奉珠玉至熙州己酉上謂宰執曰大觀以來川茶不以博馬惟市珠玉故武備不修今若復捐數十萬緡易無用珠玉曷若惜財以養戰士乃詔浚勿受量賜以答其意既而上曰浚措置陜西極有條理吕頥浩曰陛下雖失之杜充復得之張浚上曰浚自薦辛興宗作秦帥比至陜西見孫渥才優即奏罷興宗而用渥蓋其用心公也上語在是月辛酉今聮書之時浚聞金人南下上浮海東征亟治兵入衛未至襄漢遇德音知金退乃復還關陜王之望記西事曰浚歸自秦亭士馬甚盛至房陵畏桑仲而不敢近乃以王以寧為制置使王擇仁為節制步騎十萬措置漢上以寧至襄陽乃卑辭假道而去擇仁孤軍不敢進頓於均州後其將王闢叛去後潰而亡於是西師之東下者星散盡矣桑仲知浚畏已而西帥之易與也益亡所憚矣己未上詣天慶觀朝辭九廟宰執百官扈從自渡江至是始有此禮上登舟回鑾以禮部尚書曽懋為顯謨閣直學士知洪州是月金左監軍逹蘭自維州遣泰伊原名太一今改正貝勒玷原作孛堇玷今改正等提兵南下以援烏珠因圍楚州守臣趙立乘城禦之金進圍揚州朝廷恐守臣張績力不能支計退保鎮江績不肯動金乃至真州績金壇人也時東京雖城守而勢益危金人更遣河北簽軍首領聶昌領衆來攻留守上官悟力不能拒城破為金所害夏四月丙午上至餘姚縣海舟大不能進詔易小舟仍許百官從便先發癸丑上至越州駐蹕州治烏珠回至鎮江而浙西制置使韓世忠已提兵駐楊子江焦山以邀之左僕射吕頥浩請駕幸浙西下詔親征以為先聲亟命鋭兵䇿應世忠庶擒烏珠此一竒也參知政事王綯亦請遣兵與世忠夾擊甲申乃下詔親征中丞趙鼎以為平江殘破最酷人心不樂是行即奏曰臣在溫台屢言當俟浙西寧靜及建康之衆盡渡江然後回蹕今遽有此舉必以韓世忠之報敵騎窮蹙可以剪除爾萬一所報不實及建康之衆未退或回戈衝突何以待之兼饒信魔賊未除王􅊛潰軍方熾陛下遽捨而去茲乃社稷存亡至厄之道也時臺諫亦皆言之乃除鼎翰林學士鼎力辭改吏部尚書亦不受遂復為中丞時敵衆百萬世忠戰士甫八千烏珠遣使與世忠約日合戰世忠募海船百十艘進泊金山下仍立一旗書姓名於上敵望見大笑曰此吾几上肉爾世忠預命工煆鐵相聯為長綆貫一大鈎遍授諸軍之强健者平旦敵以千舟噪而前比合戰世忠分海船為兩道出其背每縋一綆則曵一舟而入敵不得渡復遣使願還所掠及獻馬五千世忠不聽曰只留下烏珠乃可去時達喇所遣之兵在儀真江之南北兩岸皆敵衆而世忠據中流與之相持知揚州張績亦命偏師控扼要處與世忠為援烏珠閉戶不敢出乃即城之西南隅鑿渠三十里欲潛師渡建康而地勢高潮不應金之在儀真者又於城外鑿小渠三十里屬之江以通漕烏珠刑白馬殺婦人自創其額以祭天幸風濤之息便載以逃世忠諜知之悉師督戰而風弱帆緩我師不利統制官孫世詢嚴永吉死之所掠金人又為奪去金以輕騎絶江而遁世忠曰窮冦勿追使去先是世忠視鎮江形勢無如龍王廟者敵來必登此望我虛實因遣將蘇德以二百卒伏廟中又遣二百卒伏江岸遣人於江中望之戒曰聞江中鼓聲岸下人先入廟中人又出數日敵至果有五騎至龍王廟廟中之伏聞鼓聲而出五騎者振䇿以馳僅得其二有人紅袍白馬既墜乃跳馳而脫詰二人者云則烏珠也是舉也俘獲殺傷甚衆金所遺輜重山積又得龍虎大王舟千餘艘龍虎大王者乃金封王爵而監龍虎軍烏珠之壻也自主管川陜茶馬趙開變𣙜茶法怨詈四起至是主者以為合罷若謂軍費所資即乞劄與宣撫使張浚行之詔下其說浚不為之變也知宣州李光奏鎮江建康金人悉已遁去先是湖北帥司檄本路捉殺官孔彥舟權副總管領兵往鼎州捕鍾相彥舟過澧州而澧州之民有應相者乘而攻之彥舟喪甲僅以身免及入鼎慮復有應相者遂屠其城民死十八九餘悉黥為兵時賊勢甚盛彥舟據城時出兵與戰勝負相當彥舟每得賊黨不殺惟斷其指及耳鼻縱之出曰汝爺有神能為汝續則復來相得之惡其彰已之妄而養之密室自是其黨亦生疑心彥舟乃聚竹為筏若將去者且為竹籖題云爺若休時我也休依舊乘舟向東流遇獲相黨則簮其首而遣之相得籖喜謂實將避已彥舟又潜遣人投相謂之入法相素自誇喜人從已亦受之至是相乘筏夜渡而入法之人內應相敗走癸未獲之并其妻子及僞官悉檻送行在詔擢彥舟為利州觀察使時宣撫處置使亦檄彥舟權湖北副總管辛卯詔淮浙鹽場已復昨行福建鈔法可罷之廣南監司乞罷催稅户長依熙豐法村疃三十戶每料輪差甲頭一名壬申詔可仍推行於諸路乙未逺安軍奏近緣御前後軍統制陳思恭到州兩日間軍士竄者四十七人皆思恭誘去乃詔宰執召思恭赴都堂約束中丞趙鼎等交論左僕射吕頥浩之失乃罷為鎮南軍節度開府儀同三司太一宫使制曰下吳門之詔則有失於先時請浙右之行則力違於衆論於是參知政事范宗尹攝行相事以浙東制置使張俊為浙西江東制置使除劉光世韓世忠外張俊節制令同知樞密院事兩浙宣撫使周望以所領兵付俊是月以戶部侍郎李逮為江浙諸路發運使湖冦鍾相雖已敗而餘黨所在嘯聚如慈利縣之陳寓信松滋縣之李合戎澧陽縣之吳宣各有衆百千其後亦稍稍撲滅惟龍陽之楊華楊廣楊太最為劇盜太年少楚人謂幼為么故曰楊么時么之名未著惟稱華廣至是知蔡州直龍圖閣程昌禹被召以蔡兵三千人統制官杜湛統領官卲宏淵以下自隨道鼎澧間撫諭使馮康國以羣盜方盛乃奏乞留昌禹攝帥事於是權副總管孔彥舟引全軍去昌禹入鼎州自此每遣杜湛等與賊戰常獲小捷五月癸卯言者謂御舟經由知明州張汝舟應奉簡儉粗能給足知台州朝公為頗務豐華不免擾民乞行賞罰以示好惡參知政事范宗尹曰若黜公為則溫州盧知原發運使宋輝皆當貶矣上曰只褒汝舟則好惡自眀如公為輩不必皆黜乃詔汝舟加一官時諸路盜起大者至千萬人朝廷力未能制范宗尹以謂此皆烏合之衆急之則併死力以抗官軍未易禦也莫若析方鎮以處之羣盜有所歸則衆當懷土是不攻而自潰矣乃奏曰昔太祖受禪與趙普合謀收藩鎮之權天下晏然無事一百五十餘年可謂良法比年國難如此四方帥守皆東手環視莫知所出蓋軍力單寡不可以有為此法之敝也今日救敝之道當稍復藩鎮之制況諸郡為盜所據者凡十數則藩鎮之勢駸駸已成朝廷雖不為人亦自為之矣曷若朝廷為之使恩有所歸也今亦不盡行之天下且裂河南江北數十州為之少與之地而専付以權擇人久任以屏王室實今日之當務也羣臣多以為不可宗尹力陳上亦决意行之甲辰知光州吳翊報敵中事宜庚戌上謂宰執曰聞杜充在南京受劉豫節制遣人誘陷東京朕待充自庶官除從官建節遂召同知樞密未幾拜相可謂厚矣何故至是王綯曰陛下去秋若不相充無知之俗至今必以為恨陛下待之既盡彼自失節國家何傷焉詔三省樞密院同班奏事合輪修時政記辛亥上謂宰執曰從班極少卿等常共議務取其實不厭多也脫乘輿服御悉從簡儉如除一省郎費亦不多茍得人其利溥矣范宗尹曰用人之法須擇可為執政方除從官可為從官方除省郎則選精而真才出矣上曰然上又言神宗選將必詳考然後命之庶必有成因曰祖宗多有所傳家法外人豈得盡知王綯曰如宣帝所謂漢家自有制度是也壬子召知成都府盧法原知泉州謝克家知洪州胡直孺並為尚書法原吏部克家工部直孺刑部法原不及供職改知䕫州秉子也癸丑御史中丞趙鼎為端眀殿學士僉書樞密院事時宰臣未兼樞密而同知樞密院周望在平江府故一院之事僉書得以専總前此兵政悉𨽻御營使司事權既分又再經大變文移紛亂至是鼎始檢故事舉行以正西府之體參知政事王綯纍章求退上曰綯醇儒嘗為朕宫僚事朕始終如一不欲令遽去時朝廷聞登萊多積粟因知海州李彥先遣使至丁巳宰執奏欲就委彥先用海舟轉輸以助軍食上曰登萊道梗今既未能厚恤乃反責其積粟以輸行在於理未安范宗尹等退曰聖慮髙逺非羣臣所及時占象者言夜有赤氣蔽天中又有白氣如練貫之殿中侍御史德清沈與求言此天心仁愛陛下出變以示警也且天子所在謂之朝廷今䖍州一朝廷秦州一朝廷號令之極至為詔矣願勑張浚等止降指揮勿得為詔朱勝非閒居録曰唐制不經鳳閣鸞臺不得謂之敕敕者三省奉行聖㫖之書也張浚以知樞密院事為川陜處置使得㫖許便宜行事事多出勑勝非在朝廷日見之前云某司次述事因古語云奉勑如何末以使銜押字黃紙大字皆過於勑時席益徐俯大不平之指以為僣勝非曰川士性誇侈意以劄子為不尊故用便宜作勑初不思奉何勑也聞渠向自建康出國門已行便宜事矣又論相天子之職也願親書所屬意之臣姓名禱於天地占而用之又天子之兵而劉光世則稱曰太尉兵願如龍騎虎騎之類别立軍號使大將自刺之戊午詔三省條上初上在明州諸班直謀亂已誅其為首者自駕還越上遂廢班直親從别選御營中軍五百人入直陛嵓然皆烏合之衆至是宰執奏事趙鼎留身曰陛下初即位議復祖宗之政至今未行一二而祖宗於兵政最為留意熙寧崇寧變亂舊章獨不敢議改軍政蓋自藝祖踐祚與趙普講眀利害著為令典萬世守之不可失也昨眀州班直因訴事紛亂非其本謀乃盡廢之是因咽而廢食今諸將各總重兵不𨽻三衙則兵政已壞獨衛兵倣佛舊制亦掃蕩不存是祖宗之法廢於陛下之手臣甚惜之仁宗時親事官謀不軌直入禁庭幾成大禍既獲而誅不復窮治未聞盡棄之也上悟仍復舊制宰執擬以朝奉大夫陳桶為閩憲范宗尹曰桶有文行本擬郎官近除郎多儒生欲兼用才吏以備緩急上曰才吏亦不可無但不可太多如吕頥浩純用掊克之吏也沈與求論同知樞密院事周望宣撫浙西脫身先遁避敵縱兵大掠致敵破吳門又擁重兵坐視臨安之陷而不赴援甲子以望提舉太平觀與求再論遂責衡州居住范宗尹等聚議欲將京畿東西湖北淮南並分為鎮以鎮撫使為名除茶鹽之利國計所繫合歸朝廷依舊置提舉官餘監司悉罷財賊除納上供外並聽帥臣移用州縣官許辟置內知通奏朝廷審授遇軍興許以便宜從事帥臣不因詔擢更不除代如捍冦立功特許世襲詔從之初擬世襲上曰若便世襲恐太重當俟其保守無虞然後許之乙丑詔以河南孟汝唐四郡授知河南府翟興楚泗漣水三郡授知楚州趙立滁濠二郡授知滁州劉立光黃二郡授知光州吳翊舒蘄二州授知舒州李成海淮陽二郡授知海州李彥先承天長二郡授知承州薛慶和無為二郡授知和州趙霖並為鎮撫使既而成以舒蘄叛徑擾江西江浙制置使張俊薦統制官嶽飛為通泰鎮撫使時飛獻金人之俘上呼譯問得實者八人付中軍磔之戊辰上謂宰執曰金人頗能言二聖動靜云今在韓州及皇后宫人皆無恙上感動不懌久之三省言沿江道逺緩急恐失機㑹鄂嶽雖係湖北宜撥屬江南今欲建三安撫大使一置司鄂州則鄂嶽筠袁䖍吉南安𨽻之一置司江州則江洪撫信興國南康臨江建昌𨽻之一置司於池州則建康池饒宣徽太平廣德𨽻之建康本帥府緣近鎮江而去江州一千四百里獨池在其間若置帥於此則沿江相去甚均從之朱勝非閒居録曰時於沿江易置帥藩創安撫大使但約每帥相去七百里不問形勢如池陽僻陋乃置江東大帥事同戲劇爾詔諸路帥臣見帶制置使並罷初金人既陷山東左監軍達喇居濵濰而叛臣劉豫在東平奉之尤謹達喇嘗有許豫僭立之意豫使子麟用重寶隂賂監軍左右求僭立而僞雲中留守髙慶裔者尼瑪哈腹心也乃獻議於尼瑪哈曰吾君舉兵止欲取兩河故汴京既得而復立張邦昌邦昌廢遂再有河南之役自下河南官制不易風俗亦無所更可見吾君意非貪土亦欲循邦昌故事也元帥可首建此議無以恩歸他人尼瑪哈於是遣人馳稟金主晟晟許之尼瑪哈仍命慶裔詢訪河南求賢人建國衆未及對豫鄉人進士張浹首願立豫其議遂決時諸郡迎合敵意亦共推豫慶裔歸尼瑪哈復令慶裔馳問豫可否豫陽辭之且推前知太原府張孝純尼瑪哈曰戴爾者河南百姓推孝純者獨爾一人爾可就位我當遣孝純輔爾於是金主晟遣慶裔同知制詰韓昉以是月立豫於北京册文略曰今命爾為帝國號大齊世修子禮永䖍貢誠付爾封疆並同楚舊改元曰阜昌豫受册之初告天祝版誤書年號為靖康又純用趙野家廟祭器識者知其不久也金乃以孝純為豫僞相送之歸鄉故奉使宇文虛中贈以詩云閭里共驚新素髮兒孫將整舊斑衣孝純至汶上而豫已僭立遂相之先是官軍之陷賊在北京者聞豫將至遂閉門殺金人豫至誅其首者數十人由此豫不居北京而復歸東平豫以前宗正丞李孝揚及前通判濟南府張東權左右丞以其弟益為北京留守升東平為東京以東京為汴京南京為歸德府尋又移益守汴京金又以右軍烏珠南侵所降李儔李鄴鄭億年等臣豫豫命儔守襲慶鄴守東平億年為禮部侍郎豫以生景州守濟南節度東平僭位北京遂起四郡强壯為雲從子弟應募者數千人又置三衛官凡翊衛勳衛以有官人或其家世有官者為之此據劉豫傳及張滙所記滙言九月九日立豫而豫傳乃五月戊申豫傳所記差詳今從之民或醉酒嫚豫云汝何人要作官家又滄州進士邢希載上言乞遣使密通江南豫皆斬之是月以吏部侍郎綦崇禮兼權直學士院六月壬申上謂宰執曰卿等識万俟詠者否必是小人昨其親戚奏求遷兩官朕已擲之矣對曰實如聖諭張守因奏詠工小詞嘗為大晟府撰樂章以得官者也初周望宣撫兩浙請以徽猷閣待制湯東野守平江府及望敗東野自劾而言者亦攻之癸酉詔東野落職依舊知平江言者以本朝分兩府而兵權盡付樞密比又置御營使司是政出於三也望罷是司而諸將處以軍職提兵如故甲戌詔御營使司併歸樞密院為機速房仍令宰相兼知樞密院事大理少卿王衣上殿奏事丙子上謂宰執曰衣似淳朴治獄既要盡情又不可慘刻以傅致其罪如衣尚須平允范宗尹曰人多稱其長者張守曰衣雖法科然議刑頗近厚己卯詔浙西帥臣於鎮江府置司其臨安府罷兼帥職庚辰又詔以德安復漢陽三郡授知德安府陳規荆南歸峽荆門公安五郡授知荆南府解潜鼎澧二郡授知鼎州程昌禹金均房三郡授知金州范之才襄陽鄧隨郢四郡授知襄陽府陳求道淮寧頴昌三郡授知淮寧府馮長寧並為鎮撫使之才雍孫也求道在襄陽既而有劇盜劉忠號白氊笠者擁衆來犯求道禦之戰敗為賊所害又長寧在淮寧亦不能守以其地降於劉豫後長寧至豫所勸其行什一稅法僞授戶部侍郎初孔彥舟權湖北總管移檄本路提舉官曾幾求鹽以給軍食本司官屬懼請豫之以紓禍幾拒之不與既而昌禹復欲得鹽幾曰使吾畏死則輸彥舟矣亦不與幾懋弟也壬午宰執擬前淮東提舉官潘良貴為湖南提刑詔可上因曰良貴頃為諫官與袁植皆勸朕誅殺祖宗以來未嘗戮近臣故好生之德信於天下若此必失人心趙鼎曰諫諍之職尤不當以此導人主也丙戌以開府儀同三司吕頥浩為建康府路安撫大使知池州觀文殿學士朱勝非為江州路安撫大使知江州太尉劉光世為浙西安撫大使知鎮江府每路置參謀參議官各一員是後諸路皆有之此據徐度却掃編時光世獲到敵俘號簽軍者謂此不宜留蓋知吾山川險易後日叛去或為鄉導己丑上謂宰執曰祖宗未嘗好殺彼皆吾民朕不能保之不幸陷金遂為敵用其本心可憫張守曰若散𨽻諸軍豈能遽叛上曰然守曰陛下好生如此天人必助信順實為中興之基也先是醫官開州團練使王繼先遇登極特許不轉防禦换武功大夫給事中富直柔封還録黃謂侍醫當還本色官何與武功宜惜名器以勵戰士三省亦奏伎術官法不許换前班上曰朕於言無不從但頃冒海氣繼先診視有功彼未嘗請皆朕意爾直柔抗論不撓朕當屈意從之甲午詔寢前命於是范宗尹等退而嘆曰上從善如轉圜中興之業其庶幾乎中書門下奏行在仰食者衆廩粟不豐今秋成可期宜及時儲蓄乃詔委諸路漕臣廣東令褚宗諤糴十五萬石福建令魯詹糴十萬石各運至漳泉福州仍以所部年額上供為本錢詹嘉興人也己亥又詔宋輝糴之浙西給銀十萬兩度牒直十萬緡運至華亭縣徐康國糴之浙東亦給銀十萬兩屬郡錢非茶鹽及朝廷寄樁者如經制折帛贍學之類皆許為糴本衢婺運至越州越溫台皆即其地儲之諸統兵官非有制書而妄取及所在州妄發與之者皆從軍法戶部尚書葉份嘗言人主以清心省事為本以節用愛人為先凡無名之費不急之務皆所當去至是言者謂份買宗女為妾下吏鞫之乃份為都司時同舍郎有姓同者誤以為份也事雖白份亦求去乃除龍圖閣學士知泉州金右監軍烏珠回江北屯於六合縣時左監軍達蘭在山東遣人誚烏珠渡江無功令止於淮東候秋髙相㑹再下江南烏珠以前日渡江之事為恥㑹聞王師將出陜右因西往應之留渤海萬戶托卜嘉等軍於淮東以待達蘭通泰鎮撫使嶽飛統兵捕劇賊戚方至是方始就招安
