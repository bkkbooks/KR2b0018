body:
  text: 中興小紀卷三十八宋熊克撰紹興二十八年嵗在戊寅春正月時令平江府改造牧馬瓦屋而不降錢物上慮必致科擾庚午乃諭宰執據間架支錢付逐軍自蓋庶即可集如户部闕錢從內庫支錢沈該等曰臣等仰見聖心愛民可謂切矣言者論殿前司强刺人充軍壬申上謂宰執曰士大夫往往以招軍為不切事宜殊不知無事之時當為先事之備今殿前司見闕數千人積之嵗月必至暗失軍額但當約束無令擾人足矣上又曰守令舉職已許監司列薦而監司賢否勤惰將使誰察之宜依守令别為考察之法時臨安府申輦官為軍中招去殿中侍御史葉義問曰在禮以足蹴路馬芻猶且有誅况天子之輦官其可刺以為軍此而不言則下凌上替他日有不可勝言者遂力陳之自是軍中少戢又福建帥臣沈調以招軍進秩其弟左僕射該辭免有㫖降詔不允給事中兼直學士院楊椿言招軍之勞薄而上宰之兄有嫌此賞一行將有强刺良民以希進者乞許其辭從之三月著作佐郎周麟之請就日厯所纂神宗哲宗兩朝寶訓至是神宗寶訓書成丁卯左僕射沈該等并仙源積慶圖上之嚴州遂安縣賊徒嘯聚有擒獲者甲申上謂宰執曰招安非良法命之以官是誘之使為盜不若移此以賞捕盜之人盜知必見獲則可使無盜沈該等曰聖慮髙逺非臣等所及夏四月南劔州禁軍作閙甲辰福建轉運判官趙不溢奏至上曰治軍與民不同又事有雖大而可濶略雖小而不可貸顧其情如何耳此豈可姑息自今有犯但當行法更須精擇守臣使任其責五月甲戌宰執奏朝士楊偰乞將取應宗子比府監進士理年免舉上曰此自有成法遵守可也祖宗以來俸料之數乃稍就格此若可行不至今日矣是月金國主亮坐薰風殿召其臣吏部尚書李通翰林直學士蕭亷語以朕夜夢至上帝所殿中人語如嬰兒少頃有青衣特宣授朕天䇿上將令征某國朕受命出而上馬亮所乘烏騅小馬號小將軍見鬼兵無數朕發一矢射之衆皆喏而應既覺聲猶在耳即遣人至廄中視所乘馬其汗如水取箭數之亦亡其一此異夢也豈非天假手於朕令取江南乎通等皆賀亮戒無令泄於外六月福建帥司奏擒獲海寇已戮其巨魁三人餘乞斷配辛巳上謂宰執曰士大夫持論多以姑息為好生殊不知殺人不死是謂失刑卿等更審處之已而㫖下帥司具逐人情犯申省其後刑部侍郎陳正同又奏諸路死囚例多降配事上曰刑非務刻要當其罪若専事姑息廢法用例則人何所畏卿等可令遵守成憲沈該等曰邇來獄案臣等一一親閲酌情斷罪務適其中既不殘民又不廢法期以仰稱陛下欽恤之意正同沙縣人瓘子也著作郎陳俊卿在普安郡王邸已二年每當講必傳經啓沃王深器之一日王習毬鞠俊卿微誦韓愈諫張建封書以諷王即為誦全文不遺一字俊卿退而喜曰王聰明而樂從諫社稷之福也秋七月左正言何溥請詔大臣擇大縣闕為堂除辛未上謂宰執曰朕謂天下事治其末者不若事其本縣令末也監司郡守本也若監司郡守盡得人則縣何患不得人卿等為朕選監司郡守足矣沈該等曰聖訓及此深得為治之要昔姚崇為唐元宗言今擇十道採訪使猶慮不得其人况天下四百餘州其縣令豈能盡擇正與聖意合也丙子詔置國史院修神宗哲宗徽宗三朝正史以右僕射湯思退兼監修先是起居舍人洪遵論鑄錢利害上曰遵論頗有可採前後銅禁行之不嚴殆成虛文銅雖民間常用設以他物代之亦可今若上自公卿貴戚之家以身率之一切不用然後申嚴法禁宜無不戢者於是有㫖於御府出銅器千餘付外銷毁其士庶之家照子及寺觀佛道像鐘磬鐃鈸官司銅鑼許存外餘並納官翌日知樞密院陳誠之奏事因及此且曰陛下以身率之自然令行禁止上曰所得之銅固不多徒欲使人知不用即不復鑄矣八月徽宗實録書成宰執請擇日稱賀上顰蹙久之曰若可以不賀否壬辰再奏禮當拜表第罔極之恩深惻聖懷若免稱賀亦以昭孝道欲竟不賀詔可戊戌右僕射湯思退上之九月端明殿學士知成都府李文㑹卒右僕射湯思退言故翰林學士汪藻嘗纂元符以來詔㫖比修實録所取十蓋七八深有力於斯文甲子詔贈藻端明殿學士子恪等與堂除未幾徽宗實録書成思退上之書成在十一月今聨書之時太學私試有中前列者賦落韻一學閧然博士金華唐堯封函取駁放於是侍御史葉義問論堯封罷之國子正馮方亦改差户部架閣乃降詔戒飭諸生略曰較藝不精朕固黜之矣自今有不率教者長二具名以聞方安嶽人也初大理寺丞環周言臨安平江湖秀低田多為水浸蓋緣諸水併歸太湖湖水分為二泒東南一泒由松江注之海東北一泒由諸浦注之江其諸浦中惟白茅浦最大今為淤塞望令有司於農隙開決俾北泒流通實四州無窮之利詔漕臣措置既而轉運副使趙子潚知平江府蔣璨言太湖者數州之巨浸而獨泄以松江之一川宜其勢有所不逮是以昔人於常熟之北開二十四浦流而導之楊子江又於崑山之東開一十二浦分而納之海凡三十六浦後為潮汐沙積而開江之卒亦廢於是民田有淹沒之憂天聖間漕臣張綸嘗於常熟崑山各開衆浦景祐間郡守范仲淹亦親至海浦浚開五河政和間提舉官趙霖又開三十餘浦此見於已行者也今諸浦堙塞又非前比總計用工三百三十餘萬錢三十三萬餘貫米十萬餘石緣平江積水已兩月未退望速行之己巳詔監察御史任古覆視既而古至平江言常熟五浦通江委是快便若依子潚所請以五千人為率來嵗正月入役月餘可畢又言平江四縣舊有開江兵二千人今乞止於常熟崑山兩縣各招填百人從之璨晉陵人古定陶人壬申户部言兩浙江湖嵗認發米以石計者兩浙一百五十萬除三十五萬折錢一百一十萬緡今發八十五萬江東九十三萬今發八十五萬江西一百二十六萬今發九十七萬湖南六十五萬今發五十五萬湖北三十五萬今發三十萬欲且依减下之數以憑科降詔依限發足上將祀南郊禮部侍郎孫道夫言神祖時執政以國用不足乞罷郊賜司馬光贊之而王安石執不行臣謂將來郊禮宜申光之議許兩府侍從皆辭錫賚宗室刺史以上减半節用自貴近始以風示天下上曰朕在宫中衣服飲食皆從儉約道夫曰陛下可謂於禹無間然矣既遂除道夫兼侍講辛巳以建州觀察使濮園令士輵為昭化軍節度使嗣濮王壬午領殿前都指揮使楊存中言本司見造戰船乞置虎翼水軍一千人從之時平江紹興湖秀諸處被水欲除下户積缺癸未宰執擬令户部具有無損嵗計上曰止令具數便於內庫撥還朕平時無妄費內庫所積正欲備水旱爾本是民間錢却為民間用復何所惜户部侍郎趙令詪請將州縣義倉陳米出糶及水不須檢放及七分便許賑濟乙酉右僕射沈該等言義倉米在法不應糶糴之恐失豫備上曰逐郡米自有數若量糶十之三樁其價次年復糴亦何所損又髙下必須檢放七分方賑濟則賑濟處絶少矣飢民何繇得食卿等别為措置冬十月初上於禁中作損齊又親灑宸翰為之記至是吏部尚書賀允中請推廣損齊記節儉之意詔諭中外庚寅上謂宰執曰朕禁中嘗闢一室名為損齊屏去聲色玩好置經史古書朝夕燕坐於此嘗作記以自警不謂外間亦聞之允中比於經筵問朕好道之意朕謂之曰朕之好道非世俗之所謂道也世俗修身鍊形以求飛升不死若果能飛升則秦始皇漢武帝當得之矣若果能長生則始皇武帝至今存可也朕惟治道貴清淨茍侈心一生雖欲自抑有不能已者故所好惟在恬淡寡欲清心省事所謂為道日損損之又損以至於無期與一世之民同躋仁壽如斯而已當降出碑本以賜卿等朕又惟比年侈靡成風如婚祭之類至有用金玉器者此亦不可不戒沈該等曰損卦之象在於懲忿窒欲陛下以此道制世御俗唐虞之治不難致矣若降御記以迪在位過於詔書逺甚然尚慮四方未知續當擬詔意進呈十一月壬戌宰執奏近蘇湖松三郡大水放大户積缺蒙聖恩捐內庫錢助户部嵗計以寬民力所進大禮全銀錢帛又令减半深恐錫賚之際或不足用上曰大禮支費朕半年前預立定格無分毫濫豫比之前郊才及十之五沈該等曰陛下恭儉出於天性豈前代帝王所可跂及辛丑朝獻景靈宫戊寅朝饗太廟己卯冬至合祀天地於圜丘大赦天下皇太后新嵗八十上將以正旦於宫中行慶壽之禮十二月辛卯宰執請依建隆故事率臣僚詣文德殿稱賀從之辛丑上謂宰執曰近州縣官吏胄經臣僚論列而監司郡守失於按發雖已行遣一二其餘待罪者皆放罪恐公然容芘姦贓之吏無所忌憚自今更不許待罪紹興二十九年歲在己卯春正月丙辰朔詔皇太后仁德天祜聖壽無疆新歲八十朕於宫中行賀禮當與普天同慶應京朝官選人使臣及得舉進士父母年八十以上者並特與官封有差壬戌詔諸軍揀汰人逐州立定員數類極邊處二十員如三次立功者添差帥司監司指使先已詔客販食米不得收稅仍豁除州縣稅額所冀民不闕食至是訪聞諸路奉行滅裂遇販米船雖無他貨亦故作淹延屈伏收稅又閩廣路例皆販穀場務巧稱非米抑令納稅乃詔米穀悉同若無他貨並即時放行如有違慢許民越訴委轉運司㸃檢月具申省二月己丑以侍御史葉義問為吏部侍郎庚寅殿中侍御史任古奏事因請義問出臺之由上曰義問在臺稱職今委料理銓曹未幾兼史館修撰及侍講二職尋以義問兼權尚書初諸路多閒田右司郎官鍾世明嘗請出賣而未行仍許民佃緣歲獲厚而租輕復增租以攘之者謂之剗佃故詞訴繁興官以為病知溫州黃仁榮建言請盡鬻之則訟自息而利在官詔從之至是仁榮授淮西帥入對上曰卿嚮論鬻田户部得緡錢五百萬矣何必為淮西行也遂除度支郎官三月不雨癸未上謂宰執曰祈雨略應未至雱霈雖令斷屠三日所免止是猪羊民間緣此競食雞鵝魚蝦之屬屠害物命多過百倍可更斷三日生命微物悉禁之時殿前司統制官陳敏上戰車之法甲戍上曰戰車雖出于古然用各有宜知樞密院事陳誠之曰戰車非澤國所用同知院事王綸曰房琯猶敗于中原况澤國乎今之軍士不知車為何物上曰姑令三帥議之免令武人有棄一得之歎也丙子宰執奏擬蠲放諸路積缺詔意上曰輕徭薄賦所以息盜嵗之水旱所不能免儻不寬恤而惟務催科有司又從而加以刑罰豈使民不為盜之意故治天下當以愛民為本湯思退曰本固邦寧誠政之所先此詔既頒實惠廣被真三王之用心也夏四月己亥右僕射湯思退言三省實總萬機各有本省之法自大觀間修中書門下敕令格式歷年既久而尚書省第有省記條冊望下有司重修三省成法從之其後刑部侍郎黃祖舜條具申請未幾詔罷敕局前指揮還寢至乾道六年降詔復修户部侍郎趙令詪言自臨安至鎮江河水淺澀留滯運綱望令守臣修堰閘辛丑詔從之五月己未上與宰執論及內外儲蓄事上曰比緣河流淺澀綱運稽緩己支內帑錢五百萬緡以佐調度朕自息兵講好二十年所積豈以自奉哉蓋欲備不時之須免臨時科取重擾民爾可令户部㑹計每嵗經常之費量入為出而善藏其餘自非飢饉師旅勿得妄支湯思退曰昔漢文帝常言朕為天下守財爾今陛下聖德過漢文逺矣六月知樞密院陳誠之乞罷除資政殿學士知泉州於是侍御史朱倬殿中侍御史任古言誠之附㑹秦黨無補國論其去已為僥幸望鐫職罷郡以協公議詔與宫觀而左司諌何溥等再論遂落職朱倬任古何溥與右正言都民望等言左僕射沈該在政路數年無所建明而該亦上疏請老己酉罷為觀文殿大學士提舉洞霄宫倬等再論遂落職致仕民望德化人也敕令所刪定官聞人滋乞選人歷任及十考無過雖舉狀不及格望許降等改官仍約纍年中數以舉狀年勞參用庶抑貪冒而養亷素詔吏部長二參酌務可久行閏六月給事中王晞亮中書舍人張孝祥洪遵議以謂此法一開則出十餘年坐侍京秩其不可有四難如所請從之滋嘉興人晞亮莆田人也初朝廷以四川道逺舉人難於赴省令就宣撫制置司類試行之三十年矣至是禮部侍郎孫道夫兼侍講一日極論四川類試之弊上曰早方與宰執議今嵗已無及其後舉當遣御史監之道夫曰御史監試事體固重然所關防不過試闈中傳義代名等弊其有前期投所業問題目以祕語為契驗則無跡可尋必令赴禮部乃為允也既而事下國子監兵部侍郎兼祭酒楊椿曰蜀士多貧而使之經三峽冒重湖狼狽萬里可乎欲去此弊一監試得人足矣遂詔止令監司守倅子弟力可行者赴省餘不在遣中秋七月丁亥以吏部尚書賀允中為參知政事癸巳以户部侍郎趙令詪為崇慶軍承宣使襲封安定郡王八月己卯起居舍人浦城楊邦弼言紹興起居注所未修者凡十六年緣久無正員因循積厭望令兩省逐月修進外其前未修者帶修一月庶撰次有倫克盡中興之美從之御史臺主薄張闡前為提舉兩浙市舶請編本司法上以兩浙閩廣三路市舶不同令逐司具上將委官詳定九月壬午上曰朕嘗問闡舶司嵗入幾何闡言嵗約二百萬緡如此即三路所入不少皆在常賦之外宜後取户部收支實數以聞時有言金國將敗盟上命同知樞密院王綸等奉使彼國驗之至是綸等回言鄰國恭順和好無他丙戌宰執皆賀上曰前日諸處妄傳中外紛紜之論或欲㳂邊屯戍軍馬移易將帥儲積錢糧便為進取之計萬一遂成輕舉則兵連禍結何時而已今而後宜安邊息民以圖長久乃為良䇿湯思退曰遣使尋盟和好益堅皆自陛下威德所致申飭邊境務令安靜敢不仰遵聖訓庚子皇太后崩於慈寧宫殮前一日宰執召禮官赴堂曰有㫖問含玉之制莘老曰禮院故事所載以周禮典瑞鄭元所注制之其可因立具奏上覽之曰是真禮官也時百官朝暮臨將避辰日起居郎權中書舍人黃中以為非經且引唐太宗哭張公謹事爭之既而卜殯日適在權制釋服之外有司議百官以吉服陪位中又論之曰唐制殯在易月之內則曰百寮各服其服啓殯在易月之外則曰各服其初服今殯雖過期獨不得以啓殯例之而服其初服乎且喪與其易寧戚惟稽古定制有以伸臣子之至情可也冬十月癸酉王綸奏樞庭除常程細事外其大者亦與三省商議方敢決上曰樞庭雖五代之制疑是太祖太宗曽入思慮五代弊法祖宗掃除略盡惟存此一二大者必有深意太祖太宗不血刃取天下以堯舜之聰明更加思慮豈可易也都民望曽有章云軍政豈可令宰臣不與謂樞庭不法朕收之矣上又云大臣固不當疑雖人告其不軌朕亦不信若其姦邪即罷之不當任而疑也綸曰自古帝王用人之道無越於此矣時金國主亮再役諸路夫匠造軍器於燕京令其臣右丞李通董之又命户部尚書蘇保衡侍郎韓錫造戰船於潞河夫匠之死者甚衆十一月先是皇太后回鑾事實既進而祐陵之書亦成然吉凶之禮不可相襲未敢以聞己亥左僕射湯思退始請以永祐陵奉録為名仍於顯仁后神主祔廟以前進呈奉安於敷文閣從之丙午權葬顯仁皇后于永祐陵之攢宫先是有持隂陽家說欲於殯宫舊禁之外廣立四隅以二十里為禁域故有墓在其間皆當徙去浙東帥臣王師心力言其不可時監察御史任文薦奉詔監掩殯宫就令按視於是獲免者七百六十有竒又薦獻之物舊取於民師心謂聖心極其誠意豈可使民勞費請以上供錢給其直從之十二月淮南漕臣魏安行言淮東多閒田今誘民以耕宜借之口糧次給農器定為分數俟見利還官仍立賞格如招到一百家有官人充部押官無官人補進勇副尉五百家有官人充部押官無官人補承信郎依效用補官法理為實任丙寅詔從之安行鄱陽人也以端明殿學士提舉萬壽觀兼侍讀張燾為吏部尚書侍御史朱倬為中丞辛未同知樞密院王綸進知院事初詔內外各薦武臣如有才藝超卓衆所列薦者别具取㫖至是中書舍人洪遵刑部侍郎黃祖舜共薦新浙西副都監李寶乙亥詔除寶帶御器械又資政殿學士知潭州魏良臣薦浙東副總管李橫淮西總管劉綱皆籍記先是御前置甲庫凡乘輿所需圖畫什物有司不能供者悉於甲庫取之故百工技藝之精巧者萃於其間日費無慮數百千禁中既有內酒庫而甲庫所釀尤勝以其餘酤賣頗侵户部贍軍諸庫課額以此軍儲常不給於是吏部尚書張燾言王者以天下為家不當私置甲庫以侵國用上從其請盡罷之人由是知甲庫之設非上本意也初本朝尤重告老之制宣和以前士大夫未有既死而方乞致仕者南渡之後故實散亡朝奉武翼郎以上率為此舉甚者宰輔大臣考終於內其家發哀舉服已降㫖聲鍾給賻而方且為之告廷出命制詞中不免有親醫藥介壽康之語如故相秦檜万俟卨知樞密院沈與求是也其在者非易簀屬纊不復有請是年吏部郎官洪邁言乞令吏部立法今後當得致仕思澤之人物故者即以告所在州州上首部然後考其平生於式無纍者輒官其後人若真能陳義引年或辭榮知止者則厚其禮節以勵風俗賢於天下為僞也上曰朕記得此事之廢方四十年當如卿語時執政多以為然而左僕射湯思退難之其儀遂寢此據洪邁隨筆録時開府儀同三司領御前諸軍都統制判興州吳璘官資已穹其下姚仲王彥之儔皆建節統全軍守巨鎮異時蜀帥以文令則玩於柔以武競則窒於暴至是四川制置使王綱中開心見誠不立崖塹頗得將使之情詔加綱中寶文閣直學士以寵之
