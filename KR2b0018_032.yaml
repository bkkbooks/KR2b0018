body:
  text: 中興小紀卷三十二宋熊克撰紹興十五年嵗在乙丑春正月丁未朔上御大慶殿行大朝㑹之禮初四川宣撫副使鄭剛中於階成二州開營田抵秦州界凡三千餘頃嵗收十八萬石至是剛中言川路軍興以來人户賦外對糴米惟成都最多臣今欲以營田所積對減三之一并本司激賞犒錢一百八十萬貫外更減二十萬貫丁卯詔從之上曰累年民力已覺少寛此皆休兵之效也三月宰執奏歩軍司乞換手射弓事上曰朕頃在京見内庫弓箭皆太宗真宗所製經歴百年記識如新蓋其製造之精故也知舉右諫議大夫何若上合格進士林機等己巳上御集英殿試所問略曰朕所賴以濟惟真賢實能而徳行或同於鄉原智略或專於謀身從政而茍趣辦摛文而徒華藻平居則肆貪得臨事則蔑首公上謂宰執曰䇿題蓋欲入仕者知趨向之正秦檜曰士人趨向不正久矣願陛下力變此風上曰朕觀五十年前人材皆自仁宗時涵養為累朝之用以此知人材正湏養育成就既遂賜劉章以下三百人及第出身機侯官人章龍遊人也初主司擬章第三及進呈上親擢為首夏四月彗出東方上諭宰執曰彗星見朕甚懼焉卿等可圖所以消弭之道秦檜因奏太宗真宗朝嘗縁彗星疎決等事上曰可且降詔以四事為主癸未詔略曰朕征科苛擾獄繋淹延致傷和氣上干垂象令監司郡守條上便民之事務在必行以施實徳丁亥大赦天下五月壬戌宰執奏湖北帥司放散迎神百姓事秦檜曰臣觀其意似欲以此邀功希賞上曰古人所以不賞邊功蓋有深意也大理寺丞周彬請復置六部架閣官是日詔從之秋七月初皇后嘗臨蘭亭帖逸在人間太傅醴泉觀使咸寧郡王韓世忠以錢百萬得之識者以為真修禊所書世忠表而獻之上除驗璽文乃知為中宫異時臨本是月以賜保康軍節度使吳益益刋之於石時金國境内大旱飛蝗蔽日是月詔蠲民税八月自南渡以來六曹長貳㕔皆未知壁記至是户部侍郎王鐵始攷建炎逮今一十九載凡任常伯亞旅者三十餘人列其姓名刋於石九月戊午本部郎官邊知白為之作序略曰六官之設凡以為民而地官獨稱民部蓋於民為最親故獻其數則王拜而受有負版則聖人式之不已重哉鐵南昌人知白吳縣人是時他部亦未有繼為之者自建炎初省諸路提舉常平官併其職於提刑司次年朝議復置且討論其非書成未頒而上南渡繼而言者謂常平之法不可行遂寢中間常平之職嘗𨽻發運司亦𨽻經制司已而復𨽻提刑司至是王鐵言常平一司錢穀斂散宜専使領之乞復置諸路提舉官己未詔以諸路提舉茶鹽官為提舉茶鹽常平公事川廣以憲臣兼領知和州劉將乞展免夏税一年壬戌上謂宰執曰言事與行事不同若此行事便有實利及民秦檜曰儒者所陳王道不過愛民而已上曰然上御書一徳格天之閣賜太師左僕射秦檜又以金渡銀洗鑼唾盂照匣等物賜之時䖍梅及福建劇盜有號管天下五黒龍滿山紅之屬其徒稍衆攻刼縣鎮鄉民多作山嵒自保先是福建帥臣莫將言漳泉汀劒四州接江西廣東之境縁遊手輩從賊熟識山路引其直衝縣鎮如入無人之境官軍不習人險多染瘴癘艱於掩捕乞委四州守臣募强壯遊手每州一千人為效用時統制官張淵措置本路盜賊有㫖委淵同措置淵請逐州先招五百人既而將改帥廣東以知䖍州集英殿修撰薛弼為福建帥是月弼入閩境冦方盛道上客勸弼改途避之及迓兵至弼趣隊伍揚金鼓分道並進聲言新帥以䖍兵全將至矣賊無敢近者十月癸未以翰林學士承㫖秦熺為知樞宻院熺力請依李淑故事避親而罷庚寅以為資政殿學士提舉萬夀觀恩數視執政主管馬軍司事田晟乞支軍器上諭宰執曰戒器不用則蠧宜令善䕶之又奏鎮江府御前統制王勝秋教武藝出格人上曰自教習以來軍人之武藝頗精師固不可不素練也侍御史汪勃請置四川總領四川宣撫司錢糧為名既而上謂秦檜曰卿前日所論置四川總領甚當如此方與諸軍一體上諭檜在是月癸亥今聫書之是月以承事郎劉章為秘書省正字章今春廷試首擢不待一任回便除館職蓋用往嵗陳誠之例也十一月戊午以右諫議大夫何若為御史中丞先是司封郎中李澗言端拱之初固當親耕帝耤以先天下乞講求故事既而禮官討論元豐中度地國南以合先王之制而政和新書品式具載今可行之既而宰執奏將來耤田降詔上曰先帝耤田亦不每嵗常講惟務勤農祇葢席屋事畢撤去庶不至擾秦檜曰陛下紹述先朝勸農之意戒諭如此憂民深矣己未乃詔以來嵗之春親耕耤田閏月秘書省請下諸路訪遺書及先賢墨跡戊寅上謂宰執曰所訪圖書邇來所得甚多非時平無事安能及此今欲訪臣寮藏書之家從本所説諭闗借仍令所在州軍送秘書省抄畢給還十二月太尉醴泉觀使郭仲荀卒於台州初建康府御前都統制王徳以清河郡王張俊之姪子蓋及俊親將馬立顧暉並為統制官至是俊解兵柄已久徳乃背俊不禮子蓋等而罷之俊怒每訢諸朝左僕射秦檜亦忌其勇詔乃罷徳為浙東總管以統制官王權代之時福建羣冦未平本路鈐轄李貴領兵討管天下貴失利為賊生得有統官張淵在本路措置盜賊自為一所或語帥臣薛弼事惡二三盍請以措置所𨽻帥司弼不從曰惟和則可以濟事先是舊帥莫將嘗乞招游手為效用及將移鎮而轉運司以軍湏浩汗申樞宻院言閩中人勇於私鬬怯於公戰此等游手易聚難散慮賊平之日官軍既還或能作過亦未為便遂下安撫司共議弼以謂廣東總管韓京每出必捷正以所部多土人今本路素無此等故連年受弊弼又謂前守贛上有武翼郎周虎臣成忠郎陳敏各有家丁數百人皆能戰比之官軍一可當十遂辟虎臣為本路將官敏為汀漳廵檢皆從所請弼又揀取二人家丁日給錢米責以捕賊期於必滅與漕司合奏選一千人號竒兵詔可自此嵗費錢三萬六千緡米九千石而草冦遂平虎臣開封人敏石城人也時監司郡守多獻羡餘以希進袁州雖小是年帑廩適充溢或謂知州事王師心盍獻諸朝師心不欲諸縣民有逋租乃悉為代輸之福建措置盜賊張淵所部統領官邵宏淵性質直而喜功淵惡不用且恨其嘗對衆相折杖之百斥入卒伍宏淵之客蜀士鐘鼎走行在上書為辨曲直左僕射秦檜怒始創聽讀之名覊鼎于福之郡學鼎禱帥臣薛弼求依所親於永福縣弼聽之鼎復詣闕上書弼自劾降一秩紹興十六年嵗在丙寅春正月戊寅上諭宰執曰將來耤田降詔湏語簡意足使民曉然知勸農之意如漢文帝每嵗親耕詔當時民知務農遂致富庶也壬辰上親饗先農行耤田之禮三推畢耕耤使秦檜請以耒耜授有司上不從遂推至九癸巳檜乞付史館從之甲午檜又奏曰陛下耕耤過三推之數少勞聖躬上曰朕本欲終畆以卿屢奏乃止僉書樞宻院李若谷奏曰父老觀陛下躬耕極感悦上曰太宗朝每駕出城必宣集父老訪以民間利病况耕耤為農之勸朕豈憚勞耶丁酉宰執奏除直龍圖閣髙世定浙西提刑上因諭曰監司郡守若奉職宜加擢若不恤民奉法郡守令監司按劾監司令御史彈劾如此上下有紀綱不至委靡也二月辛亥初史館修日厯凡藩邸舊事與帥府建置本末人無能知者時慶州觀察使提舉佑神觀開封韓公裔悉省憶上送書成論者謂尚多放逸時楊愿為史官左僕射秦檜請遣愿質之公裔所記皆實檜欲賞公裔摘使來情按四字疑有訛脱㑹除公裔保康軍承宣使檜疑公裔舍已而自求於上是月言者因論公裔罪謂與愿往來詔罷之初建炎間復置新科明法自紹興十一年禮部始定本科中選人將來廷試賜第次年遂得黄子淳一人至是禮部復言崇寧初此科已併進士額今有官人自許試法其新科明法欲罷己巳詔從之上以文武之道不可偏廢三月庚午朔詔興武學養士其後以百人為額置博士員新除資政殿學士秦梓卒癸酉詔依執政贈典仍令江東漕司為辦𦵏事先是茶馬司設買馬兩務一在成都府市於文叙黎珍等州號川馬一在興元府市於西和之嵒昌寨階之峯貼峽號秦馬凡馬五十匹為一綱然渉數千里之逺故多斃於道至是眉州進士侯鳳獻馬綱利害丁丑上諭宰執謂其言雖未足取然朕固知其弊未有一處無之每一綱到所損甚多皆縁部綱人作過卿等宜措置革之初詔展皇城及創修外闕臨安府守臣端明殿學士張澄以天府之力與漕臣分綜其半及親耕耤田所設靈壇御耦幄殿次舍倉廩什器澄悉先具至是除澄慶逺軍節度使從官得旄鉞本朝絶少中外榮之自建炎中湖南猺人楊再興父子占奪民田且招叛添寨柵意欲作過先是委帥臣劉昉審度措置遣屬官諭以逆順禍福之理許令改過自新再興即散其徒且還侵地誓永不敢犯邊失業之人遂獲安處下本管憲司保明昉委有前績夏四月壬寅上謂宰執曰猺人久侵省地今盡以歸可見向化大抵猺人湏加存撫此既不擾彼亦豈敢為過詔除昉直寳文閣先是宰執奏修圓壇詔付臨安府上因曰昨所進禮器極精緻制頗近古三禮圖之謬誠無足取癸卯上又曰昨降祭服令禮官考古以製庶將來不闕也知道州李佾言真宗御製七條仁宗慶厯中常再舉行乞下諸路於守令㕔掲示己酉詔從之庚戌上謂宰執曰近日全無事秦檜曰御前諸處奏到可見上曰前此文字極多朕有至夜分不寐頓減如此豈非和議之效蓋上聽覽萬機夙夜留心如此禮器局成鏄鐘甲寅上曰湏聲和而應律乃可用更令禮官審之初再置諸路提舉學事官通選本路監司之有出身者兼之至是有獻言者乞於憲漕二司事専委其一下禮部既而國子監申請専司轉運司有出身者兼領如俱有出身即從上一員五月壬申詔從之時臨安府北關外河道堙塞漕舟往往卸於門外再搬入倉極為費力而商販亦阻是日詔令開治淮東鹽課増羡丁未宰執奏推賞上曰法不足改只循其常若改而稍増次年必虧大抵民食鹽每嵗止如此也戊午宰執奏大理寺臨安府決獄事上曰隆暑之際恐諸郡未能悉體朕懐逮繫淹延可令監司徧詣所部決遣詔禮器局鑄景鐘故事學士撰銘宰臣書之己未上謂秦檜曰卿一就撰銘以為萬世不朽之傳於是檜撰銘以進曰皇宋紹興十六年中興天子以好生大徳既定寰宇乃作樂暢天地之化以和神人惟茲景鐘首出衆樂天子専用諸禋祀有詔臣檜銘且書臣竊惟文徳武功猶隂陽之時而虞舜周文之用心世莫之識蓋較勝則績顯兼懐則度宏不可使後世無傳也夫銘天子令徳臣敢對揚休命謹拜手稽首而獻銘曰徳純懿兮舜文繼躋夀域兮孰内外薦上帝兮偉兹器聲應兮同久貽子孫兮彌萬世既而上謂檜曰卿所進銘詞翰甚美檜曰天子銘徳諸侯記功臣淺陋豈能形容盛徳上語在七月甲午今聨書之乙丑監察御史石埭王鑑請建髙禖祠壇庶獲聖嗣詔付禮部既而本部言祖宗以來未嘗親祠髙禖惟兩制攝事詔用親祠禮仍改大禮使為親祠使初春補就試者五千人遂分數場有改名冒試至於再三秋七月辛未中丞何若言今秋補試人數又多乞於貢院引試上曰士人進取之弊一至於此所係甚大不可不革今日之所養則他日之所為可見也八月戊戌朔司封郎中邊知白除將作監吏部郎中初宣州有晉太守桓彛廟封忠顯王其子温亦封宣威公至是請加封於是太常寺丞王湛主簿陳積中皆預討論而中丞何若論奏擬封不當甲寅上曰桓温逆迹屢移晉祚頼大臣扶持不然晉不血食久矣昨推恩顔真卿子孫今推封温事屬相戾執中與湛俱令外任時臨安府河道已濬通壬戌詔居民不得填塞舟船並令泊城外興化進士方子寳獻所訪遺書丙寅上曰昨較遺書至今獻者尚少蓋監司郡守視為不急可申嚴制先是以湖南都鈐轄戚方為歩軍司統制九月己丑宰執奏方已到供職上曰自兵興以來諸將出入若身之使臂無不如意兹為可喜也初右朝請大夫無錫袁復一為廣南提舉市舶至是三佛齊國王寓書市舶官言近年商販乳香頗虧直市舶遂以繳進壬辰上謂宰執曰市舶之利頗助國用宜循舊法招徠逺人於是鐫復一官一等時禮器新成十月戊戌太師左僕射秦檜言制作甚精上曰所用皆是今次大饗太廟一新戊申上曰昨日三衙習射皆精宜加賞以激之秦檜曰今天下無事可見陛下之不忘武備也上又曰秘府求書進者未多宜加賞格以勸來者己酉上曰今天下無事民事最急監司郡守湏是擇人得人則為縣首自不作過蓋縣官皆銓注難别賢否全在考察昏繆不任者别與差遣清强有才則宜擢用之知臨安府沈該乞展两淮起税之限庚戌上謂宰執曰財賦湏知取予之道如知取之為取不知予之為取非久利也淮南民若盡歸業則其利甚廣也甲寅三省擬右朝奉大夫唐遵除淮南漕按句下有脱文别無事只不生事便了秦檜曰今天下無事第恐庸人擾之又曰若無庸人擾之天下自治十一月言者乞以科舉餘分人數取經義庚午詔從之甲戌朝獻景靈宫乙亥饗太廟丙子合祀天地於南郊大赦天下初上致齋而雪作及朝獻則杲日麗空至郊夕微隂登壇即霽三台星見時知南外宗正司士源將滿甲寅上諭宰執曰士源可與合得恩數别選人替之宗司得人則宗室皆循理不得人則紀綱廢至於擾州縣宜謹擇之也初明槖宣諭廣東薦洛陽遺民朱敦儒召至闕賜進士出身除館職遷吏部郎中至是任浙東提刑而右諫議大夫汪勃言其疎繆辛卯上謂宰執曰爵禄所以勵世如其可與則文臣便至待從武臣便至建節如其不可雖一命亦不容輕授乃詔罷之初選人改京秩用舉主五員數中之一必得轉運副使或提㸃刑獄號為職司至是吏部侍郎林乂請待制以官師一路者其薦牘視此遂著為令故事告身書史不過一二人時大禮後奏補封贈填委又請擇善書吏窮日力繕寫且識其姓名以備稽考乂尤溪人與秦檜有舊引至侍從其才雖未協衆望然頗勤於所職選人薦舉應格未引騐而舉主有故或差之一日則失之終身乂雖休日亦引於其私第以此人亦稱之十二月乙亥彗見越七日乃伏進士章公奎上言今國家偃兵而未免有預借之税望即除之上曰此事有否朕與鄰國通和正為百姓若預借以擾民失朕本意乃詔户部條上丁巳上謂宰執曰諸寨屋令主帥措畫給錢與之自蓋不然恐勞民力也庚申秦檜奏臘前已見三白上曰二麥可望又曰上殿官論捕獲私販茶鹽往往枝蔓可令有司看詳恐追逮無辜傷和氣也時秦檜以為時已太平日興彌文諱言兵事深忌崇信軍節度使萬夀觀使張浚初浚居長沙葢屋六十楹且為堂牓曰盡心葢以奉其母而言者論浚卜宅逾侈至擬五鳳建樓上不以為然檜遣起居舍人吳秉信以使事至湖南有所案騐秉信造浚見其所居不過中人常産可辦不覺歎息反以檜意宻告之歸而被黜秉信鄞縣人也至是浚因星變言今日事勢譬如養成大疽於頭目心腹之間不決不止決遲則害禍大而難測決速則禍輕而易治惟陛下斷之以獨謹察情偽豫備倉卒庶幾社稷有安全之理不然日復一日後將噬臍異時以國與敵者反歸正議此臣所以食不下咽而不能一夕安也於是中丞何若言浚也包藏禍心惟冀天下多事則僥倖再用乃詔浚落節以特進提舉太平興國宫連州居住浚之學尤深於易自至貶所精思大㫖述之於編以謂易有太極是生两儀太極一也两儀二之也分為二而七八六九之數成五行之象於是大著又曰天數二十有五地數三十凡天地之數五十有五此天地之中數也何以知其然葢一三五七九合為天數而天數不過五二四六八十合為地數而地數不過五天地竒耦合之為十總之為五十有五自然之數皆不離於中中故變變故其道不窮聖人神而明之用數之中故消息盈虚之妙闔闢造化之機皆在於我而動静不違焉中其全矣又嘗論剛柔之義以示子姪曰君道主剛而動則用柔接下撫民莫非柔也故乾動為坤臣道主柔而動則用剛犯顔正色莫非剛也故坤動為乾故觀於剛柔之中而究其所以用則可以類推矣先是奉使金國者得自辟十人以從賞典既厚願行者多納金以請遂為故事時禮部侍郎周執羔為賀大金國生辰使始拒絶之集英殿修撰鄭望之上章告老從之時望之居上饒築室名寓居葢取晉陶濳寓形宇宙之意後嘗有詔落職復召上語近臣曰鄭望之不特是君臣乃是故人望之時已八十一不復出矣
