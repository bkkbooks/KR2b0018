body:
  text: 中興小紀卷三十宋熊克撰紹興十二年嵗在壬戌春正月癸卯樞密使張俊措置江淮戰守回參議官以下分三等推恩行府結局俊乞罷樞務不許且薦其將定逺軍節度使田師中掌故嶽飛之兵又薦清逺軍節度使王德往金陵於是並詔為御前都統制師中於鄂州德於建康駐劄此據野記修入戊申言者論敷文閣待制知徽州朱芾祕閣修撰知宣州李若虛皆嘗為嶽飛謀議官主帥有異志而不能諌望黜以示戒詔並落職初奉使何鑄曹勛等至金國見其主亶於春水開先殿具陳上意力加祈請伏地者再鑄不能言金主令起之曰先朝已如此行豈有轍改勛反覆懇請語甚切至金主首肯數四大帥烏珠傳命使之歸館尋有館伴張鈞來言皇帝及國王見使人所言甚喜次第有恩也是晚館伴耶律紹文等到館又傳金主命早來使人上殿所請宜允仍出回書示之有許還梓宫及太母語至是勛等以書歸羣臣猶疑獨上兩操和戰之策以兵威摧折敵勢而厚禮至誠以感動之敵雖驕暴亦回心革面以順上之志也是月太保萬夀觀使劉光世卒於行在後諡曰武僖光世遺奏援例乞免其家差徭科斂中書舍人張擴持之以為不可時擴在後省見事有不當人心者皆為上言之二月辛未詔建國公進封普安郡王王天性忠孝自幼育宫闈晨省昏定未嘗離膝下上與皇后尤所鍾愛至是出就外第初太祖受命北征次于陳橋軍中有知星者苗訓引親吏楚昭輔仰視日色其下復有一日訓舉手加額曰此天命也及王既受封有日者尤若訥私謂普乃並日二字合乎易所謂明兩作離蓋不特同符藝祖而大人繼明照四方之象已兆于此矣己卯殿中侍御史胡汝明論監司不按州縣之吏壬午上謂宰執曰汝明所論甚當朝廷分道命使正要幾察州縣可申嚴行下若州縣贓汚不法而監司不能按致有臺諌章疏者當併黜之汝明黟縣人也己丑詔吏部尚書吳表臣禮部尚書蘇符侍郎陳桶郎官方雲翼討論典禮不詳具祖宗典故專恃已意懷姦附麗可並罷雲翼永嘉人也三月貢院上博學宏辭合格人京官洪遵選人沈介洪適詔賜遵出身適同出身介循一資介德清人遵適皆徽猷閣待制皓子也皓奉使久在敵中至是和議定皓報太后歸耗辛酉宰執賀太后來有期上曰洪皓身陷敵國乃心王室誠可嘉也二子並中詞科亦忠孝之報遂詔遵館職適敕局刪定官自中興設詞科以來即入館自遵始上又言遵之文於三人中最勝朕謂文貴適用若不適用譬猶畫虎刻鵠何益於事哉知貢舉給事中鄱陽程克俊上合格宗子善能附正奏名試以示勸奬上謂宰執曰天孫之貴溺於晏安往往自陷非法若一以邦典繩之則非所以示惇睦之恩置而不問又無以立國家之法惟擇其好學從善者稍加崇異以風厲其餘是亦教化之術也乙卯上御集英殿策試遂賜陳誠之以下二百五十三人及第出身初秦熺第一熺有官左僕射檜子也遂降第二溥永嘉人誠之侯官人也川陜宣撫副使胡世將時在鳳州之河池方結陜西河東忠義首領俾為內應而朝廷與金敵講和就差川陜宣諭使鄭剛中照舊吳玠劉豫所管分畫地界世將奏秦商二郡元不係玠所管合自二州以南為界惟和尚原係玠立寨元非劉豫地分宜依舊保守且言探報敵人欲以鐡山為界果爾鐵山在河池縣裏則和尚原等關隘悉為所占其四川並無限隔雖金州殺金坪仙人原稍險别有平路得以入川利害灼然不可許也時世將已病丙辰卒尋詔川陜津置其喪以歸夏四月丁卯上曰孫近嘗言用人乃人主獨斷不可委之臣下朕以為用人雖人主之權然深宫之中安能盡知賢否惟在論一相耳一相得人遴簡乃僚而薦之則人主當斷而用之若人君好要則百事詳好詳則百事荒此善論人君之道者也廣西買馬嵗額一千五百匹而去年買發二千四百匹至是詔經略使胡舜陟提點買馬官知雍州俞儋以下各進一秩上以淮上用兵成不戰却敵之功丙子詔推恩宰執於是秦檜等言此皆睿算無遺諸將戮力臣等何功之有上曰漢髙祖善馭羣臣每諸將奏功必賞蕭何張良蓋以指蹤之功也卿等同寅輔朕以底成績朕何敢忘檜等再拜而退相謂曰君能下下以成其政何以仰稱隆遇之意哉兩浙漕臣王㬇等進銀以助迎奉兩宫之費己丑皇后邢氏已上仙丁亥訃音才至於是太常寺討論服制上謂宰執曰先王制禮無過不及適于中而已宜參古今之制使等威有辨而合於禮庶可垂法於後世也金遣其臣烏陵贊謀至陜西議分地界川陜宣諭使鄭剛中出白馬關外見之贊謀欲盡取階成岷鳳秦商六州指鐡山以西為界剛中曰此難即割須俟旨可也贊謀曰講和而不退和尚原兵何也剛中曰割地之旨朝下晚退矣贊謀不能奪剛中乃上奏曰秦商二州並和尚原皆陜蜀要害不可許也其後割秦商地之半棄和尚原仍於大散關內得興趙原以為控扼之所五月甲午就除剛中端明殿學士宣撫副使先是宣撫司嘗居閬中自移于河池縣饋餉不繼人以為病剛中奏移司利州務從省費既而剛中欲移屯一軍都統制楊政不從剛中呼政語曰宣撫欲移軍而都統制不肯某雖書生不畏死也聲色俱厲政即日聽命丙申詔于旴𣅿軍置𣙜場其後安撫軍光州皆置甲辰詔諸州無教官處令尚書省選差既而禮部立到試教官法上謂宰執曰士大夫不可不學惟學故能考前世興衰治亂以為龜鑑則無過舉而政皆適當矣朕在宫中未嘗一日廢也立法在是月乙卯今聫書之丙午詔禮部住給度僧牒雖特旨亦令執奏先是臨安府乞度牒修觀音殿上不與第給錢五千緡上曰朕觀人主欲消除釋老二教或廢其像或廢其徒皆不適中往往愈熾今不放度牒可以漸消而吾道勝矣庚戍工部尚書莫將等議上大行皇后諡曰懿節先是上以太后回鑾普天同慶可召和氣猶慮諸處以奉迎為名緣此科率却致暛怨已降詔悉令戶部自支不侵諸州經費庶不擾民言者論夔路有殺人祭鬼之事乞嚴禁止之己未上謂宰執曰此必有大巫唱之但治巫則此自止西門豹投巫于河以救河伯取婦蓋知此道也六月甲子大金國送觀文殿學士前東京留守孟庾徽猷閣待制前知淮寧府李正民還朝庾等奏昨兵渡河不能死節陷身辱國乞正典刑詔放罪任便居住詔放罪在是月癸未今聫書之乙亥宰執奏上殿官晏孝純乞禁止父母在别籍異財之事上曰此固當禁然恐行法有弊州縣之吏科率不均民畏户口大而科率重不得已而為誠可憐者宜併申嚴科率之條於是秦檜等仰歎聖聰周知民情如此時川陜都統制吳璘入覲上問璘前此所以勝敵之方璘曰先令弱者出戰強者繼之丁丑宰執奏璘功賞士上因以璘所對語之且曰璘善用兵此正孫臏三駟之説一敗而二勝者也上又曰當須令適中政有賞罰如醫之用藥不及則不能治病太過又傷氣也時有學子上書乞用王安石三經新義為言者所論癸未上曰六經所以經世務者以其言皆天下之公也若以私意妄説豈能經世乎王安石學雖博而多穿鑿以私意不可用甲申宰執奏言者所論鹽禁事上曰古今事異今國用仰給煮海者十之八九豈可捐以與人散利雖王者之政然使人專利亦非政之善也吳王濞之亂漢實使之使濞不專煮海之利雖欲為亂得乎初興元府有六堰引褒水溉民田至數千頃故漢中地極膏腴兵興以來嵗久弗治堰壞而田多荒至是帥臣武當軍節度使兼川陜宣撫司都統制楊政率衆修復偶夏水堤決政親往督役其後堰成嵗省漕計二十餘萬石又城南並漢江岸水數至城下政仍作長堰捍之水遂趨南岸城賴以安是年召宣州觀察使趙密於建康為龍神衛四廂都指揮使主管步軍秋七月言者論福州僉書判官胡銓文過飾非用欺羣聽士之無知者往往從而宗之望竄斥以為惑衆之戒癸巳詔銓除名新州編管皇太后回鑾大金國遣少監髙居安等扈送甲午起發癸卯吳璘乞用初任團練承宣使為其子授文資上許之中書舍人張擴以為不可乙卯上謂宰執曰武臣換文資恐將帥之材後難得矣張俊曰須試而後換文可也上曰俊言甚是宜降指揮以革其後上因舉杜甫詩將軍不好武稚子總能文之句謂甫意蓋有在也於是秦檜等仰見聖心之不忘武備如此戊申宰執奏事因論車服有用玉者上曰將來郊廟玉器當先製朕觀今所用祭器皆别山樽自有山樽之制犧樽自有犧樽之制如玉鬯玊爵之類今皆未備豈可不先製也上尊事天地奉先思孝故凡服食器用必以祀事為先秦檜等不勝嘆服上自南巡儀物草創至是諸王宫教授石延慶言國朝郊廟大禮有三駕之制恭聞皇太后鑾輿還闕陛下將迎于郊而儀衛末講望詔大臣集禮官搜舉往憲有詔車輅儀仗委工部尚書莫將戶部侍郎張澄同內侍邵諤制造己酉太常寺言五輅之制惟玊輅以玊飾之今當先玊輅又按本朝黃麾仗共二千二百六十五人其數最為酌中欲依此製造從之是日上又諭宰執曰吳璘功賞事早與了使之歸秦檜曰已與張俊議呼璘到堂面定庶幾允當上可之且曰賞須令適中今日邊面正賴將士協力守之賞須當乃慰其意且免姦人動搖軍情也大金國遣金吾衛大將軍完顔宗賢祕書監劉祹等來癸丑上謂宰執曰郡守條上五事其間頗有可採又有欲衝見行法者宜詳之可行即行秦檜曰如莊綽所上有可行者何鑄曰守臣中有志於民者所論定不茍上曰然於是檜等仰見上厲精庶政臣寮所上利害躬覽不怠如此中興豈難致乎時因有宗子犯法乙卯上謂宰執曰見宗學教官令日率宗子講書作功課庶使用心不為惡事於是秦檜等仰見上留意宗子以教為先惇敘之實莫大於此上殿官宇文剛言湖外米賤乞行收糴戊午上諭宰執令即行之且曰水旱堯湯所不能免惟有以備之則民免流移之患也八月乙丑宰執奏湖北帥臣劉錡言沅州猺人作過事上曰蠻夷但當綏撫不可擾之慮致生事於是秦檜恭稟聖訓以諭錡焉丙寅皇太后渡淮言者論端明殿學士僉書樞密院何鑄首董嶽飛之獄閲日滋久初無一言敘陳既而以樞臣使金乃謂以讞獄不合遂致逺行又言飛之獄本其徒所告反狀甚明而鑄所遷延乃在黨惡遂罷鑄以本職提舉太平觀尋詔落職責徽州居住既又論殿中侍御史胡汝明及察官歸安施巨長洲李溢皆鑄所薦詔悉與外任先是迎護梓宫當差大臣而左僕射秦檜辭不行乃詔少保判紹興府孟忠厚為迎梓宫禮儀使又以參知政事王次翁為迎太母禮儀使並往楚州迎接戊辰上問宰執曰界首猶未得皇太后報秦檜曰據王次翁奏九日可到界首以理揆之此事必不爽約前蕭毅行陛下明與約言若太后果還自當謹守誓約如今嵗未也則誓文為虛設此最切當上曰亦以此事卜和議諧否若還我太后則是大金亦守和議也皇太后回鑾已近辛巳上至臨平鎮奉迎上入幄朝見宰臣文武百官班幄外起居上初瞻慈容喜深感極淚溫龍綃軍衛歡呼聲震天地父老童稚携持夾道擁看以手加額咸歎曰不圖復見聖神子母之重歡如此也太后以北方聞太傳醴泉觀使韓世忠名召至簾前曰此為韓相公耶慰問良久乙酉上以語秦檜等且言太后既歸宫中事一切不復顧矣於是秦檜等仰歎聖德之至宜其篤生上聖以建中興而鸞馭言旋為天下之母也徽宗及顯肅懿節二后梓宫回己丑上至臨平迎奉以歸初太常少卿施坰請於皇城近處權設龍德别宫至是即奉安馬九月乙未以少保護國軍節度判紹興府信安郡王孟忠厚為樞密使戊戌詔皇太后俸錢月一萬貫冬年寒食生辰各二萬貫生辰加絹一萬匹左僕射秦檜進所撰徽宗哀册辛丑上諭檜曰哀册極佳蓋語皆紀實故也向昭慈挽詞衆人所作文雖可觀皆不紀實朕當時所撰有俯隨遺詔日猶想御簾時要紀實爾檜曰向陛下書扇賜經筵官皆當其實上曰朕閲唐史見太宗面評羣臣才德短長似有所感朕所書皆杜甫詩蓋因以見意也有阿李者本乾明寺尼法名善靜因被虜在北界詐作柔福帝姬逃歸後朝廷差宣政使馮益並宗婦吳心兒往紹興府識認遂收入內加為福國長公主降駙馬都尉髙世榮至是因內侍李鄂等隨梓宫回具言柔福帝姬在北界降徐還去年已死還近自北界以其骨歸後因還父中立訴于朝遂下法寺勘實是日辛丑詔阿李杖死益心兒以識認不審編管外州乙巳少保左僕射秦檜加太師檜面辭新命上曰梓宫歸喪慈寧就養皆卿之功此未報百分之一不必辭也詔福建官買茶送𣙜場仍戒有司即時支價錢上曰官中買物往往不即支還價錢故人憚與官交易蓋上通察民情如此戊申詔參知政事王次翁充大金報謝使得慶軍節度錢愐副之製玊輅畢工大金國遣中書侍郎劉筥刑部尚書完顔宗表等來庚戌引見以給事中直學士院程克俊為翰林學士辛亥詔差內侍藍圭主管慈寧殿事務上謂宰執曰朕戒諸人凡有闕不得白太后只來白朕蓋太后年已六十惟胸中無一事動作如意即夀考康寧無窮矣於是秦檜等仰服聖孝以謂養志曾參之所難而上優為之此舜之盛德也初中書舍人張擴為左僕射秦檜所知不數年至侍從屢繳詞頭人多不樂至是吏部引赦行詞擴每秉燭草制言者謂其太遽而文不工擴乃罷去丁巳詔戶部侍郎沈昭逺為大金賀生辰使知閣門事王公亮副之新除中書舍人楊願為大金賀正旦使知閣門事何彥良副之願山陽人也冬十月壬戌言者論錢塘駐蹕之地而城壁摧剝儻不加飾何以肅逺近之瞻况臨安府昨被旨置回易庫收其嬴以備此舉幾年矣今宜取而用之詔臨安府措置初卜地為永固陵得于紹興府會稽山昭慈聖獻后殯宫之西北乃遣中丞万俟卨又詔資政殿學士鄭億年相繼按行皆以其地可用丙寅權殯徽宗聖文仁聖顯孝皇帝及顯肅懿節二后戊寅詔隨從梓宫官吏扶護萬里勤瘁可嘉自內侍官李鄂以下四十四人推思有差庚辰詔鎮江府依沿海制置使例罷帶沿江安撫使癸未詔車輅院復置官吏甲申皇太后生辰始燕于慈寧宫時朝廷欲以福建臘茶就行在置局給賣丁亥詔福建見任提舉市舶官更不兼茶政别差官提舉茶事置司於建州初參知政事万俟卨奉使大金國行次汴京奴𨽻輩有為人致書訪其子者彼之伴使以為言卨曰兩朝以玉帛相見而後敢以私書入境然父子之情不過候安否爾發書視之果然及次涿州又以南官歐擔夫告者且曰一行裝齎悉以車載不復調夫矣卨曰歐擔夫者請得其名治之不調夫則止於此以聽大國之命伴使語塞遂已至是使還詔卨提舉詳定一司敕令孫覿志卨之墓曰卨之復命也宰相秦檜假金人譽已數十言屬卨紿上卨退而歎曰丞相訹我面謾吾戴天履地忍為此乎卒不從他日與檜議怒無復同寅之意矣十一月庚寅上謂宰執曰人君惟虛心則事至自見秦檜曰虛心則臣下或有迎合亦無所逃上曰臣下迎合孟子所謂逢君之惡其罪大程克俊曰此不容誅也秦檜曰陛下虛心照臨百官士庶孰不精白以承休德哉左朝奉大夫黃達如者前守南雄州為提黜坑冶鑄錢官韓球所按至是任滿奏事言太后回鑾梓宫還闕兹為盛事望宣付史館然後大明黜陟異論者正典刑主和者加旌賞庶上慰徽宗二后在天之靈少紓太母滯鬱之氣遂擢達如為監察御史辛卯禮部侍郎直學院王賞編付史館達如建陽人賞開封人球璜弟也初太師左僕射秦檜與太傳樞密使張俊同主和議約盡罷諸將獨以兵權歸俊故俊力助其謀及諸將已罷而待御史江邈數言俊之過於是俊求去位癸巳罷為醴泉觀使復還三鎮舊節封清河郡王邈建德人公望猶子也此據野史修人兩浙轉運副使李椿年言臣聞仁政必自經界始自兵火之後文籍散亡豪民猾吏因緣為姦有田者未必有稅有稅者未必有田富者日益兼併貧者日益困弱皆由經界不正且言其利害有十臣比訪得平江府嵗收七十萬石著在石刻今按籍雖有四十萬而實入才十餘萬皆以為逃田嘗聞朝廷有按圖核實之請其事始於吳江縣而知縣石公轍盡復其數蓋按圖而得之也欲望陛下斷而行之將吳江之驗施之一郡一路以及天下則經界正而仁政行矣上謂宰執曰椿年之論頗有條理秦檜曰其説簡易可行程克俊曰比年百姓避役止緣經界不正若行之誠公私之久利也乃詔專委椿年措置椿年請先往平江諸縣俟其就緒即往諸州要在均平為民除害更不增稅額從之椿年遂即平江創經界司於是守臣周葵見椿年曰今欲均稅耶增稅耶椿年曰何敢增稅葵曰若不欲增稅何言本州苗米七十萬石椿曰倉記云爾葵曰倉記云穀七十萬石謂倉中所容總數耳五穀皆穀也豈獨米乎椿年曰審爾則用圗經三十萬為凖未幾葵罷去己亥始詔立太學養士既而權以三百人為額仍復置祭酒司業博士正録管官初永固陵殯宫以户部侍郎張澄為橋道頓遞使澄熟知會稽地里自發引至復土反虞皆先事而備至是遷澄為尚書右諫議大夫歙縣羅汝楫言陛下近因臣寮之奏以前日異論者明正典刑此誠今之先務然初定議和而謗議紛然往往出於愚而無知不足深責惟趙鼎王庶曾開李彌遜四人者同心併力鼓率其黨必欲沮害此事賴皇明洞照不惑浮言今開與彌遜尚以美職而食祠祿失刑已甚望賜貶黜鼎庶見在謫籍近赦恐合量移乞令有司勿復舉行亦足少懲丙午詔從之於是開彌遜並落職汝楫又言前殿中侍御史張戒最與鼎厚引居言路凡鼎之風旨奉承不暇故助鼎以沮和議鼎罷相戒失所賴復請留之既被黜則往依嶽飛於江夏其趨操可知庚戌詔停戒官少保樞密使孟忠厚求去位罷為少傅依舊信安郡王判福建既而與知建康府觀文殿學士葉夢得兩易其任時閩中之寇未平詔夢得挾御前士便道之鎮十二月庚申上謂宰執曰梁汝嘉頃為户部尚書號稱經制財用徒耗官錢公私交易無補於國為汝嘉身謀則得矣如國計何初命户部尚書張澄等詳重修六曹寺監庫務勑令格式至是書成壬申太師左僕射秦檜上之言者為南巡以來三嵗之祀獨於明堂而冬至郊天曠嵗未舉今既治安願於來嵗用郊祀之儀庶應祖宗故事詔禮部太常寺討論申省甲申上曰祥瑞何用朕所不取唯年穀豐登乃莫大之瑞也
