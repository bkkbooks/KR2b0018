body:
  text: 中興小紀卷三十五宋熊克撰紹興二十一年歲在辛未春正月癸未宰執奏知廬州吳逵乞㴠養淮南復業之民未可起稅乃詔下戶部與展年數上又曰還俗僧圓覺宗果撰聖者偈妙喜禪皆菑祥謗讟之語誕謾無禮鼓惑軍民此最害事宜禁止之戊子上親饗景靈宫既事而雨雪癸巳上以語宰執秦檜曰此陛下孝誠所格也甲午宰執奏差衢州守臣上曰可差曹筠臺諌無大過當假之初筠任侍御史以言失當至是復用也禮部兼侍講陳誠之奉使大金國初故主亶之存也本朝太后歲與亶妻禮物巨萬至是亮代亶立遂輟此禮誠之入北境預為遜辭諭之彼國竟不敢言及還上嘉之自左僕射秦檜用事士大夫平日少失其意輒禍不測集英殿修撰提舉太平興國宫魏矼當初講和時與議不合檜嘗欲除近郡矼遜辭不就奉祠凡四任寓衢之常山僧舍蕭然一室迄免於禍是月卒士論傷之初故相趙鼎嘗謂其客刪定官方疇曰自鼎再相除政府外所引從官如常同胡寅張致逺張九成潘良貴吕本中魏矼皆有士望異日决可保其無他疇曰願公徐觀之鼎曰此等人材如何變得其後諸賢流落之久皆壁立巖仭雖死不變至是疇始信鼎之能知人也五月前知大安軍張輔世言四川惟利路創義士于保丁內選充而文其手就令土豪官多率斂邀求役無虛月甚為民病今邊燧無警望放歸農田詔制置司申樞密院時利西路安撫使吳璘鎮興州已久上乃親御宸翰賜璘以守邊安靜加拜太尉璘嘗自著書兵要大略謂金人有四長我有四短當反我之短以制彼之長蓋彼之所長曰騎兵曰堅忍曰甲重曰弓矢吾當集漢畨所長而兼用之故制其騎則有分隊之法制其堅忍則有更休迭戰之法制其甲曰徑弓彊弩制其弓矢曰以逺尅近以彊制弱其說甚備至于陳法有圖而無書焉大理寺丞謝邦彥乞給病囚藥丙申詔從之邦彥侯官人也上御書大學篇賜新第進士甲子上謂宰執曰賜宴日逼朕二十日早下筆食時已畢因言黃庭堅樂毅論墨本皆有淵源秦檜曰陛下留神翰墨精敏如此臣下所未聞也秋七月壬寅以集英殿修撰曹筠為敷文閣待制代李璆帥蜀初命刑部侍郎韓仲通等詳定重修茶鹽敕令格式至是書成八月辛未左僕射秦檜上之上曰是書纎悉備具若能遵守永逺之利也壬申太師通議郡王韓世忠卒後諡曰忠武時有言贍學公田多為權勢之家所占九月戊戌朔上謂宰執曰緣不度僧常住多有絶産令戶部撥以贍學癸丑詔諸路昨泛差押綱使臣多不曽到部故無賴作過今後並差現任使臣冬十月癸未秦檜之初相也徽猷閣待制王居正時為左史嘗奏上以檜作相前所言皆不讎檜憾之及檜再相專國居正慮為所害屏居常州時事一不掛口書祠官之考十有二至是檜權益張尤忌善類大誅譴以立威多竄之嶺外居正闔門托疾猶奪其職是月卒居正素不取王安石之學故工部侍郎楊時嘗著三經義辨以示居正居正繼亦為三經辨學與時之說相經緯上謂宰執言旴眙守臣龔鍳頗安靜秦檜曰朝廷報對境文字鑒不放心處必來申明百官皆留意所職如此則無不濟矣是月御製秦檜畫像贊曰維師益公識量淵冲盡闢異議决策和戎長樂溫清寰宇阜豐其永相豫凌烟元功仍親灑宸翰賜之右諌議大夫章復殿中侍御史林大鼐共論參知政事余堯弼傾邪姦險朝廷有大議論則默而不言望貶之以清政府堯弼亦奏乞祠十一月庚戌詔除資政殿學士提舉外祠復等再論遂詔落職復宣城人也前知池州黃子遊言農田水利所係甚重望飭諸路提舉官俾建塘陂以備旱暵丁巳上謂宰執曰須常平官得人若監司用心事無不濟近時監司多端坐不出提㸃刑獄職在平反尤當遍臨所部宜戒飭之詔僉書樞密院事巫伋兼權參知政事十二月戊辰司封郎官王葆言近日民間多銷錢為器詔令工部禁止時雖連日小雨而雪未應期上遣人禱太一祠辛巳晚雪作壬午宰執奏事上曰昨晚寒甚便得雪甚可喜秦檜曰陛下至誠昭格如此當率百官表賀丁亥檜奏曰臘雪應期中外共慶去年臘中三日雪果大有秋上曰自此二麥可望不惟時豐疫病亦自消矣紹興二十二年歲在壬申春正月大理評事莫濛言州縣受民輸米各有定數而收耗有至加三者凡此止資官吏侵用乞下有司揭示許民越訴丁巳詔從之二月殿中侍御史林大鼐言公孫杵臼程嬰韓厥三人有大功於趙氏本朝皆封侯爵中興以來嘗詔立廟而有司弗䖍神靈不妥望進以公爵擇地建廟升為中祠使相熊夢而有祥扶龍祚而無極壬午詔禮部討論兩浙漕司先次營廟既而三人皆進封公先是徽猷閣直學士向子諲告老歸臨江之舊隱號曰薌林居士間居十五年庚戌卒子諲早受學于故諌議大夫劉安世宣和初方臘作亂詔發運司捕之子諲時為屬獻言曰若急請于朝以安世尹南都前諌官陳瓘守金陵人望所歸不勞兵而賊可破識者謂此真良策其長不能用靖康末張邦昌僣位遣人持勑書至廬州問其家子諲時為發運副使牒郡守馮詢及提舉鹽香官范冲拘之故給事中胡安國嘗謂其忠節可以扶持三綱者蓋指此也癸酉以右諌議大夫章復為御史中丞初復論端明殿學士僉書樞密院巫伋執政無補而林大鼐亦論伋黷貨營私丙子詔伋以本職奉外祠復等再論遂落職辛巳以中丞章復為端明殿學士僉書樞密院事時住鬻度僧道牒已久其徒寖少又福建官自運鹽頗為民患乃遣太府寺丞鍾世明下本路措置寺觀田産凡僧道之見存者計口給食餘則為寬剩之數籍歸于官并究運鹽之弊世明方行殿中侍御史林大鼐言慮民間未知指意或有疑惑辛酉上諭宰執明降指揮以曉諭之世明將樂人也五月殿中侍御史林大鼐言民間有事先訴于縣結絶不當然後經州以次及監司臺省今兩浙民訟監司州縣未决多徑至臺省請申舊法禁止辛亥上諭宰執曰如此則朝廷事多從之主管崇道觀曾恬少嘗尊事故楊時謝良佐陳瓘劉安世得存心養性之學及為大宗正丞一日攝行宗正事吏有慢令不共即繩以法無敢違者時秦檜專政士多求媚以取要官而恬自守無所詘丐祠以去寓常熟之僧剎投間幾十年是月卒恬故相公亮之孫也六月丁丑宰執奏知嘉州王知逺乞罷鑄小鐡錢事上曰此於錢引實有利害可令總領與漕司同措置以刑部侍郎韓仲通兼權吏部尚書秋七月乙巳上謂宰執曰聞四川所起禁衛卒所費多出於軍衆可令總領司應副初江西多盜而䖍州尤甚後雖撲滅慮其復作乃留殿前司吳進一軍彈壓而本州禁軍嘗隨前總兵官程師回往來捕寇頗勇與進軍素不相下丁巳夜兩軍交鬬州兵因而作亂焚民居逐官吏守臣鄱陽余應求有父安行年老欲走忽墜城死應求遂以丁憂為辭而去于是叛軍據城自守八月丙寅領殿帥楊存中奏據本司統兵官吳進申䖍州將兵反江西帥臣張澄亦奏請遣兵入己卯上諭宰執曰聞有欲走湖南者乃詔鄂州都統制田師中速發兵仍令澄集本路兵擒捕事定日具有功人申樞密院辛巳又詔殿前司逰奕軍統制官李耕統所部兵一千六百人往討之先是纍禁私泛海商人而泉州境內尚多有此上聞之恐别生事戊子詔申其禁虔州叛兵突出徑走南康軍而寓居左朝奉郎田如鼇為其所得遂復歸據䖍城時統制官李耕總軍才入江東界時殿前司左翼軍統制官陳敏見駐福建被本路帥檄統所部一千五百人護閩境於是領殿帥楊存中奏敏本䖍人且於江西捕寇有功乞令敏進兵至䖍與耕併力討賊九月乙未詔從之又就命如鼇權本路提刑令即城中撫定既而耕敏與鄂渚田師中所遣統制官張訓等各以兵至城外戊戌宰執奏前知蘄州周楙乞修河堤事上曰不獨蘄州凡沿淮有水旱悉令漕司守臣措置初紹興八年除李光為參知事有右從政郎楊煒者寓行在聞之曰此吾鄉先生也今得位必將盡行所學久之無所聞時蕭振任侍御史朝廷方與金人議和煒不以為是作書欲獻光因先見振說書中意振曰亦恐金人難信煒遂以書責光有同槽共食之語光遣人專語煒以不及答書至是振知台州煒為黃岩縣令政頗有聲振每聞煒大言無顧忌則擊節稱善遂薦煒改秩復移書浙東提刑秦昌時俾同薦之昌時左僕射檜猶子也因屬吏密語振曰煒嘗以書責光尤太師某其姪義不當舉如待制亦不可舉也振曰吾業已許之豈可中輟俄有縣吏得煒書有詆時相語以告昌時昌時以聞于朝詔送大理寺仍下所司發卒大索得其萬言書藳譏刺時政獄具庚辰詔除煒名送萬安軍編管其兄選人炬亦連坐羈置雍州振罷仍落徽猷閣待制於池州居住先是林大鼐在言路嘗奏錢塘江浸淫為患十一月壬寅上諭宰執令臨安府同漕司乘冬月水不泛溢時治之為易又舊有塔廟隂以相之雖出小說亦不可廢也丙午朝獻景靈宫丁未朝饗太廟戊申冬至合祀天地於圜丘大赦天下有軍人龎翼者教人學道起居舍人林機因與翼逰遂出知信州丁巳上諭宰執曰機信翼邪說遂亡上下之義機既令出翼亦不當留士大夫尚為動况軍中乎時守臣監司不輸常賦專以進竒羡相尚太府卿徐宗說攝二版曹乃言今後當令先補常賦所逋仍乞以賦入殿最行賞罰詔從之於是上諭宗說曰版曹久匱卿所論甚當是日以宗說權户部侍郎宗說頗有心計於經費出入盈縮之數皆知其要吏不能隱然附秦檜以至侍從嘗為檜私營田産士論鄙之而畏檜無敢言者宗說開化人也龍神衛四廂都指揮使知䖍州李耕率諸軍以乙卯登城盡收叛卒誅之而捷奏猶未至於是領殿帥楊存中奏遣人送鞋襪與耕軍中己未上曰䖍賊閉城拒官軍且四十日城中百姓何以活令存中更遣兵尅期蕩平庶脫良民于禍也十二月直袐閣前知太平州韓膺胄言州縣小吏喜怒自私驅無罪之人不白長官而禁於獄或終不加罰徒繫以苦之望詔有司嚴禁甲子詔刑部立法故端明殿學士王雲之猶子積以雲死事乞推恩戊寅謂宰執曰雲奉使極效忠率先衆人勤事而死于難乃與積迪功郎有袁敏求者妄撰語言丁未宰執奏合編管上曰小人妄生是非既得其罪當行以為惑衆者之戒初興元府兵亂以來城內生荆棘官舍民居皆茅屋而帑藏寓諸僧剎太尉楊政再為帥始以次繕治至是一新户口浸盛如承平時矣政所統將士自休兵之後十餘年未嘗輕以升遷蓋深體朝廷之意也福建舊行産鹽法民歲輸錢而受鹽於官其後法壞輸錢如故而民不得鹽其間多私鬻以給食而官亦不問至是帥臣龍圗閣學士張宗元始再榷鹽犯者滋衆人不以為是帥司屬官胡憲上書於宗元告以為政大體宗元不悅久之憲請嶽祠而去同時在幕中有輕薄者用其姓名為詩嘲之曰獻陳利害知何益蓋憲獻同音謂胡憲也金國主亮造燕京宫室至是年率其文武百官遂遷都焉亮因以燕京為中都𨽻以平薊涿易雄保順遂州號中都路舊上京為北京𨽻以興中府錦義宗利州號北京路遼陽府渤海故地為東京𨽻以廣寧府潘復登辰州號東京路雲中府為西京𨽻以宏豐朔應蔚勝州號西京路開封府為南京𨽻以曹單陕鄧鄭陳蔡穎宿泗號南京路又以河間真定平陽太原益都東平大名京兆延安臨洮慶陽會寧咸平臨潢十四府為總管府河北東路河間府冀莫清滄深景州𨽻焉西路真定府邢洺相定濬衛州𨽻焉河東南路平陽河中府隰懷晉澤潞解州𨽻焉北路太原府汾代嵐欣石平定州岢嵐保德軍𨽻焉山東東路益都濟南府沂密濰濱淄隸登萊州𨽻焉西路東平府徐兖濟慱德州泰安軍𨽻焉大名府路恩濮開滑𨽻焉京兆府路鳯翔府同華虢耀州𨽻焉延安府路鄜坊州保安綏德軍𨽻焉臨洮路蘭秦隴鞏河會川積石鎮戎軍𨽻焉慶陽府路平凉府環涇邠原寧州𨽻焉會臨府路肇齊信州𨽻焉咸寧府路韓懿州𨽻焉大赦其境改明年元日正元此據張棣所記修入棣又云燕京城門十二束曰宣耀曰施仁曰陽春西曰皓華曰麗澤曰彰義南曰豐宜曰景風曰端禮比曰通元曰會城曰崇智紹興二十三年歲在癸酉春正月先是前禮部侍郎髙閌退居明州時秦檜之弟棣為明守檜欲卜閌嚮背因其鄉人姚孚者達意於閌曰季華弟止一女願與公結姻閌辭之遂致其仕閌自此每對人唯舉前言往行未嘗及時政之得失人物之臧否觀書終日絶意榮望己亥卒閌喜故程頥之學及嘗見楊時每語竟日深相恱服中年勇退人甚髙之是月資政殿大學士知建康府楊願卒二月右正言鄞縣史才言吏部尚書林大鼐狂躁欺誕且負不孝之實若不亟去必搖國是己巳乃詔罷之尋知泉州時吏部侍郎陳相奏淮南閘損處甚多不止洪澤丙子上諭宰執令漕臣修之以便人使來往相合肥人也龍神衛四廂都指揮使知贛州李耕具立功一萬三千餘人辛巳奏至于是第賞有差癸未以耕為金州觀察使此據野記修入方贛之亂也謫居人祕書少監分司南京孫近走吉州避之至是賊平復歸贛州未幾卒夏四月癸亥宰執奏差諸州守臣上曰士大夫在此者衆所當得闕可早與之壬寅宰執奏上書者言舉債之家如還本已足利當盡放上曰如此則上户不肯放債反為細民之害宜詳細措置是月慶逺軍節度使張澄自江西移帥福建初閩中佛剎數千區其徒猥衆地占膏腴州縣經賦視為上戶自鍾世明至計口給食悉拘所餘澄既入境即剖析利害言之乃詔委澄措置澄請計其租賦農工僧行厮役之用給之而收其餘較前所拘十還六七公私皆以為利六月時行在霖雨諸軍營多壞已詔賜錢七萬貫令修俾得安處至是上又聞民田有被水害癸亥詔户部下州縣差官檢放苗稅時皇太后目疾下諸路召醫人惟四川未發到秋七月戊子朔詔趣逐路帥臣搜訪津遣右諌議大夫史才言浙西民田甚廣而不憂旱者太湖之利也比年瀕湖之地諸軍下人多據以為田擅利妨農其害實大乞委監司究治盡復太湖舊迹使兵民各安其職農民有賴庚戌詔從之福建安撫使參議官賀允中嘗為閩漕平鹽貨見謂稱職秦檜以其不肯下已授祠觀者五年復令入帥幕以抑之是月允中之任此據墓志八月知靜江府陳璹奏乞增和糴米價及折納適中以紓民力辛亥上謂宰執曰璹善治郡可與直祕閣知潭州其他處有昏耄不任職之人令自陳宫觀先是總領四川財賦符行中有子預薦意潼州府僉書判官趙逵必為類試考官密以文屬之逵不啓緘既試符氏子不預奏名行中因他事捃托逵峻甚然亦不能害之行中南城人冬十月庚申侍御史江寧魏師遜言太府寺丞史祺孫交通匪人上曰學先王之道而從妄人孫士道習妖術以惑衆若只罷之無以戒後人可令吏部與監官端明殿學士僉書樞密院事宋朴乞罷戊辰詔以舊職奉祠於是諌議大夫史才言朴為士而不自愛乃違道罔俗與丐者為伍不當以祕殿隆名寵之遂落職壬申以才為端明殿學士僉書樞密院事時諸路推行養濟事恐其滅裂戊寅上謂宰執曰須令實給錢米以施實惠侍御史魏師遜為中丞監察御史鄭仲熊為右正言時秦榛秉政久言路皆其所引于是仲熊首論定國是久任用抑奔競節浮靡與推誠于有功之宿將等事然其間不無阿附仲熊西安人也十一月時經筵講尚書終篇癸巳上謂宰執曰朕記此書自說書官尹焞始初焞以范冲薦擢講筵既數日輒乞致仕其徒相與謀曰必得朝廷見留乃可為髙翼日趙鼎奏果言焞志在山林不樂居此願以禮留之焞遂不復致仕觀焞進講皆其師程頥之說餘無可取秦檜曰程氏之徒祖宗諱不避而諱其師之名甚嚴事君之道恐不當有厚薄兼已受官乃更欲廩人繼粟庖人繼肉曽不思孟子處賓師之地仕而不受祿則有此禮上曰孟子當戰國之時自處如此不可以為常法也先是經筵官皆進詩侍讀秦熺詩卒章曰競競驕侈戒誓不愧周官辛丑上對宰執再三稱善以熺登第日賜御書周官也上又曰哲宗朝蘇軾進御書古詩魏師遜鄭仲熊所進詩皆模倣其體上萬機之暇他無所嗜専意於文如此時編類宗正司新成上閲之甲辰以諭宰執曰所修甚有條理可即頒行十二月己未宰執奏事上顧秦檜曰昨日遣使戒之云歲遣信使已有定例使指之外不可生事上周慮如此真得祖宗柔逺人之家法宗社無疆之福也閏十二月丙申上諭宰執曰諸郡守條具民事如逺方因軍興科民至今未罷者非因條具何由得聞宜委官詳其可行者行之戊戌詔委中書檢正左右司郎官具其可行者申省取㫖蓋聖意恤民故致詳如此先是夏間宣州大水其流泛溢至太平州凡太平境內沿湖諸墟悉為衝决是冬詔遣太府寺丞鍾世明至州相視修築守臣直袐閣洪楫集屬邑共議知當塗縣事張津以謂被水農民流徙過半若令逐墟自修力不能辦遂用其說共興長埂周回一百八十里包諸小墟未幾成然自此小墟埂盡廢一遇水决則通被其害故農民屢請于官欲各興中埂以防患焉初池州青陽縣稅視鄰邑為重如貴州縣田每畝上等八升而青陽一斗九升中等六升而青陽一斗五升下等四升而青陽一斗七合幾於三倍蓋自南唐李氏賜此一縣之地與其臣宋齊邱為邑齊邱增賦以肥私家遂成定額是年江東轉運常平司為之申請詔以十分為率稅苗减二分半課米减二分然議者猶謂所减乃經界虛增之數而齊邱重賦未嘗損也至乾道中始能再蠲之以上二事皆據方志
