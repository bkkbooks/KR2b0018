body:
  text: 中興小紀卷七宋熊克撰建炎三年閏八月丁丑朔詔百官議朕今定居建康不復移蹕與右趨岳鄂左駐吳越孰安孰危其眀以告朕於是宰執召百官詣都堂應詔條具者二十五封皆以岳鄂道逺恐饋餉難繼又慮聖駕一動江北羣盜必乘虚以窺吳越則二折非我有矣戊寅上猶未觀吕頥浩等曰祖宗時遇大事亦召公卿集議上曰但恐封事中趣嚮不一大凡公生眀偏生闇人能至公議論自有見處昔真宗澶淵之役陳堯叟蜀人則欲幸蜀王欽若南人則欲幸金陵唯冦凖决策親征人臣若不以家謀専以國計則無不利矣初宰執奏淮西制置使胡舜陟請専治軍旅前迎大敵仰䕶行在王綯曰舜陟語甚壯似可託以方面上曰言未可信須在行事宰執奏在六月壬子今聮書之至是改舜陟為沿江制置使知建康府湯東野令隨駕應辦仍先往平江府見知平江府孫覿落職罷以資政殿學士李邴代之乙酉上謂宰執曰士大夫間有言李綱可復用者朕以其人心雖忠義但志大才踈用之必至誤國故不復用吕頥浩曰志大才疎誠如聖諭上曰如聽邢倞之計遂結餘堵敵人至今以為釁端周望曰如宣河東以救太原先於河陽置納級庫敵聞而笑之亦足見其踈也時倞知鼎州未㡬以倞始禍除名送英州編管貶倞在九月辛酉今聮書之丁亥以右僕射吕頥浩為左僕射同知樞宻院事杜充為右僕射並同平章事兼御營使是日上詔諸将張俊韓世忠辛企宗等問以移蹕之地俊企宗勸上徑之潭州世忠後至曰官家已失河北山東若又棄江淮更有何地上乃令内侍官押三人就都堂商議戊子宰執入奏上曰昨世忠欲往吳越吳越則我可以戰俊企宗不敢戰故欲避於湖南朕遂令引去商議朕自聞逺避之説怫鬱不平至晚不食朕嘗思金人所恃者騎衆爾浙西水鄉騎雖衆不得騁也吕頥浩曰誠如聖訓上曰人心安定吳越可居人心動擾雖至川廣恐舟中皆敵國頥浩曰金人之謀以陛下所至為邊面今當且戰且避但奉陛下於萬全之地臣願留常潤死守上曰朕左右豈可無宰相周望曰臣觀翟興李彦仙輩以潰卒羣盜猶能與金人對壘堅守陜路臣等為宰執若不能死守異日何顔見興彦仙輩也上曰張守請留杜充守建康頥浩曰臣等與韓世忠議亦如此上曰善遂決吳越之行與張浚前所請武昌之議變矣仍令世忠守鎮江劉光世守太平及池州自餘諸将分守沿江詔杜充兼江淮宣撫使領行營之衆十餘萬以節制諸将戊子百官迎太廟神主於清涼寺以行先是右正言吕祉言安逺軍節度副使范致虚才在今日可當一面雖有過宜棄瑕用之召至行在己丑賜對而右諫議大夫富直柔力詆致虚不當復用遂除致虛知鼎州祉亦隨罷言職癸巳時江東宣撫使劉光世江浙制置使韓世忠各持重兵畏杜充嚴峻論說紛紛光世見駐軍江州乞不受充節制上怒曰豈容如此跋扈遂詔充除相出自朕意令盡䕶諸将光世如尚敢違當寘之法光世乃即時渡江而世忠移屯江隂軍常州境上於是光世奏起流人王徳復為統制官上自發建康陸行之日皆霽癸卯次鎮江府乃降微雨初陳東以言事被誅至是參知政事王綯言此東之鄉里上命以金賜東家且官其子綯退語人曰乃知東死非上意也甲辰上次常州乙巳御營前将軍張俊入見陳所統兵事上曰近來諸将要多兵則朝廷難制惟卿不然自隨朕五年備見赤心亦欲卿知爾叛臣劉豫在東平府遣人説東京留守上官悟令降於金人悟斬其使豫乃賂悟之左右喬思恭等與之同說悟復斬之時禮寺典籍散佚亡㡬太常博士張宗元白宰執謂宜遣官往京城訪故府取見存圖書悉輦而來以備掌故此若緩而甚急者宰執不能用宗元方城人也宣撫制置使張浚至襄陽留㡬二十日召帥守監司令預儲蓄以待聖駕西幸王之望記西事曰浚之至襄陽也留㡬二十日程千秋王擇仁之軍咸在及諸盜之未降者凡數萬人浚謂襄陽乃喉衿之地因薦千秋為京西制置使假以便宜許之任自屬郡守貳以下皆得誅賞浚方思攬豪傑為用時新除御營使司提舉事務曲端前在陜西屢嘗挫敵浚欲仗其威聲乃承制拜為威武大将軍本司都統制於是有詔賜端略曰卿久提貔貅之師式遏虎狼之衆覽行臺之近奏知分閫之賢勞已建隆名俾䕶諸将兼制五路折衝二邊庶展盡於猷為豈復憂於䜛間學士張守詞也九月丙午諜報金人又陷登州左監軍烏珠将自登入海道以窺江浙而右僕射杜充在建康距錢塘明越道途繚繞慮失事機時江浙制置使韓世忠駐軍江隂是日宰執請以鎮江𨽻世忠而常蘇圌山諸處控扼官軍並𨽻御營使司上曰善又請以世忠充兩浙沿江守禦使上曰未可此曹少能深識義理若權勢稍盛将來必與杜充争衡只令兼圌上足矣辛亥上至平江府時金人已破單州曹州壬子侵南京先是左僕射吕頥浩欲自留平江府若敵騎侵軼則督諸將力戰乃命僉書樞宻院事周望宣撫江湖駐兵鄂渚以控上流既而上以頥浩不可離行在改除望為兩浙宣撫使提重兵留于平江又以翰林學士張守為端明殿學士同僉書樞宻院事戸部侍郎李梲遷尚書梲臨沂人靖康時為執政至是再見之使往建康督饋餉以贍沿江諸軍髙麗國王楷欲遣使入貢丙辰詔止之略曰比年多故强敵稱兵如行使之果來恐有司之不戒俟休邊境當問聘期直學士院汪藻詞也金人陷沂州詔新改官人張邵特轉五官除直龍圖閣借禮部尚書奉使大金軍前武翼郎楊憲借忠州防禦使副之宿泗等州都大捉殺使李成奏所統軍衆天寒無衣今艱難之際府庫不充欲望量賜支絹以激戰士癸亥詔戸部輟二萬匹賜之己巳詔朕累下寛恤之詔而迫於經費未能悉如所懐今聞東南和預買絹其弊尤甚可下江浙减四之一以寛民力仍俵見錢違寘之法壬申夜潭州卒亂於城南殺一兵官守臣向子諲遣人招安畏其黨不能盡誅子諲敏中五世孫也癸酉上謂宰執曰有為朕言移蹕浙東人情未孚宜降詔具述初非朕意悉出宰執庻㡬軍民不怨朕既為天子當任天下之責舉措未當豈可歸過大臣王綯曰古之賢君不肯移災股肱無以過此初金人既陷延安府而帥臣郭浩寄治徳順軍浩徳順人也敵遂趨慶州環慶帥王似選勁兵要擊於險敵不能進詔加似徽猷閣直學士至是金將羅索貝勒引衆渡渭河侵永興軍甲戌帥臣郭淡棄城遁去是月以兵部尚書謝克家為徽猷閣學士知泉州中丞范宗尹一日因奏事言趙鼎由司諌遷殿中非故事上曰朕除言官即置一簿攷其所言多寡此祖宗舊制外廷未必知也鼎所言四十事已行三十六事即除鼎侍御史金人分河間真定二府為河北東西兩路平陽太原二府為河東南北兩路去中山慶源信徳隆徳府號皆復舊州名自餘軍壘亦多改焉下令禁民漢服及削髪不如式者皆死冬十月戊寅上發平江府山東賊首郭仲威至通州受宣撫使周望招安望以便宜補官令屯平江府戊戌金人攻夀春府官吏以城降壬寅宣撫處置使張浚抵興元於是浚言漢中實形勢之地已理財積榖願陛下於來夏早為西行前控六路之師後據兩蜀之粟左通荆襄之財右出秦隴之馬天下大勢斯可定矣浚知主管川陜茶馬趙開有心計即承制以開兼本司隨軍轉運使總領四川財賦開言蜀民已困獨𣙜率尚有贏餘而貪猾認為己私惟不恤怨詈㫁而行之庶救一時之急浚以為然開於是大變酒法自成都始先罷公帑賣酒即舊坊場所置隔槽設官主之麴與釀具官悉就買聽釀戸各以米赴官自釀凡米一石輸錢三千其釀之多寡惟錢是視不限數也既遂行於四路又依成都府法於秦州置錢引務興州鼓鑄銅錢官賣銀絹聽民以錢引或銅錢買之凡民錢當入官並聽用引折納官支出亦如之民私用引為市於一千及五百上許從便加臺惟不得擅減錢引法民頗便之十一月乙巳朔金人陷廬州戊申攻和州守臣李儔以城降己酉金人陷無為軍守臣李知㡬挈帑藏與民渡江南歸知建康府胡舜陟改除兩浙宣撫司參謀官以刑部侍郎陳邦光代之時隆祐太后頓洪州而金人已自黄州渡江御營副使劉光世復還江州亟遣統制官王徳拒之于興國軍徳敗績光世馳輕騎以聞戊午敵騎至洪而太后去已七日守臣王子獻棄城走吉州守臣楊淵亦棄城走敵騎至撫州執守臣王仲山子獻建陽人仲山珪子也於是福建諸州震恐光世退屯南康軍而四廂都指揮使楊惟忠所領衛兵亦潰其將傅選司全皆反為盜以掠諸州後乃復歸趙鼎扈從録曰洪州御史臺申太后移赴䖍州至吉之太和縣楊惟忠前後軍連兩日作亂内人被害者甚衆方兵亂時太后賢妃用村夫荷轎更無一人扈衛者時金又侵湖南之境帥臣向子諲遣兵禦之不敵金人至潭州城下攻圍八日城破子諲率衆死戰奪門以出駐于湘西金兵縱掠四日而去子諲復入城後以失城罷之庚申真州守臣向子忞棄城保沙上子忞子諲弟也右僕射杜充在建康㑹諜言李成師老可擊充遽遣兵而金衆大至與成併力徑趨烏江縣充聞敵至以其軍六萬人列戍江南岸而閉門不出師無統一壬戌敵至馬家渡渡江充急遣都統制陳淬同統制官岳飛等一十七員領兵二萬與賊死戰時御前前軍統制王􅊛受充節制乃引軍先遁岳飛等軍既敗退屯蔣山以俟再戰然皆無鬭志丙寅夜皆引去丁卯充領親兵三千絶江而北時上遣内侍任源至充軍前道梗不達以狀申充充即附奏以謂初乞御營諸将聽其節制實無妄自尊大之意但欲人情相諳緩急可使今者劉光世逺在九江不得使韓世忠近在鎮江不能使儻王􅊛有心報國當陳淬等接戰之際乗勢向前敵人必敗豈有今日􅊛之不忠萬死有餘臣今在儀真檄召滁泗二州趙立劉立等集兵却回鎮江以䕶天室此區區困獸之志也於是敵入建康戸部尚書李梲知建康府陳邦光皆降通叛廬陵楊邦義獨不降見金烏珠詈之曰汝無厭而圖中原天寧久假行誅汝矣尚安能汙我遂為所害葉夢得避暑録曰兵興以來未見以大節名世者在建康得一人曰通判楊邦義嘗表諸朝為請諡而立廟又夢得褒忠廟記曰敵入建康李梲與陳邦光不能守梲先降邦光欲棄城去後亦降通判楊邦義力拒不從大書其衣裾曰寧作趙氏鬼不為他邦臣以授其僕曰持此以見吾志吾即死矣梲邦光愧謝猶强擁邦義上馬即郊次與俱見金四太子命使拜邦義叱曰我不降何拜亟遁歸卧其家敵雖暴猶未敢辱邦義也明日遣張太師好說邦義授以舊官邦義以首觸階陛曰我已志死何多誘我為敵大驚捽止之徐曰公所守固髙柰勢不可何第歸審思之吾眀日復見公邦義退亟移書曰世豈有不畏死而可利動者幸速殺我無久留我死明日金人燕梲邦光坐堂上樂方作召邦義立庭下邦義瞠視梲邦光叱曰天子以若拒敵不能抗俛首求活犬豕已不若復與共燕樂尚有面目見我乎敵將有起取幅紙書死活二字佯脅邦義曰公無多言即欲死趣書死字下我乃信邦義視吏有簮筆持文書側立即躍起奪其筆引手掣紙書字曰死敵相顧色動又使引去明日再以見四太子邦義不勝憤遙望大罵曰若無厭而圖中原邪天寧久假汝行磔汝萬段尚安得汙我敵怒使人疾擊之梃交下邦義罵不絶口遂殺之乙丑杭州守臣康允之奏金人數道並入已自采石濟江朝廷以未得杜充周望報衆情大駭集侍從官議時給事中汪藻中書舍人李正民議欲上移蹕平江親督諸将拒敵緩急則登海舟以避之宰臣吕頥浩又同從官對於便坐或謂宜遣兵將或謂宜募敢戰士前去而頥浩請自行議未决是午周望録到杜充書謂敵騎至和州充親督師詣采石防江朝廷稍安然不知建康已陷矣時又慮敵騎自江黄間南渡或徑趨衢信以逼行在乃命中書檢正官傅崧卿為浙東防遏使令募土豪集鄉兵以守衢信陸路崧卿山隂人墨卿弟也丙寅諜報金人已渡江從官入對慮敵騎不測馳突請以殿帥郭仲荀輕兵三千從駕至平江倚周望韓世忠兵以為重且謂仲荀方自杭來其兵之老幼未至易作去計乃令張俊兵以次進發上以俊重兵不可留遂決議皆行退命直學士院汪藻草詔朕當移蹕浙西為迎敵之計己巳上發越州庚午至錢清鎮得杜充奏大戰江上我師敗績又康允之報敵入臨安府界長驅而來上亟詔回鑾侍從官晚對于河次亭上侍御史趙鼎以為衆寡不敵勢難與戰且姑避之左僕射吕頥浩乃請上航海時廷臣所論多不同吏部侍郎御營參贊軍事鄭望之尤以為非便惟戸部侍郎葉份中書舍人綦崈禮曰若别有䇿甚善不然舍海道將安之望之彭城人崇禮北海人也頥浩請令侍從官以下各從便而去上曰士大夫當知義理豈可不扈從於是郎官以下多留越亦有徑歸者初上之在建康也御史中丞范宗尹言金人為國大患戰之不能勝禦之不能却國已敝矣兩河陷沒陛下駐蹕維揚敵騎遽至僅能匹馬渡江至錢塘未閲月而苗劉之變生於肘腋此皆禍之大者其小者不可悉數大抵所為皆不成所向皆不利豈徒人謀乖刺實由天意之未回也茍不能隠忍順受以紓目前之急深恐天意不測别致非常之禍此臣之所以日夜寒心也設若慮敵騎深入當以控扼之事責之将相陛下姑引而避之言至於此可謂無䇿然譬人之大病垂絶投之善藥但得不死則徐議補治陛下誠能側身修行以享天心發政施仁以從民欲選将練卒繕甲儲糧數年之後以弱為强孰曰不可則今日之無䇿乃為異時之長䇿也至是以宗尹為參知政事又以侍御史趙鼎為中丞殿前都指揮使郭仲荀為兩浙宣撫副使與御營都統領辛企宗並留越州又以御營前軍統制張俊為浙東制置使癸酋上出門時連雨泥淖吏卒暴露命兩浙漕臣莆田陳瑞沿路犒設衛士肉纔有六百斤炭倍之而已先是京西制置使程千秋在襄陽而所降桑仲有衆數千屯漢水之北時商賈巨舟無數載四方之貨皆列于南岸以傍府城舟中多至百人少亦數十各有兵械自䕶緩急亦能併力禦冦千秋一日下令欲盡拘之商賈曰此利吾貨也中夕悉遁去説者謂千秋自徹藩籬已見失䇿又城中統兵官有李忠及號徐大刀曹火星者三人仲遣人以二馬遺徐曰本欲取襄陽而兄在焉今且去勤王矣徐以良甲二報之千秋怒其與敵通因長至日諸将列賀執而誅之一軍皆憤奔以告仲仲曰我以兄故不入襄陽今千秋乃敢殺吾兄遂回軍攻城千秋遣曹火星出戰又使一将援之曹曰徒撓我軍政不須爾獨與仲戰一晝夜殺傷相當黎眀仲盡驅良人各持竹一竿第見城外青竹蔽野仲軍繼之曹再戰遂大敗仲入據襄陽千秋遁去仲追之不及王之望記西事曰張浚用程千秋久之又疑其䟦扈乃以郭永為檢察軍馬李允文為京西憲使左右掣其肘二人傾險輕躁欲得其處更謀撓之使不得有所為既又奪其便宜諸将以故解體遂至於敗千秋之庸謬固足以敗襄陽然觀浚所以用之政使能者亦未能有功也宣撫處置使張浚至秦州置司節制五路諸帥纔數日即出行闗陜移環慶師王似知成都府而以武臣趙哲代之於是㕘議軍事劉子羽薦涇原都監吳玠浚與語大悦㧞為統制官又以其弟小使臣璘領帳前親兵十二月乙亥朔金人攻臨安府守臣康允之退保赭山錢塘縣令朱蹕白允之自帶本縣及仁和縣弓手土軍於前路欵敵使杭民無逃死計行二十里遇敵騎蹕兩中流矢左右掖至天竺猶能率鄉兵以撃敵後數日遇害蹕安吉人也初鎮江府無守臣獨恃浙西制置使韓世忠之軍以為固時世忠引兵駐江陰而建康潰卒戚方等迫城以萬計守臣胡唐老度不能支因撫定之無何方欲犯浙西妄言赴行在請唐老部衆以行唐老不從戊寅為方所害己卯上次眀州召集海舟甚急先自中春遣監察御史莆田林之平往福建募船千隻至是相繼而至朝廷甚喜參知政事王綯曰豈非天助也上曰亦非偶然辛巳戚方等犯常州守臣周杞守子城以拒賊亟遣統領赤心隊官朝請郎劉晏出戰遂破之時杜充下諸将潰去多行剽掠獨統制官岳飛屯宜興縣不擾居民晉陵士大夫避難者皆賴飛以全故時譽翕然稱之壬午上将登海舟只帶親兵三千餘人吕頥浩逢辰記言精兵萬餘人與此不同隨駕有衛士張寳譚煥等不欲入海謀作亂因宰執入朝百餘輩噪而前吕頥浩怒詰之范宗尹曰此豈可以口舌争引其裾入殿門門閉衆不得入上遣内侍宣諭衆遂定命中軍都統制辛永宗勒兵捕寳煥輩十七人誅之餘黨分𨽻諸軍除衡門外盡廢其直趙鼎事實曰駕之幸四明也敵騎侵迫乃議登舟以一舟處班直六十人人不得過兩口諸班相語曰我有父母有妻子不知兩者如何去留訴於皇城司内侍陳宥宥不能决令自陳于朝人衆語喧有肆惡言者葢激於一時非本謀也後數日擒之斬其同謀二十餘人時金人已渡浙江知越州李鄴奏聞甲申宰執早報上於御袍中出示之乙酉上登舟戊子詔六曹百司官吏從便寓於明越温台諸處於是左右御營使司參議官以次皆留時留者有兵火之虞去者有風濤之患皆面無人色此據趙鼎扈從録壬辰宗尹等至眀有昨随崔縱奉使人盧伸自敵中歸時敵破和州得歸朝官程暉令與伸偕來所携國書語極不遜既非専使宗尹遂不見之癸巳上次昌國縣命戸部郎官李承造往台州刷錢帛杜充所遣屬官直徽猷閣陳起宗至言充敗欲引衆趍行在而路不通是晚吕頥浩折簡與范宗尹言充在儀真甚的浙東制置使張俊自越州領兵至眀州時已無船可載俊因納隠士劉相如之策遂留以抗敵丁酉上謂宰執曰昨者朕将御舟楫令從官聚議都堂鄭望之不肯同衆所論亦未為通吕頥浩曰望之在假續到不知衆人所對王綯曰崇宣以來大臣専權不容立異比者㑹議都堂更相詰難臣不意復見此氣象皆陛下優容忠讜所致望之自守所見乃朝廷之福也上嘗問望之曰苗劉時卿在甚處對曰臣竄在嶺表得之道途臣以為陛下甚錯上曰何故曰二兇既就擒陛下不送天獄却付韓世忠軍中今日在陛下左右者得以面諂爾上又問卿見洪皓三畨國書否望之曰臣無縁得見上命内侍取示之葢上以望之累使敵中欲使之料敵情也望之未㡬奉祠而去戊戌金人攻越州帥臣李鄴以城降敵即渡其家屬先往錢塘鄴邴兄也既而邴坐此亦落資政殿學士親事官唐寳袖石撃金将烏珠不克死之金人攻明州張俊下令曰天子且巡海道汝輩宜用命進者重賞不進者不貸癸卯嵗除敵至城下俊令統制官劉寳先與之戰若不勝則以兵横之既而寳兵少却統制官楊沂中田師中統領官趙宻與之戰又不勝寳率兵再進沂中棄舟登岸與師中宻等皆死戰而守臣劉洪道率州兵以射其旁遂大破之殺數千人宻太原人也金人既破杭州乃遣人檄秀州令降守臣程俱言小邦不敢専遂解櫜入赴平江宣撫司又慮見襲遂率官吏棄城出保華亭縣朝廷遂命俱押米綱赴行在於是同知樞宻院宣撫使周望追俱赴司㡬為所斬遂劾之云朝廷私此一人遂失億兆之心士論是之先是奉使洪皓自太原至雲中左副元帥尼瑪哈軍前而奉使王倫亦留在彼有商人陳忠因倫從者楊永亨見倫宻告兩宫太母起居狀倫遂與浩共以金遺忠令聞於兩宫以為倫輩皆本朝遣來通問於是兩宫始知建炎中興之實既而皓為尼瑪哈送於冷山遂依左監軍烏克紳以居為之教子
