body:
  text: 中興小紀卷三十四宋熊克撰紹興十九年嵗在己巳春正月時春教使臣踏射克敵弓己酉宰執奏乞依格推恩上曰克敵弓最為強徑雖被重甲亦須洞徹若得萬人習熟何可當也二月丁巳上謂宰執曰春雨利農農務種糧為急已詔被傷處令常平司給借更丁寧户部應副上以王雲奉使忠義而而死於絶塞甲子詔録其子奉議郎秬為六院官仍賜銀絹各五百乙丑上謂宰執曰昨令開河因以濟飢民朝廷所給錢米慮公吏邀阻減尅或於諸縣調夫反有搔擾可諭湯鵬舉曹泳令體此意躬身察之毋致或戾時鵬舉為臨安守泳兩浙漕臣也未幾濬河工畢丁卯上謂宰執曰近有監司郡守上殿所奏第應文書自今並奏民事庚辰布衣劉勉之者建陽人少得易象之學于涪陵譙定又嘗遊南京故諫議大夫劉世安一見器重悉告以平日所得之要及出處大致遂歸隱故山先是吕本中為中書舍人率從臣張致逺等五人合薦之召赴行在既至而本中等已去有司令求於後省試策勉之乃引疾而歸十餘年益昌所學是月卒勉之通經術識治體非拘儒曲士素隱之流也三月己酉宰執因奏四川州縣奉行經界賞罰上曰奉行如法其恩不限員數庶使人人知勸經界均稅極為便民初行時有肆異議沮壞者益平江均稅畢紛紛之議始息秦檜曰當時獻議欲逐户自陳若使自陳豈無失實上曰李椿年通曉次第中間憂去領以别官便有失處時四川措置經界官鄭克頗領責州縣通判漢嘉楊承曰仁政而虐行之非法意也上不違令下不擾民則仁政得矣乃隨事區處召諸縣令曰平易近民美成在久吾儕其謹行之皆曰如奉使之檄何承曰忽上令而畏使檄此非諸君之罪風俗之罪也但行其無愧於心者雖罪何畏焉迄成獨漢嘉為列郡最克開封人承臨卭人也五月壬午朔上謂宰執曰諸州禁軍闕額可令招填卿等切宜留意癸未遂奏立招軍賞罰格元法止及都監至是守臣賞罰欲與一體詔從之仍令月申樞密院上又曰頃者程師回捕虔賊皆用本處兵若招足而習武藝緩急可用也户部郎中周莊仲言今禮文畢舉宜因臘之日併行蠟祭乙酉詔從之莊仲浦城人武仲弟也六月辛亥朔宰執奏前知南雄州朱同乞以千金等方治瘴氣者集為一書頒之廣南詔從之新修吏部續降七司通用法成書戊午太師左僕射秦檜上之己未詔略曰朕纍下詔寬恤而勞來安集之政不聞於郡縣是吏奉吾詔不虔也比又詔監司守臣奏對非民事勿陳尚慮至意不周俾吾赤子不被其澤是用咨爾在位各揚乃職使主德宣而民罔不獲則豫汝嘉其或誕謾不恭亦不汝赦賞信罰必欽哉殿中侍御史曹筠言溧陽知縣馮德長洲知縣尹機不法事癸酉上諭宰執二人罪頗大俟案重加責之上因曰知縣能否朝廷亦難遍察須責之監司守察之如治狀可嘉即與轉官再任或升擢之庶可勸也筠當塗人也丙子上謂宰執曰福建盜已除惟海道間有作過只緣巡尉非人可令帥司察其不可倚仗者罷之前知舒州楊惇乞修水利詔戶部修治秋七月甲申詔時當大暑趣令諸路提刑詣所部決獄辛卯鎮江府預借民苗米為右諫議大夫巫伋所論癸卯詔守臣曾惇罷之初廣東羣盜尚多詔統兵官韓京戍循梅以彈壓之久而未代秦檜意其難制令新廣帥薛弼圖京是月弼至南雄州京來謁弼即席諭京丐罷遣人送之出嶺亟命别將馳入戍所統其軍初言者謂祖宗以來定公私贓三等之罪以紏天下之吏原其意未嘗不在於保民嚮緣州縣官率多不虔而民被其害於是又立民事一罪在公私贓三等之外然有公罪雖輕而麗民事則遂為終身之纍甚於私罪之極重者是以疑似之際吏肆其姦得以舞文而出入之不可不察望勑有司更加詳議庶協於中事下勑令所既而本所奏謂民事被罪謂擅行科率及應害民之事以被罪者則不注知通及縣令差遣緣民事被罪難與犯公罪者同欲乞依見條八月辛亥從之華亭縣鹽戶訴請鹽本錢戊辰上曰鹽户宜恤不則逃去其害非細乃詔戶部措置先是景靈宫配饗功臣繪像祖宗朝皆有副本在天章閣及袐閣兵亂不存甲戌詔各具副本藏之二閣九月大理寺丞郭唐卿奏本寺取會未圓情節往往不以時報庚子上謂宰執曰緣道逺故緩乃詔申舊法令今後速報時劉章以廷魁任館職左僕射秦檜意其不附已而祠部郎官胡寧乃故相趙鼎之客是月言者謂鼎寓居衢州章為衢人故與寧交通俱罷之冬十月己酉朔宰執奏太常寺申將來郊祀躬謝禮畢合詣太一宫行燒香之禮上曰此祖宗故事可行也十一月庚寅朝獻景靈宫己亥言者謂淮南湖北寧靖民稍復業而曠土尚多惟縣令親民此未有賞格可以勸之乃下户部遂併立守令墾田增減賞罰之格初詔於臨安府西溪蓋馬軍寨屋令戶部侍郎宋貺親往觀之無得侵民田至是未畢十二月壬子上曰天氣寒凛可趣令畢工庶免軍人暴露著作佐郎林機言邪謀害正偽説汨真乃古今之通患然著迹于昭昭者易以見而匿形于𡨕𡨕者難以察陛下道德言行無愧于古之哲王臣備員史館預聞記注得以特書屢書垂示無窮然訪聞有異意之人匿于近地作為私史集其邪謀偽説臣若不言則異日害正汨真之患臣實任其咎望密加搜索嚴為禁絶庶幾信史著而後世不為售私者所誣甲寅上謂執宰曰此事不應為乃詔許人告令州縣覺察及監司按劾御史臺彈奏並取旨優加賞罰己未宰執奏瑞雪應時詔給諸軍雪寒錢金國主亶立十五年矣平日嗜殺晚年性尤暴宗族大臣皆懼不免相與結約以伺其間是夜入亶寢所先收其兵械然後數亶罪殺之詰旦未知所立宗族大臣中惟左丞相岐王亮粗知書遂共立亮大赦境內除常所不原者文武官各轉一秩放民租稅一年降亶為東昏侯以謂刑餘之人故不得入廟亮既立改元天德時四川部所招扈衛人到闕己巳宰執奏給賞賜上曰發來已滿千人可令制置司今後嵗招三百庶幾不至闕人資政殿學士王次翁卒于明州初朝廷委廣西帥臣即橫山寨市馬於羅殿自把按宋史外國傳作羅箇納溪大理諸蠻歲捐金一百兩銀五萬兩錦二百匹絁四千匹及于亷州石康倉撥鹽二十萬斤皆資博馬之宜歲額市一千五百匹五尺為最髙價銀一百兩下者四尺三寸三十一兩四尺二寸二十六兩以是為差良馬三十匹為一綱常馬五十匹為一綱遣使臣部送至行在建康鎮江太平州五處不顛斃于道則有賞先是石康之鹽分令欽橫賔貴潯藤梧象栁容等州轉至橫州山倉然諸州科民則苦富戶差吏則雜私販往往陷沒留滯是月帥臣陳璹始令官支腳錢選委使臣給以續食若般及一十萬斤即與押良馬一綱至行在此據陳璹家貢馬須知修入左僕射秦檜與故給事中胡安國及其子徽猷閣宜學士寅皆厚善寅是年省其所生毋于建州復還湖南檜以白金助其行寅書謝之略曰願公修政用賢勿替初志尊內攘外以開後功檜謂其諷已始大怒之時前禮部侍郎張九成與前步帥解潛居南安軍一日潛病劇九成往省之曰太尉平日所懷亦有不足者否潛泣曰平生惟仗忠義誓與敵死以雪國恥而不肯議和遂為秦公所斥此心惟天知之九成曰無愧此心足矣何必令人知然人亦無不知者但有遲速耳濳曰聞此言心中豁然矣即逝九成因嘆曰武人一念正氣猶待人以決吾儕讀聖賢書平日安可不正此心乎紹興二十年歲在庚午春正月丁亥左僕射秦檜趣朝忽有殿前司後軍使臣施全者挾創於道遮檜肩輿欲害之傷大程官數人一軍校奮而前與之敵衆奪其創遂擒送大理寺獄具全招為所給微而纍衆不能活每嵗牧馬及招軍勞而有費以此怨忿意欲用兵遂潛携創伺檜出乞用兵因而鼓衆作過若不從則害檜壬辰詔磔全於是初言者論前參知政事李光在貶所嘗撰私史其子右承務郎孟堅居紹興府同郡人陸升之傳聞所記皆非事實詔兩浙漕臣曹泳差官究治申省取旨至是送大理寺勘實孟堅招父光所作小史語涉訕謗丙午上謂宰執曰光初用時以和議為是朕意其氣直甚喜之及得執政遂以和為非朕面質其反覆固知光小人平生蹤迹於此掃地矣于是貶光昌化軍孟堅編管峽州而龍圖閣學士程瑀寶文閣學士張燾徽猷閣待制潘良貴新福建參議官賀允中新福建機宜吳元美並貶秩有差徽猷閣直學士胡寅落職皆緣與光通書之故元美侯官人也光等貶在三月今聨書之二月壬子戶部言經界所以結絶其未行處委漕司及守臣依平江行之本所管幹官四員與逐路覆實官並罷從之未幾詔曰昨李椿年乞行經界初欲去民十害遂從其請今聞寢失本意可逐路委監司一員詳其便民者行之其反為民害則日下改正詔在三月二十一日今聨書之前廣西提刑路彬奏靜江府昭州折帛錢昨因張浚領督府每匹增及兩倍因詔戶部裁損戊午上謂宰執曰昨令監司郡守任滿以民事奏彬乞免所增折帛錢可除職以示勸以彬為宜袐閣利州路提點刑獄初奉使湯鵬舉往賀大金生辰時朝廷未知前主亶已被殺至是鵬舉奏見彼國接伴使言新主亮登位見報諸國乃下有司排辦準備既而有司奏每年大金賀正旦人使到闕朝見日依五禮新儀設黃麾角仗一千五十六人將來大金人使到日亦乞依新儀設黃麾角仗壬戌詔從之三月庚辰大金國遣侍衛親軍都指揮使完顔思恭翰林學士翟永固來報登位貢金注碗二綾羅三百良馬六初金國故主亶之被殺也今主亮身預其謀至是亮得位而大事已定凡當時與之同謀者亮皆加以弒君之罪曹王宗敏乃故主太祖旻之子屬最為尊亮忌其名重首加戮之又納其妻于宫中梁王宗弼開國有勳惟有一子曰韓王亨亦以無罪見害是月亮詔中外臣庶皆令宜言朝廷闕失與軍民利害如若可採自應聽用其或不當弗加之罪茍能裨補公私别議銓賞夏四月癸酉新知廬州吳逵請置力田之科募民就淮甸耕賞以官資四千補進武校尉三千補進義副尉下至七百亦補副尉作田力出身在武舉之上得應轉運司舉從之逵崇安人也五月丁丑宰執奏前知臨江軍彭合乞蠲清江縣加耗米詔從之上曰合昨任縣官常有監司列薦今可與監司初起居舍人兼玉牒所檢討官王曮等言見修今上皇帝玊牒先修到今上聖德乞以中興聖統為名至是書成己丑奉安于天僖殿內聖祖天尊大帝之西先期隂雨連夕是日雲霞絢綵杲日麗天觀文殿大學士萬夀觀使秦熺乞宣付史館從之侍御史曹筠論前知太平州徐渥專利自恣壬辰詔今後不得與渥親民其治郡有聲者優擢之袐書少監湯思退等言有旨以師臣秦檜忠義大節付在史館止有今來事迹及張邵所奉之書餘則闕望詔令檜録奏宣付庶得廣記甲辰上謂檜曰思退乞將卿靖康事記為别録以示天下後世可依其奏檜謙退久之上曰不然後代無以知卿忠義僉書樞密院巫伋曰檜之大節天下共知要當令屢書不一庶使後世姦賊悚懼上然之六月丁未是夏故相趙鼎之子汾奉鼎之喪歸葬于衢州常山縣守臣章傑知中外士大夫平時與鼎有簡牘往來至是又携酒會葬意可為竒貨乃遣兵官下縣同縣尉翁蒙之以搜私釀為名馳往掩取復疑蒙之漏言潛戒左右伺察之蒙之書片紙走僕自後垣出密以告汾趣令盡焚篋中書及弓刀之屬比兵官至一無所得傑怒方深治蒙之而逮汾與故侍讀范沖之子仲彪拘于兵官之所蒙之母訴于朝左僕射秦檜咎傑已甚詔移蒙之為婺州蘭溪縣尉下其事于浙東安撫司未幾遂息時士氣猶未泯所唁問鼎議論時事固非一家而集英殿修撰魏矼與鼎尤厚是日非蒙之則根株牽連當起大獄人謂蒙之初被委茍避免固足取名然慮更委小人則禍遍及善類故詭承而潛泄之忤傑弗顧鼎之家賴以紓禍蒙之雖微官而仁智勇皆可尚也時傑有館客魏掞之見傑為此亦慨然以書譙之長揖而去蒙之崇安人掞之建陽人也秋七月端明殿學士何若卒先是措置諸路遞角所屬官王彥融乞逐路提舉馬遞鋪官令轉運司長官兼領事下兵部本部言若委之漕臣之長則樁辦鋪兵衣糧為便八月庚戌詔從之資政殿學士韓肖胄嘗帥浙東既奉祠則家于越與弟宜祕閣膺胄尤相友愛先是家藏書甚富散于南渡僅存家集肖胄刻意搜求迄復其舊且明習故典多識言輩言行至是卒初其祖忠彥之帥定武也按此下文氣不接疑有脫誤頗怏怏及忠彥入相擢為太學博士始愧服而肖胄薦士亦不以為己力人謂其有祖風烈九月特進提舉太平興國宫責居連州張浚自去國二十年退然自修若無能為者而四方之士莫不傾心健將悍卒見之者必咨嗟太息下至兒童亦知有張都督每使者至金國其國必問浚今安在是月浚移永州浚舊居永人情相樂聞其歸喜相與出迎見浚所養勝前皆賀之初故相趙鼎嘗謂其客刪定官方疇曰張德逺建炎復辟之功豈可忘也上待臣下有恩想必講求矣疇曰今日擔子極重秦相欲獨負之恐難也不知故相中誰可辦者時李綱朱勝非尚存鼎曰伯紀一輩不濟事惟德逺可爾第恐不容復來至是浚果為檜為忌屏居湖外之久如鼎言也建州甌寧縣有洞曰回源其地與建陽縣接境乃建炎初劇冦范汝為竊發之地民性悍而習為暴小遇飢饉即羣起剽掠去嵗因旱凶民杜八子乘時嘯聚首破建陽逐官吏殺居民是夏張大一李大二復于洞中作過本路帥臣仍率官軍蕩定進士魏掞之謂民之易動蓋緣艱食乃請于提舉常平官袁復一得米一千六百以貸鄉民至冬而取遂置倉于邑之長灘鋪自後再嵗散斂如常民得以濟不復思亂而草冦遂熄人謂掞之所請乃社倉遺意使諸鄉各有倉儲粟則緩急可恃蓋本朝自景祐中王琪引隋唐故事請復置義倉而石介著書亦謂隨唐義倉最便若每村立一倉委有年德者主之遇飢饉量口而給則民不乏矣後以議者多同異而止熙寧初齊唐同三州守臣王廣淵趙尚寬髙賦皆乞置義倉乃詔三州講求且圖經久之法而陳留知縣蘇涓亦言臣領畿邑請為天下倡戶五等自二石至一斗出粟有差每社有倉各置守者耆為戍納官為籍記嵗凶則出以賑民藏之久則又為立法使新陳相登即詔行之既而上與王安石論其法安石曰人有餘粟藏之于家何所害而固欲使之戍官非良法也安石意在青苗不主是法故一言而罷元豐初復詔行義倉府界提點蔡承禧言二石而戍一斗所取至輕然臣所領二十二邑其九已行幾萬石矣乞併行之乃令畿邑皆立倉而將作監主簿王右文言畿邑已試不擾請行于諸路遂詔京東西如畿縣法仍聽就縣倉輸自是義米入縣倉元祐末御史黃慶基言比歲旱潦至使江湖運米濟之然損重費以惠一時不若舉良法以惠萬世義倉良法也先帝元豐復行以為隋唐取之太重慮民不堪故納苗一石者止輸五升可謂薄矣夫樂歲雖多取之猶不為虐况取至少乎蓄之稍豐自足濟民未幾慶基去而倉竟不立紹聖著令諸縣義倉米斗收五合即元豐舊法也大觀初乃增令斗收一升以備賑荒至今行焉然義米不留諸鄉而入縣倉悉為官吏移用始也縣倉于民猶近厥後上三等戶皆令輸郡即義米帶入郡倉轉充軍食或資煩費豈復還民故每遇凶年無以救民之死今若以常歲所取義米令諸鄉各建倉貯之縣籍其數主以有年德如掞之輩乃建陽已試之效遇飢饉還以賑民且不勞逺致推行于諸郡則斯民被實惠矣右迪功郎安誠曾受故相朱勝非辟為江西帥司屬官勝非之亡也誠于佛寺飯僧自撰疏文訕及朝政為郡守所發刑寺鞫實冬十月戊辰詔停誠官惠州編管庚午參知政事余堯弼僉書樞密院巫伋乞今後朝退依典故權赴太師秦檜府聚議從之十一月己丑言者謂昨緣軍興諸縣教閲弓手嘗添置將領今既寧息乞罷去從之十二月秦檜久患在告甲子始赴朝參二孫直寶文閣塤直顯謨閣堪扶掖以入詔免拜上喜甚曰且得與卿相見檜頓首謝上曰瑞雪應時可喜又人使在塗並無須索足見省事
