body:
  text: 中興小紀卷十四宋熊克撰紹興三年嵗在癸丑春正月丁巳朔翟琮引衆搗孟邦雄營邦雄方醉卧遂將其族以歸甲子詔户部侍郎姚舜明往建康府總領都督府錢糧仍選官屬充糧科院審計司舜明嵊縣人也初金將薩里罕等衆十萬自鳯翔長安聲言東去其實由商於出漢隂直趨金商至是入泊陽界斥堠將部龍與敵遇退走金房鎮撫使王彥倉卒召兵使别將將二千人迎敵初亦以小勝既而金諸軍萃焉二將併沒彥聞敗乙丑退保石泉縣敵遂入金州初令廣西帥臣許中市戰馬皆弱不堪用至是降中兩官壬午詔置買馬司於雍州馬必髙四尺二寸以上每百匹為一綱先是言者論工部侍郎賈安宅以為張邦昌之僣立也莫儔以書報安宅安宅欲往從之聞上登極儔既被罪乃遽請致仕又謂苗劉之變吕頥浩等檄書至湖州守二及寄居葉夢得欲相率皆行安宅斷然以為不可於是安宅被旨分析既上委臺臣驗其實始知安宅致仕在儔被罪已前亦未嘗沮夢得等勤王之議惟與王黼連親是月安宅以徽猷閣待制奉祠而去言者不已遂降為集英殿修撰兼吏部尚書席益言魏晉而下甄别人物專在選曹至唐而銓法密矣然不盡拘以微文激濁揚清時出度外故杜淹表薦四十餘人後多知名韋思謙坐公事負殿髙季輔遽擢為監察御史國初猶存舊制乾德四年詔曰自今常調集選人吏部南曹取歷任中多課績而無闕失其人材可擢者具名送中書引驗加奬則是尚或任人而不專任法也其後官制釐改典選者一切不得以意從事振幽拔滯無復關焉望稽用乾德詔書凡常調中材行可取者許長二具名以聞二月丁亥朔詔從之辛亥詔廣西買馬置提舉官既又撥本路上供錢七萬緍付之為本自是嵗得千匹雖極費力斃於道者常半然於治軍亦非小補以右諫議大夫徐俯為翰林學士先是俯為侍讀進春秋解義桓公四年天王使宰渠伯紏來聘引左氏傳及杜預釋謂伯紏父在而攝父之職出聘列國故名以譏之上曰桓公篡立天王當致討既四年不問乃使其宰往聘失政刑矣書名貶之也因顧右僕射朱勝非曰卿更為朕討論而俯亦乞以聖諭編之記注既而勝非又奉親筆以為天王之失而孔子名宰所謂指行事示褒貶者於是勝非奏陛下天縱之能日新之學臣曷足以副隆旨然嘗陪經幄不敢固辭謹參考經傳衆説庶幾推廣聖言臣聞刑威者主之大柄分守者臣之大節桓公聽羽父姦謀篡而自立擅易許田貪取郜鼎如是四年天王不問乃使其宰往行聘禮所謂主柄臣節今盡廢矣故經書宰名所以譏周王也望依俯所奏以宸翰付經筵且編之注記永為大訓癸巳詔從之乙未上覽權邦彥遺表謂宰執曰邦彥盡瘁國事遽爾淪謝深可傷惻卿等可往弔之問其家所須吕頥浩言邦彥歸舉家皆陷今惟一女嫁韓穰乃詔以所得恩數分給其女知興元府劉子羽聞金州失守即遣統制官田晟率兵守饒風嶺且報陜西都統制吳玠玠驚曰事迫矣當亟邀于險諸將不能辦我當自行遂自河池縣一日夜馳三百里至饒風列營拒之官軍萬七千人益以洋川義士為三萬玠以黃柑遺金帥薩里罕得之始知玠東來敵衆仰攻我師連勝薩里罕怒斬其千户貝勒數人募死士由饒風之左間道援崖而上丁酉犯祖溪關繞出玠後玠遽還仙人關己亥金人陷興元府壬寅子羽退保三泉縣從兵才三百子羽遺玠書與之訣玠得書泣統制官楊政勸玠往救子羽玠乃引麾下兵由間道趨三泉縣子羽留數日兵稍集而統制官王俊又以五千人至於是軍聲復振辛丑宰執奏禁中神御薦饗禮科上曰朕皆自閲有一事可議神御二十五位各用羊肚一須殺二十五羊恭惟祖宗以仁覆天下豈欲多殺物命謹以别味代之在天之靈亦必歆也吕頥浩等言陛下盡誠以奉先而仁恩及於微物天下幸甚初建康府守臣端明殿學士李光以支軍衣絹不足嘗借用上供絹是月下本府具當職官時光已奉祠去而端明殿學士趙鼎為守鼎以為光為守臣直移文有司取而用之誰復敢議安可併及他官遂止以光聞因奏漕司不時應副且迫於軍衣光不得不爾擇禍莫若輕非其罪也光之罪行及臣矣始朝廷頗怒得鼎奏乃薄光罪時參知政事同都督諸軍孟庾江東宣撫使韓世忠各駐軍於建康軍中多是招安強冠鼎為二府素有剛正之風庾世忠皆加禮兩軍亦肅然知懼民既安堵商賈通行未幾移鼎帥江西劉豫之母偽太后死諡曰慈憲是月葬於東平縣三月戊午宰執奏池州敢勇軍作過上曰此事雖由小人喜亂亦守臣馭之失宜吕頥浩曰請先抽作過敢勇且分汰其餘衆乃議守臣之罪上可之丁卯宰執奏揀刺親從親事官上曰凡招軍之費動輒萬緍人但見萬緡爾不知皆生民膏血豈可輕用誠不得已也浙東沿海制置使吕源因賜對輒奏私事為言者所劾是日詔今後上殿不得輒論私事初襄陽府鎮撫使李橫既得帥權思立竒功以自固又軍中乏食往往以人為糧朝廷所給皆州縣虛樁之數橫乃與信陽軍鎮撫使牛臯相約同領兵北去襲頴昌府遇金人戰屢捷臯魯山人也金人自入中國少能抗之不意橫等率至悉潰而去遂復潁昌及汝州葉縣等處至是橫等傳檄諸軍將復東京略曰偽齊僣號自速誅夷國運中興王師已進西壓淮泗東過海沂又曰金商之帥出其先荆湖之帥繼其後倘能納欵則悉仍舊貫執迷不悟則後悔難追時橫已除京西招撫使吳玠會劉子羽於三泉子羽以潭毒山形斗拔其上寬平有水乃築壁壘凡十六日而成且儲粟守之初諸叛以利訹金謂四川唾手可得金所忌者獨玠故道險從金商不意玠之越境而戰也破金無所得已失望而洋川公私之積皆置他處至是野無所掠殺馬而食馬且盡遂殺兩河僉軍食之又春厲方作至金牛鎮距我師數十里而退且遣人賫書招子羽及玠子羽斬之而縱其一問孰遣汝來曰國相國相謂劉益也壬午子羽與玠謀遣兵邀於武休關而金棄輜重已去擊其後軍敗之先是宣撫司官屬有勸張浚移治潼川府者軍士聞之皆怒子羽馳書請勿徙浚從其言乃定以太尉江東宣撫使韓世忠為淮東宣撫使於泗州置司兵部郎官劉景真論淮南守臣當久任癸未上曰守臣固當久任至於選任則不同股肱近郡止於承流宣化惠養百姓而已淮甸密邇寇敵又須曉軍事知撫兵御將之宜然後能扞一方不可不擇也夏四月先是河南鎮撫使翟琮擒孟邦雄奏至上大悅超授琮利州觀察使而邦雄之黨梁進者復為劉豫守襲琮於伊陽琮設伏擊之盡殪京西招撫使李橫以聞丁亥以橫兼商虢鎮撫使詔琮押邦雄赴行在戊子上謂宰執曰沈與求席益前為吏部長二甚有能聲今乃不如方員多闕少士大夫失職者衆倘非痛戢姦吏安得注擬無壅可召洪擬等諭之己丑宰執奏刑部郎中韓膺胄請誤入人死罪者乞依祖宗法終身廢之經赦不原上曰此仁宗之事也其仁民詳刑如此上又謂吏部曰亂後文書不存吏緣為姦長吏尤當痛懲其弊使差注無滯權尚書洪擬雖纍歷亦恐失於濡緩席益曰擬甚用心上曰治吏以法使之畏威乃不敢侮文也吕頥浩曰唯上德以寬服民其次莫如猛也庚寅以浙西大帥劉光世為江東宣撫使於池州置司時光世與韓世忠更戍世忠已至鎮江而姦細入池州城潛燒倉庫光世擒而鞫之皆云世忠所遣於是世忠與光世交訴於上詔光世移司建康府而世忠又欲以兵襲其後上遣使和解仍書後漢冠恂賈復事戒之登仕郎鄒况上書言其兄浩直諫且乞雪昭慈獻烈皇后之謗辛卯上謂宰執曰此是哲宗朝事言之無傷乎徐俯曰陛下母事昭慈追崇極典天下共知謗已息矣上曰昭慈勳臣之家當時備禮而納正后此本朝盛事俯曰宣仁聖烈太后尤重家法正后生元子繼萬世之統以哲宗少年成之在色不欲以多近嬪嬙小人隂連宫掖因是得行媒孽遂致廢后上曰皆當時大臣不諫之罪也壬辰詔都督府移於建康浙東宣諭朱異薦鎮東軍僉判張九成等五人政績是日詔各轉一官上曰增秩賜金古所以賞守令故郡縣之政克舉吕頥浩曰內薑仲開臣之外親乞勿賞恐外議以臣為私上曰不可有功必賞乃所以為公使有罪雖卿之親亦不當貸也癸巳上曰鄒况乞雪昭慈之謗今當大祥因此時下詔如况言可也上遂問昭慈得罪泰陵之因俯對以昭懷上僣及左道之誣席益曰此皆章惇蔡卞之罪也遂詔昭慈諡號别加討論甲午上曰鄒浩之弟欲擢之乃令上殿徐俯曰鄒浩亦有子名柄然嘗為李綱客今當以其父故用之若終嫌其陷於綱黨浩更有次子上曰直臣之子復擢用之為御史使言事聳動四方亦足為國家之光也尚書省言浙中去嵗大稔今韓世忠移軍屯泗上非借民力恐饋餉不集乃命戶部尚書黃叔敖與江浙都轉運使張公濟兩浙轉運副使梁汝嘉以空名告身誘富民糴米五十萬石芻五十萬束乙未叔敖等奏今來博糴與常時不同乞不作納粟仍與免試注官汝嘉麗水人也時鼎寇楊么衆至數萬僣號稱大聖天王旗幟亦書此字且用以紀年乃詔湖南帥臣折彥質令節制潭鄂荆湖諸軍會于鼎州討之於是鼎澧制置使程昌禹先遣統制官杜湛引兵攻賊寨以俟諸軍來會既而潭州統領官劉深鄂州統制官顔孝恭共二千人荆南將官羅廣三百人並至屯鼎之城外而軍食不繼辛丑鄂潭之兵南還癸卯荆南之兵北還而湛亦歸矣戊申宰執奏戚里髙士瞳乞落階官及差遣詔除權客省四方館公事仍轉一官上曰士瞳宣仁近親又最長故優異之然不可躐等髙爵厚祿留待立功將士朕於外戚未嘗假以恩澤今後宫之家官未有過保義郎者吕頥浩曰漢有恩澤侯本朝固無也上曰此曹何厭之有雖與之正任承宣使又望節鉞矣己酉上諭宰執曰人材當須長養成就之今每除一監司常患無人向遣五使宣諭意在利民至于贓吏所當深治然所在多置獄橫及無辜非朕本意此後唯謹擇監司不必遣使遂詔諸緣宣諭所發置獄除正犯人外並放時神武後軍都統制巨師古駐軍揚州淮東宣撫使韓世忠欲令聽其節制師古不伏世忠劾罷之詔主管殿前司郭仲荀兼統神武後軍初詔李橫牛臯等直趨京城或徑往長安與宣撫司夾擊時朝廷方嘉橫勇敢向前而江西帥臣趙鼎獨奏襄陽居江淮上流實川陜襟喉之地以橫鎮撫誠為得䇿今聞橫與牛皋共起兵往東京又聞偽齊亦會金人及遣李成領衆西去恐緣此紛擾不定橫烏合之衆將不能禦則決失襄陽江湖震動其害可勝言哉近有來自襄陽臣竊訪之云橫止緣乏食兼無衣則其出兵固非獲已臣望詔有司時有資給使橫衣糧足則不假他圖然後責其守疆待敵不得因小利出兵則可為持久之計矣上覽奏頗憂之橫等軍本羣盜雖勇而無律見金所遺子女玉帛縱略數日置酒髙會金人聞而易之偽齊將李成與金合衆二萬復來橫等多無甲戰敗而走賊亦不敢深逐也參議官穀城談世則為賊所執令其臨江漢招橫橫不答世則遇害頴昌府復陷偽境至是荆南鎮撫使解潛奏橫已回襄陽及金犯鄧州境與本鎮甚近緣四川總領財賦趙開遏糴將士飢餓望下湖南撥兵同保上流仍下川路備糧詔以付宣撫司鼎冦楊么拒官軍纍年賊徒亦多被殺至是以諸處會兵來討人心頗搖乃偽肆赦立鍾相之幼子子義為太子自么與黃誠以下皆盡臣禮之以固其黨之心初賊有寨僅七十中間為官軍所破或葺或廢惟夏誠劉衝二寨險不可破上每日朝退即閲羣臣章疏及四方奏報申時付外乃習射晚則復覽投匭封事日以為常未嘗少怠五月乙卯朔上因以語宰執且曰每日申時付外章奏至卿等處晷刻皆定可見也河南鎮撫使翟琮奏去朝廷道逺緩急乞𨽻宣撫處置使張浚戊午詔從之己未資政殿大學士吳敏卒自渡江以來大宗正權於虔廣二州置司至是詔行在建睦親宅辛酉宰執奏當作屋百間上曰此非今所急然事有不得已者故春秋得其時則不書不書者聖人之所許也近時營造之令一下郡邑即科於民故民輒受弊若物物和買則民不與知乃令有司條上是年冬始成南班宗室至而居焉初榷貨務都茶場槩稱行在至是詔鎮江府吉州置司者别為名時御筆增小官俸下有司條具壬戌上曰小官俸增雖變舊法亦所以權一時之宜祖宗成憲固當謹守至于今昔事有不同則法有所不行亦須變而通之自元豐增選人俸至十千二百當時物價甚賤今飲食衣帛之價比宣和間猶不啻三倍則選人何自給而責以亷節難矣初遣奉使潘致堯髙公繪等往金國軍前通問至是回乙丑以致堯為刑部郎中公繪為浙西都監金願再遣重臣以取信丁卯遂以吏部侍郎韓肖胄除端明殿學士同僉書樞密院事辛未命肖胄為金國軍前通問使仍擢給事中朐山胡松年為工部尚書副之肖胄等辭奏曰緣大臣各徇己見致戰和未有定論臣等已行願毋先渝約或半年不復命必别有謀宜速進兵不可因臣等在彼而緩之也癸酉宰執奏稟國書上曰有天下者當持之以謙易曰謙尊而光則知能謙者尊而光矣時有上殿官李長民者正民之弟也戊寅上問宰執曰長民比正民如何吕頥浩對二人皆淹博文辭則長民優上曰陳襄薦司馬光等朕得其藳以示從臣而正民以光等為皆不合時宜士大夫笑之徐俯曰正民父景淵長者持論平允不以元祐為非臣嘗戒長民當繼父志上曰顧長民力行如何爾元祐人雖賢其子孫亦不必遍用餘人亦不可偏廢惟賢則用之上又問鄒况何如人頥浩等對以浩之弟上曰浩固賢今更當論况之賢否席益曰陛下不以正民之過而廢長民雖已知浩之賢又問况之賢否可謂至公矣上曰朕心至公未嘗偏有好惡况用人乎既而除長民監察御史常與改秩湖南宣諭薛徽言薦通判永州劉延年祈陽縣令張登欲就任增一秩己卯上問宰執曰延年何如人吕頥浩等皆曰不識上曰古人求賢如不及然人固未易知聖人猶難之大臣既不識何由知其賢否乃召延年赴行在登就任增秩上又謂宰執曰監司守令皆有勸農之名未聞勸農之實吕頥浩曰漢力田與孝悌同科以重農事也上曰觀文帝詔足知當時重農事矣席益曰大觀政和間亦嘗舉行勸農事而吏不以實應徒為文具至有追集農夫拘留纍日以待守令之行阡陌者今當令縣縣行勞來之實上然之初淮東宣撫使韓世忠遣統制官解元杜琳等將兵渡淮北去至是詔世忠金人已約講和所遣兩軍且駐盱眙勿侵齊國之境是月劉豫偽戶部侍郎馮長寧與監察御史許伯通同修十一稅法與阜昌敕令格式皆成二法並行文意相妨者從稅法其説以謂宋之稅法為民大蠧權豪交通州縣而欺愚弱入田宅不承其稅間有陳詞官吏附勢不為推割産已盡而稅猶在監固拘囚死而後已官攤逃户之稅使邑里代輸又方田髙下土色不實朝行寬恤之詔暮下割剝之令故民窮而起為盜大率皆吠堯之言也資政殿學士許翰自湖北遷居江西六月戊子卒金人之由褒斜谷而去也宣撫處置使司遣軍追擊俘女真二千口至是張浚奏捷時副使王似才至而朝廷未之知也上曰賴敵自退兩蜀無虞左僕射吕頥浩曰臣深以為憂今強敵自敗皆陛下聖德所致所有張浚取旨上曰可速其來仍督王似盧法原之任庚寅曲赦川陜令吳玠速上將士功狀既而法原亦至仍置司于閬州于是總領四川財賦趙開白似等求罷且言自改修茶鹽酒已壞之法嵗有常息起建炎己酉至紹興癸丑共收一千五百餘萬緡兼陜西茶馱及陜西造銅錢引紐計川錢又八百三十餘萬緡惟是官吏營私惡其不便於已共興謗讟以為擾今老矣恐誤國事似等知軍食方急不可以無開乃疏乞因任詔從之自川陜屯兵一嵗之用可計者糧一百六十餘萬石而對糴居其半錢三千餘萬緡而鹽酒稅亦半之此其大略也此據鄭剛中送人序上謂宰執曰為法不可過有輕重然後可以必行朕嘗語徐俯異時宫中有所禁則令之曰必行軍法而犯者不止朕深惟其理但以常法處之後更無犯者乃知先王立法貴在中制所以必可行也鼎寇楊么犯鄂之公安石首兩縣甲午詔天武捧日四廂都指揮使神武前軍都統制王􅊛為荆南潭鼎澧嶽制置使率所部全軍并帶統制官崔增水軍搗其巢穴仍仰淮東宣撫使韓世忠江東宣撫使劉光世各以船五百隻與􅊛又詔統制巨師古以兵二十亦隨􅊛去併力討之􅊛又請金字牌欲招安其衆上曰建炎以來盜踵起而不息者由黃潛善專事招安而無弭盜之術髙官厚祿以待渠魁是賞盜也故不逞之徒胥動為盜楊么罪惡貫盈何以招為仍命將來破賊誅止渠魁貸其脅從許以自新庚子給事中黃唐傳乞立武選格以科舉人數三分之一待武士中第者注縣尉他日有統兵官闕並先選武士詔兵吏二部條上建炎中國子監併歸禮部丁未始詔駐蹕所在國子監量養士仍置博士然未果行焉初吕頥浩以養兵費廣乃稍更鹽法循法為序使商賈入納奔湊又經理淮甸以護通泰專鹽利而堂後張純獻計頥浩增定私鹽刑名多配嶺南犯者相屬于是殿中侍御史常同言法已極重貧民所負至少而受捕豪家結羣持伏則法不能及宰臣循蔡京之舊亦用張純提領兩務而户部與胥吏通姦利已有顯狀上諭同曰凡舉事不能有利無害苐當擇利多害少者為之非卿言朕不知其害至是亟命有司更定其法下純大理寺治罪取兩務復𨽻户部時選部案牘不存吏得為姦川陜官到部者多以微文沮抑往返輒經嵗于是考功郎官歷陽魏矼奏請細節不圓者悉先放行人以為便自後踵行之
