body:
  text: 中興小紀卷二十五宋熊克撰紹興八年秋七月己丑以御史中丞常同為顯謨閣直學士知湖州先是左僕射趙鼎嘗奏向子諲無罪當留同與潘良貴誠有罪不宜因子諲之故顯出之俟少定令外補不惟為同良貴亦所以為子諲蓋外議猶以子諲久對為非而良貴實出於愛君也三人既出給事中張致逺駮詔謂不應以一向子諲出二佳士上怒作色顧鼎曰固知致逺必繳駁凡再言之鼎曰陛下何由知之上曰致逺與諸人善趙鼎事實曰時蓋有先入之言上聞鼎奏由是不樂後數日右丞相秦檜留身奏事甚久既退鼎扣之曰上無以前日言有語否檜曰上無他但患相公不樂爾鼎乃信而不疑辛亥宰執奏淮西張宗顔乞遣統制官吳錫軍馬回别請濟師上曰吳錫有膽勇心計然不可獨用可趣歸令楊沂中别發一軍趙鼎曰沂中已嘗有此請蓋上知人能駕馭皆出於談笑之間所謂善將將也於是樞密院令殿前司追回錫仍依其數别撥一軍往廬州權𨽻於宗顔俟防秋過取旨舊制三衙管軍未嘗內宿上駐蹕揚州始日輪一員內宿彈壓至是殿帥揚沂中已免宿直又缺馬帥惟權步師解潛一員與兩司使臣互輪潛奏乞依東京舊例乃詔潛權免只分輪使臣於是右諫議大夫李誼言按魏置中衛將軍晉武分為左右衛宋齊謂之二衛各領營兵每暮一人宿直又唐右衛大將李大亮自兼三職宿衛兩宫每畨直嘗假寐太宗勞曰公在我得酣寢則三衙宿直尚矣太平無事不以三衙宿直可也今萬騎時巡宫闕則非曩之壯大禁衛則非曩之衆多內外之患可備非一而管軍夜居於外是潛等之寢則安為宗社慮則未也望令沂中與潛依舊輪宿仍權差馬帥通作三衙以次寓直上嚴宸極從之既遂以龍神衛四廂都指揮使韓世良權馬帥時有御批宗子防禦使璩建節封國公入資善聽讀方疇稽山語録曰時左相趙鼎語右相秦檜云公嘗説鼎丙辰罷相之後議論鼎者專以資善堂藉口鼎今日當避嫌公可面納此御筆如何檜曰公為首相檜豈敢專公欲納之檜當同敷奏也鼎約檜與劉大中各作一劄子明日鼎與大中各將劄子至惟檜無之鼎遂參酌只作一劄子明日鼎又語檜同進呈尤好檜復曰公為首相檜不敢專明日進呈鼎奏曰祖宗受天明命當傳萬世陛下仁孝子孫千億未可量也但宗子某己封建國只是小國今某封吳國公却是全吳臣欲且與建節或封一等小國上曰都是小孩兒且與放行鼎執奏再三且曰兄弟之序不可亂上意難之遂留御筆曰待三五箇月别商量既下殿樞密王庶西人氣直語鼎曰公錯了也檜曰檜明日留身敷奏明日檜留身又明日鼎留身奏曰昨所納御筆不知檜與大中有何奏上曰大中之説與卿一爾八月戊午詔疆場之臣無弛邊偹庚申以利州觀察使馬擴為沿海制置副使鎮江府置司先是朝請大夫吳説嘗與苗傅欵密言者屢劾之十年不調辛酉上因語宰執曰説纍赦不得自新非朕用人之意可諭言官負釁之人已行者勿再論於是趙鼎等仰服主上洪度兼容所謂國君含垢此其至也甲子宰執奏馬擴將到奉使録記海上之盟約金人夾攻事上以為敵國之與中國如隂陽消長豈能偏廢若可勦除漢唐之君行之久矣趙鼎等三復上語謂此豈特中國之幸亦敵國之幸也辛巳著作佐郎李彌正髙閌皆除郎官而著作郎何掄張嵲尚未遷樞密副使王庶疑之以問趙鼎鼎曰少需處之要職至是以掄為祕書少監殿中侍御史張戒言掄昔張浚入蜀掄為之鷹犬去嵗浚獨相自以黃潛善乃王黼之黨每持邪説以司馬光為非王安石為是至再修神宗實録掄攘臂其間略無忌憚浚敗乃焚毁簽貼國家大典豈宜屢易以徇權臣之私意詔以掄知邛州嵲不自安亦求去遂除福建轉運判官徽宗既祔廟禮畢是月始詔修徽宗實録以左僕射趙鼎兼提舉鼎奏曰先帝以仁厚之德􅉼養天下幾三十年其間法令有未盡善者皆出於羣臣貪功冒賞之私而有司壅於上聞非先帝本意也劉大中宣和初知如臯縣有旨即隱者徐神公所居建為觀觀基包士民墳墓甚衆大中顧有司不能決乃具圖申省且束裝待罪洎取旨先帝愕然曰豈可發民墳墓即詔移之别地則知當時有不便於民者使先帝悉知未有不改之者此羣臣之罪而蔡京為之首也上深然之以至泣下鼎又曰崇觀之失不歸之蔡京使何人任責今士大夫力主京者皆厚私恩而薄祖宗之人也願陛下深察之時臨安府任同京邑而守臣集英殿修撰張澄有治劇之才甚得時譽是月除徽猷閣待制九月丁亥侍御史蕭振言近除發運使令糴米以待闕用其價雖隨時低昻常使官價髙於民間仍不加耗及即時支錢則有以助國寬民詔從之既而右諫議大夫李誼言祖宗時發運所領乃轉輸東南之粟以實中都又制茶鹽香礬石貨之利今皆所不及惟是給以本錢使之糴買然復興一司豈專為此哉如營田經理之制市易懋遷之法又州縣錢物之限無所拘賦斂之橫無所考監司廢格詔條漫無有稽察臣願俾總六路而調其盈虛內與戶部相為表裏則劉晏之策可展而不為虛文不然則糴買一事自可責之諸路漕臣何必創此司哉望下臣之説於三省講而行之蕭振一日奏事上因語臣下之姦者且曰朕初不欲以語卿恐人謂朕令卿言也振曰臣與陛下所共者理爾理之所在臣安敢自默時新除沿邊守臣王默等辛丑上謂宰執曰今日邊壘內則綏撫外則斥堠二事至大未易得人宜精擇之乙巳金遣左監軍薩里罕自雲中馳之陜右見左都監巴克實議割地事路由同州先是青澗李世輔陷偽境時為同州守世輔怒薩里罕無禮因殺其從者百人將擒以歸本朝會敵騎追逼世輔折箭為誓縱之去於是世輔不克南歸亡入夏國初召秦檜之來道由婺州時左朝散郎王次翁致仕居于婺與檜遇既而中書舍人樓照為檜言次翁貧甚因曰吕頥浩次翁郡人也頥浩再相次翁困一至此檜笑曰非其類也遂落次翁致仕以兵部郎官召之是月移為吏部郎官是秋金人括京畿及陜西錢穀皆轉移北去蓋有割地以歸本朝之意也冬十月重修祿秩敕令書成丙辰右僕射秦檜上之待御史蕭振論參知政事劉大中與父不睦何以事君望正典刑以厚風俗大中亦纍章乞罷丁巳以為資政殿學士知處州振復論遂改提舉洞霄宫趙鼎事實曰初監察御史蕭振力求外補且託其鄉人吳表臣薛徽言為請甚切鼎信之遂除郡而去及秦檜拜相一召即來始振以親年七十求去至是不復以親為詞尋除南臺是必有薦為鷹犬者也未踰月論劉大中至三章不已鼎謂意不在大中行且及臣矣方疇稽山語録曰時召蕭振入臺振秦檜死黨也首攻劉大中大中既去趙鼎亦丐去正人端士掃地盡矣論者云秦檜竊柄十有八年毒流天下皆自振發之故目振曰老蕭云蕭振言經制司糴米而發運使程邁一例拋與諸州則諸州不免拋下諸縣科之百姓即非創司寬民之本意宜令官自置糴場丁卯詔從之辛未趙鼎入辭從容奏曰臣昨罷相半年蒙恩召還已見宸衷所嚮與向來稍異臣今再辭而後人必有以孝弟之説脅制陛下矣臣謂凡人中無所主而聽易惑故進言者得乘其隙而惑之陛下聖質英邁洞見天下是非善惡謂宜議論一定不復二三然臣甫去國已稍更改如修史本出聖意非羣臣敢建言而未幾復修此為可惜臣竊觀陛下未嘗容心特既命為相不欲重違其意故議論取舍之間有不得已而從者如此乃宰相政事非陛下政事也上曰朕深會此矣趙鼎之去也樞密副使王庶送鼎登舟曰公欲去盍早為庶言鼎曰去就在樞密鼎豈敢預庶西人氣直即曰庶會此矣召龍圖閣直學士孫近及端明殿學士李光乙亥以近為翰林學士承旨光為吏部尚書既而給事中張致逺以徽猷閣待制出知廣州中書舍人吕本中奉祠而去二人皆趙鼎所厚者二人之去皆在十一月今聨書之辛巳宰執奏北使約仲冬至泗州上曰所議殊未可解但可和則和不可和則否可督諸將為之備也十一月甲申以學士承旨孫近為參知政事龍圖閣直學士汪藻復進宣和以後詔旨己丑除藻顯謨閣學士有旨少師劉光世賜第中書舍人勾龍如淵繳奏上曰今財力困匱營繕實難但以光世罷兵柄奉朝請恩禮稍加于舊則諸將知後福之有終皆效力矣於是宰執秦檜等退而稱上馭將帥深得漢光武遇功臣之意前宰臣趙鼎之求去也殿中侍御史張戒以謂大臣進退國家安危所係陛下他日必悔乞留鼎于經筵詔戒為耳目之官附下罔上可與外任朱勝非間居録曰趙鼎復相植黨益急凡凶險刻薄之士無不收用使造虛譽而排善類張戒其一也鼎薦常同為中司同即以鼎所喜奏為臺屬戒自郎官除察院未幾遷殿院鼎失眷丐罷知其決去即露章請留以徼後福其言狂躁愚弄鼎既罷猶知泉州蓋其黨與維持之力也接伴使范同奏金使遣人議過界上曰若使百姓免於兵革之苦得安其生朕亦何愛一己之屈勾龍如淵退朝録曰時金國遣二使携書來書中蓋以河南之地盡歸于我者惟是使人入界索禮過當號其書曰詔書指吾國曰江南見吾館伴使必欲坐堂中而坐使人於一隅所歷州縣必欲使官吏具禮迎其書如吾國中迎天子詔書之禮且言其書到行在必欲上再拜親受之上下洶洶不知所為上親劄付館伴范同途中稍生事當議編置而朝廷議禮益不決如淵因奏今日和議實陛下以徽宗顯肅皇后梓宫與母兄之重在人國中宸心朝夕不遑寧處遂遣王倫奉使請和今日金人既遣報賫書而來倘若不受必致歸曲於我一日興師彼則有辭此和議固不可壞而禮文之間動輒過當儻不度利害勉而從之則堂堂中國一旦遂為金人屈已如臣管見必遣王倫與使人反覆商議取得金書納入禁中則禮不行而事自定矣上曰果如此即無以加俟試以此而付之樞密院編修官廬陵胡銓上書言王倫無故誘置金使以詔諭江南為名是欲臣妾我也倫論我一屈膝則梓宫可還太后可復鳴呼自來主和議者誰不以此説啖陛下然卒無一驗則敵情亦可知矣向者陛下間關海道危如纍卵尚不忍北面臣敵今無故而反臣之百官軍民皆欲食倫之肉倫不足道而秦檜亦為之近者曽開引古誼以折檜檜厲聲曰侍郎知故事檜獨不知耶檜畏天下議已又令侍從臺諌僉議以分謗孫近傅會檜議遂得執政臣謂倫可斬近亦可斬也願斬三人頭竿之藁街然後羈留使者而興師問罪則三軍之氣不戰而自倍不然則臣有蹈東海而死爾辛亥詔銓狂妄上書意在鼓衆除名勒停昭州編管時銓有孕妾臨月遂寓湖上僧舍欲少遲行而臨安府已差使臣挾錮身來矣館職范如圭與刪定官方疇同見吏部侍郎晏敦復為銓求援敦復曰某嘗言秦檜之姦諸公不以為然今方專國便敢如此趙元鎮雖無狀不至是也此人得君何所不為敦復即往見知府張澄語之曰銓論宰相天下共知祖宗朝言事官被謫開封府必不如是澄愧謝曰即追回矣方疇稽山語録曰其後疇見趙鼎於稽山誦晏敦復有趙元鎮無狀之語鼎曰景初亦出此語乎疇曰某親聞之疇又曰敦復久在銓部有人望當遷尚書而鼎謂敦復嘗抗吕頥浩被送吏部鼎執政召為都司除吏部侍郎但其性介僻不通故遲之也於是秦檜孫近上章待罪詔無罪可待檜等又奏若銓重竄則臣等有所不安遂寢前命送吏部與廣南監當右諫議大夫李誼言陛下臨御於今一紀所用相凡十人執政三十三人然皆不久而去規模數易士夫知其不久則肆為同異而無忌憚吏知其不久則專為茍簡以幸蔽欺陛下夙夜憂勤而治不加進殆必由此今左相虛位參政闕員乃擇賢之時望考以聖心參以公論儻選而得天下之材則責之專任之久可革數易之弊臣備位言責不敢復避形迹惟陛下察焉是月資政殿學士陳與義卒于湖州禮部侍郎張九成求去面奏曰外議以臣為趙鼎之黨雖臣亦自疑之上問其故九成曰臣每造鼎見其議論無滯不覺坐久則人言臣為鼎黨無足怪也於是九成除祕閣修撰提舉太平觀而去十二月右僕射秦檜乞差官前路與金使計議使名未正當以江南為宋以詔諭為國信至如不受封册不泛遣使皆先事預約戊午上謂宰執曰朕承祖宗二百年基業為臣民推戴已踰十年豈有受其封册兼畫疆之後惟正旦生辰遣使非時不許往來於是檜等皆仰嘆上沉幾逺慮非羣臣所及己未秦檜言趙鼎修哲宗史成加特進直學士院吕本中行詞云合晉楚之成不若尊王而賤霸鼎為首相於議和未嘗不僉同今命詞如此皆鼎風旨欲伺和議不成為脫身之計上因諭己酉年金人南騖鼎時為臺臣尚欲與金人畫江為界豈以和議為非此事張守備見檜曰更可録此聖語付史館於是檜等退而竊歎上明智照臨洞見臣下反覆之態豈可欺哉中丞勾龍如淵言資政殿學士王庶嘗營救趙鼎乞罷潭州之命丙寅詔庶落職與宫祠金國左副元帥逹蘭遣其使張通古來朝己巳入見通古言先盡還河南地徐議餘事殿中侍御史金華鄭剛中言今日之勢尤急於邊郡如楚泗通泰滁濠江鄂以至荆襄關陜之地不過二十餘郡願詔大臣精選二十輩分而布之使其招徠收養朝廷又時遣使按行無狀者昜之處處得人則須以持久增秩賜金之事可行矣庚午詔從之參知政事李光請罷常平主管官辛未上謂宰執曰常平法本漢耿夀昌今豈可以王安石而廢之其提舉官自可復置庶幾不陷失一司錢穀秦檜因奏光言諸路月樁錢漕司不以上供及移用等錢樁辦又一路諸郡輕重不均致不免敷之百姓上曰朕屢諭趙鼎更不肯行若悉將上供等錢樁辦自不必科敷兼江東既闕劉光世一軍其錢糧亦通用蓋上哀憫元元之意其切如此甲戌以端明殿學士韓肖胄為僉書樞密院事乙亥詔肖胄充金國報謝使以樞密都承旨錢愐副之是月以起居郎劉一止為中書舍人兼侍講太府寺丞莫將賜出身為起居郎一止亟言將丞九列驟綴從班人以為將上書助和議而得之臣之誤恩與將同制臣若不言人必謂臣自為地而不患乞併臣罷之不報將歸安人也先是左僕射秦檜嘗因語國事云此事大係安危禮部侍郎曾開於坐中抗聲曰丞相今日不當説安危止合論存亡爾檜矍然驚其言而罷是月開以寶文閣待制出知婺州此據吕大麟見聞志初吏部郎官黃祖舜以父憂去位至是免喪自度與時論不合即丐奉祠浮湛里中以著書自娛家貧屢空而處之常晏如也時淮東宣撫使韓世忠伏兵於洪澤詐令為冦俟金國使回則劫之以壞和議而世忠將郝卞密以告漕臣胡紡紡白之奉使僉書樞密院韓肖胄故金國使由淮西以去世忠不得而劫焉金人既割河南之地以歸本朝遂移行臺尚書省於大名府仍遣行臺左丞相張孝純還上詔孝純赴闕孝純自慙乃白右副元帥烏珠願歸徐州致仕而卒時金人以舊嘗臣劉豫者李鄴為翰林承旨馮行寧為戶部使戶部在平陽府二人受命皆更服以赴焉初北使之來也校書郎范如圭上書於右僕射秦檜責以曲學倍師忘讎辱國之罪且曰公不喪心病狂奈何一旦為此若不早改必且遺臭萬世矣檜怒至是如圭輪對言兩京版圖既入則九廟八陵瞻望咫尺而朝修之使未遣何以仰慰神靈下遂民志上悽然曰非卿不聞此言遂命遣使檜以其不先白己益怒久之如圭奉祠而去
