body:
  text: 中興小紀卷三十一宋熊克撰紹興十三年嵗次癸亥春正月癸巳詔祖宗朝殿幄悉用純綵後來寖多文繡今當屏去止用緋黃二色既而知信州葉三省乞宣付史館上未允左僕射秦檜曰此陛下盛德事合付史館於是檜等仰歎真所謂示敦朴以先天下者也三省桐廬人也戊戌加上徽宗尊諡曰體神合道駿烈遜功聖文仁德憲慈顯孝皇帝先是隂雲欲雪己亥上親饗太廟日霽霧澄皆誠孝所格禮部侍郎王賞請付宣史館從之壬子上謂宰執曰近有士人進說以為春秋無褒議論似偏恐非聖人本意程克俊曰觀春秋命名正寓褒貶賞罰之意上以為然二月己巳上謂宰執曰古今琴制不同各有所寓朕近出意作盾樣示不忘武備之意於是秦檜等稱贊時殿中侍御史晉江李文㑹以朝廷方守和議不言兵乃奏仁義之說曰陛下文德柔逺兼愛南北之民仁也昔金人猖獗陛下毅然請行既即位猶念二聖逺狩宵旰圖治宗廟再安義也願陛下力行此道天下幸甚庚子上謂宰執曰文㑹力陳二義甚善朕今録一本置之几案欲常觀鑒己卯宰執奏福建安撫使葉夢得措畫弭盜之事上曰盜之竊發多緣守令非人掊克所致宜令帥司條具凡有害於民者除之自此夢得或招捕或誘之相戕三策並用然頗與監司相異至交奏其事監司謂盜魁林元仲必不可致既而夢得遂招致之又俞徹明必再叛萬少隆必大熾而夢得處之皆定異議遂息此據葉夢得行述三月禮部侍郎王賞奏將來郊禮宿齊處及祭等事乙未上謂宰執曰三年郊禮止一宿毋枉費人力只隨宜絞縛務從簡省秦檜等曰兹誠陛下盛德之事臣等敢不奉詔言者謂自元豐始廣景靈宫以奉祖宗衣冠之遊即漢之原廟也自艱難以來庶事草創而原廟神遊猶寄永嘉四孟薦饗旋即便朝設位未副廣孝之意望命有司擇地倣景靈舊規以建新廟迎還列聖睟容庶幾四孟躬行獻禮用慰祖宗在天之靈丁酉詔禮部太常寺討論申省既遂建於新莊橋之西其地乃故劉光世妻向氏所獻庚戌上曰將來郊祀詣景靈宫可權宜乘輦此去十里若乘輅則拆民居必多蓋上愛民之誠如此言者以謂吏部告身在官告院其監官但置籍授吏而弗預書告萬一姦弊無由察知乞亦命書告甲寅詔從之兵部侍郎程瑀言將來郊祀用國初大駕儀伏總一萬一千二百餘人除已有黃麾半仗及玊輅法物儀仗外見闕金象木革四輅望下所屬製造詔以纈代繡仍差兵部郎官錢時敏軍器監劉才邵主簿宋貺同監視之貺歙縣人也辛酉宰執奏上殿官范正國論廣南鹽事上曰法必有弊而後改若未見其弊遽議更作非特無利必至為害凡法皆然不止鹽也癸酉以右諌議大夫羅汝楫為御史中丞前知漳州韓岊請復孝悌力田科丙子上曰漢有比科固可以厚風俗然祖宗時未嘗行宜令講究不可輕易創立岊侯宫人也兩浙漕臣張淑獻相度秀州華亭縣宜置閘以捍鹽鹹潮事丁亥宰執奏事上曰數日來太后趣行冊命中宫之禮朕乞太后降一指揮太后不肯云我但以家事豈豫外庭太后知國體故重如此秦檜等曰太后有定命陛下奉行可也五月癸亥中書舍人楊願請依唐乾元及國朝故事詔天下置放生池祝聖夀乙亥詔諸路監司措置申省先是詔立聖節紫宸殿上夀儀已成丁丑天申節百官上夀如儀知大宗正權主奉濮王事士夽言自前嗣濮王仲湜權奉神貌安於紹興府之光孝寺今欲以法堂權充園廟從之臨安府并屬縣並獄空甲申詔奬守臣敷文閣待制王㬇㬇圭孫也六月戊子詔知興元府川陜宣撫司都統制楊政令仍改為四川宣撫司都統制臨安府宗子學生師閔師顔訟教官鮑同不法事己丑上謂宰執曰此乃論師長恐起告訐之風可送宗司拘管教官須先正已然後可以率人若自為不法人豈服之鮑同令本府體究果有不法亦當黜之既而體究上所論多不實上曰朕不罪同師閔師顔須與行遣秦檜奏乞送大宗正士夽庭訓同不可為教官欲罰銅對移别職從之殿中侍御史李文㑹論江隂軍僉幕蔡楶不法事壬辰上諭宰執曰不按發監司須當行遣天下事臺諫安能盡知監司乃朝廷耳目之官豈可容縱不舉且與降官自知所畏矣鄂州御前都統制田師中奏諸軍統制等官有老病者已蒙朝廷與差遣離軍今不可闕官乃詔鋒軍統制李道為前軍統制餘以次升焉初詔權任鬻度牒至是夀星寺乞每嵗撥放詔以故嶽飛宅葺為太學丁酉端明殿學士僉書樞密院事程克俊求去位壬寅詔依前職提舉洞霄宫甲辰宰執擬差太學官上曰師儒之任尤當遴選須得心術正者為之將以經㫖諭後進萬一有邪說學者從而化之為害非細秦檜曰謹遵聖訓翰林學士秦梓引疾乞退辛亥以為龍圖閣學士知宣州先是詔守臣到任半年具上民間利害及邊防五事癸丑上謂宰執曰近觀諸處所奏固有法已該載亦有一方之便朝廷未知者宜委都司詳之其便民者即與行無事虛文也初徽猷閣學士胡舜陟知靜江府因奉詔捕郴賊駱科餘黨以饋餉不繼與廣西轉運副使吕源有隙舜陟劾源沮軍事時有府吏徐竿者因獲罪舜陟杖而逐之竿乃隂求舜陟之失得其雍州買馬折閲事以告源源即誣奏舜陟受金且以書抵秦檜言舜陟非笑朝政檜素惡舜陟遂入其言差大理寺丞袁柟燕仰之於靜江府制勘竿亦對獄舜陟入獄二十日至是死人皆寃之竿歸才及家而卒既而舜陟妻汪氏訴於朝上曰舜陟是從官兼罪未至死勘官不可不繩柟仰之並送吏部柟等送吏部在明年二月今聫書之是月資政殿學士張徴卒時䖍冦擾江西及閩廣而州縣多無備又官兵有常屯不敢越他界以故賊得往來如志環數千里民被其害於是殿中侍御史李文㑹言州縣事同一家願令三路帥臣監司共議合兵將以據要衝仍定期會共為掩襲使賊出輒遇兵則竄無所逃庶易殄滅從之秋七月己未復置國子監書庫官一員禮部太常寺修定景靈宫四孟朝獻儀詔從之溫州進士蔡大中上書論人主誠心等十事謂當有始有終其說頗有理詔與永免文解辛酉上謂宰執曰朕觀史書自古人君未見有始無終而能長久者也秦檜曰終始惟一時乃日新有始有終乃聖人日新之德上曰然以唐太宗之明而魏鄭公有不克終之戒終始惟一古所難也帶御器械吳益以皇后受冊陳乞恩數丁卯上諭宰執令依例與之上曰皇后甚嚴無例事必不敢乞皇后意欲除內祠且令閉門讀書也壬申宰執奏池州都統制王俊申乞將官申任上令樞密院約束諸軍揀去老弱存其强壯日加訓練以備朝廷不測差官按試上曰此事今日所當為者異時緩急調恐誤事也時國學新成試補生員四方來者甚衆幾六千人丙子揭榜取徐驤等三百人驤浦城人時上出孟饗有唐突者四人其一乃宗子為注籍事八月乙酉朔上謂宰執曰既來唐突恐須有說且令其近屬保明若是宗室不可使之失所不然須與行遣既到朕前當别其是非也乙未詔有司檢太宗幸學曽令學官講經及各有恩例故事川陜宣撫副使鄭剛中進金一萬兩己亥上謂秦檜曰頃年張浚曽獻金三萬兩是時錢物有餘卿可諭與剛中不須循舊有餘則進若取於民不可也舊制三年科舉川廣福建例先諸路一月引試至是言者以謂駐蹕吳㑹則福建為甚近恐試下舉人或冒名再試他州請以八月五日鎖院詔從之初奉使洪皓張邵朱辨自金國歸上眷皓厚嘗曰雖蘇武不能過也是月除皓徽猷閣直學士提舉萬夀觀權直學士院時金人取趙郴輩三十家詔悉歸之皓言昔韓起買環於鄭鄭小國也能引義不與金既限淮按疑有脫誤官屬皆吳人留不遣蓋慮知虛實也彼方困於蒙古原作䝉兀姑今改正示强以嘗中國若遽從之彼將謂秦無人而輕我矣又言王倫輩以身徇國棄之不取緩急何以使人至是皓見秦檜又言張浚敵所憚乃不得用又言錢塘暫駐畢而景靈宫太廟皆極土木之工示無中原意耶檜不悅兵部侍郎程瑀遷尚書九月丁巳宰執奏江東提刑洪興祖欲進石碑事上曰石碑安用不善刻者皆失其真學書惟視筆法精神朕得王獻之洛神賦墨跡六行置之几間日閲十數過覺於書有所得近已寫尚書終篇學字若便寫經不惟字進而經亦熟秦檜曰平時諸生未有能寫經一部此仰見聖學之不倦也御史李文㑹論徽猷閣直學士提舉萬夀觀權直學士院洪皓以謂皓在朝必生事亦因及宇文虛中事甲子上謂宰執曰朕嘗觀書見臣之事君不可有二心臣而有二心春秋之所不恕乃詔皓以本職出知饒州丁卯以御史中丞羅汝楫為吏部尚書戊辰上曰諸處有癃老廢疾之人依臨安府例令官司養濟窮民無告王政之所先也以兵部尚書程瑀為龍圖閣學士知信州太府寺丞張子儀言乞三嵗考守令以户口復業登耗為升黜之典己巳乃詔淮東京西監司嵗終取州縣所增户口以聞知司郎官梁辨以病乞祠是月司業髙閌因經筵講畢奏曰國學落成臣奉詔試補諸生幾六千人自中興以來雖三年省闈亦未有如此之盛上曰乍脫干戈人皆向學此誠可喜閌曰近來場屋不無懷挾假授之弊目前頓革皆不敢犯上曰朕亦聞之此美事也閌曰臣待罪學官見此美事諸生以謂陛下方偃武修文與太祖初定天下之時同符輒舉建隆故事願陛下講臨雍之禮言未畢上曰已令討論矣蓋是時上已有幸學之意閌未之知也先是閌請修監學法以元豐法為主詔敕令所參修至是成冬十月己丑太師左僕射秦檜上之祕書丞嚴抑言國朝㑹要仁宗時自建隆修至慶厯神宗時自慶厯修至熙寧而後來尚未編集事無所考望令儒臣續而為書抑又言渾儀之制祖宗所留意渡江以來闕然無有乞下太史局重創皆從之抑歸安人也時景靈宫成祖宗帝后神御初自溫州海道迎來上曰此事至重朕甚慮之及聞出陸上心始安秦檜曰念祖宗如此益見聖心之孝誠也至是逹行在上乃詣天章閣西殿告遷徽宗及顯恭顯肅二后神御乙未並奉安於景靈宫侍御史李文㑹論新除國子監丞石延慶輕儇無行丁酉上曰太學風化之本使此人充監官何以取重於士人即詔罷之辛未宰執奏差郡守上曰其中有老不任事者又無顯過可論第千里之民受其害爾朕嘗與言官說此秦檜曰有不奉行詔令如朝廷免稅仍舊催科者皆緣守非其人也上曰如此者當懲一二人自懼矣祕閣修撰張九成與徑山主僧宗杲為莫逆交時緇流之赴宗杲者皆百舍重趼凡二千餘衆徑山雖巨剎至無所容宗杲更敞千僧閣以居之而九成往來其間左僕射秦檜恐其議已故言者論九成宗杲謗訕朝政詔九成落職謫居南安軍而宗杲編管衡州先是九成寓鹽官縣僧剎一夕夢水陸逺行至一城郭亦寓小剎似悒悒不樂及至南安皆如所夢十二月甲申九成私識之辛卯宰執奏禁止江西私鑄錢事上曰卿等見錢樣否此事更不成錢皆消錢而私自鑄者當嚴禁止公私皆不得用不然盜鑄愈多尤費力也自建炎中罷內轡庫是日始詔復置新知永州熊彥詩上言欲依嘉祐治平故事補中監學生命詞給綾紙從之甲午上詣景靈宫行恭謝禮乙未再詣皇后遷葬父母欲青石作墓前羊虎己亥上謂宰執曰此石出平江朕不欲行下郡邑恐科率於民只支錢付守臣王鐵依市價置買卿等可諭與之鐵南昌人也大金國遣右宣徽使完顔日曄祕書少監馬諤來賀正旦己酉見於紫宸殿貢金注碗金盤各一金盞四雜色綾羅紗縠三百良馬六上謂宰執曰今次使人來事體皆正大體既正則小節不足較觀金人之意和議必須堅久秦檜曰此皆陛下御得其道上曰非卿學識過人堅主和議豈能至此自是使命往復不絶而嵗貢物數亦無增損初北使之來也命户部尚書張澄館伴是禮久不講澄頗知舊制凡使人入見及謝辭燕犒賜豫之儀澄皆𫝊之悉合朝度遂為定式至是以澄兼權兵部尚書先是䖍州有統兵官程師回本蕃將來降時詔歸北境人而師回有兵數百人憚不欲行守臣薛弼諭之曰公從卒多不可芘公能遣此屬朝廷必多公芘不遣矣師回即承命既而省符趣師回就道遂去師回舟行過大孤山舟人告毋作樂恐龍怒師回故命其徒奏蕃樂少頃黑雲四合有物湧波間目如金盤師回射中其目即還入水風亦息安流而濟人皆服其勇也紹興十四年嵗在甲子春正月戊午衢州龍遊縣士民舉知縣黃鉞有政績乞令再任下兩浙漕司究其實至是漕司奏鉞無治狀可稱且有違法事為人所訴庚午上謂宰執曰此必計㑹來不可從也朕嘗謂天下惟在賞罰若賞當賢罰當罪則人知勸沮天下無不治朕每留意民事如縣令治狀顯著不特再任便當拔擢方欲激勸也癸酉以侍御史李文㑹為中丞殿前都指揮使楊存中請刺本軍人以防諸處互招仍乞嚴賜約束丙子太師左僕射秦檜奏舊有二法一招别軍人並依軍法此太重難行一立賞許人告以犯人所請計贓坐罪將校取㫖此法可行上曰善立法不貴太重而貴必行法必行則人莫敢犯矣二月庚辰詔太學養士三百太少宜更增二百人秦檜與參知政事万俟卨一日同奏事退坐殿廬中批上㫖除某官吏鈐紙尾進卨曰偶不聞聖語檜怒於是御史中丞李文㑹右諫議大夫詹大方皆論卨違詔除職與郡而給事中楊願駁奏丙午乃以卨提舉太平觀己酉文㑹又論中書舍人劉才邵祠部郎官王觀國皆附卨以進亦詔與外任大方建德人也以資政殿學士新知建康府樓照為僉書樞密院事時左僕射秦檜方専政而軍監陳康伯於檜有舊淡然無求檜雖稱其靖重然常越次用他人是月始遷康伯為吏部侍郎蓋欲遣之出疆康伯弋陽人也三月甲午宰執奏鎮江府御前都統制王勝軍中減放兵數上曰昨嘗指揮諸軍減放人數令即招填可嚴戒目下招足不然恐暗損軍額緩急誤事宜預備之也時皇太后修宅有起居民處詔臨安府守臣張叔獻倍支搬挈之費及對撥官屋毋令失所丁卯宰執奏故將官劉實死事特給文歷以養其弟通事上曰實驍勇忠實昨在淮西遇敵力戰有功朕聞其死為之不食者一日秦檜曰陛下記功恤孤如此將士安得不盡死節以圖報乎己巳上幸太學祗謁先聖先師止輦於大成殿門外步趨登降執爵灌獻注視貌像翼翼欽慕復覽太祖真宗徽宗所製贊文又命有司悉取從祀諸贊併録以進遂升堂頒手詔示樂育詳延之意賜諸生坐命國子司業髙閌講易泰卦學官內外舍生推恩有差復幸養正持志二齊顧諸生肄業之所徘徊久之即除閌禮部侍郎言者以為盛事請宣付史館從之於是上親製文宣王贊曰大哉宣聖斯文在兹帝王之式古今之師志則春秋道由忠恕賢於堯舜日月其譽維時載雍戢此武功肅昭盛儀海宇聿崇閌奏曰陛下頒示御製宣聖贊文形容盛德無愧於古上曰唐明皇嘗作贊文乃斥先聖先師之名非尊儒重道之意閌曰此尤見聖學髙出前代帝王之上既又御製七十二子贊其序略曰朕兹幸太學延見諸生因作文宣王贊機政餘間歷取顔回而下七十二人亦為製贊并刋石置於太學夏四月己卯宰執奏太史局製渾儀乞依舊例差官秦檜曰在廷之臣罕能通曉上曰此事闕典已即宫中製成小範可以測日晷夜度以樞星為則蓋樞星中星也非久降出當以為式但廣其尺寸爾檜曰固天縱之將聖又多能也聖主有焉於是命檜提舉修製辛巳上謂宰執曰昨日蘇籕上殿乞以近世儒臣所著講說纂而成編以補唐之正義其言甚當若取善者頒諸學官使學者有所宗一則師王安石程頥者不至紛紜矣秦檜因乞禁野史上曰此尤為害事如靖康以來私記極不足信上皇有帝堯之心禪位淵聖實出神斷而一時私傳以為事由蔡攸吳敏矣上皇曽諭宰執謂當時若非朕意誰敢建言必有族滅之禍樓照曰上皇聖諭亦嘗報行天下所共知也檜曰近時學者不知體者謂司馬遷作謗書然武紀但盡記時事不敢自立議論臣嘗委史局官撰神宗史志有一日而成者輕率如此豈可用也上曰朕向嘗論范冲修徽宗實録惟當記政事之大可為法者其細事自不必書大抵史官須有經學乃可用也北境泗州移文楊州約發人數丁亥上謂宰執曰但令楊州回報去朝廷見依誓書津遣蓋誓書所載淮北遣歸者取其願也卿等謂如何檜曰如此誠便樓照曰早來檜所論仰符聖訓上曰人情不相逺理之所在自然契合福建羣盜未滅而海賊朱明熾甚是日詔統制官張守忠往討之上曰民愚為盜不足平第憂被驅脅者雖釋其罪縱之歸業生理已蕩析矣時祕書省所校祖宗實録猶多舛誤戊戌詔令再校後更有差即具名以聞南蕃來貢是日詔廣西經略司依舊例於橫山寨管設遣之回五月辛亥朔宰執奏諸路已置放生池上曰此事固善但恐妨細民漁採所害亦大止令元有處復舊可也李文㑹詹大方同論資政殿學士僉書樞密院事樓照不可以居政塗甲子照罷依舊職提舉太平觀乙丑以御史中丞李文㑹為端明殿學士僉書樞密兼權參知政事先是經筵講畢上謂禮部侍郎髙閌曰向來張九成嘗問朕云左傳載一事或千餘言春秋只一句書之此何也朕答之云聖言有造化所以寓無窮之意若無造化即容易知乃常人言爾閌曰說春秋者雖多終不能發明正如窺造化也上曰九成所問極是閌曰陛下答語亦極是既而秦檜奏事上問及九成檜疑閌薦之時給事中楊願亦在經筵檜呼願詢其事丙寅言者論閌遂罷去時有宗室子攸獻文欲換文資上曰朕固欲宗室嚮學然文資豈可僥幸須令後省試策乃可也己卯以右諫議大夫詹大方為御史中丞右正言何若請進君子退小人丙午上諭若曰朕擢卿為諫官正要别君子小人何時無小人但時察而去之乃不害治矣若江寧人也是月大金國主亶生子詔其境內童行有籍於官者悉度為僧道士亦如之秋七月庚戌朔新知濠州李觀民上殿上戒令毋招集流亡戊午上復以語宰執俾申諭之初端明殿學士王倫為大金國所留居河間府者六年金欲用之為平欒三路轉運倫不從是日被縊而死未幾其子述仗北人訪其骨得之以歸其後上嘗語宰執曰倫雖不矜細行乃能死節此為難也得骨而歸在是冬上語在十月先是諸軍請衣賜所差使臣多弊易取良縑而軍所得皆怯薄者庚申始詔户部委官封記仍令總領所差官偕本軍使臣同領以絶其弊祕書省舊有提舉官見麟臺故事先是少監游操言肇建新省望依故事壬戌乃詔以禮部侍郎秦熺兼之操建陽人也丙子上幸祕書省賜本省詔略曰仰惟祖宗肇開冊府纍朝名世之士由是以興一代致治之原自此而出朕一新史館親御榜題肆從望幸之誠以示右文之意於是本省及實録院官各進一秩八月癸巳吏部尚書兼侍讀羅汝楫請外丁酉除龍圖閣學士知嚴州既而以刑部侍郎周三畏兼權吏部尚書庚子殿中侍御史汪勃言國學初建方衆拭目以觀取舍今次舉場乞諭諸生俾皆知正習甲辰上謂宰執曰勃所論極善曲學臆說誠害經㫖抑之則人之心術自正矣勃黟縣人也户部侍郎朝謙之言議者謂自古來理財用之臣皆無善終所以近世習而成風不復以理財為言臣以為不然聚斂而興利固非所宜如經常賦以足國裕民又安可緩今日官物多陷失而州縣漫不加省宜有以救其弊而革之至於勸農欲墾無遺利督撫欲輸無逋期廣儲蓄之計以備水旱遵茶鹽之法以通商賈凡若此者宜悉令條上謙之任城人也顯謨閣待制提舉明道宫葛勝仲自紹興初築室於寶溪之上奉祠纍任至是十有四年辛亥卒勝仲江隂人在宣和間為大司成以文鳴於世及卒士悼惜之其後諡曰文康庚申上因與宰執論治道秦檜曰數十年來止是臣下互爭勝負致治道紛紛今當平其勝員之端以復慶厯嘉祐之治乃國家之福上曰正與朕意合如是則宗社有無窮之慶矣辛酉四川宣撫副使鄭剛中言欲分利路為兩路西路以吳璘東路以楊政並充安撫使其金房開逹安撫使郭浩欲除落經略二字文成階鳳等州帶沿邊安撫亦合除落從之上因曰川陜地逺為將尤難璘統兵有法肯為朝廷出死力諸將所不及也時和議方堅而璘獨嚴備日為敵至之虞故西路之兵為天下最初璘與政共佐其兄玠守蜀同心協力義均手足至是分鎮蜀門政雖貴亞於璘而執門下之禮益恭世頗賢之此據璘政墓志壬戌宰執奏大理寺詞訴事上曰此皆官吏弛慢所致可委長吏親察之如非其人即與沙汰又獄吏但以諸州吏充逐時更易漏泄獄情非便宜令吏久於其職不可替也先是趙鼎在潮州有編管人王文獻與鼎相見歷問行朝事宜因及禮部侍郎髙閌閌鼎所厚也鼎又嘗語守臣龔寬稱文獻切直令縱其自便鼎復以錢米饋之初閌患近世禮學不明凶禮尤甚嘗著厚終禮鼎因以書寓文獻逹閌求所作厚終禮文獻至行朝閌已罷去文獻偶坐事送臨安府鞫之獄具文獻與寬皆已行遣於是中丞詹大方請竄鼎以禦魑魅使天下曉然知其終身不齒壬申上謂宰執曰可遷之逺地庶其門生故吏知不復用於是移鼎吉陽軍安置寬建陽人也時鼎子汾力乞侍行鼎不使之以無事而俱死瘴地手批付之曰紹聖初吕微仲丞相謫嶺南惟一子曰景山愛之不令同行而景山堅欲隨去不可却既至䖍將過嶺吕顧其子泣曰吾老矣罪如此萬死何惜汝何罪欲俱死瘴鄉耶我不若先死使汝護喪而歸吾猶有後也吕遂縱飲而死吾不令汝侍行亦吕之意微仲大防字也時秦檜用事久職臺諌者多其耳目每薦進必先諭以已意檜嘗謂祕書郎張闡曰君久次欲以臺中相處如何闡曰丞相茍見知老死祕書幸矣檜默然先是席益為潭師嘗辟闡置之幕下而檜初罷相益蓋有力故深憾之至是殿中侍御史汪勃論闡借助附益冬十月戊寅朔宰執奏其事有詔罷闡檜因言近臣學者多說春秋乃不知孔子作經本意在尊王而已蓋盛則周召佐之衰則桓文扶之使桓文不僭與周召何異上曰春秋蓋為諸侯之僭也學者明其綱領方逹聖經之㫖若泛然無主徒誦其文何益哉宣州守臣秦梓遣官軍入魔冦巢穴擒俞一等殆盡戊子詔梓與通判趙公智各遷一秩壬辰上謂宰執曰祖宗實録多有不必書者謂之實録蓋紀其實可為後世之法也以工部尚書莫將為敷文閣學士知福州十一月戊申朔以御史中丞詹大方為工部尚書癸丑以給事中楊願為御史中丞壬戌上諭宰執曰冬至假內朕欲閲戰士稍精者優賞庶諸軍不至怠惰秦檜曰陛下不忘武備如此將見人百其勇也先是觀文殿學士朱勝非自罷相居湖州嘗就除知本州既而得提舉洞霄宫食祠祿八年寓天聖僧舍杜門却掃留心內典與世事相忘乙亥卒時吏部闕官壬申宰執乞以軍器監趙子厚暫權侍郎秦檜曰今日宗室當崇奬之令聚於朝上曰如曽中第不生是非之人寺監祕書省皆可處之祖宗不用作宰執其慮甚逺可用至侍從而止檜曰欲置宗學以教育之乃令討論舊法是月金國黃龍府之北大雪色如血赤至暮方消十二月户部郎官邊知白乞臨安及諸郡復置漏澤園詔可上曰此仁政所先知白吳縣人也新知明州秦棣乞戒守臣無好竒以生事無玩習以曠官辛巳上諭宰執曰郡守之職惟奉法宣化為急正不當爾棣檜弟也戊子中丞楊願殿中侍御史汪勃右正言何若交論端明殿學士僉書樞密院事李文㑹邪險害政不協衆望乃言編管人王文獻締結俾之游說又私養臺吏伺臺中章疏梟心虺志無所不為文㑹亦請罷丁酉詔文㑹落職提舉太平觀既而願等又論文㑹薦冒官人陳洵於奉使王師心濫轉四資遂貶筠州勃歙縣人也師心金華人也辛丑時諸路多獻資餘獨潼川路漕臣楊椿無所獻嘗曰今瘡痍未瘳愧不能裕民力其忍掊尅以資進身耶故一路無橫斂之擾是年改椿本路提㸃刑獄吏有抑配官鹽而盜其贏者椿按治之椿眉山人也大金國主亶改元皇統
