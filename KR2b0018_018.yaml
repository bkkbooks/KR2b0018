body:
  text: 中興小紀卷十八宋熊克撰紹興五年歲在乙卯春正月乙已朔日有蝕之丙辰上謂宰執曰大臣朕之股肱臺諫朕之耳目事均一體或有官非其人所當黜者卿等宜亟以告朕不必須待論列書曰股肱喜哉元首起哉百工熙哉股肱得人則萬事皆治矣趙鼎曰臣等駑怯何足仰承聖訓然為治之要在於用人陛下以此訓臣可謂得其要矣己未金兵之遁也留程師回張延夀為收後二將彼中之驍將也至是張俊命統制官張宗顔引兵追及之繼又遣統制官王進等邀其歸路薄之於淮敵衆悉潰墮淮而死師回延夀勢窘而降初以俊為浚既降始悟曰吾以為張樞密今乃關西也行宫留守孟庾請上還臨安府從之金之薄淮也劉光逺遣統制官酈瓊統兵過淮由間道徑趨光州僞知州許約守城甚堅又劉麟遣統領官李知柔以衆三千助之瓊說約降不從即進兵急攻城欲破約勢窮乃降遂復光州甲子奏至上謂宰執曰許約為劉豫結連楊么乃劫張昻山寨凶逆宜誅今來歸朕不欲失信當貸之沈與求曰朕下方圖復中原倘示大信安反側臣見壺漿載道以迎王師矣初金之故主旻與今主晟相約互傳位於其子孫旻在日以晟為安班貝勒原作諳版孛極烈今改正下同安班貝勒者儲嗣之位也及晟代旻即捨己之子宋王宗磐而以旻之長孫梁王亶小名哈爾滿原名曷刺馬今改正下同者為安班貝勒仍領都元帥之職是月晟卒宋王宗磐與旻之子涼王固倫原作固碖今改正及左副元帥尼瑪哈皆爭立而亶為嫡遂立之蓋尼瑪哈自去歲為鄂勒琿所代已失兵柄故不得立時鄂勒琿達蘭諸帥自江上回至燕山悉赴晟之喪初晟已諡旻為武元皇帝廟號太祖至是亶諡晟為文烈皇帝廟號太宗二月丁丑上自平江府還臨安府己卯上次秀州壬午上至臨安府丙戌右僕射趙鼎除左僕射張浚除右僕射並平章事浚兼知樞密院都督諸路軍馬趙鼎事實曰二月回鑾先議定張浚右揆出使湖外平楊么鼎升左揆方鎖院之夕鼎密啓曰宰相無事不統不必専以邊事乃為得體洎兩制出浚獨以軍功及専任邊事為言上既以邊事付浚而政事及進退人材専任於鼎矣喻樗語録曰時趙張二公相得人固知且並相樗獨以謂且作樞密使同心同德亦何不可他日趙退則張繼之說一般話行一般事用一般人如此則氣道長若同相議論有不合或當去位則一畨更改必有參商是賢者自相戾也已而其事亦稍如此庚子宗正少卿范沖請以近詔羣臣條對倣治平故事編類進入乃以命學士孫近直學士院胡交修而殿中侍御史邵武謝祖信又言羣臣所條利害既上御府願親省覽或俾大臣分閲擇可用者奏行從之故事左僕射兼監修國史辛丑趙鼎奏直史館范沖於臣為外姻願改授張浚上曰安可以沖故廢祖宗故事況史館非朝廷政事之地可無辭遂詔鼎兼之於是殿中侍御史張絢言宰相用人不當以鄉閭親屬為嫌更宜訪寒畯癸卯上謂宰執曰如此則朋黨之風自破矣趙鼎曰用人所以立國臣豈敢久居相位至於立國規模則當為逺計也鼎於是以政事之先後及人材所當召用者密條而置座右一一奏稟以次行之鼎謙沖待士犯顔敢諫凡內降恩澤多奏格不行號為賢相而深喜故崇政殿說書程頤之學朝士翕然嚮之時有言今托稱伊川門人者却皆進用如選人桐廬喻樗真其人也乃不見知是月鼎始薦樗改官除正字誥辭曰頃窮西洛之淵源遂見古人之大體中書舍人王居正行也樗以此頗為衆所嫉徽猷閣待制胡安國亦師頥者也聞之以謂西洛淵源古人大體雖其髙弟游酢楊時謝良佐諸人尚難言之而況樗耶乃敢托於詞命以妄褒借識者憂之居正未幾遷兵部侍郎於是有伊川三魂之目鼎為真魂居正為强魂言其多忿也故工部侍郎楊時為還魂言其身死而道猶行也既而正字襄陽張嵲遂以元祐中五鬼配之劉豫罷什一之法改行五等稅法閏二月丁未端明殿學士僉書樞密院事胡松年請外詔以舊職知宣州川陜宣撫使盧法原請上供物帛自去年以後仍充贍軍己酉上謂宰執曰祖宗內帑本以備邊宜從所請趙鼎等曰陛下捐內帑以贍軍此帝王盛德事也詔臨安府依舊帶浙西安撫鎮江府帶松江安撫既而鎮江守臣劉寧止請撥常州江隂軍及崑山常熟二縣屬沿江安撫司從之寧止歸安人也庚午宰執奏中書舍人劉大中繳大理評事李洪試大法改官事趙鼎曰法以弼教宜崇奬之上曰不崇奬之其學將絶沈與求曰法家雖别一科人命所繫亦宜重其選也是月都督張浚出江上勞師至鎮江府召淮東宣撫使韓世忠親諭上㫖使移屯楚州以撼山東世忠欣然受命即日舉軍渡江於是浚至建康府勞江東安撫使張俊軍又至太平州勞淮西宣撫使劉光世軍而還侍御史張致逺殿中侍御史張絢右司諌趙霈交章論新除主管馬軍王􅊛討賊無功乞正其罪詔罷􅊛管軍仍降充團練使絢丹陽人也􅊛軍一萬五千撥𨽻淮東宣撫使韓世忠三月乙亥趙鼎薦荆南鎮撫使解潛召為主管馬軍司公事初靖康中潛副李綱宣撫河東鼎在綱幕中與潛有舊至是引用之先是川陜宣撫副使盧法原以憾不濟師不餽糧及不給降錢幣不應副器械功成又不銓量獲功將士上以手詔詰法原法原辨數甚悉上不以為是既而法原卒於閬州宣撫司事令副使吳玠權主行之淮東宣撫使韓世忠已至楚州遣屬官陳桷等赴闕左僕射趙鼎奏臣已細詢桷據言韓世忠已過淮南視控扼之所桷今來乞兵守建康蓋欲張浚分占江上同負此責臣以通泰鹽利為重乞飭世忠且在承楚捍敵或采石等淺處有警即令引全軍趨江東或浙西而通泰鹽利在所不顧也桷又言世忠軍老幼在鎮江非便臣與桷議欲令遷平江桷以為然此亦張浚之意也乙酉左僕射趙鼎奏乞遣中使傳問宣撫上曰當别有所賜近劉光世進馬來問朕乞花瓶遂輟玉瓶賜之鼎曰陛下御府寶器以寵大將深得駕馭之術矣是日趙鼎奏觀文殿大學士李綱録到建炎聖語上曰朕已閲皆實綱近日論事非往時比鼎曰綱才器過人嚮辟少年浮躁之士為屬致有所纍上曰屬官須老成更練鼎曰誠如聖諭初張浚謫居福州而綱亦寓福浚與綱㑹既除舊隙遂相厚善至是浚入相數於上前言其忠未幾起綱知洪州兼江南安撫制置大使朱勝非閒居録曰舊制御膳日進一百二十品淵聖減作四十品上即祚又加裁省其後早晚共止一羊不過數品而已巡幸東南駐蹕郡廨兵火之後屋宇闕陋雖久駐亦不增葺中宫未還妃嬪有名位者才二三人其餘宫監并有職掌者通不及百人雖大禹之勤儉不是過也大臣密侍帷幄目覩盛事固宜仰體德意而三丞相則不然李綱私藏過於國帑乃厚自奉養侍妾歌僮衣服飲食極於美麗每饗客肴饌必至百品遇出則厨傳數十擔其居福州也張浚被召綱贐行一百二十合合以朱漆鏤銀裝飾樣致如一皆其宅庫所有也吕頥浩喜酒色侍妾十數夜必縱飲前戶部侍郎韓梠家畜三妾俱有殊色名聞一時梠死諸大將以厚賂取之吕力爭用數千緡得一人號三孺人大寵嬖之初則専其家政既而頤浩為留守兼判臨安權勢甚盛三孺人者遂預外事公然交通韓氏中外因以媒進時頤浩六十七嵗矣趙鼎起於白屋有朴野之狀一旦拜相驟為驕侈以臨安相府為不足居别建大堂竒花嘉木環植周圍堂之四隅各設大爐為異香數種每坐堂中則四爐焚香煙氣氤氲合於坐上謂之香雲又艱難以來堂饌菲薄鼎增厚十倍日有㑹集侍從將帥下逮省寺官所喜者次第召食堂厨公吏云日費香直數十緡酒饌尚不計也其後鼎坐臺疏落職守泉纍章數千言而乾沒都督錢十七萬緡竊用激賞庫錢七十餘萬緡奄有臨安府什物三千餘件乃章中一事命下人皆謂鼎必辨而不辨也初禁衛諸軍遇赦轉員其法甚備自中原俶擾軍營紛亂排轉不行時諸將所總嵗嵗奏功而天子親兵久無升遷之望左僕射趙鼎請據三衙見管人數倣佛舊例立為轉員之法始合祖宗舊制而軍政明矣金主亶升所居曰㑹寧府建為上京仍改官制初奉使宇文虛中留其國至是受金官為之參定其制以太師太傅太保為三師太尉司徒司空為三公尚書省置令次左右丞相皆平章事左右丞皆參知政事侍中中書令皆居丞相下仍為兼職元帥府仍置都元帥左右副元帥左右都監樞密院置使副僉書院事大宗正府置判同判同僉書事宣徽院置左右使同知僉書事六部初置吏戶禮三部侍郎後置三尚書仍兼兵刑工既而六曹皆置尚書郎官左右司及諸曹皆備國史院置監修以宰相兼領次修史御史臺置大夫中丞侍御史以下而大夫不除中丞惟掌訟牒及斷獄㑹法諫院置左右諫議大夫補闕拾遺並以他官兼之與臺官皆充員而已翰林學士院置承㫖學士侍讀侍講學士直學士待制修撰而承㫖不除殿前司置都㸃檢左右副㸃檢左右衛將軍勸農司置使副記注院置修注太常寺置卿少祕書省置監少以下皆備國子監官不設外道置轉運使而不刺舉故官吏無所憚都事令史用登進士第者預其選人以為榮官無磨勘之法每一任則轉一官此其大略也初金之故主晟兄弟相約互傳位於其子孫時亶既立於義當復用晟之長子宋國王宗磐為安班貝勒兼元帥之職而亶不遵初約及定官制以三公居都元帥上又左副元帥尼瑪哈右副元帥烏克紳皆亶所忌至是以宗磐為太師領三省事易其儲嗣之位封尼瑪哈晉國王亦領三省事又除烏克紳左丞相皆以相位易其兵柄而冀王鄂勒琿魯王達蘭正除左右副元帥故宗磐失望其後以至謀變蓋兆於此也未幾鄂勒琿死以達蘭代之而進左監軍烏珠為右副元帥夏四月甲辰朔言者請倣景德㑹計録列紹興以來嵗計量入為出詔送户部戊申本部先纘到去嵗收支數餘乞容續録從之初太廟神主寓於溫州嵗時薦饗委之守臣司封郎官林待聘嘗言原廟之在郡國有漢故事而太廟神主禮宜在都今新邑未奠宜考古師行載主之義還之行闕以彰聖孝至是始就臨安府建太廟遣權太常少卿沙縣張銖迎至行在既而奉安上行欵謁之禮明年親征遂奉木主以行先是侍講范沖乞依仁宗邇英閣故事寫書無逸孝經天子四章為圖設於講殿之壁上從其請親御宸翰寫成二圖庚戌上以語宰執於是趙鼎贊上從善汲汲之意且曰沖以世官入侍經幄乞修故事宜也沈與求曰宋璟獻無逸圖以為元龜今宸翰昭回非璟所獻之比陛下方夙夜自警則恢復可期天下幸甚乙卯詔直寶文閣曾紆齎其父布所著正論赴闕中道除紆知信州戊午上謂宰執曰昨閲曾布正論其言皆正當趙鼎曰臣嚮官陜西嘗見此乃布親筆近復得於紆處蓋相去二十年矣宛然如故沈與求曰韓璜言紆造正論蓋不知其詳也上顧鼎曰布有奏藁薦陳瓘等十餘人卿跋尾具言曽見正論鼎曰臣誠有之先有詔發常平倉米賑糶己未宰執奏欲每日糶一千石上曰隂霖不止細民艱食官為發廩則穀價自平趙鼎等曰陛下憂民如此臣等期有以副聖意官既賑濟則富家不至閉糴上曰富家惟務厚藏而不知散鼎曰厚藏而不知散所以致富及子孫驕奢妄用則家道往往不振上曰立國亦然子孫不知祖宗創業艱難習成驕奢馴致禍亂亦可以為戒也沈與求曰周公陳王業艱難以戒成王七月之詩是也今陛下念祖宗創業艱難日復一日臣知勘定有期矣甲子道君皇帝崩於五國城聖夀五十有四後太后坰鑾知是此日先是道君嘗命隨行王若沖録北遷事跡未克成書丙寅淵聖申命若沖以謂先王嘉言善行不可無紀乃許隨行官吏各具見聞送若沖編修仍令蔡鞗提㸃未幾書成即所謂太上道君北狩行録是也徽猷閣待制程昌禹守鼎州六年賊不能犯是月除昌禹都督府參議官乃移知嶽州程千秋代之千秋在嶽時賊已願出降及至鼎始覺賊無就招意時統制官杜湛亦改為都督府左軍統制千秋因留湛所領蔡兵以捍賊是夏金主亶以其國有親喪慮本朝乘而代之令右副元帥烏珠屯於黎陽而左副元帥達喇歸祈州初金攻熙河蕃漢官盡降隴右郡王趙懷恩乃攜老小入蜀至是乞依兄懷德例别帶一職五月己卯詔除懷恩正任觀察使辛巳上殿官李椿年言嵗鬻度牒不下萬數是失一萬農也積而纍之農幾盡矣昔越王報吳生男女有賞嫁娶不時有罰今則反是上曰越王養兵二十餘年而後報吳椿年曰陛下知此道矣願斷而行上首肯之椿年浮梁人也己丑左司諫趙霈言安不忘危治不忘亂安危治亂之機相為倚伏昨丁陽九厄運比者皇威始震仇讐逺遁已肇中興之業天其或者殆將悔禍所謂安危治亂之機不可一日忘也漢光武初定天下馮異來朝詔曰倉卒蕪蔞亭豆粥呼沱麥飯異頓首曰願國家無忘河北之難小臣不敢忘巾車之恩唐太宗既平髙昌魏徵舉小白無忘在莒之事以戒之帝曰朕不敢忘布衣時公不得忘叔牙之為人也臣亦願陛下無忘親征時臣無忘扈從時則恢復可期矣辛卯詔霈論奏得諫臣之體令尚書省寫成圖進入時貴州防禦使瑗在宫中上嘗以語宰執曰此子天資特異儼如神人朕親自教之讀書性極彊記至是趙鼎得㫖造書院於行宫門內以為資善堂欲令就學上曰朕年二十九未有子然國朝自有仁宗故事今未封王止令建節封國公似合宜以朕所見此事甚易行而前代帝主多以為難鼎曰自古帝王以為難而陛下行之甚易此所以莫可跂及也上曰藝祖創業至勤朕取子字行下子鞠於宫中庶仰慰藝祖在天之靈孟庾曰陛下念藝祖創業而聖慮及此帝王所難之事也己亥以瑗為保慶軍節度使建國公宗正少卿范沖起居郎朱震並為資善堂翊善震邵武軍人也趙鼎事實曰一日上語鼎曰欲令瑗出閣選官教之且就禁中置學館便建資善堂庶幾正當所差官亦有名仍一依皇子建節除國公鼎乃與同列議選范沖朱震為翊善朝論以二人為極天下之選上亦嘗謂鼎曰前日臺諫因對語及資善之建皆曰如朱震范沖天生此二人為今日資善之用可謂得人矣然是時建資善及命官與出閣之日適張浚在外故憸人得以間之始見疾矣都督張浚謂楊么據洞庭湖實占上流不先去之為腹心害將無以立國然冦阻重湖春夏則耕耘秋冬水落則收糧于寨載老小于船中而驅其衆四出為暴前此朝廷以夏多水潦必冬乃出師故冦得併力而我多不利今乘其怠而討之彼衆既散一旦復合固已疲於奔命又不得守其田畝禾稼則有絶食之憂黨與必攜可招來也雖已命湖南制置使嶽飛往討而兵將未必喻此或逞兵殺戮則失勝算傷國體遂奏請自行上許焉浚因辟樞密都承㫖馬擴為都督府都統制初湖南制置大使席益獲楊么探者數百人皆傳致逺縣囚之浚行至醴陵縣召囚問之盡釋其縛給以文書俾分示諸寨曰今既不得保田畝禾稼必乏食且餒死矣不如早降不死數百人歡呼而往及潭州而首領黃誠周倫等先請受約束然嘗殺招安使人猶不自安浚令嶽飛分屯鼎澧益陽壓以兵戊戌飛至鼎之城外置寨列艦飛素有威望而軍律甚嚴乃遣先出降人楊華入賊招安華未降時為賊魁以寬厚得衆遂與故部曲潛結么黨殺么以降時大旱湖水涸如冬間六月甲辰言者謂康定初陜西用兵詔樞密院邊事與宰相同議又因晏殊言參知政事亦許同議今二府同班奏事與舊制别班再上不同而宰臣已兼知右府欲乞邊事之大者三省同批㫖密院官押劄子庚戌詔從之甲寅以久旱詔禁屠以禱雨右諫議大夫趙霈言自來斷屠止禁猪羊而不及鵝鴨請併禁之中書舍人胡寅見霈疏曰一疏無三百言而用鵝鴨字以十數況諫職乃及此乎聞敵中統兵者號龍虎大王脫或入攻當以鵝鴨諫議拒之時人以為名對戊午詔贈故觀文殿學士鄧洵仁五官中書舍人劉大中言洵仁兄弟相繼執政専以諂諛固寵望賜追寢戊寅詔從之自靖康初追復元祐諸臣官職後亦稍稍擢其子孫然議論不一是非混淆趙鼎夙有此志是以身任之因大中繳洵仁辭頭遂歷言熙豐祐聖崇觀政事人材善惡利害首尾甚備上嘉納即詔榜之朝堂先是都督張浚親臨湖以觀賊勢疑未可攻復欲還朝為防秋之計㑹制置使嶽飛來以小圖白浚曰此易擒耳浚曰此妨防秋之備飛請浚少留八日擒之浚乃遣飛往初湖南統制官任士安王浚郝政領兵二萬餘慢王􅊛不稟其令以此無功飛始至鞭士安以折其氣使為賊餌先揚言嶽太尉兵二十萬至矣及是止見士安等軍賊併力拒之飛伏大兵四合賊敗走悉乘舟入據水寨賊將陳瑫內變劫僞太子鍾子義船獲金交牀與龍鳯輦等詣飛降楊么赴水死黃誠周倫遂挾子義奔潭州都督府降餘黨相繼皆降飛入水寨殺賊衆殆盡惟夏誠寨恃險固守飛擇善罵者二千人夜往罵之且悉衆運草木流下填滿乃長驅入營遂擒賊誠果應飛來之䜟於是浚言除楊么就戮外招到黃誠周倫等衆二十餘萬湖冦盡平李龜年記楊么本末曰初賊自恃其險官軍陸襲則入湖水攻則登岸賊中為之語曰有能害我須是飛來蓋言其險非有羽翼莫能近也俄詔用嶽飛適值大旱而湖水涸飛命軍士伐君山之木為巨筏無數賊意謂以木筏塞諸港汊賊戰敗急趨舟欲出湖而港汊木筏已滿舟為所礙不能遁戮死而外盡招降之飛來之䜟於是乎驗初張浚與淮東宣撫使韓世忠議令移屯泗上既而世忠退屯承楚之間與初議小異浚遂請祠上乃降詔諭世忠且謂宰執曰世忠移屯既略如議浚復何疑趙鼎曰臣等已作書報浚而世忠將董􅌈亦自謂他日有警老小必還鎮江則積糧淮南非便浚必曉此意至是董旻攜親筆詔至軍前世忠拜詔感泣軍情共戴聖恩
